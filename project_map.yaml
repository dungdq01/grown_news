  M04_ci:
    purpose: chạy validate + test trên mỗi PR, làm S3 có răng; sở hữu cả hook S4
    be: [.github/**, .githooks/**, Makefile, .gitattributes]
                                     # .gitattributes thêm v29 (PM 2026-09-05, cùng
                                     # lý lẽ Makefile v13: bề mặt cơ chế git/CI —
                                     # lfs filter là thứ ci.yml phải biết; trước
                                     # đó vô chủ nên T04-8 dính lỗi boundary).
                                     # FR-003 duyệt 2026-08-19: hook là bề mặt S4,
                                     # cùng loại cơ chế với CI. M01 sở hữu LUẬT,
                                     # M04 sở hữu BỀ MẶT chạy luật đó.
                                     # `Makefile` thêm ở v13 (FR-036/B4): nó là
                                     # bản NGƯỜI-CHẠY-TAY của cùng danh sách cổng
                                     # trong ci.yml. Trước đó nó không thuộc
                                     # module nào, nên check_g6b không đo được —
                                     # và T01-9 đã sửa nó mà không khai. Cùng
                                     # module với ci.yml thì hai danh sách lệch
                                     # nhau là việc của MỘT chủ.
    fe: null
    depends_on: [M01_core, M02_kb] # kiểm chúng, KHÔNG sở hữu file nào của chúng
    screens: []
    spec: 06_modules/M04_ci/spec.md
    status: as-built

  M05_intake:
    purpose: gác cửa cho bản .md do agent khác sinh — kiểm rồi cho vào kb/ ở draft
    be: 05_intake/**
    fe: null
    depends_on: [M02_kb]           # ghi vào kb/; DÙNG LẠI validate.py của M01, không copy
    screens: []
    spec: 06_modules/M05_intake/spec.md
    status: as-built
    luat_rieng: >
      Bản origin=external KHÔNG BAO GIỜ vào thẳng approved. Schema đã cưỡng chế
      (external ⇒ review_status const draft ⇒ citations_sampled >= 2).
      Đây là lý do tách khỏi M01: nhét chung thì validate.py mang hai chế độ.
    inbox: _inbox/                 # nơi người dùng thả file

  M06_skillgen:
    purpose: đọc skill_candidates trong bản approved, sinh SKILL.md dạng NHÁP
    be: 06_skillgen/**
    fe: null
    depends_on: [M02_kb]           # chỉ đọc kb/, không ghi
    screens: []
    spec: 06_modules/M06_skillgen/spec.md
    status: as-built
    ghi_ra_ngoai_repo: "~/.claude/skills/<name>/SKILL.md"
    manifest: skill-manifest.json  # năng lực hiện có — nguồn để chấm verdict
    luat_rieng: >
      Sinh NHÁP, không sinh đủ. Trigger máy làm tốt (draft_trigger có sẵn);
      nội dung máy làm dở (một nguồn thì chỉ chép lại nguồn đó). Sinh đủ tạo ra
      thứ trông như skill mà cài vào làm agent tệ hơn.
      Ngưỡng: priority >= 25 VÀ verdict thuộc {NEW, DEEPEN}.
      Thứ tự chấm theo skill-manifest.json $matching.order — cổng cứng TRƯỚC domain.
    do_M1_nao: M1.2 — không có module này thì M1.2 chắc chắn bằng 0

  M07_curate:
    purpose: quét kho theo nhịp, báo ba thứ hỏng dần — bài chết, draft đọng, concepts phình
    be: 07_curate/**
    fe: null
    depends_on: [M02_kb]           # CHỈ ĐỌC — không tự sửa kb/ kể cả concepts.yaml
    screens: []
    spec: 06_modules/M07_curate/spec.md
    status: as-built
    thresholds: 07_curate/thresholds.yaml
    luat_rieng: >
      Đề xuất, không tự sửa. kb/ là nguồn chân lý và là thứ M1 đo — module tự gộp
      concept hoặc tự đổi trạng thái thì người duyệt mất quyền kiểm soát thứ đang
      dùng để chấm dự án.
      Ngưỡng ngày là THAM SỐ ở thresholds.yaml, không phải hằng số rải trong code:
      kho đang 0 bài nên mọi ngưỡng hiện tại là phỏng đoán và sẽ sai.

  M08_api:
    purpose: bàn biên tập local — CRUD bài viết qua HTTP cho NGƯỜI, mọi ghi qua validate.py, chỉ 127.0.0.1
    # v30 · T08-33 — hai đường thêm, cùng lý lẽ v28/v29 đã dùng cho M03:
    #
    # `core/assets/xuat-dang.json` — bảng khai LOẠI BẢN GHI → DẠNG XUẤT. Bên
    # cưỡng chế nó là CỬA (`xuat-cua.mjs` trả 422 theo bảng); FE chỉ đọc để vẽ
    # menu. Nằm ở `core/assets` vì quy ước bảng-khai-một-chỗ, y như
    # `nguong-loi.json` ngay cạnh đây. M01 không đọc, không ghi nó.
    #
    # `web/package.json` — cửa xuất cần thư viện `docx` (MIT). Phụ thuộc của
    # một tính năng M08 phải khai ở chỗ npm đọc, và chỗ đó chỉ có một. Đây là
    # đường HẸP có chủ đích: M08 thêm phụ thuộc cho cửa của mình, không sửa
    # `scripts` hay cấu hình build của M03.
    be: [web/api/**, _recycle/**, 06_modules/M08_api/**, core/assets/nguong-loi.json,
         core/assets/xuat-dang.json, web/package.json]
                                   # FR-058 lớp A — bảng khai NGƯỠNG: người đọc
                                   # duy nhất là web/api/dungchung.mjs (nguongLoi)
                                   # + cổng của nó. Nằm ở core/assets chỉ vì quy
                                   # ước bảng-khai-một-chỗ, không vì quan hệ sở
                                   # hữu. Đo trước khi khai (2026-09-04):
                                   # grep -rl nguong-loi core web chungcat
                                   #   → web/api/dungchung.mjs · web/test/rate-limit.test.js
    fe: null                       # FE thuộc M03; M08 chỉ là handler sau server.mjs
    depends_on: [M02_kb, M01_core] # đọc/ghi kb theo hợp đồng; DÙNG LẠI validate.py qua spawn, không copy
    screens: [SCR-04]              # bàn biên tập: nút duyệt/sửa/xoá + form tạo bài (control ẩn khi không có API)
    spec: 06_modules/M08_api/spec.md
    status: as-built               # v31 · web/api là server ĐANG CHẠY live
                                   # (cửa LÕI + nháp + xuất + proxy THỢ, ~30
                                   # cổng node). spec §5 vẫn ghi 'planned' —
                                   # đó là nợ FR riêng, ô backlog M08 giữ.
    luat_rieng: >
      Ghi kb/ CHỈ qua luồng validate-trước-ghi (M08-R2). Không default trường
      quyết định — 3 trường M1, reject_reason là LỜI KHAI của người (M08-R3,
      B-B1 nguyên vẹn). DELETE = move _recycle/, không unlink (M08-R4).
      Chuyển trạng thái chỉ qua PATCH /status, bảng chuyển cứng M02 §2.2 (M08-R5).

  M09_thuvien:
    purpose: ban ghi THU VIEN — tai lieu tai len (pdf/ppt/word) va video theo URL, co nhan nhu bai phan tich
    be: 06_modules/M09_thuvien/**                       # khong so huu file BE nao — xem luat_rieng
    fe: null                       # khong so huu file FE nao — xem luat_rieng
    depends_on: [M02_kb, M01_core, M08_api, M03_web]
    screens: [SCR-05]              # tab thu tu cua man Nap nguon + man xem truoc trong cua so doc
    spec: 06_modules/M09_thuvien/spec.md
    status: as-built               # FR-037 xong 2026-08-28; 7 cổng S3 xanh
    luat_rieng: >
      Module NGANG — no khong so huu file nao, no khai HOP DONG roi bon module chu
      thi hanh: DDL + export/import o M02_kb, cua ghi o M08_api, render o M03_web,
      nhanh ho so validate o M01_core. Nen moi don vi viec cua no phai khai
      pham_vi_ghi theo boundary cua MODULE CHU, va check_g6b kiem dieu do.
      Nam rule rieng (M09-R1..R5): luat mo coi hop UNION BA BANG (bo sot recycle
      thi DELETE pha byte vinh vien ma phucHoi van bao thanh cong) · sha256 do MAY
      tinh + magic-byte khop mime · src iframe tu whitelist host, khong tu
      frontmatter · ban ghi thu vien khong dem vao thuoc do CHAT LUONG · tran body
      JSON 1 MB KHONG duoc noi, media co tran rieng.

  M10_tailieu:
    purpose: module TÀI LIỆU — pdf/ppt/word tải lên; màn riêng, nạp riêng, CRUD tại chỗ
    be: [06_modules/M10_tailieu/**]  # bảng `tai_lieu` do M02_kb khai trong DDL
    fe: null                       # màn thuộc M03_web thi hành — xem luat_rieng
    depends_on: [M02_kb, M01_core, M08_api, M03_web, M09_thuvien]
    screens: [SCR-06, SCR-07]      # SCR-06 màn Tài liệu · SCR-07 nạp tài liệu
    spec: 06_modules/M10_tailieu/spec.md
    status: as-built               # v31 · bảy màn + ba đường nạp đã dựng
                                   # (C5/C6); spec §5 'planned' = nợ FR (ô chung
                                   # 'năm module một bệnh' — backlog M08).
    luat_rieng: >
      Module NGANG như M09: khai hợp đồng, module chủ thi hành. DDL bảng
      `tai_lieu` ở M02_kb, cửa ghi ở M08_api, màn ở M03_web, hồ sơ validate ở
      M01_core, kho hiện vật (byte + magic-byte + sáu đầu đề) ở M09_thuvien.
      Ba rule riêng: màn chỉ đọc bảng của nó (đo bằng SỐ ĐẾM, không bằng lời
      khai) · form sửa PHẢI có ô `media`, không dựa vào `FM_GOC` giữ hộ · form
      nạp phải có ô chọn `category`/`concepts` từ danh mục, không đẩy người dùng
      vào `concepts_proposed` mà họ không biết.

  M11_video:
    purpose: module VIDEO — đăng ký URL YouTube/TikTok; không byte vào kho
    be: [06_modules/M11_video/**]  # bảng `video` do M02_kb khai trong DDL
    fe: null                       # màn thuộc M03_web thi hành — xem luat_rieng
    depends_on: [M02_kb, M01_core, M08_api, M03_web, M09_thuvien]
    screens: [SCR-08, SCR-09]      # SCR-08 màn Video · SCR-09 nạp video
    spec: 06_modules/M11_video/spec.md
    status: as-built               # v31 · bảy màn + ba đường nạp đã dựng
                                   # (C5/C6); spec §5 'planned' = nợ FR (ô chung
                                   # 'năm module một bệnh' — backlog M08).
    luat_rieng: >
      Module NGANG. Đây là module LÀM MỚI, không phải tách ra: đo được không có
      đường tạo video nào tồn tại trước FR-038 — đăng ký URL đi qua form viết bài
      8 ô với cổng `phan-tich` đầy đủ.
      Ba rule riêng: màn chỉ đọc bảng của nó · mở màn KHÔNG gọi ra mạng ngoài
      (click-to-load; hàm dựng thẻ không được nhắc `.nhung` — kiểm hai chiều ở
      B8b chứng minh phép kiểm 'không chứa hằng host' xanh oan khi host qua một
      biến) · `url_normalized` do MÁY tính và host lạ báo TẠI CHỖ DÁN, không đợi
      422 sau khi người dùng điền xong.

  M18_nguoidung:
    purpose: module TÀI KHOẢN + CÀI ĐẶT — ai có account, mời thế nào, buộc kênh nào,
      phiên của ai, và ô quyền nào bật/tắt được từ web (proposal-3, ADR-07)
    be: [06_modules/M18_nguoidung/**]   # bốn bảng do M08_api khai DDL trong DB của LÕI (ADR-06)
    fe: null                       # màn admin thuộc M03_web thi hành — xem luat_rieng
    depends_on: [M08_api, M03_web]
    screens: []                    # CHƯA CÓ wireframe màn admin — s5 chưa chạy cho màn này (FR-048 §6b)
    spec: 06_modules/M18_nguoidung/spec.md
    status: planned                # FR-048
    luat_rieng: >
      Module NGANG như M09/M10/M11: khong so huu file ma nao, khai HOP DONG roi
      module chu thi hanh. DDL + bay cua o M08_api (FR-047), xac thuc bien o
      M17_cong, man admin o M03_web. Moi don vi viec khai pham_vi_ghi theo
      boundary cua MODULE CHU — check_g6b kiem dieu do.
      FR-045 viet "LOI so huu bon bang". LOI la mot VUNG TIN CAY, khong phai mot
      module: entities.*.owner can mot module vi owner la thu pham_vi_ghi neo vao.
      M18 la cai ten do. Truoc FR-048 bon bang chi ton tai duoi dang COMMENT o
      project_map:83-90, va check_map khong doc khoa `entities` mot lan nao nen
      khong cong nao bao duoc.
      Bon rule rieng (M18-R1..R4): ma_moi MOT LAN + het han, danh dau bang
      UPDATE...WHERE dung_luc IS NULL + changes() chu khong phai SELECT-roi-UPDATE ·
      moi lan thu (ke ca that bai) ghi audit_log, va dong log KHONG chua ma da thu ·
      cot `vai` chua ai doc nen KHONG duoc dung lam cong chan cho toi khi co
      quyet dinh "vai nao lam duoc gi" · ba bang phai-xuat co duong export, hai
      bang con lai (ma_moi, phien) KHONG xuat trang thai (ADR-06 c).

# Ranh giới ghi — cũng chính là biên R1 đo ở mức nhánh.
# core ghi vào kb/, web CHỈ ĐỌC kb/. Hai bên không gọi thẳng nhau.
# Backup theo TỪNG MODULE — quyết F4. Không có cơ chế tập trung.
# Ràng buộc bất biến: xoá sạch mọi thứ trừ kb/ rồi dựng lại phải ra trạng thái cũ.
backup:
  M01_core:  {what: code + test, how: git remote, why: dựng lại từ git được}
  M02_kb:    {what: NGUỒN CHÂN LÝ, how: "git remote + ổ ngoài (chưa chốt lối)",
              why: mất là mất tất cả, không dựng lại được từ đâu}
  M03_web:   {what: output dẫn xuất, how: KHÔNG cần, why: build lại từ kb/}
  M04_ci:    {what: workflow yaml, how: git remote, why: file nhỏ trong repo}
  M05_intake: {what: báo cáo hợp lệ, how: git remote, why: file .md vào kb/}
  M06_skillgen: {what: "skills/<name>/SKILL.md", how: git remote riêng của agent,
                 why: nằm ngoài repo này (~/.claude/skills/)}
  M07_curate: {what: không sở hữu dữ liệu, how: —, why: chỉ đọc và sửa kb/}
  M09_thuvien: {what: KHONG co du lieu rieng, how: theo M02_kb, why: byte song trong kb/_kho.sqlite + export kb/_media/}
  M08_api:   {what: handler code + _recycle/, how: git remote,
              why: "code dựng lại từ git; _recycle/ là bài đã xoá — track trong git như kb/"}

# ═══ FR-058 lớp B — ARTIFACT HỆ THỐNG: KHÔNG nhận chủ module ═══════════════
#
# `04_system/**` là artifact **s4**, ở TẦNG TRÊN mọi module; `.gitignore` là của
# cả repo. Gán chúng cho một module là nói dối về quan hệ — và luật gốc cấm đúng
# điều đó: *"không ai được sở hữu thứ dùng để đánh giá mình"*.
#
# Trước FR-058, mỗi lần một task chạm chúng là một dòng FAIL boundary bị BỎ QUA
# BẰNG TAY (T08-24 `.gitignore` · T08-28 `04_system/adr.md`) — và một cổng mà
# mọi người quen bỏ qua là một cổng đã chết. Thà khai luật ra rồi đo nó.
he_thong:
  duong: ["04_system/**", ".gitignore"]
  luat: >
    Task của MỌI module được khai các đường này trong `phạm_vi_ghi`, với ba điều
    kiện: (1) khai TƯỜNG MINH từng file, không wildcard, kèm một dòng lý do ngay
    cạnh; (2) worklog entry của lượt đó phải có file trong `object`; (3) file
    FROZEN thì vẫn qua FR như thường — mục này KHÔNG mở khoá gì.
    `check_g6b` đọc mục này và KHÔNG báo boundary cho chúng.

boundaries:
  # ═══ FR-034 — DB là nguồn chân lý, file kb/** là export dẫn xuất ═══════════
  db_writers:  [M05_intake, M08_api]   # writer CÓ ĐIỀU KIỆN: mọi COMMIT qua
                                   # validate.py --strict trên tmp compose
                                   # (M08-R2), không default trường người
                                   # (M08-R3). M01 nộp bài QUA M08 (cửa 1)
                                   # hoặc M05 (_inbox) — không cầm SQL.
                                   # Danh mục (FR-019/034): bảng concepts/
                                   # categories, người khai nhãn (M02-R3),
                                   # vết ghi ở bảng audit_log (trigger cấm
                                   # sửa/xoá), export ra kb/_nhat-ky-danh-muc.md.
  db_readers:  [M03_web, M04_ci, M06_skillgen, M07_curate]  # qua khoDoc()/SELECT
  exporter:    core/tools/xuat_kho.py   # đường ghi file kb/** DUY NHẤT (chỉ SELECT
                                   # từ DB). Đường file→DB duy nhất là
                                   # core/tools/dung_lai_db.py — người/CI/test
                                   # chạy, server KHÔNG BAO GIỜ gọi.
                                   # Răng: core/tests/check_export_dan_xuat.py
  kb_writers:  []                  # (lịch sử — trước FR-034: [M01, M05, M08].
                                   # File kb/** giờ là export, không ai "ghi kho"
                                   # bằng cách ghi file nữa.)
  web_reads:   [kb-mock/**]        # bản /mock/ vẫn đọc file demo
  web_writes:  ["_inbox/**"]        # FR-010 — FE/render (M03) vẫn RỖNG với kho.
                                   # _inbox/ là thư mục trung chuyển của M05,
                                   # không phải nguồn chân lý: xoá sạch không mất gì.
                                   # gate.py hardcode review_status draft khi nạp
                                   # (test -k draft_external) ⇒ upload không tới
                                   # được approved. Cổng người nguyên. (FR-012 bỏ
                                   # khoá const trong schema — răng giờ ở gate.)
  api_writes:  [kb/_kho.sqlite]     # FR-011/FR-034 — M08, tiến trình LOCAL riêng
                                   # người tự chạy (npm run api). Mỗi ghi = 1 HTTP
                                   # request người bấm, validate trước COMMIT.
                                   # DELETE = INSERT recycle + DELETE articles
                                   # cùng transaction (M08-R4).
  curate_writes: []                # M07 chỉ báo, không sửa — kể cả danh mục
  skillgen_writes: ["~/.claude/skills/**"]   # NGOÀI repo này, không đụng kb/
  contract:    format file .md      # hợp đồng là format, không phải code

entities:
  Analysis:
    owner: M02_kb
    description: một bản phân tích một nguồn = một file .md
    storage: kb/<source_type>/<slug>.md
    schema: core/assets/frontmatter.schema.json    # nơi ràng buộc SỐNG
    fields:
      review_status:
        formula: "draft | edited | approved | rejected"
        spec: kb/README.md#trạng-thái-duyệt
        note: cổng người DUY NHẤT trong toàn hệ thống; chỉ approved lên web
      credibility_max:
        formula: "verified | plausible | claimed | conflicted"
        spec: core/skill-src/web-spec.md
        note: chỉ để lọc và hiển thị — KHÔNG phải cổng chặn
      category:
        formula: "agent-llm | backend | data-ml | ai-services | observability | delivery"
        spec: kb/README.md#ba-chiều-phân-loại--đừng-nhầm-chúng-với-nhau
        note: >
          FR-009 — CHỦ ĐỀ của bài, thay trường `tags` tự do. Enum ĐÓNG trong
          schema (khác concepts để ở file rời): 6 giá trị, hiếm đổi, nên thêm
          mục mới phải qua FR chứ không duyệt lô hàng tuần.
          KHÔNG bắt buộc — bài announcement có thể không thuộc mảng nào.
          Đừng nhầm với concepts: category là chủ đề (thô, chia kho thành mảng),
          concepts là khái niệm kỹ thuật (mịn).
          `kb/categories.yaml` là bản ĐỌC-ĐƯỢC-CHO-WEB của enum này, không phải
          chân lý thứ hai: form cần label_vi để render, và trước đây 6 giá trị
          bị gõ tay trong shell.html. `check_danh_muc.py` canh ba nơi khớp nhau
          (yaml ⇔ enum ⇔ shell không gõ tay).
          SỬA LỖI TÀI LIỆU: dòng này từng ghi concepts "dùng tính
          corroboration_factor". Không đúng — grep corroboration trong core/src,
          05_intake, 06_skillgen, 07_curate ra 0 kết quả. Không mã nào tính nó;
          nó là số LLM tự khai, suy từ `independent_sources` (đếm theo
          url_normalized). Concepts chỉ là ĐƠN VỊ để nhận ra hai nguồn đang nói
          cùng một điều, không phải đầu vào của phép tính nào.
      url_normalized:
        formula: "url bỏ tracking, bỏ www, quy youtu.be và arxiv/pdf về dạng chuẩn"
        spec: kb/README.md
        note: đơn vị đếm nguồn độc lập; 3 bản cùng url = 1 nguồn
      word_count:
        formula: "đếm từ thân bài, bỏ code block, tiêu đề, locator"
        spec: core/src/source_distiller/validate.py
        note: dữ liệu dẫn xuất — sinh bằng --fix, không khai tay
      skill_candidates:
        formula: "priority = (relevance × frequency × durability × corroboration) / cost"
        spec: core/assets/frontmatter.schema.json
        note: credibility claimed/conflicted + 1 nguồn ⇒ cấm NEW/DEEPEN
    used_by: [M01_core, M02_kb, M03_web, M04_ci, M05_intake, M06_skillgen, M07_curate]

  Concept:
    owner: M02_kb
    description: khái niệm trong danh mục kiểm soát
    storage: kb/concepts.yaml
    fields:
      id:    {spec: kb/README.md#conceptsyaml, note: "concepts[] chỉ được lấy từ đây"}
      aliases:
        spec: kb/README.md#conceptsyaml
        note: >
          CODE CHẾT — validate.py:279 chỉ lấy {c["id"]}; grep toàn repo không ra
          đường đọc nào (aliases của M06 là skill-manifest.json, file khác).
          22 mục × ~3 ≈ 60 giá trị không ai đọc. Hai lối: xoá (sửa file frozen
          ⇒ FR) hoặc dùng (validate nhận alias, chỉ về id chính). Chưa quyết.
    used_by: [M01_core, M02_kb, M03_web, M05_intake, M07_curate]

  Category:
    owner: M02_kb
    description: chủ đề bài — enum ĐÓNG, khác Concept ở chỗ chân lý nằm trong schema
    storage: >
      core/assets/frontmatter.schema.json (enum — CHÂN LÝ, frozen)
      + kb/categories.yaml (bản đọc-được-cho-web, DẪN XUẤT)
    fields:
      id:       {note: "phải khớp enum; thêm mục = sửa file frozen ⇒ FR"}
      label_vi: {note: "nhãn hiển thị — lý do file yaml tồn tại: form cần nhãn"}
      gom:      {note: "ranh giới giữa 6 mảng, theo FR-009"}
    canh_boi: core/tests/check_danh_muc.py
    used_by: [M01_core, M02_kb, M03_web, M05_intake, M08_api]

  SkillDraft:
    owner: M06_skillgen
    description: nháp SKILL.md sinh từ skill_candidates — NGOÀI repo này
    storage: "~/.claude/skills/<name>/SKILL.md"
    schema: null                   # không qua validate.py; file cho agent đọc
    fields:
      name:        {spec: 06_modules/M06_skillgen/spec.md#22, note: từ capability}
      description: {spec: 06_modules/M06_skillgen/spec.md#22, note: từ draft_trigger}
      than:        {spec: 06_modules/M06_skillgen/spec.md#22,
                    note: PHẢI RỖNG + dòng TODO — M06-R2 chống chính module phình vai}
    used_by: [M06_skillgen]

  # ═══ FR-048 (2026-09-02) — bốn bảng tài khoản, CHỦ = M18_nguoidung ═══
  # Trước FR này chúng chỉ tồn tại dưới dạng COMMENT ở đầu file (khối M17_cong).
  # FR-045 viết "LÕI sở hữu" — LÕI là một VÙNG, không phải một module, nên
  # `entities.*.owner` không nhận được nó. Đây là chỗ vá.
  # Cả bốn nằm trong DB RIÊNG của LÕI ở `web/` — KHÔNG ở kb/_kho.sqlite (ADR-06).

  NguoiDung:
    owner: M18_nguoidung
    description: một tài khoản = một dòng; MỘT chủ dự án + 5 đồng nghiệp (prd.md:8)
    storage: "web/<db của LÕI>   # ADR-06 — KHÔNG kb/_kho.sqlite"
    schema: null                   # không qua validate.py; DDL ở M08_api
    fields:
      id:          {spec: 06_modules/M18_nguoidung/spec.md, note: khoá chính}
      ten:         {spec: 06_modules/M18_nguoidung/spec.md, note: "DỮ LIỆU CÁ NHÂN — B-E5"}
      vai:
        spec: 06_modules/M18_nguoidung/spec.md
        note: >
          CHƯA AI ĐỌC. Cột trống từ FR-045. KHÔNG được dùng làm cổng chặn cho
          tới khi có quyết định "vai nào làm được gì" (M18-R3). Hôm nay M17-R6
          (lột review_status khỏi payload) là lớp DUY NHẤT giữa một account
          thường và quyền duyệt.
      trang_thai:  {spec: 06_modules/M18_nguoidung/spec.md, note: còn hiệu lực hay đã thu hồi}
      tao_luc:     {spec: 06_modules/M18_nguoidung/spec.md, note: máy đặt}
    used_by: [M08_api, M17_cong, M15_kenh, M12_chungcat, M14_chatbot, M03_web]

  MaMoi:
    owner: M18_nguoidung
    description: mã mời MỘT LẦN + hết hạn — đường duy nhất tạo ràng buộc chat_id
    storage: "web/<db của LÕI>"
    schema: null
    fields:
      ma:
        spec: 06_modules/M18_nguoidung/spec.md
        note: >
