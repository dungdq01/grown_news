    fields: [xem kho.schema.sql — view, không bảng]
    used_by: [M08_api, M13_truyhoi]
  LoaiNguon:
    owner: M01_core                # bảng khai core/assets/loai-nguon.json (FR-038)
    fields: [7 giá trị — bảng là nguồn, không gõ tay]
