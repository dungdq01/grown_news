      chat_id:        {spec: 06_modules/M18_nguoidung/spec.md, note: "DỮ LIỆU CÁ NHÂN — B-E5"}
      nguoi_dung_id:  {spec: 06_modules/M18_nguoidung/spec.md, note: buộc vào ai}
      buoc_luc:       {spec: 06_modules/M18_nguoidung/spec.md, note: máy đặt}
    used_by: [M08_api, M17_cong, M15_kenh]

  Phien:
    owner: M18_nguoidung
    description: phiên hội thoại — ngữ cảnh sống ở LÕI, không ở THỢ
    storage: "web/<db của LÕI>"
    schema: null
    fields:
      id:             {spec: 06_modules/M18_nguoidung/spec.md, note: khoá chính}
