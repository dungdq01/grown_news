  - id: gap-ci
    trang_thai: ĐÃ ĐÓNG — v31; object .github/workflows/ci.yml (M04 as-built).
                Nợ kế thừa 'chungcat/truyhoi vào CI' sống ở T04-8, không ở gap này.
    what: S3 chưa có CI; hook local bỏ qua được bằng --no-verify
    vá_ở: build_order B1
  - id: gap-m1
    what: kho rỗng nên M1 (metric chặn) chưa đo được — 0/10 nguồn
    vá_ở: build_order B2
    note: đây là chỗ dự án có thể chết; M1 fail ⇒ quay lại sửa giao thức
    fr: FR-001 đã thêm 3 trường đo (insight_new, skill_installed, review_minutes)
        + ràng buộc approved bắt buộc khai. Giờ đo được bằng máy, còn thiếu dữ liệu.
  - id: gap-web
    trang_thai: ĐÃ ĐÓNG — v31; object commit b7ab3f8 (web SSR + 7 plugin +
                ~100 cổng đang chạy live).
    what: M03_web chưa có code production — mới có prototype vanilla HTML
    vá_ở: build_order B3a, B3b
  - id: gap-quartz
    trang_thai: ĐÃ ĐÓNG — s8 T03-3, 2026-08-19
    what: prototype dựng vanilla, chưa port sang Quartz component
    vá_ở: s6 spec M03_web → s8 implement
    quyet: >
