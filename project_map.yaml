# ═══ v18 · NĂM MODULE DỰ KIẾN — đợt hai (s4, 2026-08-31) ══════════════════
#
# VÌ SAO KHÔNG NẰM TRONG `modules:`
# `check_map` §1 đòi mỗi module có `06_modules/<tên>/`, §4 đòi `spec.md`. Spec
# là artifact của s6, chưa viết. Khai vào `modules:` bây giờ ⇒ cổng đỏ, và
# cách chữa duy nhất là đẻ năm spec rỗng — tức năm hợp đồng không nói gì.
#
# Nên chúng ở mục riêng: `check_map` không đọc mục này, nhưng NGƯỜI đọc được,
# và s6/s7 tiêu thụ được `be` để khai `phạm_vi_ghi`. Không phải chỗ giấu —
# đây là chỗ ghi rõ 'đã quyết biên, chưa viết hợp đồng'.
#
# TỐT NGHIỆP sang `modules:` khi module-pack của nó tồn tại (s6).
#
# Thư mục mã đã dựng ở s4 (khung rỗng, mỗi cái một README):
#   chungcat/ · truyhoi/ · chatbot/ · artifact/ · kenh/
# Bảng khai cổng + vùng: core/assets/dich-vu.json
#
# `be` CHỈ liệt thư mục mã đã có thật. Một boundary trỏ vào hư không thì task
# khai `phạm_vi_ghi` trong đó vẫn đi qua check_g6b mà không ai báo — đúng lý do
# check_map §2 tồn tại.
#
# ══ 2026-09-01 · MỤC `modules_du_kien` ĐÃ HẾT, và đó là lý do nó bị XOÁ ══
#
# Cả SÁU module đợt hai (M12→M17) đã tốt nghiệp sang `modules:` — mỗi cái một
# pack 6 artifact dựng ở s6. Nên `06_modules/<ten>/**` nay ĐÃ khai cho cả sáu,
# và `check_g6a` đối chiếu 17 module ↔ 17 thư mục.
#
# KHÔNG để lại một khoá `modules_du_kien:` RỖNG: một khoá rỗng đọc như 'còn
# module đang chờ' trong khi không còn cái nào, và nó là thứ PHẢI NHỚ mới dọn.
# Cần lại mục này (đợt ba) thì thêm lại — kèm đúng đoạn giải thích ở trên.
# Worklog: WL-01K9W3S6M12 … WL-01K9W8S6M17.
