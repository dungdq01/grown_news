        note: >
          NULL = chưa dùng. Đánh dấu bằng UPDATE...WHERE dung_luc IS NULL +
          changes(), KHÔNG phải SELECT-rồi-UPDATE (M18-R1) — hai request dùng
          cùng một mã đồng thời phải có đúng MỘT thành công.
    used_by: [M08_api, M17_cong, M15_kenh]

  DinhDanhKenh:
