          ngoài khoảng ảnh thật 77–152, nên ghi để theo dõi chứ không tính lỗi.
        chart_palette: pass dataviz/validate_palette.js cả light và dark
        typography: >
          0 cỡ chữ gõ tay · MỘT họ chữ (Inter) cho mọi màn · weight chỉ từ token.
          FR-018: mono chỉ còn ở mã thật (code/pre/kbd + output gate/validate);
