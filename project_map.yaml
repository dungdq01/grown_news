          thành một bí mật vĩnh viễn.
      nguoi_dung_id:  {spec: 06_modules/M18_nguoidung/spec.md, note: mã cấp cho ai}
      het_han:        {spec: 06_modules/M18_nguoidung/spec.md, note: "bắt buộc — sinh mã không hết hạn là ĐỎ Ở CỔNG SINH"}
      dung_luc:
