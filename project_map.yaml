      tokens: 05_uiux/tokens.css              # 90 token — NGUỒN DUY NHẤT, import thẳng
                                              # (ghi 113 từ s5, đếm thật 90 — FR-027 sửa)
      design: 05_uiux/DESIGN.md               # vì sao token là vậy
      typography: 05_uiux/TYPOGRAPHY.md       # cỡ chữ nào dùng ở đâu
      wireframe: 05_uiux/wireframes/SCR-00-app-shell.md
      prototype: 05_uiux/prototype/app-v20.html
      readme: 05_uiux/README.md               # đọc file này trước
