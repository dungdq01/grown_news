  F1_ingest:
    p0: true
    purpose: link → bản phân tích draft trong kb/
    modules: [M01_core, M02_kb]
    steps: skill 6 pass → kb/<type>/<slug>.md → pre-commit validate → draft
    diagram: 04_system/diagrams/flow-tong.md

  F2_review:
    p0: true
    purpose: draft → approved. Cổng người duy nhất.
    modules: [M02_kb]
    steps: người đọc → sửa → đổi review_status → commit
    diagram: 04_system/diagrams/flow-tong.md

  F3_publish:
    p0: true
    purpose: approved → trang báo
    modules: [M02_kb, M03_web, M04_ci]
    steps: git push → CI xanh → build đọc kb/ → chỉ approved → gộp url_normalized
    diagram: 04_system/diagrams/flow-tong.md

# Cưỡng chế bằng máy — nơi rule có răng (S1-S4).
enforcement:
  S1_deny:
    file: .claude/settings.json
    paths: 6                       # 3 mặc định ADOPT + 3 hợp đồng dự án
    note: schema, concepts.yaml, .githooks — sửa phải qua FR
  S3_toolchain:
    cmds:
      - {cmd: "python core/src/source_distiller/validate.py kb/", gate: 8 cổng format}
      - {cmd: "pytest core/tests -q", gate: 49 test, note: kiểm luật có hiệu lực}
      - {cmd: "for f in core/tests/check_*.py", gate: 31 cổng check, note: v31 đếm bằng ls}
    ci: .github/workflows/ci.yml   # v31 · CÓ RỒI (M04 as-built). Nợ còn:
                                   # chungcat/** + truyhoi/** CHƯA vào CI — T04-8.
  S4_git:
    hook: .githooks/pre-commit
    note: chặn commit .md sai format trong kb/; đã kiểm chứng chặn thật

# Khoảng trống đã biết — không giấu, để gate sau soi
  # ═══ v31 · FLOWS ĐỢT HAI — mã đã chạy thật, map phải biết ═══
  F4_chung_cat:
    p0: true
    purpose: bản ghi kho → job M12 → model thật → verify quote → NHÁP → người duyệt → kho
    modules: [M03_web, M08_api, M12_chungcat]
    steps: nút Chưng cất → POST /api/job → worker → egress một cửa → C2 nháp → /chung-cat/nhap/
  F5_transcript:
    p0: true
    purpose: video (URL/mp4) → tải audio → ASR local → .vtt hiện vật → (chưng cất từ transcript)
    modules: [M03_web, M08_api, M12_chungcat]
    steps: Sinh transcript → tai_nguon (allowlist+ingress) → faster-whisper → gan-hien-vat → tab Transcript
  F6_truy_hoi:
    p0: false                      # plan 9 đơn vị đã duyệt, 0 mã (2026-09-08)
    purpose: kho → chỉ mục dẫn xuất → tìm đoạn kèm địa chỉ bấm được
    modules: [M03_web, M08_api, M13_truyhoi]

