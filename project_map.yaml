  # FR-046 (2026-09-02) — bản nháp chưng cất. CÙNG LỖ với bốn bảng trên:
  # FR-046 không gán chủ cho nó, và `check_map` không đọc `entities` nên không ai báo.
  # Chủ là M12 vì M12 SINH và SỬA nó (AC-5.4/5.5: checkpoint + lan_gui);
  # M08 chỉ là nơi THI HÀNH cửa ghi, giống quan hệ M08 ↔ M18.

  NhapChungCat:
    owner: M12_chungcat
    description: bản nháp AI sinh, người sửa — sống trong DB, không phải file (FR-046)
    storage: "web/<db của LÕI>"
    schema: null
    fields:
      job_ulid:      {spec: 06_modules/M12_chungcat/spec.md, note: khóa chính}
      ban_goc_ai:    {spec: 06_modules/M12_chungcat/spec.md, note: bản MÁY sinh, KHÔNG được ghi đè}
      ban_hien_tai:  {spec: 06_modules/M12_chungcat/spec.md, note: bản người đang sửa}
    used_by: [M12_chungcat, M08_api, M03_web]
    note: >
      Tốn TOKEN MODEL để tạo ra — thứ đắt nhất trong năm bảng của DB LÕI, nên
      ADR-06 (c) xếp nó vào nhóm PHẢI XUẤT ra file để backup.

  # ═══ proposal-3 + ADR-07 (2026-09-03) — ô setting sửa được từ web ═══
  #
  # BA TẦNG, và ranh giới giữa chúng LÀ quyết định (ADR-07):
  #   bất biến   → mã + DDL CHECK      → KHÔNG AI đổi, kể cả `chu`
  #   schema ô   → `O_SUA_DUOC` trong mã → không ai đổi QUA WEB (sửa = PR)
  #   giá trị ô  → bảng `cai_dat` ở DB   → `chu`, qua web
  #
  # Tầng giữa phân biệt quyết định này với "một form sửa DB": DB chỉ giữ GIÁ TRỊ
  # của ô ĐÃ ĐƯỢC KHAI TỒN TẠI TRONG MÃ. Không đường nào để một form TẠO RA một
  # ô mới — allowlist, không denylist (CVE-2018-8007 đi vòng một blacklist).

  CaiDat:
    owner: M18_nguoidung
    description: >
      giá trị boolean của các ô quyền ĐÃ KHAI trong mã. KHÔNG phải "mọi cài đặt
      hệ thống" — bảng model/trần/quota vẫn read-only trỏ file (SCR-16 nguyên).
    storage: "web/<db của LÕI>   # ADR-06 — cùng chỗ với bốn bảng tài khoản"
    schema: null                   # không qua validate.py; DDL ở M08_api
    fields:
      khoa:
        spec: 06_modules/M18_nguoidung/spec.md
        note: >
          PHẢI có trong `O_SUA_DUOC` (allowlist trong mã). Khoá lạ ⇒ TỪ CHỐI,
          không tạo hàng. Đây là vế `M3.2` của proposal-3.
      gia_tri:
        spec: 06_modules/M18_nguoidung/spec.md
        note: >
          Boolean. KHÔNG chuỗi tự do, KHÔNG JSON — vế nền của security_baseline
          §9.2: không ô nào được diễn giải thành đường dẫn/lệnh/URL/mã.
          CVE-2024-3028/3025: một trường setting ⇒ XOÁ ĐƯỢC FILE SQLITE.
      doi_luc:  {spec: 06_modules/M18_nguoidung/spec.md, note: máy đặt}
      boi:
        spec: 06_modules/M18_nguoidung/spec.md
        note: >
          AI ĐÃ đổi. SEC 17a-4(f)(2)(i) gọi tên trường này (*identity of the
          actor*), và CVE-2026-48086 ghi đúng chỗ né được nếu thiếu nó.
    used_by: [M08_api, M03_web]
    note: >
      BỐN vế KHÔNG THƯƠNG LƯỢNG (security_baseline §9.1), mỗi vế một CVE:
        1. `duyet-bai` không bao giờ là một ô  (CVE-2024-3283)
        2. `vai` không là một ô; enum khoá DDL  (CVE-2026-9796)
        3. cửa ghi không nhận object            (CVE-2026-31942)
        4. `viec` sửa-setting không sửa DANH SÁCH ô  (CVE-2026-17601)

  # ═══ FR-048 — GIỮ CHỖ cho M19_baihoc (Edu), CHƯA THI CÔNG ═══
  # KHÔNG có 06_modules/M19_baihoc/ và KHÔNG có mục trong `modules:`.
  # check_map kiểm HAI CHIỀU: thêm module vào map mà không dựng thư mục ⇒ ĐỎ,
  # và đó là ĐÚNG — nó bắt đúng lúc ai đó định thi công M19 mà chưa qua s2/s3.
  #
  # Vì sao giữ chỗ ngay bây giờ mà không đợi upgrade 2:
  #   M14_chatbot AC-8.4 (đã viết, G6A xanh) hứa "đúng MỘT hàm giải bot → tập
  #   doc_id". Hôm nay KHÔNG CÓ BẢNG NÀO đứng sau lời hứa đó. `bai_hoc` chính
  #   là nó. Không khai hình dạng ở đây thì ba module (M13, M14, M03) mỗi bên
  #   tự nghĩ ra một hình dạng, và hợp nhất về sau đắt hơn nhiều.
  #
  # Vì sao CHƯA thi công được (FR-048 §4):
  #   s1 ĐÃ phủ  — research_summary §3.1 nguyên lý ①: "phạm vi truy hồi là
  #                control HIỂN THỊ". NotebookLM là 1 trong 4 bản khảo.
  #   s2 CHƯA    — proposal đợt hai không có scope-in nào tên "gom nhóm".
  #                Luật riêng s2: "Proposal duyệt xong = phạm vi thô CHỐT.
  #                Đổi ⇒ FR, không âm thầm phình ở s3."
  #   s3 CHƯA    — prd.md không có "bài học".
  #   ⇒ Đường đúng khi upgrade 2 khởi động: FR mở rộng phạm vi → PRD + proposal
  #     → s6. KHÔNG quay về s1.

  # ═══ v31 · BỐN ENTITY ĐANG CHẠY mà map chưa biết (audit dev mới #8) ═══
  Media:
    owner: M09_thuvien             # hàng byte hiện vật; schema sống ở kho.schema.sql (M01)
    fields: [sha256, byte, la_dan_xuat, kieu_moc, so_byte(GENERATED)]
