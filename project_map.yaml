    description: >
      một tập nguồn CÓ TÊN và CÓ THỨ TỰ, gom bài viết + tài liệu + video thành
      một đơn vị học. Chiều phân loại THỨ TƯ.
    storage: null                  # chưa quyết — thi công ở upgrade 2
    schema: null
    status: planned                # cùng giá trị M10/M11 mang
    fields:
      ten:      {spec: null, note: chưa thi công}
      thu_tu:
        spec: null
        note: >
          ĐIỂM PHÂN BIỆT với concepts/category, và là lý do nó không suy ra
          được: concepts là một TẬP, bài học là một DANH SÁCH. Không phép tính
          nào lấy concepts ra thứ tự bài 1 → bài 2 → bài 3.
    used_by: [M14_chatbot, M13_truyhoi, M03_web]   # khi thi công
    note: >
      KHÔNG nhét vào M12_chungcat: M12 chưng MỘT nguồn thành MỘT nháp (1→1);
      bài học là nhiều-nhiều CÓ THỨ TỰ giữa ba bảng đã có. Hai hình dạng khác nhau.
      Lộ trình đã chốt: bài học → khóa học → lớp học ⇒ Edu, ở đợt upgrade 2.

flows:
  F0_toan_canh:
    p0: true
    purpose: bốn module, một chiều dữ liệu
    modules: [M01_core, M02_kb, M03_web, M04_ci]
