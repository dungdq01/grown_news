tien_de_nguoi_dung_toi_phai_sua:
  ho_noi: '"nếu .yaml khó khăn trong giao tiếp cho API/web thì sao không dùng .csv"'
  do_duoc:
    - "dungchung.mjs:95  YAML.stringify(fm) — hệ thống ĐÃ ghi YAML mỗi lần sửa bài"
    - "gate.py:131,166   yaml.safe_dump — phía Python cũng vậy"
    - "dungchung.mjs:47  mượn `yaml` của Quartz ⇒ 0 dependency mới"
    - "articles.mjs:61   API trả JSON `{items:[{id,label_vi}]}`, KHÔNG trả YAML"
  ket_luan: >
    Web đã nhận JSON rồi. YAML chỉ là định dạng NGUỒN mà server parse. Đổi sang
    CSV không làm bề mặt API đổi gì — chỉ đổi chỗ parse. Vấn đề thật là THIẾU
    ENDPOINT GHI, không phải định dạng.
  csv_se_mat:
    - "`aliases` là list thật; một alias chứa dấu phẩy + tiếng Việt (concepts.yaml:28)"
    - "23 dòng comment mang LUẬT VẬN HÀNH (42% categories.yaml) — CSV không có comment"
    - "5 comment nhóm chia 22 concept thành 5 cụm — cấu trúc ngầm, không trang trí"
    - "đổi tên file frozen ⇒ FR + sửa FROZEN.lock + ≥12 điểm hardcode"
  nguoi_dung_chon: giữ YAML

hai_phan_trong_yeu_cau_DA_CHAY_san:
