lam_gi:
  A1_chip_muc_chua_dung: >
    Giữ nguyên lý lẽ cũ ("22 bar trong đó 12 bằng 0 là nhiễu") nhưng KHÔNG cắt
    bỏ: mục chưa dùng xuống vùng chip `#cchua`. Chip là <span> chứ không
    <button> — lọc theo nhãn 0 bài thì ra lưới rỗng, hình dạng phải nói đúng
    việc nó làm được.
  A2_moc_category: >
    Mốc MỚI `#catlist` + `#catcount`. Mỗi mục hiện label_vi + id + số bài, `gom`
    vào title. Mục đang có bài thêm class .ch-d (viền đậm) + số.
  A3_sidebar_nhan_tiếng_Việt: >
    `data-gt` GIỮ id (JS lọc so với data-cat/data-cpt trên thẻ — đổi nó là vỡ bộ
    lọc). Chỉ đổi chữ hiển thị, id còn xem được ở title. Không có nhãn thì giữ
    id (fail mềm).
  mot_ham_cho_hai_file: >
    docDanhMucFile(kho, ten) thay docDanhMuc hardcode "concepts.yaml". Viết bản
    thứ hai là nhân bản nợ — đúng họ hai bản schema đã lệch hai lần.
  don_no_kem: >
    shell.html:169 gõ cứng `Ngưỡng gợi ý gộp: <b>2</b>` — bản copy THỨ HAI của
    concept_merge_min (bản đầu tôi đã sửa ở worklog trước, ở index.ts). Giờ là
    mốc `#pnguong` đọc từ thresholds.yaml. M07-R2: "sửa MỘT chỗ".

loi_TU_TAO_RA_va_tu_bat:
  what: >
    Sau khi sửa, bản THẬT hiện "Agent và LLM" đúng, nhưng bản /mock/ vẫn hiện
    `agent-llm` id thô.
  goc: >
    Là hệ quả trực tiếp của việc tôi tách hai kho ở worklog trước
    (docDanhMucFile đọc vocab từ CHÍNH kho nó dùng). kb-mock/ không có
    categories.yaml — sinh_kb_mock.py chỉ copy concepts.yaml.
  sua_o_goc: >
    sinh_kb_mock.py copy CẢ HAI file trong một vòng lặp, không thêm khối thứ hai
    giống khối cũ. Sinh lại kho, build lại: cả hai bản hiện nhãn tiếng Việt.
  bai_hoc: >
    Tách hai kho là đúng, nhưng mỗi file vocab thêm vào kb/ từ nay phải nhớ
    thêm vào generator. Vòng lặp theo tên file làm việc đó thành một chỗ.

