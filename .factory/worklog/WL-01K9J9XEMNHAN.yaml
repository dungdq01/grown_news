khong_giai_duoc_va_da_noi_thang:
  what: >
    Người dùng nói "không phải lúc nào cũng có PC". GĐ A KHÔNG giải điều đó —
    server bind cứng 127.0.0.1 (M08-R1) nên vẫn phải ngồi trước máy đó.
  vi_sao_khong_lam: >
    Nghe ra LAN/Internet đụng M08-R1 + B-D3 ("web chạy local hoặc private") +
    security_baseline §4 (rà toàn kho trước khi để ra ngoài) và §1 (không auth —
    "localhost LÀ toàn bộ lớp bảo vệ"). Đó là FR-020 riêng, việc khác.
  nguoi_dung_xac_nhan: >
    Họ nói ý là "giao tiếp qua API web cho tiện" ⇒ GĐ A giải đúng phần đó: bấm
    trên trình duyệt thay vì mở VS Code sửa YAML.

