# ══ Ba tầng escaping cắn trong MỘT đơn vị, và lần này để lại byte điều khiển ══
#
# Lần thứ 11, 12, 13 của cùng lớp lỗi. Ghi ra để nó thành LUẬT, không thành
# kỷ niệm. (Cố ý KHÔNG viết ví dụ bằng chính các chuỗi escape đó — viết chúng
# vào đây đã làm file này hỏng thêm một lần nữa lúc soạn.)
#
# 1 · articles.mjs (B5) — tôi dán KÝ TỰ ĐIỀU KHIỂN THẬT vào một character class
#     của regex. git và grep lập tức coi cả file là "binary file". Sửa: viết
#     bằng escape dạng chữ u cộng bốn chữ số hex, không dán ký tự thật.
#
# 2 · shell.html dùng CRLF (770 trên 771 dòng). Mọi mốc tìm-thay gõ bằng ký tự
#     xuống dòng đơn KHÔNG khớp. Sửa: đổi mốc sang CRLF ngay trước khi so.
#
# 3 · thu-vien-nap.test.js — một dấu gạch chéo cộng chữ b, đi qua một tầng công
#     cụ nữa, thành BYTE 0x08 (backspace) trong nguồn; regex ranh-giới-từ thành
#     regex tìm ký tự backspace. Nhìn bằng Read KHÔNG thấy — chỉ cat -A thấy.
#     Sửa: bỏ hẳn ranh giới từ, dùng mốc có dấu chấm phẩy (esbuild phát ra dấu
#     chấm phẩy nên mốc đó CHÍNH XÁC hơn), rồi đếm byte dưới 32 phải bằng 0.
#
# LUẬT rút ra — FR-033 §6 đã ghi mà tôi vẫn vi phạm: MỖI LẦN một dấu gạch chéo
# phải đi qua một tầng công cụ, hãy chọn cách viết KHÔNG CÓ dấu gạch chéo.
# Và sau mỗi lần ghi file bằng script: đếm byte dưới 32. Read không thấy chúng.

# ══ Cổng của tôi yếu, và kiểm hai chiều bắt được — hai lần ══════════════════
#
# Bản đầu của §3 chỉ so VỊ TRÍ: `.size` xuất hiện trước `fetch(`.
#
# Lượt phá thứ nhất: đổi `if (f.size > MEDIA.tran_byte)` thành `if (false)` —
# cổng **VẪN XANH**. Vì `f.size` và `MEDIA.tran_byte` còn nằm trong CÂU THÔNG
# BÁO của nhánh đã chết. Một nhánh chết thoả mãn mọi phép kiểm dạng "có nhắc
# tên". Siết: đòi một PHÉP SO (toán tử thật).
#
# Lượt phá thứ hai: bỏ hết `return` trong hàm — cổng lại **VẪN XANH**, dù tôi
# đã đòi "so rồi return theo thứ tự". Vì một `return` của nhánh KHÁC
# (`if (!f.size) { …; return }`) còn nằm trong đoạn và thoả điều kiện thứ tự.
# **Một phép kiểm theo THỨ TỰ không biết `return` nào thuộc về ai.**
# Siết lần hai: CẮT KHỐI GUARD theo ngoặc khớp, rồi đòi `return` NẰM TRONG nó.
# Giờ bỏ đúng `return` của khối size ⇒ đỏ, còn nhánh kia giữ nguyên ⇒ không đỏ oan.
#
# Đây là lý do "xanh không chứng minh gì" phải áp cho CẢ cổng mình vừa viết.

# ══ Một phép kiểm cũ HẾT THOẢ ĐƯỢC, không phải bị vi phạm ═══════════════════
#
# `cac-man-con-lai.test.js:441` ghim `np-au` đúng 3 vạch và dãy 3/2/1. Thang có
# BA mức; màn giờ có BỐN lối ⇒ bốn mức khác nhau là điều **không thoả được**.
#
# Đây khác hẳn "cổng mất răng": cổng mất răng thì điều kiện thành hiển nhiên
# đúng; ở đây điều kiện thành hiển nhiên SAI. Cả hai đều phải sửa, nhưng lý do
# ngược nhau, và nhầm lẫn giữa chúng dẫn tới nới cổng khi đáng lẽ phải siết.
#
# Viết lại theo ý định mà chính bình luận cũ đã khai: số vạch DẪN XUẤT từ số
# tab · mỗi vạch trong 1..3 · ≥2 mức khác nhau · "Tự viết bài" thấp nhất.
# Giữ được mệnh đề còn giá trị ("lối người viết tay là lối máy làm ít nhất") và
# bỏ phần con số đã hết đúng. Hai lối ĐƯỢC cùng mức — "dán link" và "nạp tài
# liệu" đều là máy làm gần hết, và đó là sự thật về sản phẩm.

