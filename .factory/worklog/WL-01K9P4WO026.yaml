bug:
  - >
    Kho mock KHÔNG có nhãn nào đang dùng — trạng thái HỢP LỆ, emitter khai rõ
    `ccount` rỗng khi danh mục rỗng. Hệ quả: `mCc` là `null` nên
    `if (mCc) ok(...)` **không chạy và không in dòng nào**; `soTrongHang` rỗng
    nên `[].every(...)` đúng vô điều kiện
  - >
    Phép thứ nhất BIẾN MẤT KHÔNG DẤU VẾT. Phép thứ hai IN RA CHỮ "ok" trong khi
    tập nó xét là rỗng — `hàng sắp giảm dần: ` với không gì sau dấu hai chấm.
    Chính output của cổng đã nói điều đó suốt, không ai đọc

ban_va:
  - >
    MỘT bản render riêng có nhãn thật cho đúng hai phép này. KHÔNG đụng `kn`:
    cả chục phép khác trong file dựa vào nó, và kho mock rỗng nhãn là trạng thái
    hợp lệ không nên bị ép đổi
  - >
    Gieo 3 khái niệm với 3 · 2 · 1 lượt dùng ⇒ thứ tự đúng là `3 2 1`, phân biệt
    được với mọi thứ tự khác
  - >
    HAI phép tự kiểm vật liệu: `> 0` hàng nhãn, và `>= 2` hàng mang số. Dưới 2
    thì `.every` lại đúng vô điều kiện — chết ở chỗ mới
  - >
    `if (mCc)` đổi thành `ok(mCc !== null, ...)` RỒI MỚI `if`. Im lặng bỏ qua là
    thứ phải bị chặn, không phải thứ được phép

