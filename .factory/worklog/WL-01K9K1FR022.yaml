# ── Cùng ngày: "xoá 2 bài rồi mà ĐÃ LOẠI vẫn 0" ─────────────────────────
loai_khac_xoa:
  nguoi_dung: '"tôi từ chối (xóa) 2 bài rồi mà trong đã loại thống kê vẫn là 0 nè. là sao?"'
  chan_doan: >
    KHÔNG phải bug đếm. Đọc đĩa: hai bài trong _recycle/ đều mang
    review_status: draft — người dùng bấm XOÁ, không phải LOẠI. Con số đúng.
    Nhưng cách viết chữ "từ chối (xóa)" cho thấy hai nút đọc ra là MỘT việc, và
    đó là lỗi của giao diện chứ không phải của người dùng.
  ba_viec_khac_nhau: >
    Duyệt/Loại là PHÁN QUYẾT — bài Ở LẠI kho, đổi trạng thái, loại thì kèm lý do,
    và đếm vào ô thống kê. Bỏ khỏi kho là DI CHUYỂN — file rời kb/ sang
    _recycle/, không còn nằm trong ô nào.
  sua:
    - "nhãn: '✕ loại…' → '✕ Loại (ghi lý do)…' · '🗑 xoá' → '🗑 Bỏ khỏi kho…' + title nói hệ quả"
    - "hộp thoại xoá nói thẳng: 'Đây KHÔNG phải loại bài' và chỉ sang nút kia"
    - "ô KPI thứ năm 'trong thùng rác' (api-only, đếm từ /api/recycle) — thiếu nó thì xoá xong bài bốc hơi khỏi mọi con số"

