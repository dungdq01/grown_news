khong_chi_la_tham_my: >
  Từ lần thứ hai, Chrome hiện ô "Không cho trang này tạo hộp thoại nữa". Bấm
  nhầm một lần thì MỌI confirm sau đó trả false IM LẶNG — nút Xoá thành nút
  chết, không báo gì. Một lớp bảo vệ mà người dùng tự tắt được bằng một cú bấm
  nhầm thì không phải lớp bảo vệ.

khong_dung_moi_ma_tai_dung: >
  Khảo sát tìm ra repo ĐÃ CÓ hệ <dialog> (#dlg-nhan, #dlg-sua — FR-019/FR-021)
  kèm CSS .dlg + ::backdrop + nút đóng tập trung data-dlgdong. FR này thêm một
  hộp thoại dùng chung theo đúng khuôn đó, không phát minh lại.

vi_sao_khong_tu_dung_overlay: >
  Cửa sổ đọc dùng z-index TĂNG KHÔNG TRẦN (let Z = 40, ++Z mỗi lần mở/focus/kéo).
  Overlay position:fixed sẽ chui xuống dưới cửa sổ ngay khi người dùng mở đủ
  nhiều. showModal() vào top layer — không có cuộc đua nào để thua, và có sẵn
  focus-trap + Escape + inert.

bon_bay_da_xu_ly:
  promise_treo: >
    Đóng bằng Escape / ✕ / bấm ra ngoài đều bắn `close` chứ không qua nút OK.
    Không nghe `close` thì hàm gọi đứng chờ mãi một câu trả lời không bao giờ
    tới — treo im lặng, loại khó truy nhất.
  tra_loi_hai_lan: "dongHoi() xoá hoiXong TRƯỚC khi close(), nên handler close không trả lời chồng"
  listener_chong: >
    gan() chạy lại mỗi lần điều hướng SPA. Tôi suýt để listener `close` gắn mà
    không gỡ — sau 10 lần nav là 10 bản cùng nghe. Đã thêm vào addCleanup cùng
    chỗ với các listener khác.
  escape_cua_so_doc: >
    Handler `phim` đóng cửa sổ trên cùng khi Escape. Khi hộp thoại mở, `phim`
    thoát sớm — Escape để <dialog> tự lo, không đóng nhầm cửa sổ phía sau.

duong_du_phong_co_y: >
  Trong chính hoi(): trang không có thẻ <dialog id="dlg-hoi"> (bản build cũ còn
  trong cache) thì rơi về confirm/prompt. Thà hỏi bằng hộp thoại trình duyệt
  còn hơn IM LẶNG LÀM LUÔN một việc xoá. Đây là hai lời gọi duy nhất còn lại;
  test cho phép đúng hai, lời gọi thứ ba là đỏ.

