hai_lan_trung_bay_escape:
  lan_1: "`\n` trong heredoc bi dich thanh xuong dong THAT => SyntaxError 'unterminated string'"
  lan_2: "lap lai y het o lan sua thu hai"
  R4_diem_dung: >
    Lan thu hai dang le phai DOI HUONG chu khong va tiep. Da doi: bo escape han,
    tach mot `print` co `\n` thanh HAI lenh `print`. Khong con escape thi khong
    con bay.
  cong_cu_phoi_ra: "repr() — `\b` thanh byte 0x08 vo hinh voi grep/terminal"

