M06-R4_bien_thanh_CO_CHE:
  rule: "cam 'tu cai skill vao agent, hoac ghi de SKILL.md nguoi da sua'"
  ve_1: "packager KHONG tu chay — nguoi go lenh moi cai. Khong hook, khong import tu server."
  ve_2_kho_hon: >
    Ghi de ban nguoi da sua tay la nuot cong bien tap IM LANG. Khong the phan
    biet "nguon di toi truoc" (cap nhat binh thuong) voi "ban cai bi sua tay"
    neu chi so hai ben. => moi lan cai ghi `.nguon.json` = sha256 cua thu VUA
    CAI. Lan sau, file lech manifest nghia la co nguoi sua tay => DUNG, doi
    `--ghi-de`. Ca am co test rieng, va no kiem CA "ban nguoi sua con NGUYEN
    sau lan dung do" — dung ma van ghi mat mot phan thi loi hua la gia.

cong_phai_do_duoc_VA_khong_do_OAN:
