    Man Cho duyet loc `=== "draft"` nen ban `edited` khong hien, du
    `BANG_CHUYEN` CHO PHEP `edited -> approved` va cua so doc bai CO ve nut Duyet
    cho no. Duong cut o tang dieu huong: API cho, nut co, khong man nao dan toi.
  do_tren_kho_that: >
    2 draft + 1 edited. O KPI "cho duyet" hien 2, "tong ban ghi" hien 3 — ban
    edited khong nam trong BAT KY o nao trong 4 o. Sau khi sua: "cho duyet" = 3.
  bai_den_do_bang_duong_binh_thuong: >
    Sua mot bai approved lam no tut xuong `edited` => ROI KHOI SITE (M03-R1 chi
    publish approved) => roi bien mat khoi moi con so va moi hang cho. Khong tin
    hieu nao cho nguoi duyet biet co viec phai lam.
  duong_duy_nhat_truoc_khi_sua: >
    Vao man Tat ca, TU MAT QUET tim chu `· edited` o dong meta — sidebar chi co
    3 facet cat/loai/cpt, KHONG co facet trang thai.
  sua: "tap `choDuyet` = draft + edited, dung o 6 cho (queue, qcount, 2 o KPI, dai rong, so trang)"
  cho_chua_hon_ca: >
    home-pages/index.ts:435-439 DA CO comment dai giai thich dung loi nay ("liet
    ke trang thai bang tay la dem thu cong mot enum se dai ra") — tac gia sua cho
    CHI MUC cua so, nhung khong ap cho queue/qcount/kpi2 ngay ben duoi. Bai hoc
    viet ra roi ma khong ap het. Day la lan THU BA cung mot loi, moi lan mot cho.

