# ══ PHAN DANG GIA NHAT ═════════════════════════════════════════════════
M14-R3_la_rule_KHONG_cuong_che_duoc_dieu_no_muon: >
  Chu du an chot `co-nhung-mau-thuan` do MODEL tu khai. No chỏi luat goc: model
  vua sinh cau tra loi vua tu phan "nguon mau thuan nen toi khong tra loi", tuc
  so huu thuoc do cua chinh no, va mot lan tu choi SAI trong y het mot lan DUNG.
  Khong dao quyet dinh; thu hep cho no tu do: model duoc KHAI, nhung phai kem
  >=2 dia chi, va CODE kiem dieu kien can — ca hai phan giai duoc, va thuoc HAI
  ban ghi khac nhau.
  Ghi RO gioi han trong rules.md: rule nay KHONG cuong che duoc "dung tu choi
  sai", chi cuong che duoc "tu choi phai tro vao hai cho co that". Viet gioi han
  ra la de khong ai doc bang rule roi tuong nhanh nay da duoc canh dung nghia.
  Va vi nhanh nay KHONG co tien le ma nguon mo nao, AC-4.3 (log MOI lan ban) la
  thu duy nhat cho biet sau ba thang no co bi lam dung khong.

mot_quyet_dinh_UI_quyet_dinh_luon_gia_tri_CA_module: >
  Chu du an chon "gan co TUNG khang dinh" thay vi bo im lang / tu choi ca cau.
  Lua chon do CHI co nghia neu co duoc NHIN THAY. Mot block chua-xac-minh render
  GIONG block da xac minh thi he da bo im lang — chi la bo trong mat nguoi doc
  thay vi bo trong du lieu.
  Nhung do la AC cua M03, KHONG phai M14. Neu khong ai viet AC ben M03 thi lua
  chon cua chu du an mat hieu luc MA KHONG CONG NAO DO. Da ghi thanh muc rieng o
  ui_flow §2 de s7 chia task cho M03, khong de no roi vao khe giua hai module.

viet_ra_cai_verify_KHONG_bao_dam_—_de_khong_khai_qua_vach: >
  M14 la cho de khai qua vach nhat. Mot cau tra loi co MOI citation xac minh VAN
  CO THE SAI. Co `da-xac-minh` nghia la "quote nay co that o do", khong nghia
  "cau nay dung". Da lap bang bon dong kiem-duoc / KHONG-kiem-duoc o model_flow
  §5, dan thang B-A6: "may kiem duoc dia chi co that + van tai do chua tu khoa,
  KHONG kiem duoc van do co ung ho khang dinh. Dung khai qua vach."

thu_tu_citation-first_la_HOP_DONG_khong_phai_toi_uu_prompt: >
  57% citation kieu generate-then-cite la post-rationalization (research §11).
  Nen "doan truoc, viet sau" khong phai mot cach viet prompt cho gon — no la hop
  dong. Va AC-5.2 (KHONG goi M13 lan hai sau khi model da viet) la cach duy nhat
  cuong che tu ngoai: mot loi goi M13 sau khi model da viet CHINH LA cai dat cua
  57% do.

M15_dung_DUNG_endpoint_cua_M03: >
  Khong co endpoint rieng cho kenh. Mot endpoint rieng cho Telegram la buoc dau
  cua viec chatbot moc hai ban, va M8.2 (kenh thu hai <=20% cong kenh thu nhat)
  la phep do bat dung chuyen do. Ghi vao model_flow §2 vi day la thu s7 de chia
  sai nhat — "lam mot route rieng cho gon" nghe vo hai.

