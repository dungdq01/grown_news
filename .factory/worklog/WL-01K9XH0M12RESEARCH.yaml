upload_MP4_do_hanh_vi: >
  Cau hoi cua chu du an: "upload MP4 da co chua?"
  DO THAT qua luuHienVat tren kho tam (byte mo dau ftyp mp42):
    video/mp4 · audio/mpeg · video/quicktime · video/x-matroska · video/webm
       => ok=true, 201  (CA NAM)
    26214401 byte => ok=false, 413   (tran TRAN_MEDIA = 25 MB)
  Va frontmatter.schema.json khai media.items.mime la `pattern` RFC CHUNG
  ⇒ video/mp4 hop le o ca schema. Magic-byte chi ap cho 5 dinh dang da khai.
  => CO, upload MP4 chay duoc. Nhung KHONG dung duoc cho video:
     25 MB ≈ 1-2 phut video 1080p (vs ~26 phut MP3 128k, ~50 phut Opus 64k);
     luu thanh application/octet-stream + xem_truoc "tai" (mot nut tai ve);
     khong noi duoc source_type video (bang video doi url_normalized).
  => VA no KHONG phai thu M12 can: research PHAN C chot audio KHONG vao kho,
     no song trong Maildir cua job roi BI XOA; chi transcript .vtt vao kho.

bon_lo_da_ghi_vao_FR-054_§7:
  - "§4.2 KHONG cuong che duoc. No viet 'khong them mime video/*' — nhung KHONG
     CAN them: FR-039 da doi vai bang mime tu cong NHAN sang bang RENDER. Luat
     'khong byte video vao kho' dang song bang CHU, khong bang cong. Ba loi, ca ba
     la quyet dinh cua chu du an vi loi nao cung cham mot FR da duyet. Toi khuyen
     loi (b): giu FR-039 nguyen, them mot luat hep hon 'ban ghi video khong duoc
     co media mime video/*' — cuong che duoc bang CHECK/mot cong thay vi bang mot cau."
  - "§4.4 chot file-nguoi-tai la multipart qua web/, nhung KHONG noi tran cua
     duong multipart. Dung 25 MB cua kho la con so SAI ve ban chat — dau vao tam
     cua mot job khong phai noi dung kho. Can hang thu ba TRAN_NGUYEN_LIEU (M09-R5
     da lap tien le dung: TRAN va TRAN_MEDIA la HAI hang). Va cua nen nhan AUDIO
     chu khong VIDEO: duoi cung mot tran, audio chua 20-40x thoi luong."
  - "V6 da HET DO. §3 khai V6 phai 'do hom nay' vi FR-052 chua ap, va goi do la
     'cach dung de mot phu thuoc khong bi quen'. Do 2026-09-03: schema khai
     media.type=array, minItems=1 ⇒ FR-052 DA AP. Nen dong 'phu thuoc CUNG ...
     chua ap' o dau FR khong con dung, va V6 khong do duoc nua theo cach no mo ta."
  - "Da viet testcase cho V1-V7 o testcases.md PHAN III. Viet ra thi lo ba cho FR
     chua du de viet MOT ket qua mong doi: V1 (transcript do NGUOI dan => la_asr
     false, truong model ASR mang gi?) · V5 (MOI loi that bai => neu tung loi hay
     mot cau chung?) · V7 (VTT co BOM UTF-8 truoc WEBVTT => W3C cho phep, phep so
