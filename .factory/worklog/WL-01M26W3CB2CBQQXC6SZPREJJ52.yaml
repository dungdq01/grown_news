ve_dat_nhat_thuoc_phai_di_theo_code: |
  Doi sang mui ten lam cong `chung-cat-nhom-theo-bai` DO: helper `tach()` cua no
  chi biet `function ten(`. Hai duong sai deu bi loai:
    · noi ve  -> mat luon phep do
    · giu ma o dang cu de chieu thuoc -> thuoc dieu khien code
  Sua THUOC. Va do lai thi loi ra `tach` cu con **khong doc duoc `async function`**
  (`ccNap` chi khop nho `indexOf` tim chuoi con) — mot lo im lang tu truoc.

  Neo moi `(?:^|\n)[\t ]*((?:async )?(?:function ten\(|const ten = ))`.
  Lan dau toi neo `^…` cung, lam vo ve 7 (`async function ccNap`) — **toi da
  chan doan nham la "xanh oan co san"**, doc lai file thi day la hong do CHINH
  neo vua them. Da sua, khong de lai loi phan sai trong tai lieu.

  Chung minh con DO DUOC (4 phep, 3 dang khai bao):
    viecNguoi (mui ten) · _cau (function) · ccNap (async fn) · ccKpi (function)
    -> co trich duoc; xoa ten khoi nguon -> ca bon tra `null`.

