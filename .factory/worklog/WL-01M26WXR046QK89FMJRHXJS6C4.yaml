tim_ra_the_nao: |
  Khong ai bao cao. Cong `check_khuon_linh_dong` do sau dot clear du lieu, va
  toi suyt ghi no la "nhieu fixture" roi cho qua — vi thong bao la
  `word_count khai 1008 nhung dem duoc 910`, nghe dung nhu lech so dem.

  Loai gia thuyet do bang mot phep do NGUOC: cho than DUNG khung di qua ham,
  khong them gi.
    than goc                          : 1008 chu
    qua ham, khong them gi            : 1008 chu   <- bat bien
    them 2 muc (+7 chu)               : 1015 mong doi
    qua ham                           :  907       <- MAT 108
  Bat bien tren duong thuong ma mat chu khi co muc them ⇒ khong phai fixture.

nguyen_nhan: |
  `noi: dict[str, str]` va `tieu_de: dict[str, str]` khoa theo SO MUC. Bai nen
  moi (sinh sau dot clear) co san `## 6. Huong dan tich hop cho Lap trinh vien`;
  cong them mot `## 6.` nua ⇒ cai sau de cai truoc, ca khoi 108 chu bien mat,
  KHONG mot dong log. Vong phat lai muc ngoai khung con `da_ra` — cung khu
  trung theo so, nen sua moi `noi` van mat.

  So muc la do MODEL dat. Lay no lam khoa tu dien la gia dinh sai tu dau, va no
  nam dung trong duong ma `WO-077`/`WO-094` vua mo cho model viet tu do —
  cang tu do thi cang de trung.

vi_sao_lo_nay_song_toi_hom_nay: |
  Bai nen CU khong co `## 6.` cua rieng no, nen cong xanh. Cong lay
  `next(p for p in kb/**/*.md if 'ho_so: phan-tich' in ...)` — tuc **phu thuoc
  am vao mot file du lieu**. Dot clear doi file nen va lo hong lo ra.
  Ghi lai day nhu mot lop loi: cong doc du lieu that thi du lieu that la mot
  phan cua thuoc.

sua: |
  `moc` mang ca TEN; dung `lan: list[[so, ten, chu]]` theo THU TU xuat hien
  thay cho hai tu dien. O khung lay lan xuat hien DAU TIEN cua so ay va danh
  dau `dung`; moi lan con lai — ke ca trung so voi mot o khung — xuong duoi,
  khu trung theo CHI SO chu khong theo so muc.

