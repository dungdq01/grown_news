viec: |
  Mở `GET /api/model` + `POST /api/job` ở `web`, để trình duyệt gọi được dịch vụ
  chưng cất MÀ KHÔNG cầm khoá dịch vụ. Trước lượt này FE không có đường nào tới
  `:8790` — bốn task UI (T03-92/93/94/95) đứng chờ đúng chỗ này.

  Ba quyết định đọc được trong mã, không nằm trong đầu ai:
  1 · số cổng THỢ đọc từ `core/assets/dich-vu.json`, không gõ `8790` lần thứ hai.
  2 · `dich` (đích egress) bị lọc LẠI ở cửa LÕI — THỢ đã lọc ở đầu kia, cửa này
      không tin đầu kia đã lọc. Hai lớp cho một luật, lớp thứ hai rẻ.
  3 · thiếu phiên ⇒ VẪN tạo việc với `nguoi_dung_id` null + một dòng `audit_log`
      nói việc KHÔNG CÓ CHỦ. KHÔNG rơi về "người dùng mặc định" — cái đó mới là
      fail-open mà `FR-047 §2.1 L2` cấm. Khi đăng nhập web có: đổi thành DENY.

