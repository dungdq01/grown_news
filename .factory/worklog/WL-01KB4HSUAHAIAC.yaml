    07_plan (git mv, khong copy) va web/test/kho-delta.test.js CO.
  AC2 (T03-149) — toi viet "grep normalize(NFD) trong web/plugins => dung 1 cho".
    Do that tren *.ts: BA cho, ca ba CO TRUOC luot nay:
      multiwindow.inline.ts:1329  slugGoiY — ban chuan, C3 dung lai
      multiwindow.inline.ts:1709  boDau    — KHAC muc dich: bo dau de SO KHOP, khong
