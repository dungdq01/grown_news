    helper mo coi. `[\s\S]*?` khong-tham VAN bat dau tu `/**` DAU TIEN cua file,
    nen no nuot tron 177 dong dau index.ts: GOC, SEP, NGUONG, esc, mang,
    docTuDia, tg, chen, bar.
  vi_sao_nguy_hiem_hon_binh_thuong: >
    index.ts dang mang thay doi CHUA COMMIT cua AI kia (FR-027f/j/k). `git
    checkout` se xoa luon viec cua ho => khong dung duoc duong lui thong thuong.
  cach_khoi_phuc:
    1: "ghep lai khoi tu HEAD theo DONG (khong theo chuoi — chuoi da that bai 3 lan vi indent doi)"
    2: "build => 'bar' declared twice => xoa ban trung do minh ghep vao"
    3: "build => 'chuTran is not defined' => dung lai (con mot cho dung o oKpi)"
    4: "build => 'TRANG_THAI is not defined' => DUNG LAI TU TEST: bon-trang-thai §4b khai ro no phai doc `properties.review_status.enum` cua schema"
    5: "test layout do => NGUONG thieu `feat`/`phu`/`cot3D`; suy nguoc tu assertion (3 the + 3 dot) => feat 3, phu 2, noiBat 5"
  dieu_cuu_toi: >
    TEST LA DAC TA. Ba thu mat (TRANG_THAI, NGUONG.feat/phu/cot3D) deu dung lai
    duoc CHINH XAC vi co phep kiem noi ro chung phai la gi va lay tu dau. Neu bo
    test viet "kiem tra bieu do dung" thi da mat that.
  bai_hoc_ghi_ten: >
    KHONG dung regex `[\s\S]*?` de xoa MOT khoi trong file lon — no neo tu dau
    file. Muon xoa mot khoi thi cat theo DONG voi hai neo TRUOC va SAU, hoac
    doc file roi Edit chuoi chinh xac.
  da_bao_cao: "co — noi thang trong phan tra loi, khong giau"

