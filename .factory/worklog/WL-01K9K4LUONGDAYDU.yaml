# ── Bug 3: MOI PUT tren bai approved deu ha xuong edited ─────────────────
bug_put_ha_trang_thai:
  muc_do: NGHIEM TRONG — bai roi khoi site sau mot lan bam Luu khong doi gi
  chung_minh_bang_may: >
    `delete fm.review_status` roi gan lai (articles.mjs:211-214) day khoa xuong
    CUOI object. `YAML.stringify` in theo thu tu chen nen hai chuoi khac nhau du
    moi gia tri y het. In ra: thu tu cu `id,review_status,origin,title` vs moi
    `id,title,origin,review_status` — stringify KHAC nhau = true.
  hau_qua: "M03-R1 chi publish `approved`, nen PUT y nguyen = bai roi khoi site, phai xin duyet lai"
  hai_cach_sua_SAI_da_thu_va_loai:
    sortKeys: >
      `YAML.stringify(o,{sortKeys:true})` — co bi BO QUA IM LANG tren ban yaml
      dang dung (do duoc: hai chuoi van khac nhau). Mot tuy chon khong co tac
      dung ma khong bao loi la bay te hon khong co tuy chon.
    replacer_mang: >
      `JSON.stringify(o, Object.keys(o).sort())` — replacer dang mang XOA TRANG
      object long: `skill_candidates:[{priority:3}]` va `[{priority:9}]` deu ra
      `[{}]`. Loi NGUOC va nang hon: sua noi dung ma bai van giu `approved`.
      Bat duoc bang cach tu thu 5 ca truoc khi tin.
  sua: "ham chuan hoa DE QUY (sap khoa moi tang) roi so JSON. Kiem 5 ca: doi thu tu / doi gia tri long sau / thieu khoa / them khoa / doi thu tu mang."

