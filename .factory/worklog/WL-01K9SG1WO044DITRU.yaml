don_vi: WO-044 — DB cũ không theo DDL mới; dời DB + dựng đường di trú

viec: |
  Chủ dự án duyệt lối A. Nhưng phép duyệt đó dựa trên một tiền đề TÔI BÁO SAI,
  và điều đó phải đứng đầu entry này.

  ⚠️ TÔI BÁO SAI TIỀN ĐỀ. Trình lối A kèm câu *"DB rỗng 0 hàng"*. Thực tế
  `audit_loi` có **9 hàng**. Nguyên nhân: lần kiểm đầu tôi gõ `audit_log` —
  sai tên, bảng thật là `audit_loi` — nhận `no such table`, rồi ĐỌC MỘT LỖI
  TÊN THÀNH MỘT SỰ THẬT VỀ DỮ LIỆU.
  Chốt tự đặt đã cứu: `assert tong == 0` chạy NGAY TRƯỚC thao tác không hoàn
  tác được, và nó DỪNG. Nhờ vậy 9 hàng được xuất ra file trước khi DB bị dời.
  ⇒ Tôi KHÔNG xoá DB như phép duyệt cho phép; tôi DỜI nó (giữ được mọi thứ,
    tốn 0), vì tiền đề của phép duyệt đã đổi.

  HAI VIỆC, và việc thứ hai mới là việc thật:
  1 · DB dev dời khỏi repo, dựng lại theo schema mới. Xác nhận trên server
      THẬT: `GET /api/nhap-chung-cat` → 200, `PRAGMA table_info` ra 11 cột.
  2 · Đường DI TRÚ `diTruLoi()` — chạy mỗi lần mở DB, idempotent qua
      `PRAGMA table_info`. KHÔNG cột cờ "đã di trú": một cờ như vậy nói về LỜI
      KHAI, còn `table_info` nói về thứ CÓ THẬT.
      Dựng bảng mới + copy + đổi tên, KHÔNG `ALTER`: SQLite thêm được cột nhưng
      **không sửa được `CHECK`**, mà T08-27 đổi enum 3→4 giá trị.
      Dựng LẠI trigger `ban_goc_ai` — nó gắn với bảng CŨ và chết theo bảng.
      `da_gui`/`bo` ánh xạ về `nhap`; giữ nguyên thì `INSERT` vỡ ở `CHECK` và
      mất cả hàng.

