hoc_duoc: |
  1 · MỘT TRUY VẤN TRẢ "KHÔNG CÓ" PHẢI PHÂN BIỆT HAI CÂU: *"bảng không tồn
      tại"* và *"bảng rỗng"*. Tôi trộn chúng, và một phép duyệt của chủ dự án
      đứng trên câu sai. Chốt kiểm-lại-ngay-trước-khi-làm là thứ đã cứu.

  2 · BỘ CỔNG ĐO SAI CÂU HỎI, và 2785 phép đo xanh không nói được điều đó.
      Mọi cổng trỏ `LOI_DB` vào thư mục tạm ⇒ luôn chạy trên DB MỚI TOANH, nơi
      `CREATE TABLE IF NOT EXISTS` chạy thật. Chúng đo *"schema đúng khi dựng
      từ đầu"*; không ai đo *"schema đúng khi DB đã có"* — và câu thứ hai là
      câu người dùng gặp. `§6b` nay đo đúng ca đó.

  3 · `T08-27` tôi viết *"chưa có dữ liệu thật ⇒ 0 migration"*. Đúng về DỮ
      LIỆU, sai về FILE: một file rỗng vẫn có SCHEMA.

