# ══ Cổng đo ĐẦU ĐỀ, không đo mã nguồn ══════════════════════════════════════
#
# Một `res.writeHead` đúng trong code mà không tới được trình duyệt là một đầu đề
# KHÔNG TỒN TẠI. Repo này đã trúng đúng lớp lỗi đó: `PRAGMA foreign_keys = ON`
# khai trong header DDL suốt mấy tháng mà không cơ chế nào bật — vô hại chỉ vì
# DDL không có FK nào. Nên cổng dùng `http.request` lấy `res.headers` NGUYÊN VĂN,
# không qua lớp gói của `fetch`.
#
# BẢNG KHAI LÁI PHÉP KIỂM: `content-type` và `content-disposition` so với
# `media-mime.json` (`xem_truoc: "iframe"` ⇒ inline, `"the"` ⇒ attachment), KHÔNG
# so với chuỗi gõ tay trong test. Đổi bảng thì phép kiểm đổi theo.

# ══ Ba thứ plan không nói, mà thiếu là hỏng thật ════════════════════════════
#
# 1 · 405 KÈM `Allow`. `DELETE /api/articles/media/<sha>` để mặc sẽ rơi xuống
#     cổng cấu trúc `:type/:slug` và nhận `400 "type phải thuộc: …"` — câu trả
#     lời NÓI SAI CHỖ: nó bảo đường dẫn sai trong khi thứ sai là METHOD, và
#     người gọi đọc rồi đi sửa URL. 405 thiếu `Allow` cũng là 405 không nói được
#     phải làm gì tiếp (RFC 9110 §15.5.6).
#
# 2 · NHÁNH 304. Plan khai `etag` nhưng không khai nhánh nào dùng nó. Một etag
#     không có 304 là etag trang trí — và cả session này đã gọi tên đúng lớp lỗi
#     đó ba lần. Ca âm kèm theo: `If-None-Match` KHÔNG khớp phải ra 200 CÓ thân.
#
# 3 · BLOB MỒ CÔI ⇒ 404. Byte đang staging (vừa nạp, chưa bấm Ghi) là HỢP LỆ
#     trong kho nhưng KHÔNG phải nội dung công khai. Phục vụ nó là biến cửa nạp
#     thành chỗ chứa file ai cũng đọc được, chỉ cần biết sha256.
#     `hienVatPhucVu` dùng CÙNG union ba bảng mà exporter dùng cho luật mồ côi
#     (M09-R1) — một phép tính, hai người gọi.

# ══ Vì sao CSP ở HEADER, không ở attribute ═════════════════════════════════
#
# `sandbox` attribute trên iframe mà không kèm `allow-scripts` làm HỎNG viewer
# PDF của Chromium (nó là một extension chạy script). Cùng một chữ `sandbox`,
# hai chỗ đặt, hai hệ quả khác nhau — và chỗ đúng là header của TÀI NGUYÊN, vì
# ràng buộc thuộc về byte chứ không thuộc về khung nhìn.
#
# `filename=` dùng ĐUÔI từ bảng khai + 12 ký tự đầu của sha256, KHÔNG dùng
# `ten_goc` thô: tên gốc là chuỗi của người gửi, và một `filename=` mang dấu
# ngoặc kép hay newline là đường tách đầu đề. Tên đọc được vẫn còn trong
# frontmatter để FE hiện.
#
# KHÔNG hứa `accept-ranges`: Range không cài ở v1, và hứa mà không cài là hứa dối.

# ══ Hai lần cổng của tôi đo sai, và cả hai đều là bài học lặp lại ═══════════
#
# 1 · `id` của fixture phải khớp `^src_[a-z0-9]{6,}$`. Bản đầu sinh `src_tlpdf`
#     (5 ký tự) nên bị schema chặn, trong khi `src_tlpptx` (6) đi qua — HAI CA
#     GIỐNG NHAU mà một đỏ một xanh, và nó đẩy tôi đi tìm bug ở đường phục vụ
#     trong khi lỗi nằm ở fixture. PAD, đừng cắt.
#
# 2 · `if-none-match: undefined` làm `setHeader` NÉM, giết cả file test trước khi
#     in được dòng nào về bốn phép kiểm còn lại. Cùng bài học với `nap()` ở
#     `thu-vien.test.js`, lần thứ ba trong nhánh B: phép kiểm phải SỐNG SÓT qua
#     đúng thứ nó đang chấm.

