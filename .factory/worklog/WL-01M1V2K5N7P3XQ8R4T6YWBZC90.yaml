ba_loi:
  - ten: "403 cho MỌI lời gọi `/api/job` — Node không đọc `.env`"
    trieu_chung: "nút *Sinh transcript* bấm không ra gì; console đầy 403"
    goc: >
      `tho-cua.mjs` gửi `X-Khoa-Loi` lấy từ `process.env.CHUNGCAT_KHOA_LOI`,
      mà **Node không tự đọc `.env`** — biến là `undefined`, cửa thợ so
      `bool(mong) && header === mong` và chặn. Phía Python đã nạp `.env` từ
      lâu (`moi_truong.nap()`), nên hai bên lệch nhau đúng ở chỗ này: một bên
      đọc file, một bên không.
    sua: "`process.loadEnvFile(new URL(\"../.env\", import.meta.url))` ở đầu `server.mjs`"
    chinh_lai_chan_doan: >
      Tôi báo với chủ dự án là *"`.env` có `CHUNGCAT_KHOA_LOI=` rỗng"* — SAI.
      Khoá đã có sẵn (25 ký tự, tiền tố `dev-`); tôi không đụng vào. Lỗi duy
      nhất là phía Node không đọc file.
    bay_thu_hai: >
      Bản sửa đầu dùng `process.loadEnvFile()` KHÔNG tham số — nó lấy `./.env`
      theo CWD, mà server chạy trong `web/` còn `.env` ở gốc repo. Đo được:
      `ENOENT: open '.env'`, và 403 vẫn nguyên. Đường phải tính theo VỊ TRÍ
      MODULE.

  - ten: "cửa xuất `transcript` — bảng khai HỨA, mã KHÔNG GIAO"
    trieu_chung: >
      Bấm *Phụ đề* ⇒ trình duyệt lưu về `<slug>.json` chứa thân lỗi 404
      ("File wasn't available on site" trong ảnh chủ dự án).
    goc: >
      `xuat-dang.json` khai `theo_loai.transcript = [srt,txt,docx,goc]` từ
      `T08-33`, nhưng `cuaXuat` chỉ biết `khoDoc([loai])` — mà **transcript
      không phải một BẢN GHI**, nó là hiện vật `text/vtt` gắn trên bản ghi
      video. Bảng khai hứa một dạng mã chưa bao giờ cài.
    vi_sao_toi_nay_moi_lo: "`T03-121` là thứ ĐẦU TIÊN dựng đường dẫn tới nó"
    sua: >
      `xuatTranscript()` — tra `khoDoc([\"video\",\"tai-lieu\"])`, lấy hiện vật
      `text/vtt`, `docHienVat` ra byte, rồi `srt`/`txt`/`docx`/`goc`. Chưa có
      transcript ⇒ câu CHỈ ĐƯỜNG, không 404 trần (404 trần làm trình duyệt lưu
      thân lỗi thành file, và người mở ra tưởng transcript của mình hỏng).

  - ten: "`video?dang=goc` trả TRANSCRIPT dán nhãn *bản gốc*"
    phat_hien_boi: "ma trận đo đủ 11 dạng — không phải chủ dự án báo"
    goc: >
      `media[0]` với một video ĐĂNG KÝ BẰNG URL là phần tử duy nhất có mặt, và
      nó là `.vtt` do ASR sinh. Cửa trả file ấy 20 KB kèm nhãn bản gốc.
    vi_sao_nghiem_trong: >
      Đúng thứ `xuat-dang.json` gọi là *"nói dối bằng một cái nút"*. Người bấm
      "bản gốc" muốn thứ họ ĐÃ NẠP.
    sua: >
      Bỏ hiện vật `chi_dan_xuat` (đọc từ `media-mime.json` — MỘT bảng, dùng
      chung với FE) trước khi chọn. Nay trả 422 nói rõ *video đăng ký bằng URL
      thì xem/tải ở nguồn*.

bug_cua_chinh_toi:
  ten: "mục `⌁ chưa sinh` là `<a href=\"#\">` — MỤC CHẾT"
  do: >
    Bấm vào chỉ đổi URL thành `/video/#`, không làm gì. Đúng lối mà chính
    `SCR-21` tôi viết xếp là TỆ NHẤT ("màn hứa một thứ nó không giao") — tôi
    viết dòng ấy rồi tự vi phạm nó.
  cong_xanh_oan: "vế `4c` chỉ đòi *có `href`*, mà `#` là một `href`"
  sua: "`<button data-act=\"chung-cat\">` — cùng đường mà nút ⚗ đã đi, không đẻ đường thứ hai"

