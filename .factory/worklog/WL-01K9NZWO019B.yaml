m09_r3_chung_minh_bang_cau_truc:
  - >
    `src` = `nhung` (hằng trong bảng khai) + `id` (từ URL người dùng dán). Câu
    "src chỉ dựng từ whitelist + regex id" chỉ là LỜI HỨA cho tới khi có ai chứng
    minh không id hợp lệ nào thoát ra khỏi vị trí của nó
  - >
    Cổng SINH CHUỖI TẤN CÔNG rồi thử, không đọc regex bằng mắt: chèn từng ký tự
    trong `/ ? # & % : @ \ . " ' < >` và khoảng trắng vào giữa một id thật, rồi
    đòi `id_mau` từ chối. Một regex đọc-bằng-mắt là một lời khai
  - >
    Và đòi `id_mau` NEO HAI ĐẦU. Thiếu `^…$` thì `[0-9]{6,24}` khớp phần GIỮA
    của `9999999/../evil` và id mang theo dấu gạch chéo
  - >
    `nhung` của `fb` dài vì trình nhúng Facebook nhận một URL ĐÃ MÃ HOÁ PHẦN TRĂM
    làm tham số `href`. `show_text` phải đứng TRƯỚC `href`: id luôn nối vào cuối,
    nên tham số nào đặt sau sẽ rơi vào trong giá trị `href`. `id_mau` chỉ chữ SỐ —
    đó là thứ chặn mọi lối thoát, vì không ký tự nào trong `[0-9]` mở được một
    lớp giải mã phần trăm hay thêm được một tham số

khong_do_duoc:
  - >
    Trình nhúng của Facebook và Douyin có THẬT SỰ phát ở URL đó không — tôi không
    gọi ra ngoài mạng để thử. An toàn KHÔNG phụ thuộc vào việc đó (M09-R3 giữ
    nguyên dù `nhung` sai), nhưng NGƯỜI PHẢI CHỐT: dán một URL fb và một URL
    douyin rồi mở cửa sổ đọc. Khung trống ⇒ chỉ sửa `nhung`, không đụng mã.
    Đã mở ô backlog

