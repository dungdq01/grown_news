tach_hai_bo_dem: >
  FR-046 §2.1 (checkpoint theo giai doan) va M12-R6 (tran thu lai 2) gop lam mot
  bo dem thi mau thuan. Do lai: CHI MOT giai doan tieu egress — `dang-goi-model`.
  Chay lai tu `dang-doc-nguon` ton 0; chay lai tu `dang-verify` ton 0 (voi dieu
  kien phan hoi model da duoc luu).
  => HAI bo dem: `lan_gui` (payload roi khoi may, tran 2, KHONG BAO GIO reset) va
  so lan chay lai (khong tran).
  Cho sac nhat: `lan_gui` KHONG reset la ca luat. Neu chay lai reset no, nguoi bam
  muoi lan la tai lieu di ra muoi lan, va tran thanh trang tri — dung thu M12-R6
  sinh ra de chan. Va 'chay lai tu dau' CO gui lai, nen khi lan_gui=2 nut do phai
  TU CHOI KEM LY DO, khong im lang khong lam gi.
  Khung dung: tran nay KHONG phai quota cua NGUOI — no chan vong lap TU DONG.
  Nguoi that su can gui lan ba thi tao JOB MOI (ULID moi, log rieng), nen con so
  egress van DUNG. May khong duoc tu quyet gui lan ba; nguoi thi duoc, va hanh
  dong do de lai dau vet.

