FR-046_lam_M12-R2_thanh_cong_KHONG_DO_DUOC: >
  xanh_khi cu: "moi .md ra _inbox/ mang draft, ke ca khi payload doi approved".
  Sau FR-046, M12 KHONG tha mot .md nao vao _inbox/ => dieu kien do dung MOT CACH
  RONG, cong xanh ma khong do gi. Dung lop "cong khong do duoc".
  Da viet lai ca ba ve: do_khi nay GIEO mot payload doi `approved` roi DOC LAI hang
  da ghi — do hanh vi tren duong THAT, khong do mot duong khong con ton tai.

FR-046_dua_M12_RA_KHOI_mot_rao_ma_no_khai_la_"khong dung": >
  FR-046 §3 viet "Khong dung B-C1, FR-028, M05-R1". Dung ve CHU: luat M05-R1 khong
  doi mot chu, va _inbox/ van ep draft cho ban NGOAI.
  Nhung: TRUOC FR-046, M12 co HAI rao doc lap — no tu ghi draft, VA gate.py:133 ep
  draft VO DIEU KIEN lan nua. Sau FR-046, gate.py KHONG CON tren duong cua M12.
  Nen rao thu hai MAT, va rao con lai la mac dinh `trang_thai: nhap` cua bang nhap.
  Khong phai vi pham FR — nhung la mot he qua FR khong neu, va nguoi thi cong doc
  "khong dung M05-R1" se tuong con hai rao. Da ghi thanh mot khoi canh bao trong
  spec §1 va trong M12-R2.why.

