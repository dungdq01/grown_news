# ══ 413 — phép kiểm đầu tiên trong repo, và cách đo đầu tiên đã SAI ═════════
#
# `grep "413" web/test/` ra ĐÚNG 0 dòng trước lượt này: đường 413 của `docBody`
# (1 MB, FR-010) chưa bao giờ được bấm qua HTTP.
#
# Cách đo sai: `fetch` một Buffer 26 MB. undici gửi, server trả 413 rồi đóng, và
# client nhận ECONNRESET trên đường GHI trước khi kịp ĐỌC phản hồi ⇒
# `fetch failed`, không phải `413`. Đã thử cả `res.on("finish")` rồi mới destroy
# — vẫn thế. Đây là giới hạn của HTTP, không phải bug của server.
#
# Cách đo đúng: client THÔ (`http.request`), khai `content-length` vượt trần rồi
# KHÔNG gửi byte nào, và đợi phản hồi. Nó đo đúng hợp đồng: "từ chối theo header
# TRƯỚC khi đọc byte". Kèm chiều ngược — khai TRONG trần thì server phải CHỜ
# body, không từ chối sớm (nếu không thì "chặn ở header" thành "chặn mọi thứ").
#
# Và một lần đo sai nữa trên đường đi: `http.request` GIỮ header lại cho tới
# `write()`/`end()` đầu tiên. Không `flushHeaders()` thì server chưa nhận được
# gì, test timeout, và tôi đã suýt kết luận "server đo sau khi đọc" — tức đo một
# cái IM LẶNG CỦA CLIENT rồi phán về SERVER.
#
# HỆ QUẢ CHO B7/B8, phải nhớ: FE **phải tự kiểm `file.size`** trước khi POST.
# Người dùng kéo một file 30 MB vào form sẽ thấy "mạng lỗi" nếu chỉ dựa vào 413.

# ══ Ba quyết định nhỏ, mỗi cái một lý do ═══════════════════════════════════
#
# 1 · `req.destroy()` RA KHỎI `docBodyMedia` trên đường header — đảo một quyết
#     định của B3. Destroy ở đó giết socket trước khi handler nói được `413`.
#     Chủ của socket là HANDLER. Đường STREAM vẫn cắt ngay: ở đó client đã khai
#     sai, không nợ nó lời giải thích.
#
# 2 · `luuHienVat` trả `ma` theo khuôn `themVaoDanhMuc` đã có. 415 = "định dạng
#     này không nhận, đừng thử lại"; 422 = "file này sai/hỏng so với thứ nó tự
#     khai". Gộp một mã là bắt người dùng đoán.
#
# 3 · `x-ten-goc` LỌC Ở SERVER rồi trả lại. Lọc ở FE thì client thứ hai (curl,
#     một script) đi vòng qua được — một luật, một chỗ. Và lọc bằng ESCAPE
#     (`\\u0000-\\u001f`), không dán ký tự điều khiển thật vào nguồn: bản đầu tôi
#     dán thật, và `git`/`grep` coi `articles.mjs` là "binary file".

