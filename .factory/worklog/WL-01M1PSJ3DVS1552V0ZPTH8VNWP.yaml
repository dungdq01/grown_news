ngan_sach_byte:
  ghi_chu: >
    Năm dòng mime video đẩy `gn.js` lên 102460/102400 và trần HTML trang chủ lên
    62713/61440. `FR-061` cấm nới bundle chung ⇒ phải sửa bằng Ý NGHĨA rồi DỌN
    CHỖ, không bằng nới trần.
  buoc:
    - "lọc `nhom_thu_vien` khỏi chip/dòng chữ TÀI LIỆU ⇒ trang chủ 61433/61440"
    - "dời hộp thoại chưng cất (2986B) sang chunk `cctab` ⇒ gn.js 99175/102400"
  cuoi: "gn.js 99175/102400 (dư 3225) · gn.css 102372/102400 (dư 28)"

chan_lai:
  ly_do: >
    Ba chỗ hợp đồng cần chủ dự án xác nhận, ghi ở FR-063: quyết 2 chỏi FR-052
    (đã chọn nghĩa hẹp), ô file mp4 do chunk dựng chứ không phải `trang.mjs`,
    thân transcript ở chunk `cctab` chứ không phải `chungcat.inline.ts`.
  ngoai_pham_vi:
    - web/plugins/cctab/src/cctab.inline.ts
    - web/api/dungchung.mjs
    - web/build-fe.mjs
    - web/render/trang.mjs
    - core/tests/test_gates.py
  fr: FR-063 — CHỜ KÝ. Không nới tại chỗ.

nguoi_phai_ky:
  - >
    `core/assets/frontmatter.schema.json` — `so_byte.maximum` 26214400 →
    1073741824, khớp `tran_byte` của `media-mime.json` (FR-054 §9). check_frozen
    đang ĐỎ đúng. Lệnh: `PYTHONIOENCODING=utf-8 ./.venv/Scripts/python.exe
    core/tests/check_frozen.py --ky`. Agent KHÔNG ký (R2).

keo_theo:
  - >
    `check_frozen.py` exit 1 OAN trên console mặc định Windows: in tiếng Việt ra
    cp1252 ⇒ UnicodeEncodeError SAU KHI đã kết luận xanh. `#cổng-đỏ-oan`, và nó
    chặn đúng gate người phải ký. Đáng một WO.
  - >
    Trần HTML trang chủ 61433/61440 — 7 byte. Đây là ngưỡng THẬT đang chặn mọi
    ô/chip mới, không phải `gn.js`.
  - >
    `esc2` (multiwindow:2366) KHÔNG phải bản trùng của `esc`: `esc` ném trên
    non-string, `esc2` ép `String(s ?? "")`. Ghi để lần sau không ai "dọn trùng".
  - >
    Bảy cổng đo SAI CHỖ đã sửa cùng lượt (chi tiết FR-063 §4) — đo tên hàm,
    khoảng cách ký tự, hoặc một trong hai đường nạp. Không cổng nào bị làm yếu;
    phép chiếu `xem_truoc` từng làm một cổng đỏ đã được HOÀN NGUYÊN thay vì sửa
    cổng cho vừa.

