ba_loi_harness_va_bai_hoc:
  - >
    **PUT kèm `slug` khác ⇒ server TỪ CHỐI HẲN (400)**, không lặng lẽ bỏ qua như
    tôi giả định. Hệ quả: phép *"slug không đổi"* xanh vì KHÔNG CÓ GÌ ĐỔI CẢ.
    Server chặt hơn tôi tưởng, và cái xanh đó là xanh vô nghĩa
  - >
    **DELETE đòi `If-Match`.** Quên nó ⇒ cả ba trả 400, và §4 (*byte sống sót SAU
    khi xoá*) cùng §5 (*trở lại danh sách*) XANH VÔ NGHĨA — chẳng có gì bị xoá
    thì byte tất nhiên còn, bản ghi tất nhiên còn. **Phép quan trọng nhất của cả
    file xanh vì lý do sai.** Đã thêm tự kiểm vật liệu: bản ghi phải THỰC SỰ rời
    danh sách trước khi nói bất cứ điều gì về byte
  - >
    **Thay thân bài viết bằng một câu ⇒ 422 `Thiếu mục: 1, 2, 3, 4, 5…`** — hồ sơ
    `phan-tich` đòi khung 5 mục; `thu-vien` thì không, nên tài liệu/video qua
    được. Đó là server phân biệt ĐÚNG hai hồ sơ, không phải lỗi
  - >
    Cả ba lần, phản xạ đầu là "hệ thống hỏng". Cả ba lần, đọc hết thông báo thì
    ra HARNESS sai — và mỗi thông báo đã nói đúng chỗ ngay từ đầu

