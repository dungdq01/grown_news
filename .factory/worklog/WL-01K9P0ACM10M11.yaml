ve_nang_khong_ai_do:
  - >
    Mở màn `/video/` phải **0 request ra ngoài** (M09-R3). Không cổng nào trong
    71 file đo nó: `no-leak.test.js` — cái tên gần nhất — đo LISTENER rò, không
    đo REQUEST. Nhúng video là lần đầu sản phẩm gọi ra mạng ngoài; một màn danh
    sách tự gọi youtube là gửi IP người đọc cho bên thứ ba mà không ai bấm gì
  - >
    Đo được: 0 iframe, 0 `src`/`href` tuyệt đối ra ngoài ⇒ cổng XANH ngay. Nên nó
    tự chứng minh ĐỎ ĐƯỢC — chèn một iframe youtube vào bản sao HTML rồi đòi cả
    hai vế bắt. Trong dự án này đã HAI LẦN một cổng xanh vì phép cắt sai chỗ

khong_do_lai_thu_da_co_cong:
  - >
    `o-media-sua.test.js` §3 đã đo vế KẾT QUẢ của M10 AC-2.2.2 (`sha256` không
    đổi qua PUT). `man-tai-lieu` đo vế CƠ CHẾ mà spec nêu đích danh: *"và điều đó
    đúng vì form CÓ ô `media`, không vì `FM_GOC` giữ hộ"*. Chép phép đo cũ sang
    là hai bản của một sự thật, tức hai chỗ để lệch

tu_bat_duoc:
  - >
    SUÝT SỬA MÀN THAY VÌ SỬA PHÉP ĐO. §4 của `man-video` đo ô chủ đề bằng tiền tố
    id `nv-` tôi tự nghĩ ra; nó FAIL trong khi ô CÓ THẬT (id là `vd-`). Tin phép
    đo thì việc tiếp theo là đi thêm một ô đã có. Cả hai cổng nay đo hai vế độc
    lập — CHỮ người đọc thấy, và MỘT Ô tồn tại cho chiều đó
  - >
    Mỗi cổng mang bằng chứng phép đo KHÔNG MÙ: `man-tai-lieu` đòi khối `v-all`
    có nhiều hơn một loại. Ba mục "màn chỉ hiện tài liệu" vẫn xanh nếu tôi cắt
    nhầm vào một khối khác cũng chỉ chứa thẻ tài liệu
  - >
    Neo vá bằng chuỗi CÓ DẤU đi qua heredoc của bash và không khớp — lớp lỗi
    escaping đã tái đi tái lại. Đổi sang neo ASCII thuần + ghi script ra file

