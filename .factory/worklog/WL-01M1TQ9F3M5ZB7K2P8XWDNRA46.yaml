viec: >
  Tự khai ba chỗ lệch hợp đồng, do `check_g6b` bắt được sau khi mã đã viết.
  Ghi ở đây thay vì sửa lặng lẽ: nới `phạm_vi_ghi` tại chỗ là bên thi công tự
  cấp quyền cho mình, và đó là thứ luật gốc cấm.

vi_pham:
  - ma: "ID TRÙNG"
    do: >
      PM ĐÃ có `T03-119-hanh-dong-vong-doi-ve-lai-tai-cho.md` và
      `T03-120-redesign-nut-trang-thai.md`. Tôi không đọc thư mục task trước
      khi viết, nên đẻ ra hai file cùng ID — và `check_g6b` nói đúng hậu quả:
      "file sau ghi đè file trước nên `phạm_vi_ghi` của MỘT trong hai KHÔNG
      được kiểm". Tức trong suốt lượt làm, R1 của tôi không có ai canh.
    xu_ly: >
      XOÁ hai bản của tôi. Không gộp nội dung sang file PM — đó là hợp đồng
      của tầng trên, và bên thi công viết lại hợp đồng chấm mình là đúng thứ
      luật gốc cấm. Vết việc đã làm nằm ở hai worklog bàn giao (có `object`).
      `SCR-20` đổi về đúng đường PM khai (`SCR-20-nut-trang-thai.md`).

  - ma: "R1 — ghi ngoài `phạm_vi_ghi` (T03-119)"
    hop_dong_pm: "multiwindow.inline.ts · web/render/trang.mjs"
    toi_da_ghi_them:
      - web/plugins/cctab/src/cctab.inline.ts     # bộ nút + toast cửa sổ NHÁP
      - web/styles/prototype.css                  # gỡ bản trùng luật `.tx`
      - web/package.json                          # đăng ký cổng
      - web/test/sau-phan-quyet.test.js           # cổng MỚI
    do: >
      PM khai cổng là "mở rộng `vong-doi-bai.test.js` + `cua-so-doc.test.js`
      CÙNG LƯỢT"; tôi viết một cổng MỚI. Và cửa sổ NHÁP sống ở `cctab`, mà
      hợp đồng T03-119 không khai file ấy — trong khi AC4 của chính nó đòi
      checkbox "đưa lên site luôn", thứ chỉ có ở cửa sổ nháp. Hợp đồng THIẾU
      một file mà AC của nó đòi; tôi đáng lẽ phải DỪNG và mở FR ở đó, không
      phải ghi tiếp rồi khai sau.
    can_nguoi_quyet: >
      Chấp nhận as-built (PM bổ sung `cctab` vào T03-119) HAY mở FR. Tôi
      không tự chọn.

  - ma: "R1 — ghi ngoài `phạm_vi_ghi` (T03-120)"
    hop_dong_pm: "SCR-20 · multiwindow · cctab · prototype.css · tokens.css"
    toi_da_ghi_them:
      - web/test/mau-trang-thai.test.js           # cổng MỚI (PM khai mở rộng buttons/token-only)
      - web/test/page-weight.test.js              # trần — quyền là FR-068
      - web/test/chung-cat-hover.test.js          # trần
      - web/test/sinh-transcript-ui.test.js       # trần
      - web/test/mo-ta-va-nut-nap.test.js         # trần
      - web/test/nap-ba-khung.test.js             # trần
      - web/test/o-nhan-nap.test.js               # trần
      - web/test/tab-theo-doi-chung-cat.test.js   # trần
      - web/package.json
    do: >
      Bảy file trần là hệ quả của `FR-068` (chủ dự án chốt "mở trần"), và FR
      là quyền — nhưng `phạm_vi_ghi` của T03-120 không khai chúng, nên `R1`
      vẫn lệch. Phát hiện kèm theo: **trần chép cứng ở BẢY chỗ**, sáu trong
      bảy không ai nhớ là có. Ô nợ đã mở.

  - ma: "boundary M12 (T12-26)"
    do: "`web/api/**` ngoài `chungcat/**` — task PM khai hai file web"
    xu_ly: >
      Tách thành `T08-34` (cửa `GET /api/tai-video/<ulid>`), gỡ hai đường web
      khỏi `phạm_vi_ghi` của T12-26 và chuyển AC3 sang T08-34. Đây là sửa
      HỢP ĐỒNG cho khớp thực tế đúng chiều: mã đã ở đúng module, chỉ có tờ
      khai đặt sai chủ.

