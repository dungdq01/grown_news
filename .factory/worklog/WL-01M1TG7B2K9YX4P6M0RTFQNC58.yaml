fr_kem_theo:
  id: FR-068
  vi_sao: >
    Chủ dự án trả lời câu 3 của `SCR-20` là *"mở trần"*, mà `FR-061 §3` chốt
    nguyên văn *"gn.css và gn.js giữ nguyên 102400 — bundle CHUNG"*. Đảo một
    vế của FR đã duyệt thì phải là FR, không phải một dòng sửa số.
  so: "gn.css 102400 → 104448 (+2 KB, một lần). gn.js KHÔNG đổi (còn 11.8 KB)."
  do_that_sau_khi_lam: "gn.css 102613 / 104448 — dư 1835 byte"
  no_khong_tick: "FR-061 §4 (giảm béo 100+ selector trùng) giữ nguyên, chưa trả"

phat_hien:
  - ten: "trần chép cứng ở SÁU file cổng"
    do: >
      `page-weight.test.js` · `chung-cat-hover` · `sinh-transcript-ui` ·
      `mo-ta-va-nut-nap` · `nap-ba-khung` · `o-nhan-nap` · `tab-theo-doi-chung-cat`.
      Nới trần phải sửa bảy chỗ, và sáu trong bảy chỗ không ai nhớ là có.
    xu_ly: "sửa đủ, mỗi chỗ kèm chú thích trỏ FR-068; ô nợ đã mở"
  - ten: "`--primary` === `--destructive` ở hệ TỐI"
    do: >
      `--primary:#F87171` và `--destructive:#F87171` — CÙNG MỘT giá trị. Ở hệ
      sáng `--primary` là `#C81E1E`, cũng đỏ. Chụp màn lần đầu: nút CHÍNH nền
      đỏ đặc đứng cạnh cụm NGUY viền đỏ — màn đang chỉ vào chỗ nguy hiểm nhất
      bằng chính cái nút nổi nhất.
    xu_ly: >
      `.bt-chinh>button` dùng nền TRUNG TÍNH (`--ink`/`--background`), không
      `--brand`/`--primary`. `SCR-20` chỉ khai "nền đặc, chữ nghịch đảo" —
      không khai hue — nên đây nằm trong wireframe đã duyệt, không phải đổi
      thiết kế. Thêm AC5 + vế 5b GHI NHẬN sự trùng token, để ngày ai đó tách
      hai token ra thì cổng tự đỏ và nhắc bỏ vế ấy đi.

