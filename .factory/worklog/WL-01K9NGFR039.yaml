tu_bat_duoc:
  - >
    SÁU ID task TRÙNG do chính tôi tạo qua bốn lượt (T01-8 · T01-9 · T03-10 ×3 ·
    T03-11 ×3 · T03-12 · T03-13 · T03-14 · T05-2), và `check_g6b` exit 0 mọi
    lượt. `tasks[tid] = …` là phép gán dict nên file sau GHI ĐÈ file trước —
    `phạm_vi_ghi` của một trong hai KHÔNG được kiểm, tức R1 mất địa chỉ. Nó chỉ
    lộ khi hai file trùng ID tình cờ tạo một VÒNG phụ thuộc: lộ vì MAY. Đã đánh
    lại số 10 file, sửa 5 tham chiếu phụ thuộc, và thêm răng vào cổng
  - >
    Lý do tôi không thấy: `ls | tail` sắp theo CHỮ nên `T03-10` đứng trước
    `T03-4` — sáu file mới nhất không nằm ở cuối danh sách
  - >
    Văn xuôi trong task file của tôi chứa literal khoá khai phụ thuộc, và parser
    của `check_g6b` bắt khoá đó bằng regex trên CẢ file ⇒ nó đọc câu văn thành
    một khai báo thật, trỏ tới một task không tồn tại. Cùng lớp lỗi với bình luận
    chứa `id="v-nap"` ở C5
  - >
    Bốn lượt cổng tự sai (chi tiết ở web/test/WORKLOG.md): gửi sai hợp đồng nạp ·
    §4 xanh vô căn cứ vì mọi request 404 · §4 rồi đỏ oan vì cấm cả dấu ngoặc BAO ·
    §5 chết vì đo 413 bằng fetch dù đã biết không đo được
