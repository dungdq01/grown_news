quyet_dinh_thiet_ke:
  - >
    Whitelist KHÔNG bị xoá — nó đổi VAI từ cổng NHẬN sang bảng RENDER. Ba thứ dẫn
    xuất từ nó và cả ba im lặng hỏng nếu bảng biến mất: `content-type` phục vụ
    (không bảng ⇒ phải sniff tên file, đúng thứ `nosniff` tồn tại để không tin) ·
    `inline`/`attachment` từ `xem_truoc` (mất nó thì hoặc mọi thứ inline — nguy —
    hoặc PDF HẾT xem trước, tức xoá một tính năng không ai xin xoá) · đuôi file
  - >
    Định dạng ĐÃ BIẾT giữ magic-byte. Người dùng xin bỏ cửa cho loại LẠ; bỏ luôn
    cả nhánh này là nới rộng hơn thứ được xin. Với loại lạ thì lớp thứ sáu KHÔNG
    TỒN TẠI (không có chữ ký để so) — nói "yếu đi" là nói giảm
  - >
    `media.mime` từ enum sang `pattern` chứ không sang `type: string` trần: chuỗi
    này đi thẳng vào đầu đề `content-type`, nên một mime mang xuống dòng là tách
    đầu đề. Bỏ danh sách ≠ bỏ phép kiểm
  - >
    `dungchung.mjs` ĐỌC pattern từ `frontmatter.schema.json`, không gõ lại regex.
    Hai bản sẽ lệch, và lệch ở đây nghĩa là `luuHienVat` nhận một chuỗi mà
    validate sẽ từ chối — hoặc ngược lại

