quyet_dinh:
  - |
      KHÔNG thêm nhà openai/GPT dù `T12-11` nêu. `$vi_sao_ten_gia_dinh` của bảng
      khai mô tả gateway là chỗ cấp hạn mức cho claude opus + gemini + deepseek.
      Bày một model của nhà mà gateway chưa chắc có là bày một lựa chọn SẼ CHẾT
      lúc gọi — và người dùng chỉ biết sau khi đã bấm. Cần chủ dự án xác nhận
      gateway có, rồi mới 1 dòng bảng + 1 `adapter/openai.py`.
  - |
      Mọi dòng mới giữ `khu_vuc: khong-xac-dinh` và mang `$chua_goi_thu`. Đúng
      luật T12-11: "KHÔNG điền đại một khu vực cho đẹp".
  - |
      `du_phong` của dòng mới trỏ TRONG CÙNG NHÀ. Cùng nhà thì `kieu_structured`
      giống nhau ⇒ payload không phải dựng lại theo hợp đồng khác giữa lúc rơi;
      và rơi sang nhà khác là một lần đổi NƠI DỮ LIỆU TỚI mà người dùng không
      bấm — đúng thứ FR-053 §1.4 bắt phải hiện.
  - |
      `goi_y` ưu tiên `la_mac_dinh` thay vì dòng đầu khớp. Với bảng ba dòng,
      "dòng đầu khớp" TÌNH CỜ đúng; với tám dòng nó thành chọn-theo-vị-trí-trong
      -file, và một cú sắp xếp lại đổi mặc định mà không ai khai.
  - |
      `khu_vuc` ra khỏi chuỗi `<option>`, thành Ô RIÊNG luôn hiện. FR-053 §1.4
      đòi "hiện khu_vuc cạnh mỗi model — không phải chú thích cuối trang". Một
      đuôi "— khu vực: …" bên trong `<option>` đang đóng thì người dùng chỉ thấy
      lúc bung danh sách ra, tức đúng lúc họ đã quyết xong.
  - |
      Cảnh báo một-gateway hạ xuống `<em>` (micro, mờ, nghiêng) — KHÔNG cắt chữ
      nào. Đo trên ảnh chụp: ở cỡ chữ thường nó là khối TO NHẤT trong phiếu, át
      cả câu cảnh báo dữ liệu-rời-máy. Cắt một câu pháp lý cho gọn mắt là đúng
      thứ `$canh_bao_mot_gateway` viết ra để chống; đổi CỠ thì không.
  - |
      Ba phép gộp CSS là gộp THẬT (hai rule cùng selector `.bk-phieu label`; ba
      rule khai y hệt nhau cho ô nhập), làm vì `gn.css` không còn chỗ — không
      phải dọn tiện tay. `.cc-kv` bỏ `--f-mn`: `markup-matches-css` bắt đúng,
      `FR-018` giữ mono CHỈ cho mã thật, và `khong-xac-dinh` là giá trị bảng
      khai chứ không phải mã ai chép đi.

