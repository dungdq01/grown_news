chan_doan_502: |
  KHÔNG phải lỗi mã. `:8790` (THỢ) không chạy ⇒ `GET /api/model` của LÕI trả 502
  kèm câu ĐÚNG: "dịch vụ chưng cất không trả lời — kiểm xem nó có đang chạy
  không". FE NUỐT câu đó, thay bằng "không đọc được danh mục model (502)".
  Bật THỢ là hết 502. Hai thứ SỬA THẬT ở đây:
    · FE đưa câu của server ra thay vì tự nghĩ một câu (`j.loi ?? mã`);
    · phát hiện kèm: `npm run api` KHÔNG mang `CHUNGCAT_KHOA_LOI` thì
      `GET /api/job` trả 403 — hai dịch vụ cần CÙNG một khoá và không có lệnh
      dev nào khai điều đó. Đã mở ô backlog M03.

