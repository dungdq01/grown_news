hai_do_that_khong_phai_cua_toi:
  - lenh: bash .githooks/test-hook.sh
    ac: M04 AC-2.5.1
    bao: "FAIL · hook chặn cả file ĐẠT CHUẨN — đỏ giả, người ta sẽ tắt hook"
    nguyen_nhan: >
      `core/tests/fixtures/dat-chuan.md` KHÔNG còn đạt chuẩn — 4 lỗi khi thả vào
      một BẢN COPY của kb/paper/. `kb/concepts.yaml` co lại (704 byte) và mất hai
      id fixture dùng (`walk-forward-validation`, `data-leakage`).
      Bài học: "đạt chuẩn" KHÔNG phải thuộc tính của một file — nó là QUAN HỆ
      giữa file và DANH MỤC nó rơi vào. Nên `pytest -k ban_dat_chuan` XANH (nền
      riêng) trong khi `test-hook.sh` ĐỎ (nền kb/ thật).
    đỏ_do: >
      chưa quy được chủ — kb/concepts.yaml mtime 08-29 13:54 · fixture 08-27
      18:33 · test-hook.sh 08-19 02:11; cả ba TRƯỚC phiên 2026-09-02/03, và
      phiên này không chạm .githooks/**, core/tests/fixtures/**, kb/concepts.yaml
  - lenh: python core/src/source_distiller/validate.py kb/ --strict
    ac: M02 AC-2.1.1 + AC-2.1.2
    bao: 'in "3 file · 0 lỗi · 1 cảnh báo" nhưng exit 1'
    nguyen_nhan: >
      validate.py:770 `sys.exit(1 if n_err or (a.strict and n_warn) else 0)` —
      `--strict` biến CẢNH BÁO thành exit khác 0. Cảnh báo là "3 khái niệm chờ
      duyệt danh mục", một trạng thái BIÊN TẬP, không phải vi phạm schema. Hai AC
      chỉ khẳng định "parse + đạt schema" ⇒ LỆNH ĐO RỘNG HƠN AC ⇒ đỏ oan.
    đỏ_do: chưa quy được chủ (kho có sẵn khái niệm chờ duyệt trước phiên này)

