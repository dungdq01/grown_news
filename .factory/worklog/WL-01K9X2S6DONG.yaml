muoi_mot_AC_mo_ho:
  M12_AC-3.1: >
    "0 dong o LOI" ma khong dinh nghia LOI gom file nao. Khong chot thi cong hoac
    DO OAN (dung mot file phu) hoac KHONG DO DUOC (dinh nghia LOI rong toi muc moi
    thay doi deu nam ngoai). => LOI = chungcat/src/** TRU adapter/**.
  M12_AC-6.1: >
    "log truoc khi gui" ma khong noi DO BANG GI. Do "dong log co ton tai" thi mot
    cai dat log-SAU-khi-gui VAN XANH o ca thanh cong; con so timestamp cua ta voi
    cua request la so HAI DONG HO khac nhau. => do bang `seq` do TA cap, log mang
    seq va payload gui di cung mang seq do.
  M13_AC-2.2: >
    "anchor khop tung ky tu voi anchor renderer M03 sinh" — nhung M03 CHUA SINH
    ANCHOR NAO. Do: grep anchor trong web/render/ + web/plugins/ => 0; <h2>/<h3>
    trong site da build KHONG co id. Khong co gi de so.
    Nang hon: ca so do dia chi file#anchor CHUA CO NGUOI TIEU THU — M13 se sinh
    anchor tro vao HTML khong co id tuong ung, va chatbot se trich dan nhung dia
    chi BAM VAO KHONG TOI DAU. => AC do thu ton tai hom nay (anchor_py <-> slugGoiY);
    ve con lai thanh o [ ] o backlog M03 (viec cua C3).
  M14_AC-8.1: >
    Khai "nhan `bot` HOAC `nguon[]`" ma bo ngo ca CO CA HAI. Viet testcase buoc toi
    BIA mot luat uu tien — dung thu s6 cam. => khai tuong minh: nguon[] thang, VA
    ghi log khi hai thu cung co (hai thu cung co la dau hieu nguoi goi dang nham).
  M14_AC-4.3: >
    "moi lan ban duoc log" doc duoc thanh "chi lan thanh cong". Ca dat nhat la model
    DINH khai co-nhung-mau-thuan nhung BI BO vi thieu hai dia chi. Khong log ca do
    thi ba thang sau dem duoc "so lan tu choi" ma KHONG dem duoc "so lan model dinh
    lam dung" — va con so thu hai moi noi len nhanh nay co bi lam dung khong.
    => log HAI ca, phan biet duoc.
  M15_AC-2.4: >
    M8.2 "<= 20% cong kenh thu nhat" khong noi TONG GOM GI. Gom ca ha tang dung
    chung => mau so phinh, ti le LUON DAT, cong KHONG DO DUOC. Chi tinh adapter =>
    mau so nho, mot Discord binh thuong CUNG VUOT, cong DO OAN.
    => DONG CUNG mau so tai thoi diem chi co Telegram, va cong in CA HAI so.
  M15_AC-5.2: >
    "tin nhan MAT, va dieu do duoc ghi log" doc duoc thanh phai DEM DUOC so tin.
    Telegram giu update 24h va API KHONG noi "ban mat N tin". Viet testcase buoc toi
    bia mot phep dem khong co nguon. => khai thu BIET DUOC: khoang thoi gian offline,
    va neu >24h thi noi update trong khoang do CO THE da mat.
  M16_AC-4.1: >
    "artifact mang >=1 dia chi phan giai duoc ve bai nguon" — nhung bang media co
    dung BA cot (sha256, byte, la_dan_xuat), KHONG cot nao tro ve slug. Nen ca
    "liet ke artifact cua bai X" — thu UI can — KHONG viet noi testcase.
    => tach HAI TANG: tang FILE (metadata) la AC cua M16, kiem duoc ngay; tang KHO
    (truy van duoc) la FR toi M09. Gop hai tang vao mot AC la hua mot thu M16
    KHONG THE lam mot minh.
  M16_AC-2.2: >
    "khong xoa byte" chi cam XOA. Nhung sinh lai cung loai artifact cho cung bai
    GHI DE ban cu thi pha byte y het, va KHONG CO `unlink` nao de grep.
    => cam ca xoa lan ghi de, va phep do la TRANG THAI truoc/sau (moi sha256 cu giu
    nguyen, so file chi TANG), khong phai mot phep quet ma.
  M17_AC-3.4: >
    "rate limit ... nguong doc tu cau hinh" do bang "grep mot so go cung => do" chi
    dung voi duong TU VIET. spec §0 khai ngon ngu cong/ CHUA CHON (Caddy · nginx ·
    tu viet) — voi Caddy thi so trong cau hinh CHINH LA cach no hoat dong, nen cong
    se DO OAN. => do HANH VI: ban N+1 request, doi cai thu N+1 bi chan; doi nguong
    roi ban lai => diem chan doi theo.
  M12_AC-1.4_va_1.5_them_moi: >
    Khong phai AC mo ho — la AC THIEU, phat hien khi doc lai sau khao sat dot nam.
    Bon dich vu THO cung nam tren 127.0.0.1, nen AC-1.2 (bind loopback) KHONG noi
    duoc AI GOI. Payload job mang `nguon: [slug...]` do nguoi goi neu — dung hinh
    dang CVE-2026-44560. => them AC-1.4 (chi loi goi tu LOI) + AC-1.5 (nguoi_dung_id
    do LOI gan) + M12-R7.

