XOA_muc_modules_du_kien_thay_vi_de_no_RONG: >
  Sau khi M17 tot nghiep, `modules_du_kien:` con lai mot khoa RONG. De nguyen thi
  no doc nhu "con module dang cho" trong khi khong con cai nao — va no la thu PHAI
