M16_la_module_DUY_NHAT_ghi_vao_kho_hien_vat: >
  Nen no la module duy nhat co co hoi PHA byte (M09-R1: moi DELETE pha byte vinh
  vien). Ranh gioi khong phai "duoc cham hay khong" ma la "chi THEM".
  Va no can mot cap rule: M16-R1 cam xoa, M16-R2 doi khai `la_dan_xuat = 1`.
  R2 de bi coi la "mot cot metadata cho dep" — no thuc ra la thu CUU DUOC R1:
  nguyen lieu nguoi nap KHONG dung lai duoc; artifact DUNG LAI DUOC. Khong phan
  biet hai loai thi mot ngay ai do don _media/ de tiet kiem cho va xoa CA HAI —
  va ho lam DUNG, vi khong co cach nao biet cai nao la cai nao.

M16-R4_co_ve_phu_dinh_phai_DO_DUOC: >
  Duong TTS local phai sinh DUNG 0 dong log egress. Do khong phai cho du doi —
  no la cach duong local CHUNG MINH duoc no khong gui gi, thay vi ta tin no.
  Moi rule khac do "co lam dung khong"; rule nay con do "co im lang lam them gi
  khong". Day la rule duy nhat trong du an co hinh dang do.

nguoi_dung_bam_"tao_giong_doc"_la_bac_4: >
  Trong nhu mot tien ich nho, nhung no gui TOAN VAN mot bai ra mot nha cung cap
  nuoc ngoai — cung bac voi M12 gui tai lieu nguyen lieu. Day la cho de danh gia
  THAP nhat cua ca dot hai. Da viet thanh mot canh bao rieng o spec §5 va
  data_flow §4.
  Va Azure (Microsoft) vs FPT.AI (Viet Nam) gan nhu chac chan KHAC khu vuc phap
  ly ⇒ roi du phong TTS la ca ROI CHEO KHU VUC, tuc ca MAC DINH cua M16 chu khong
  phai mot ca ly thuyet. Ke thua M12-R5: phai khai tuong minh, co nguoi ky.

PPTX_cua_Marp_la_ANH_—_gioi_han_engine_la_thu_BAT_NGO: >
  Chon Marp cho mot yeu cau "sua duoc chu" thi file mo ra TRONG DUNG va KHONG sua
  duoc, va nguoi dung phat hien dieu do SAU KHI da gui cho nguoi khac.
  Nen bang khai engine.json co cot `gioi_han`, va M16-R5 doi bang phai ghi ro no.
  Cong do truoc; khong de nguoi dung phat hien sau.

M17_la_module_PHU_THUOC_NHIEU_NHAT_va_tu_lam_duoc_IT_NHAT: >
  Bay no, va SAU trong bay nam ngoai M17:
    - bon endpoint cua LOI (tra phien · tra+danh dau ma_moi · ghi audit_log ·
      ghi dinh_danh_kenh) — FR-045 khai BON BANG ma KHONG khai mot endpoint nao
    - rate limit + entropy >=128 bit + log that bai — LO trong FR DA DUYET
    - DDL bon bang trong kho.schema.sql
    - ngon ngu cong/ chua chon (Caddy · nginx · tu viet) — s4 quyet
    - cot `vai` CHUA AI DOC => "phan quyen" hom nay la MOT COT TRONG
  Da ghi thanh muc rieng: s7 KHONG duoc xep M17 vao lich truoc khi LOI mo cua —
  nguoi thi cong se doc DB truc tiep cho nhanh, va do la Z4 chet trong khi moi
  cong van xanh.

M17_la_cho_DUY_NHAT_muc_tin_doi_—_va_no_chi_doi_MOT_ve: >
  Xac thuc xong KHONG co nghia noi dung dang tin. M17 tra loi "request nay cua
  tai khoan nao", KHONG tra loi "noi dung nay co nen vao kho".
  Do la ly do gate.py:133 van ep draft VO DIEU KIEN ke ca cho request da xac
  thuc — mot tai khoan THAT van co the nap rac. Viet thanh mot so do rieng vi day
  la cho de doc sai nhat cua ca kien truc.

M15_va_M17_cung_vung_BIEN_nhung_NGUOC_NHAU_hoan_toan: >
