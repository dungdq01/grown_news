bon_lan_cong_xanh_ma_man_hong: |
  Don vi nay bi DUNG BAY bon lan, ca bon cung mot ho: cong doc CHU, man hong o
  cho khac. Ghi het vi day la lop loi dat nhat cua du an.

  1 `nhung: null` lam trang.mjs:197 chay `h.nhung.includes("youtube")` tren
    null => HTTP 500 o MOI man, ke ca trang chu. Bon cong doc-nguon deu XANH.
    Chi phat hien vi phai restart server. => Them ve 5: DUNG TRANG THAT bang
    dung duong server.mjs di. Sua: so `h?.nhan === "youtube"`, khong do chuoi
    trong mot cot khac.

  2 Nhanh duong-lui doc `ban.url`, ma phong bi cua so (`mo()`) KHONG chep
    truong do — chi co `url_normalized`. Cua so douyin VAN trang tron sau khi
    da sua id_tu; moi ve doc-nguon xanh. => Them ve 6a: NOI hai dau — truong
    nao nhanh doc thi phong bi phai mang.

  3 Ve 5 ban dau dung fixture GO TAY, thieu truong nen ban ghi bi man loc ra
    => ve 5 do mot trang KHONG CO douyin roi bao xanh. Chi ve 5a giu no khoi
    xanh oan. Cuoi cung: NHAN BAN mot ban ghi mock co that roi doi URL.

  4 Ve 3b-3d cat vung bang slice(i, i + 4200) — than ham dai ra la vung do hut,
    ve DO vi mot ly do khong lien quan gi toi thu no canh. => Cat toi DAU HAM
    KE TIEP, khong cat theo mot so doan truoc.

hai_cong_keo_hai_huong: |
  `media-cua-so` cam ham dung markup cham `.nhung` (mot chuoi host di qua do la
  mot buoc gan hon toi cho no lot vao markup, va luc do MO TRANG da la mot loi
  goi ra ngoai). `id-video-hoa-thuong` ve 4 lai DOI idVideo() tra ve `.nhung`.

  Giai: idVideo tra CO `nhungDuoc: !!h.nhung` thay vi chuoi. Chuoi nhung chi
  con song trong nhungVideo — ham chay SAU KHI nguoi bam. Tinh chat ve 4 canh
  (src = tien to TU BANG + id GIU NGUYEN CHU HOA) KHONG doi, no chi doi CHO;
  nen phep do di theo, khong noi ra. Chuoi `nhung` trong return cua idVideo von
  da khong ai dung — nhungVideo tu tra lai dong host theo `nhan`.

mot_cong_do_oan_da_va: |
  `media-cua-so` chay `thanVe.includes(h.nhung)`. `nhung: null` bi ep thanh
  chuoi "null", ma than ham co chua chu "null" => DO vi mot ly do khong lien
  quan gi toi viec co hay khong mot URL nhung trong ham. Va bang
  `typeof h.nhung === "string"`, roi CHUNG MINH no con rang bang cach gieo mot
  hang URL nhung vao ham (DO dung).

