viec: |
  Chu du an nap hai ban ghi THAT roi bao "hai cai do khong xem duoc video", va
  yeu cau test full cases. Do ra BON loi RIENG BIET:

  1 TikTok, nen the: `curl_cffi` chua cai. TikTok chan client khong gia dang
    TLS fingerprint. Cau loi yt-dlp KHONG noi thieu goi — no bao "hay bao issue
    len GitHub", dan nguoi doc di sai duong. Manh moi that nam o dong bi cat
    cut trong log job: "...rmation on installing the required dependencies".
  2 Douyin, nen the: KHONG sua duoc. yt-dlp CO extractor [Douyin] nhung doi
    cookie phien, ke ca voi URL dang chuan va da co curl_cffi.
  3 Douyin, cua so: `id_tu` khai `/video/(...)`, URL that la
    `/jingxuan/course?modal_id=...` => `idVideo` tra null => `return ""` =>
    cua so TRANG TRON, khong nut khong link khong loi giai thich.
  4 Douyin, nhung: `open.douyin.com/player` tra 403 o `aweme/detail` ke ca khi
    id dung => sua (3) ma khong sua (4) thi nut hien ra de nhung mot khung
    trong, TE HON hom nay. Nen `nhung: null` va phep sua (3) phai di cung nhau.

khong_phai_loi_cua_ta: |
  TikTok nhung: khung cua ta DUNG — trang nhung ve du tac gia, caption, 251
  like. Nhung CDN `vx-bdp.tiktokv.com` tra 403. Do TACH BACH: mo THANG
  `tiktok.com/embed/v2/<id>` o tab top-level, khong co app cua ta trong duong
  di — van 403 y het. Ghi lai de lan sau khong ai di sua `referrerpolicy` hay
  `allow=` cho mot thu khong nam o phia minh.

