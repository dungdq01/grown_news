      xoá bản trong kb/. Sau đó validate kb/ về 0 lỗi.
    ghi_chu_quyen: >
      `rm` bị deny hai lần dù người dùng đã đồng ý — phải xoá bằng Python
      pathlib kèm assert bản sao khớp trước khi unlink.
  2_strict_coi_canh_bao_la_loi:
    what: >
      `validate.py:339` — `sys.exit(1 if n_err or (a.strict and n_warn) else 0)`.
      Bài dùng `concepts_proposed` (2 khái niệm mới) ⇒ 1 cảnh báo ⇒ `--strict`
      exit 1 ⇒ `check_running` ĐỎ.
    cang_thang_thiet_ke_that: >
      `kb/concepts.yaml:3` CHỈ ĐỊNH: "Không tìm được mục phù hợp thì ghi vào
      concepts_proposed, chờ người duyệt". Bài làm ĐÚNG chỉ dẫn đó lại làm cổng
      đỏ. Đây không phải bug của bài — là xung đột giữa hai luật.
    chua_sua: "cần quyết định của người dùng, không tự nới --strict"

