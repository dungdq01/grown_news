  thành một bài tổng quan. Đây là bài THẬT đầu tiên trong kb/ (hai file cũ là
  bản thử nghiệm của tôi).

nguon_khoi_dau_do_duoc_gi:
  dang: post mạng xã hội tiếng Việt, liệt kê 8 tầng stack Python
  url: KHÔNG CÓ — chỉ 12 link emoji Facebook
  so_do: KHÔNG CÓ — không benchmark, không case study, không tỉ lệ thất bại
  tu_nhan: '"đây không phải là stack duy nhất"'
  ket_luan: >
    Danh sách CÔNG CỤ, không phải kết quả đo. Mức credibility cao nhất nó tự
    đạt được là `claimed` — nên research độc lập không phải cho đẹp, nó là điều
    kiện để bài có corroboration_factor > 1.0.

ket_qua_research_va_SU_CO_QUAN_TRONG_NHAT:
  agent_TU_THU_HOI: >
    Agent nghiên cứu báo về 21 nguồn "đã đọc", trong đó có mục C với số liệu
    chi tiết (LiteLLM allowed_fails/cooldown_time, benchmark pgvector 471,57 vs
    41,47 QPS, ngưỡng RAM 30-35GB). Sau đó nó TỰ THU HỒI: hai agent con nó
    delegate trả về TRANSCRIPT RỖNG 0 byte — nó chưa từng nhận số nào, và cũng
    chưa tự fetch. Toàn bộ mục C là nội dung không có nguồn.
  vi_sao_khong_thanh_tham_hoa: >
    Tôi đã TỰ fetch ba nguồn tôi định trích số TRƯỚC khi viết bài:
    anthropic/multi-agent-research-system (4×/15× token, 80% variance),
    anthropic/building-effective-agents (4 câu khuyên về framework),
    arXiv 2408.04667 (15% variation, gap 70%). Cả ba khớp nguyên văn.
  sau_khi_bi_thu_hoi: >
    Bài có 3 chỗ trích [LiteLLM docs] về budget tracking. Tôi TỰ fetch
    docs.litellm.ai/docs/proxy/users và /docs/routing để xác minh:
    "Requirements: Need to a postgres database" (budget cần proxy + DB) và
    allowed_fails/cooldown_time là Router-only. Khẳng định đứng được ⇒ giữ,
    và nâng citations_verified 3 → 5.
  ghi_vao_BAI_khong_chi_worklog: >
    Mục 7 (Dè chừng) ghi rõ ranh giới: 5 nguồn TÔI tự fetch, phần còn lại do
    agent báo, và agent đó đã thu hồi phần LiteLLM/pgvector. Người đọc bài phải
    biết điều này — nó quyết định tin được đến đâu.

