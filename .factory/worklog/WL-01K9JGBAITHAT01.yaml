    what: >
      `kb/docs/AIAgent-deploy-prototype.md` (post gốc) không có frontmatter ⇒
      `validate kb/ --strict` đỏ, `real-vs-mock.test.js` đỏ (đếm 4 file .md
      nhưng emitter chỉ parse được 3), `check_running` đỏ.
    y_nghia: >
      kb/ chỉ chứa bản PHÂN TÍCH — luật M02, và ba cổng vừa cưỡng chế đúng.
      Không có thư mục nào cho nguồn thô.
    xu_ly: >
