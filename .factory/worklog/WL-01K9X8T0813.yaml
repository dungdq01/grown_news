# ══ CONG TOI DUNG TU DO — va no dung ════════════════════════════════
cong_tu_do: >
  Truoc T08-11, ve 3 cua check_db_dung_cho in 5 dong "BO QUA — bang chua ton
  tai". T08-11 dung DDL => bang co that => ve do thanh phep kiem THAT va DO:
  ba bang PHAI xuat ma chua co duong xuat.
  Do la DO THAT. Nua sau quyet dinh cua chu du an ("van xuat ra .md/.yaml de
  backup") chua thi cong. Khong noi cong — dung duong xuat.
  Day cung la bang chung thiet ke "BO QUA CO THONG BAO" (thay vi xanh im lang)
  la dung: neu no xanh im lang thi hom nay khong ai biet thieu gi.

# ══ RO THAT, va chinh phep thu cua toi bat duoc ════════════════════
ro_ma_moi_vao_export: >
  Ban dau xuatLoi dung `SELECT * FROM <bang>`. Chay thu: file export CHUA MA MOI.
  Nguyen nhan: bang dinh_danh_kenh co cot `ma_da_dung` — do CHINH TOI them vao
  DDL o T08-11 lam "vet: buoc bang ma nao" — va cot do LA chinh ma moi.
  Vi pham thang M18-R2 + ADR-06 (c).
  => Doi sang LIET KE COT TUONG MINH cho ca ba bang, `ma_da_dung` CO Y ngoai
     danh sach.
  Vi sao tuong minh chu khong phai "bo mot cot": `SELECT *` xuat BAT KY cot nao
  bang co, nen ngay ai do them mot cot bi mat, no ra file NGAY ma khong ai sua
  mot dong nao o day. Danh sach tuong minh bien "them cot bi mat" thanh mot viec
  phai lam CO Y THUC.
  Dung bai hoc S8 cua plan tach-ba-bang: "View liet ke cot tuong minh, khong
  SELECT *" — lan do ly do la thu tu cot, lan nay la ro bi mat. Cung mot luat,
  hai hau qua khac nhau.

# ══ CONG CUA TOI DO OAN MOT LAN — sua PHEP DO, khong sua ma ════════
do_oan_ve_3: >
  Sau khi viet xuatLoi, cong VAN do: "ma_moi / phien KHONG duoc xuat nhung
  xuat_kho.py co nhac toi".
  Sai o PHEP DO: no grep ten bang tren TOAN BO noi dung file exporter.
  dungchung.mjs co nhac `ma_moi` va `phien` — nhung o cac thao tac C6/C7, tuc
  CUA TRA, khong phai duong XUAT.
  "Ten xuat hien trong file exporter" KHONG dong nghia "bang duoc xuat". Voi
  xuat_kho.py phep do do dung vi file do CHI la exporter; voi dungchung.mjs thi
  sai vi no lam moi thu.
  => Thu hep phep do ve dung KHOI KHAI `XUAT_LOI = [...]`.
  Va sua nguon: ve 3 truoc chi doc core/tools/xuat_kho.py, trong khi DB cua LOI
  la mot DB KHAC voi duong xuat rieng. Cong nhin nham file thi no do oan bat ke
  ma dung hay sai.

khong_co_vong_reap_o_day: >
  Do truoc khi viet: xuat_kho.py:141-146 xoa moi file khong nam trong tap
  `can_co`, nhung no chi quet kb/ va _recycle/ (KB/RECYCLE tu env) — khong voi
  toi web/_luu/. Mot rui ro bot di.
  Va xuatLoi CO Y khong co vong reap: no chi ghi de BA file da biet ten, khong
  quet thu muc, khong xoa gi. Muon don file thua thi do la mot quyet dinh rieng,
  khong phai tac dung phu cua mot lan ghi. Day la S12 noi bang ma.

gitignore_nguoc_chieu: >
  web/_loi.sqlite -> IGNORE (la DB).
  web/_luu/*.yaml -> COMMIT (la ban lui). Khac _kho.sqlite o cho: DB nay KHONG
  dung lai duoc tu file nao khac, nen ban lui la duong lui DUY NHAT.
  Da ghi canh bao ngay trong .gitignore: hai file dau chua DU LIEU CA NHAN
  (ten, chat_id); local thi khong khac gi DB, nhung `git push` dau tien la
  CHUYEN RA NGOAI => B-E5 (ND 356/2025).

