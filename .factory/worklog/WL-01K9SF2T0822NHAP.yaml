hoc_duoc: |
  BỐN lần sai trước khi đúng, và ba trong bốn là FIXTURE/hạ tầng, không phải mã:

  1 · `tachFm()` trả `{ fm, body }` — tôi đọc `t.than`. Thân bài vào
      `ghiSauValidate` là CHUỖI RỖNG, và validate báo "Thiếu mục 1,2,3,4,5" —
      một lỗi trỏ ĐÚNG mà trỏ SAI nguyên nhân. Đổi luôn tên hàm đọc thân
      request thành `thanJson` — một tên cho hai nghĩa trong cùng file là chỗ
      nó lệch.
  2 · Fixture "bản nháp hợp lệ" tự nghĩ ⇒ thiếu 5 trường + 9 mục. Lấy hình dạng
      từ một BẢN GHI THẬT (`kb/docs/xgboost-taylor-bac-hai.md`) mới qua.
  3 · Fixture vẫn trượt hai luật NỘI DUNG: mục 1+2 phải dưới 25% toàn bài, và
      MỌI mục phải có địa chỉ máy đọc được (`[§II.4]`). Hai luật đó đúng, và
      chúng bắt fixture của tôi viết như một bài thật.
  4 · `dungKho()` trả `{ kho, rac, don }`, tôi gán cả object vào `kho` ⇒ server
      CHẾT `unable to open database file`, mà cổng chỉ báo `fetch failed`.
      Ba hướng chẩn đoán sai trước khi thêm `sv.loi()` đọc stderr của server.
      ⚠️ `loi-cua-http.test.js` truyền cả object y như vậy và VẪN xanh — vì nó
      không bao giờ GHI vào kho. Một cách dùng sai chỉ lộ khi có phép ghi.

  Và một bẫy công cụ lần thứ TƯ: heredoc làm sập `\n` thành xuống-dòng thật,
  lần này hỏng chính dòng `console.log` in stderr. Viết `\n` thì dùng Edit.

