nghiem_thu_END_TO_END_tren_may_that:
  - lenh: "bash chay.sh + playwright: tai .mp4 ten tieng Viet -> Ghi vao kho"
    ket_qua: >
      Dieu huong sang `/video/` (duong thanh cong). Ban ghi CO THAT:
      `kb/video/thay-on-bai-thi-final.md` · `url: kho://video/thay-on-bai-thi-final`
      · `media[0].ten_goc: "Thay on bai thi final .mp4"` — DAU NGUYEN VEN.
  - lenh: "ffmpeg dung mot mp4 THAT (3s · 320x240 · h264+aac) roi nap qua cua media"
    ket_qua: >
      `ten_goc` tra ve `"Bai giang THAT.mp4"` — giu ca dau LAN chu hoa.
      `content-disposition: inline` · `content-type: video/mp4` · `nosniff` con.
  - lenh: "playwright: mo ban ghi do trong cua so doc"
    ket_qua: >
      `<video class="hv-p">` 679x382 · `controls` · `preload=metadata` ·
      `readyState 4` · `duration 3` · `videoWidth 320` · **`play()` chay,
      `currentTime 0.54`** · `v.error` = null. PHAT DUOC.
  bay_toi_tu_dat_va_go_duoc: >
    Lan nghiem thu dau dung mot mp4 GIA 96 byte (`ftyp` + zero). Trinh phat
    dung dung nhung `DEMUXER_ERROR_COULD_NOT_OPEN` — loi cua FIXTURE, khong
    cua ma. Neu bao "xong" o day thi do la mot loi khai; neu bao "van hong" thi
    do la mot bao dong oan. Dung ffmpeg dung mot mp4 THAT moi tra loi duoc.

