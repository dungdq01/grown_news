# ═════════ WO-057 · ten file co dau lam `fetch` NEM ═════════════════════
wo_057:
  hien_tuong: >
    Nap `Thay on bai thi final .mp4` (55 MB) ⇒ *"Khong goi duoc
    /api/articles/media — may chu chua chay?"*, trong khi may chu dang chay.
  goc: >
    Gia tri header HTTP chi nhan ISO-8859-1. Dau tieng Viet ngoai dai do ⇒
    `fetch` NEM `TypeError` luc DUNG request — 0 byte roi may. Do bang
    playwright tren `:8787` that: cung loi goi voi ten `t.mp4` thi gui duoc.
  55mb_khong_lien_quan: >
    `curl` POST 55 MB vao dung cua ay ⇒ 201 trong 1.61s. Tran bang khai 1 GB.
    Loai tru gia thuyet kich co TRUOC khi sua gi.
  ba_cho_khong_mot: >
    `napvideo` (x-ten-goc) · `multiwindow` (x-ten-goc) · `multiwindow`
    (x-ten-file). Mot `.pdf` hay `.md` ten tieng Viet hong y het, chua ai bao
    vi chua ai thu. Va mot cho la de hai cho hong im lang.
  ca_am_hon_ca_nem: >
    `cafe.mp4` nam TRONG latin1 ⇒ gui DUOC, roi Node doc header theo latin1 nen
    ten vao frontmatter bi mojibake. No THANH CONG voi du lieu sai.
  loi_thu_hai_cua_lo_nay: >
    `catch` gop moi thu thanh *"may chu chua chay?"* — `workflow §1a` cam cong
    chan sai ly do do. Nguoi doc cau do di khoi dong lai may chu cho mot loi
    nam hoan toan phia client. Da tach bang `e instanceof TypeError`.
  khong_phat_minh_loi_moi: >
    Chinh `multiwindow.inline.ts:1093` DA percent-encode `x-bo-sung` tu WO-020,
    va `server.mjs::ghepBoSung` da co `try { decodeURIComponent } catch` lam
    phong ho. Hai header ten file chi la cho bi bo sot.
  ham_cuc_bo_chu_khong_dung_chung: >
    `chunk-tu-chua.test.js` cam chunk goi ham cua chunk khac — moi chunk boc
    IIFE rieng nen mot ham dung chung nem `ReferenceError` ngay lan bam DAU
    TIEN. Nen hai ban `tenChoHeader` CUC BO la DUNG; cai cong chan la ban thu
    ba (encodeURIComponent go thang vao literal header).
  giai_ma_TRUOC_loc: >
    Lam nguoc lai la mot LO THAT: `%2e%2e%2fx` khong chua `/` nen di qua phep
    loc nguyen ven, roi phep giai ma bien no thanh `../x` SAU khi cua da mo.
    Da chung minh do duoc bang cach dao thu tu ⇒ `ten_goc` ra `"../thoat.mp4"`.

# ═════════ WO-058 + FR-075 · tai file roi khong ghi duoc ════════════════
wo_058:
  hien_tuong: >
    Tai `.mp4` → Ghi vao kho ⇒ *"Noi phat nay khong nam trong danh sach nhan…"*
    noi voi mot nguoi CHUA DAN noi phat nao. Cua ta sai trang thai, nen nguoi
    bao bug di tim sai cho.
  goc_ba_tang:
    - "FE `ghiVideo()` mo dau bang `if (!hostVideoHopLe(tho)) return` VO DIEU KIEN"
    - "`hienVatVideo` khai 331, gan 392, KHONG AI DOC ⇒ nhanh tai file la duong CHET: byte vao kho thanh cong roi khong ban ghi nao tro toi"
    - "server `CONG.video`: `if (!u) return 422`"
  hai_hop_dong_noi_nguoc: >
    `frontmatter.schema.json allOf[6]` khai `anyOf [media|url]` va
    `M11_video/spec:38` CHEP LAI dung cau do — nhung `spec:11` noi *"khong byte,
    khong dong media"*. Spec tu choi, ban FROZEN. KHONG tu chot: dua hai loi
    len ban, chu du an chon loi A ⇒ `FR-075`.
  tang_thu_ba_doi_co_cua_FR_theo_chieu_TOT: >
    Sau khi noi cong server, ban ghi VAN 422 — lan nay o `validate.py`:
    `url is a required property` (o GOC). Nen ve `media` cua `allOf[6]` CHUA
    BAO GIO fire duoc — cung lop `#cong-khong-do-duoc`. Va schema la file FROZEN
    duy nhat cua `core/`.
    ⇒ Nhung KHONG can sua no: `tai-lieu` da song voi dung rang buoc ay bang quy
    uoc `kho://tai-lieu/<slug>`. Video co byte dung `kho://video/<slug>`.
    0 dong sua file FROZEN, 0 chu ky, 0 phat minh.
  hai_rang_buoc_them_cho_kho_scheme:
    - "phai KEM media — mot dia chi trong kho khong co byte nao la ban ghi rong"
    - "slug trong url phai la slug CUA CHINH ban ghi — `kho://video/khac` tro vao byte cua nguoi khac la mot con tro sai IM LANG"
  ca_de_bo_sot_nhat: >
    `media` KHONG duoc mien phep kiem host cho mot `url` da neu. Mien thi
    `anyOf` thanh CUA SAU cho dung thu whitelist sinh ra de chan. Ve `9a` canh
    no va no do duoc.

# ═════════ WO-064 · mp4 trong kho khong xem duoc ════════════════════════
wo_064:
  hien_tuong: >
    Chu du an: *"tai len nhung loi co xem duoc dau?"* · *"cua so xem ko duoc"*.
    Cua so doc hien mot the *"Trinh duyet khong mo duoc dang nay — tai ve de
    xem"* cho mot `.mp4` ma trinh duyet phat duoc hai chuc nam nay.
  goc: >
    `media-mime.json` khai nam dong nhom video `xem_truoc: "tai"`, va HAI cho
    dan xuat tu cot do deu lam DUNG viec cua minh voi mot con so sai:
    `articles.mjs:472` (`iframe ? inline : attachment`) ⇒ phuc vu `attachment`;
    viewer roi nhanh cuoi.
  tai_khong_phai_lua_chon_sai_luc_khai: >
    `M11_video/spec` khi ay noi video *"khong byte, khong dong media"*, nen mp4
    trong kho chi la ca bien cua `tai-lieu`. `FR-075` — do CHINH toi ap 30 phut
    truoc — vua bien no thanh duong CHINH. Dung nghia *"viec vua lam khien
    artifact khac loi thoi"*, va do la ly do o backlog ton tai.
  cai_da_lam: >
    Them gia tri `xem_truoc: "phat"` (the GOC `<video>`/`<audio>`), ba cho doc
    no: bang khai (5 dong) · `articles.mjs` tra `inline` · viewer dung the phat.
    Cong cua bang o dat M01 (`check_dinh_dang_mo.py:111`) phai NHAN gia tri moi,
    khong thi no do vi chinh thu vua them.
  khong_muon_iframe: >
    Mot mp4 trong iframe la mot trang trong trang: khong `controls` cua ta,
    khong `preload`, va `FR-039 §0` cam dung hinh dang do. `<video>` la the NOI
    DUNG — no khong chay script va `nosniff` van dung.
  audio_rieng_video: >
    `<audio>` cho `audio/*`, khong dung `<video>` cho ca hai: mot mp3 trong the
    `<video>` la mot khung den, va nguoi dung se tuong file hong.
  preload_metadata: >
    Du de co thoi luong + thanh keo, va KHONG tai ca file khi mo cua so. Voi
    tran 1 GB (`FR-054`) thi `preload="auto"` la mot lan tai ca gigabyte.
  the_phat_thieu_CSS_va_cong_bat_duoc: >
    `.hv-p` KHONG co luat CSS — phep grep dau cua toi khop `hv-play` roi tuong
    la co. `<video>` khong luat ra 300x150 mac dinh va tran khoi cua so: dung
    hang loi `.cd-n[data-i]::before` thieu `content` cung ngay. Da them
    `video.hv-p` + `audio.hv-p` RIENG, cong 3 ve canh (12d-12f), gom mot ve cam
    ep `aspect-ratio` len `<audio>`.

