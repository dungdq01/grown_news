    custom.scss không với tới. Hai điều đó cộng lại: lệnh chép được hiện bằng
    Inter từ FR-016 mà không test nào biết.
  sua: "viết theo THẺ (code,kbd,samp,pre) thay vì theo class bao ngoài — thẻ không đổi tên được"

