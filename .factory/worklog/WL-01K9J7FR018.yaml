vi_sao_lech_lau_den_the: >
  Hợp đồng G5 ghi "2 họ chữ" ở BA chỗ: TYPOGRAPHY.md §Font, DESIGN.md §2, và
  project_map.ui_frozen.verified. Dòng `verified:` là dòng nguy hiểm nhất — nó
  tuyên bố hai họ chữ là tính chất ĐÃ NGHIỆM THU, nên mọi đợt sửa sau (FR-013,
  014, 016, 017) đều coi đó là nền và không ai hỏi lại. Yêu cầu của người dùng
  bị chôn dưới một dòng hợp đồng.
  Bài học: `verified:` phải ghi thứ ĐO ĐƯỢC (số cỡ chữ gõ tay, tỉ lệ tương
  phản), không ghi thứ là LỰA CHỌN (mấy họ chữ). Lựa chọn thì phải hỏi lại
  được; nghiệm thu thì không.

