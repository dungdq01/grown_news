  306 task (hom qua 14 / 297) — hai nhanh dang them task moi ngay, nen mot con so ghim
  trong tai lieu huong dan la mot cau se sai trong 24 gio.
  Da doi: bo con so khoi dong lenh, giu PHEP DEM ("0 dong loi mang ma M13/T13/T01-5x")
  va ghi ca hai moc de nguoi doc thay no DOI, khong phai mot hang so.
  Bai hoc chung voi ve zh cua AC-6.3: dieu kien phai la MOT PHEP DO, khong phai mot so
  chep tay.

them_muc_3_6_cho_dev_M13: |
