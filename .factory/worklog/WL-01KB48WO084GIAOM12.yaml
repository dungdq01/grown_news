  chiu duoc du lieu xau". Ly do them cho dev M13 du WO-084 khong phai viec cua ho:
  ho SAP TAO task moi (T13-x, T01-5x), va neu khai thieu mot muc thi ho khong chi tu
  lam do minh — ho khoa cong plan cho CA HAI NHANH cho toi khi WO-084 xong.
  Kem mot lenh kiem truoc khi commit task moi: `grep -c '^verifiability:' <task>` phai ra 1.

