# ══ Điều nặng nhất của đơn vị này: FR-037 mở MUỘN ═══════════════════════════
#
# `grep "M09|thư viện|thu-vien"` trong FR-036 ra **0 dòng**. Nó không bao trùm
# nhánh B. Nhưng nhánh B đã:
#   · TẠO hai artifact FROZEN mới (M09 spec + rules) và ký vào lock ở B0;
#   · ĐỔI một artifact FROZEN (`frontmatter.schema.json`) ở B1.
# Cả hai, theo CLAUDE.md, phải có FR TRƯỚC mọi thứ. Không có.
#
# Nên FR-037 là HỒ SƠ TRUY HỒI, và nó tự khai điều đó ở §0. KHÔNG viết ngày
# duyệt lùi lại, KHÔNG mở rộng FR-036 cho như thể nó vốn đã bao — làm thế là
# sai đúng thứ luật gốc bảo vệ: tôi vừa làm vừa tự ký `FROZEN.lock`.
#
# Và cách chặn lần sau KHÔNG nằm ở kỷ luật: `<freeze-check>` bắt "file frozen
# ĐỔI mà không có FR" nhưng KHÔNG bắt "artifact frozen MỚI được THÊM vào lock
# mà không có FR" — thêm một khoá mới thì lần so đầu tiên đã khớp và cổng xanh.
# Ô backlog M04_ci mở cho đúng lỗ đó.

