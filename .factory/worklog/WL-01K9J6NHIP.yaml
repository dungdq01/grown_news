  - 05_uiux/tokens.css                # --vien-mau, --vien-sang × 2 bộ
  - 05_uiux/DESIGN.md                 # §3 viền màu · §4 đổi family + nhịp cột
  - web/styles/prototype.css          # .pn::before + khối "NHỊP + CHUYỂN ĐỘNG v1.3"
  - web/plugins/multiwindow/src/scripts/multiwindow.inline.ts
