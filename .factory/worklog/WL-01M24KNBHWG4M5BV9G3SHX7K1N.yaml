quyet_dinh_trong_luot:
  - "Don vi thay trong chi muc la BAI (doc_id), khong phai file: hien vat cua bai doi qua frontmatter cua bai, DELETE theo file se de chunk hien vat cu mo coi (phu luc A2)."
  - "Tang dan hai nac: (sha_than, updated_at) bang ⇒ 0 fetch 0 ghi; khac ⇒ fetch, checksum=sha256(moi byte) bang ⇒ 1 UPDATE metadata (khong ghi chunk); khac ⇒ rechunk. Do bang total_changes o cong 6."
  - "Chunk tren ban `?dang=goc` (kem frontmatter) de so dong tuyet doi khop kb/<loai>/<slug>.md; frontmatter bo qua, fence ``` mo voi heading; doan truoc heading dau la chunk anchor rong."
  - "`title, tim = (chuan_hoa_tim(x) for x in (heading_path, body))` — MOT call-site trong indexer (M13-R1 dem 2 tren toan src sau khi rank co)."
  - "facet: khoa TANG nguyen van (loai · pl · nguon · cat · cpt) + space; `pl` tu loai-nguon.json, `nguon` port nguonCua (trang.mjs:1464-1500) doc media-mime.json — ban thu hai cua mot luat FE ⇒ o backlog M13 (cong doi chieu sau)."
  - "url_loi(): env TRUYHOI_LOI_URL, mac dinh cong `web` tu dich-vu.json (Z6); tu choi host ngoai loopback (M13-R5)."

