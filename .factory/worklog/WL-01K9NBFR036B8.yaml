# ══ BUG THẬT tìm ra trong lượt này: CÓ BỐN builder `Ban`, không hai ══════════
#
# B7a thêm `ho_so`+`media` vào `banTuDb` và `docTuDia`, và `hai-ban-shape` canh
# hai bên đó khớp nhau. Tôi đã tưởng đó là toàn bộ tập bản song sinh.
#
# Cửa sổ đọc lấy `BAI` từ HAI ĐƯỜNG JSON KHÁC NHAU:
#   bản mock  ->  /mock/static/open-index.json   (dựng từ data.mjs)
#   bản THẬT  ->  /api/index                     (articles.mjs:chiMucMo)
# `chiMucMo` là danh sách trường gõ tay THỨ BA. Cộng bản thứ tư trong
# `expected-render.test.js` (fixture của test — drift ở đó làm test đo một hình
# dạng cũ mà vẫn xanh).
#
# Hệ quả ĐO ĐƯỢC: xem trước hiện vật chạy trên `/mock/` và IM LẶNG không chạy
# trên kho thật. Không cổng nào bắt được, vì `hai-ban-shape` chỉ biết hai bản.
#
# BÀI HỌC: đếm bản song sinh theo SỐ ĐƯỜNG DỮ LIỆU TỚI MÀN HÌNH, không theo số
# hàm trong một file. Một file có hai hàm giống nhau thì dễ thấy; hai file ở hai
# module cùng dựng một hình dạng thì không.

# ══ Cổng của tôi vacuous BỐN lần, và tất cả cùng một nguyên nhân ════════════
#
# `media-mime.json` được NHÚNG NGUYÊN BẢNG vào bundle qua `define`. Nên mọi phép
# kiểm dạng `js.includes("<khoá trong bảng>")` LUÔN đúng — nó đo sự tồn tại của
# BẢNG, không đo việc code CÓ ĐỌC bảng. Kiểm hai chiều bắt được cả bốn:
#
#   1 `xem_truoc` — đổi `loai.xem_truoc === "iframe"` thành `loai.duoi === ".pdf"`
#     (FE tự đoán thay vì đọc khai) ⇒ cổng VẪN XANH.
#   2 `id_mau` — bỏ xác nhận id ở cửa nhúng ⇒ VẪN XANH.
#   3 host video — chèn `src="${v.nhung}${v.id}"` vào hàm dựng (hết
#     click-to-load) ⇒ VẪN XANH, vì tôi chỉ so với HẰNG literal còn bundle giữ
#     `v.nhung` là THAM CHIẾU BIẾN.
#   4 `download` — bỏ hẳn nút tải về ⇒ VẪN XANH, vì `download` còn ở chỗ khác
#     trong bundle (link tải template .md).
#
# Sửa cả bốn bằng CÙNG một cách: cắt THÂN HÀM theo ngoặc khớp rồi đo trong đó.
# Và cho phép `nhung-video` (tên act) trong khi cấm `.nhung` (truy cập thuộc
# tính) — cấm cả chuỗi là đỏ oan, cấm ít hơn là không có răng.

# ══ Ba quyết định về xem trước ══════════════════════════════════════════════
#
# 1 · Dạng xem trước ĐỌC từ `xem_truoc`, không do FE phán. `iframe` cho thứ
#     trình duyệt render được; `the` + nút tải về cho ppt/word. Và
#     `content-disposition: attachment` ở server (B6) CHÍNH LÀ chính sách đó —
#     FE chỉ nói ra, không quyết lại.
#
# 2 · CLICK-TO-LOAD, và nó phải được canh bằng cấu tạo: hàm dựng xem trước
#     KHÔNG được nhắc `.nhung`. Nhúng video là lần đầu sản phẩm gọi ra mạng
#     ngoài, và người dùng ký cho HAI HOST, không ký cho "mọi lần mở trang".
#
# 3 · XÁC NHẬN id HAI LẦN: `idVideo` rút + kiểm `id_mau` lúc vẽ, `nhungVideo`
#     kiểm LẠI lúc bấm. Giữa hai thời điểm đó, DOM là thứ ai cũng sửa được bằng
#     devtools — `data-vid` không phải nguồn tin cậy.

