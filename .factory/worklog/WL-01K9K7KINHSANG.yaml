# ── Bug chap chon EPERM — TRI DUOC nho thong bao cai tien ────────────────
bug_eperm:
  bo_i: "luot truoc toi ghi 'mot luot test do khong tai hien duoc' va da them in nguyen van phan hoi"
  lan_nay_no_tu_noi: |
    EPERM: operation not permitted, rename
      'bai-nhap.md.dang-ghi' -> 'bai-nhap.md'
  nguyen_nhan: >
    Cho toi TU TAO o FR-023: moi lan ghi xong `capNhatIndex()` spawn
    `sinh_index.py`, va no `read_text()` MOI file .md (sinh_index.py:114). Lenh
    ghi ke tiep rename de len dung file python dang doc ⇒ tren Windows la LOI
    CUNG, khong phai canh bao.
  vi_sao_chap_chon: "cua so trung nhau chi vai chuc ms — 1/5 luot"
  sua: >
    `doiTenBenBi()` — rename co thu lai 12 nhip x 20ms. Khong tuan tu hoa voi
    index vi index mat ~430ms/luot, khoa chung nghia la moi lenh ghi cho nua
    giay. Handle doc cua python chi giu vai chuc ms.
  cho_dong_bo_khong_async: >
    `Atomics.wait` tren SharedArrayBuffer — cach duy nhat ngu ma KHONG nhuong
    event loop. Ham goi dang trong mutex `tuanTu()`; nhuong luot la mo cua cho
    lenh ghi khac chen vao.
  het_luot_van_khong_duoc_thi_NEM: "im lang bo qua la mat bai ma bao thanh cong"
  kiem_chung: "chay lai 3 luot tron bo: 34/34 · 0 FAIL · 0 EPERM (truoc do 1/5 luot do)"

cong_do_dung_sau_khi_sua:
  hien_tuong: "check_index_dan_xuat do 2 phep kiem sau khi toi boc rename vao ham phu"
  cong_do_DUNG: "gia dinh 'rename nam tai cho ghi' khong con — no go cung `renameSync(benCanh, dich)`"
  sua_cong_khong_sua_code: >
    Tinh chat can bao ve khong doi: moi cho DI CHUYEN file phai danh dau index
    ban. Nen cong dem CHO DI CHUYEN (`doiTenBenBi(` hoac `renameSync(`), khong
    dem mot cu phap. Va BO than ham `doiTenBenBi` truoc khi dem — do la CACH LAM,
    khong phai mot cho di chuyen thu tu.
  kiem_hai_chieu: "bo 1 banIndex() o phucHoi => do dung 1 phep kiem"

