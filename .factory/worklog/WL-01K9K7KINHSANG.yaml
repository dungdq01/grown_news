# ── Nguoi dung dung o hai diem ────────────────────────────────────────────
diem_1_bo_cuc: >
  Toi lam token/anh/rang nhung KHONG dung lai bo cuc Trang chu. Anh chup van la
  shell cu (thanh tren ngang · panel Noi bat phang · bar HTML), chi co anh nen
  phia sau. Ba thu cau truc con thieu:
    dieu huong  thanh tren ngang  ->  rail trai 78px co dinh
    vung dau    panel phang       ->  #hero co perspective(1800px)
    bieu do     bar HTML ngang    ->  #tower khoi 3D CSS
  CHUA LAM trong luot nay — xem "no con lai".

diem_2_kinh_khong_thay_o_che_do_sang:
  nguyen_nhan: "alpha sang .9 = chi 10% anh xuyen qua. Mat doc ra 'tam trang', khong phai mat kinh."
  vi_sao_toi_bo_sot: "FR-027 chi ha alpha ban TOI (.88 -> .62). Ban sang giu .9 vi do luc do cho thay no can .84+ de dat AA."
  do_lai_ky_hon: |
    Anh public/light/ dang dung, nen nhat nhat #6D6D6D:
      alpha  nen tron   chu mo   do #C81E1E
       .90   #F2F2F1     5.16      5.16    (ban truoc — 10% xuyen qua)
       .80   #E7E8E7     5.16      4.67  <- CHON: 20% xuyen qua, ca bon du that
       .78   #E5E6E5     5.06      4.58    do chi du 0.08 — sat mep
       .74   #E1E1E1     4.84      4.39    do TRUOT
       .70   #DDDDDD     4.66      4.22    do TRUOT
  rang_buoc_binding_la_DO_khong_phai_chu_mo: >
    Ban dau toi chon .70 va tinh ha `muted-foreground` — sai huong. Do #C81E1E
    la MAU THUONG HIEU (ui_guide §1: "Đỏ #C81E1E là mực in"). Lam no toi di de
    lay them 10% do trong la doi thu nguoi doc nhan ra to bao bang, de lay mot
    hieu ung. Nen alpha dung o .8 va do giu nguyen.
  ket_qua: "sang .9 -> .8 (20% anh xuyen qua thay vi 10%) · muted-foreground #65656C -> #5F5F66 (tra no cu, doc lap voi alpha)"

# ── Phep kiem khoa CUNG mot con so, sua thanh so HAI NGUON ───────────────
motion_polish_khoa_cung:
  truoc: 'ok(audit.glass_alpha.light === 0.9 && /--background:rgba\(252,252,251,\.9\)/.test(tokens))'
  hai_viec_sai_cung_luc:
    - "chan mot thay doi HOP LE (ha .9 de kinh hien o che do sang)"
    - >
      KHONG bat duoc loi that: sua tokens roi quen sinh lai audit thi hai ben
      lech nhau ma con so 0.9 van dung o ca hai
  sua: >
    So HAI NGUON KHOP NHAU cho ca hai che do, doc alpha tu tokens.css va tu
    audit roi so. Them mot phep kiem `audit.failures === 0`. Gio audit duoc SINH
    tu tokens nen lech chi xay ra khi quen chay lai — va do dung la thu phep
    kiem nay bat.
  cung_lop_loi_da_gap: "'dem mot ten xuat hien bao nhieu lan la phep kiem yeu' — khoa mot GIA TRI khi dieu can bao ve la SU KHOP"

