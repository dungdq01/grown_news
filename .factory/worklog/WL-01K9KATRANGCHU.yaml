# ── Ba quirk ban tham khao tu mac ───────────────────────────────────────
ba_quirk_khong_bê_theo:
  quirk_1:
    ban_goc: "countUp(document) / growBars(document) goi luc load"
    he_qua_that: >
      dat co __c/__g ⇒ lan goi trong IntersectionObserver KHONG BAO GIO lam gi
      ⇒ reveal-on-scroll KHONG TON TAI (no chi trong nhu co)
    sua: "chi goi qua observer"
  quirk_2:
    ban_goc: "mot co `hover` gan hero, dung cho CA vong bieu do"
    he_qua_that: "hover hero DONG BANG bieu do; hover bieu do KHONG DUNG GI"
    sua: "treoFeat + treoPane — hai co khai rieng"
  quirk_3:
    ban_goc: 'style-hover="…"'
    he_qua_that: "thuoc tinh BIA — hover translateY(-3px) CHUA TUNG CHAY"
    sua: "CSS :hover that"
  nguyen_tac: "be nguyen mot ban tu chua la be luon ca loi cua no"

