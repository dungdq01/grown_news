    - "addCleanup go hen gio + observer khi dieu huong SPA"
  khong_lam: "vong thu ba (anh nen 7s, §5) — hai vong la dung ngan duoc noi"
  vi_sao_khai_thay_vi_lam_im: >
    Day la NOI mot luat tang duoi. Lam im lang thi lan sau khong ai biet luat
    con hieu luc o dau.

# ── Trong luong: tu choi duong de ───────────────────────────────────────
trong_luong:
  tinh_the: "rail trai day trang toi DU 35 BYTE duoi tran 48 KB"
  duong_de: "nang tran"
  lam_gi_thay_the: >
    Do xem co mo THAT khong. Co: CRLF + thut dau dong trong shell HTML. Bo o
    luc PHAT RA duoc 4 KB, giu <pre>/<textarea> nguyen ven (split theo the roi
    chi xu ly phan le).
  van_nang_tran_nhung_ly_do_khac: >
    48 -> 60 KB vi 3 pane + khoi 3D la NOI DUNG NGUOI DUNG YEU CAU, khong phai
    phinh. Cung khuon ly le da dung khi nang 40->48. 60 van cach xa 86 nen
    tripwire con no dung luc.
  hai_tran_chua_tung_co: "gn.css <=160 · gn.js <=100 — truoc do bundle KHONG CO TRAN NAO va da am tham len 112 KB"

# ── Bon phep kiem cua TOI tu sai ────────────────────────────────────────
phep_kiem_toi_tu_sai:
  1_khong_loc_media:
    sai: "`exec` lay luat `.mid` CUOI FILE — ma luat cuoi la luat MOBILE"
    hau_qua: "do dien thoai roi ket luan cho desktop"
    sua: "loc bo @media truoc roi moi lay luat cuoi (cssGoc)"
  2_khong_neo_cuoi:
    sai: "`grid-template-columns:…1.5fr…1fr` khong neo ⇒ khop CA `1.5fr 1fr 1fr`"
    hau_qua: "bo cuc 3 cot CU van xanh — cong khong chan gi"
    sua: "neo `;`"
    do_bang_thi_nghiem: "tai tao 3 cot ⇒ truoc: 0 FAIL · sau: 1 FAIL dung cho"
  3_tim_ten_thay_vi_khai:
    sai: "/treoFeat[\\s\\S]*treoPane/ — tim TEN XUAT HIEN"
    hau_qua: "doi dong khai thanh `treoChung` van xanh vi ten con o cac cho DUNG"
    sua: "cat rieng cac dong KHAI roi moi tim"
    cung_lop_loi: 'count("banIndex()") >= 3 (1 dinh nghia + 2 loi goi = 3)'
  4_do_ca_file_thay_vi_tung_khoi:
    sai: "tim `--b2s:` tren CA FILE tokens.css"
    hau_qua: "mot che do co la du xanh — ma mot bo mau cho hai nen thi sai mot nen"
    sua: "cat khoi :root / [data-theme=dark] roi do TUNG khoi"
  lop_loi_chung: "dem hoac tim mot CHUOI roi ket luan ve HANH VI"
  cach_ca_bon_lo_ra: >
    TAI TAO loi va DOI test phai do. Khong cai nao lo ra khi chi chay xanh.

loi_thu_5_ky_tu_vo_hinh:
  hien_tuong: "phep kiem quirk 2 do dai dang du ma nguon nhin ra dung"
  nguyen_nhan: >
    Viet file qua Python heredoc: trong chuoi KHONG raw, `\\b` la ky tu
    BACKSPACE (0x08), khong phai backslash-b. File chua byte 0x08 vo hinh nen
    regex khop `<BS>treoFeat<BS>` — khong bao gio khop gi.
  vi_sao_kho_thay: "sed/cat in backspace ra vo hinh; chi `JSON.stringify` moi lo"
  sua: "chuoi RAW (r'...') hoac kiem bang JSON.stringify"
  cung_ho_loi: >
    Cung ho voi: backtick trong chuoi Python o bash heredoc bi bash CHAY, va
    dau nhay don trong tieng Viet pha <<'EOF'. Ba tang escape long nhau.

