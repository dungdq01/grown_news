    - "`git ls-files chungcat` = **67 file** (ô khai 0)"
    - "không có worker → `worker.py --vong` chạy, job đi trọn vòng hôm nay"
    - "T12-7 nhà thứ hai → `adapter/` có `google.py` + `openai.py`"
    - "ba phụ thuộc chưa khai → `pyproject.toml` đủ rapidfuzz · pdfplumber · httpx · yt-dlp"
    - "`check_nghe_loopback` đỏ oan → nay XANH"
    - "hai hàng đợi song song → quét cả repo chỉ thấy MỘT"
    - "`GET /viec?n=abc` sập → sửa thật, xem dưới"
  con_lai: "45 → **37 ô**"
  hinh_dang_37:
    hop_dong_can_FR: 13
    viec_chua_lam: 5
    thieu_cong: 2
    chua_phan_loai: 17

o_736_sua_that:
  truoc: >
    `GET /api/job?n=abc` → **502 · TypeError**; thợ đóng kết nối không trả gì
    (`RemoteDisconnected`). Trong `http.server`, ngoại lệ không bắt ở handler
    GIẾT LUỒNG đang phục vụ — một ký tự gõ nhầm thành sự cố máy chủ.
  sua: >
    `api.doc_so(gt, mac_dinh, tran=500)` — ba phép chặn, ba lý do khác nhau:
    không-phải-số ⇒ mặc định (người gõ nhầm) · ÂM ⇒ mặc định (đẩy chỗ hỏng
    xuống sâu hơn là làm nó khó truy hơn) · quá trần ⇒ cắt (`n=999999` bắt đọc
    cả hàng đợi vào bộ nhớ cho MỘT lời gọi).
  sau: "`?n=abc` → **200** · cổng mới `check_tham_so_hong.py` (7 vế)"

buoc_3_fr:
  mo: FR-069
  vi_sao: >
    Đo: `grep -i "tai-video" spec.md` = 0 · `chat_luong` = 0. Một loại việc
    ĐANG CHẠY TRONG SẢN XUẤT mà hợp đồng không nhắc là đúng chỗ chủ dự án lo:
    người đọc spec để biết hệ làm gì sẽ đếm thiếu một loại, và người sửa
    `BANG_LOAI` sẽ tưởng ba loại là đủ.
  noi_dung: >
    `loai` thứ tư `tai-video` (không gọi model — nên `M12-R6` áp theo nghĩa
    EGRESS, không theo token) · bậc là THẬT không transcode · kết quả KHÔNG
    vào kho (đo: `goc` = 463 MB) · `tien_do` cùng khoá khác hình dạng · hai
    rule mới `M12-R8`/`M12-R9` · cửa web thuộc M08 (`T08-34`).
  chan_lai: "spec + rules M12 đang FROZEN ⇒ NGƯỜI ký `<freeze-check> --ký` sau khi duyệt FR"

