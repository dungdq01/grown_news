buoc_1_ci:
  phat_hien: >
    CI **không chạy một cổng M12 nào**. Đo: `grep -c chungcat ci.yml` = **0**.
    Nghĩa là mọi câu "39/39 xanh" trong worklog của tôi suốt phiên này là xanh
    TRÊN MÁY TÔI — và `R2` nói thẳng thứ đó không tính.
  da_lam:
    - "bước `cài chungcat (M12)` — KHÔNG kèm extra `[asr]` (torch >2 GB cho một bộ cổng không dùng tới)"
    - "vòng lặp chạy CẢ THƯ MỤC `chungcat/tests/check_*.py`, không liệt kê tay — cổng thứ 41 ra đời sẽ tự được canh"
    - "E2E `--mock` (0 token, 0 egress). `--that` KHÔNG vào CI: nó tiêu tiền."
  do_truoc_khi_them: >
    Chạy cả 40 cổng với env RỖNG (`env -u CHUNGCAT_KHOA_LOI -u BEEKNOEE_API_KEY
    -u KHOA_DICH_VU`) ⇒ 40/40 XANH. Nên chúng CHẠY ĐƯỢC ở CI, không phải hy vọng.

buoc_2_phan_loai:
