    - "python core/tests/check_frozen.py"  # + 8 cổng khác, 9/9 OK
  ket_qua: xanh
  test_moi: >
    web/test/filter-counts.test.js — số trên nhãn PHẢI khớp số thẻ (6 nút loại
    + 10 nút khái niệm), parser đọc được mảng, #cb đã nối. Chính test này bắt
    được lỗi đếm lệch tập.
  kiem_tay: >
    Bản mock: 6 nút loại nguồn, 10 nút khái niệm, 13 thẻ, 8/13 thẻ có concepts
    thật, 10/22 concept đang dùng, retry-jitter 2× đạt ngưỡng gộp.

