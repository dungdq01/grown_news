ba_dieu_da_chua:
  - >
    Ô MÔ TẢ → THÂN BÀI. Trước đó hai đường gửi `body: motCau`, tức thân bài LẶP
    LẠI câu tóm tắt — bản ghi tự nói hai lần, và người dùng không có chỗ mô tả.
    Một hàm `thanTu()` cho cả hai đường; rỗng thì trả về câu tóm tắt (đường lùi)
  - >
    Ô CHỦ ĐỀ + KHÁI NIỆM RA KHỎI KHỐI ẨN. Chúng có từ WO-016 nhưng nằm trong
    `#tv-meta`/`#vd-meta` mang `hidden` — có trong DOM mà người mở màn không thấy.
    Cả hai là BẮT BUỘC (cổng module chặn) nên chúng phải hiện ngay
  - >
    NÚT NẠP KHÔNG CÒN CHẾT. Màn nạp cũng khai `module`, nên phép tìm "màn nạp của
    module này" giải ra CHÍNH nó ⇒ nút trỏ vào trang đang đứng. Nay màn nạp mời
    các lối KHÁC và nói ra lối đang mở

mot_dong_chu_cua_toi_noi_doi:
  - >
    Dải lối video ghi `youtube · tiktok · douyin · bilibili`, dải tài liệu ghi
    `pdf · docs · ppt · bảng tính`. Whitelist có HAI host; bảng định dạng có
    `pdf pptx docx ppt doc` — không có `docs`, không có bảng tính nào. Dán link
    douyin thì 422, mà màn đọc như nó được nhận
  - >
    Chữa bằng DẪN XUẤT: hai dòng đó thành mốc, SSR đổ từ `media-mime.json`. Và
    trần số từ đổ từ `khung-than-bai.json` — màn nói ra giới hạn TRƯỚC, không để
    422 nói hộ sau khi người dùng gõ xong

dinh_chinh_cua_nguoi_dung:
  - >
    *"thứ chúng ta cần là danh sách LOẠI NGUỒN, chứ ko phải phân loại: loại nguồn
    là tập hợp con của phân loại, và ta cần QUẢN LÝ danh sách LOẠI NGUỒN đó →
    loại nguồn nào ứng với phân loại nào"*. Lượt trước tôi đổi tên tab thành
    "Phân loại" — lệch hướng. Panel quản lý LOẠI NGUỒN; phân loại là NHÓM CHA
  - >
    Nội dung cũng sai và đã sửa: panel đọc `m.loai` của `loai-nguon.json`, tức tên
    BẢNG (`tai-lieu`, `video`). Với bài viết thì `source_type` CHÍNH LÀ loại nguồn
    nên nó đúng tình cờ. Nay dùng lại `nguonCua()` — MỘT phép suy đã có từ WO-014

kiem_hai_chieu:
