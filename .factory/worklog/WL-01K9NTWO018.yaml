tu_bat_duoc:
  - >
    LÁT CẮT CỦA TÔI NUỐT KHỐI KHÁC. Khi viết lại panel loại nguồn, lát cắt đi từ
    `nguonlist` tới hết dòng `nguoncount` — và khối đổ bốn mốc của WO-018 nằm
    GIỮA hai mốc đó, nên nó bị xoá. Cổng `mo-ta-va-nut-nap` §4 bắt được ("0 nơi
    phát"). Cùng lớp lỗi đã trúng với `apSap` ở WO-014
  - >
    CỔNG XANH RỖNG: §3 cắt `slice(0, indexOf("<main"))` vì tôi tưởng nút nạp ở
    header — đo ra nút ở vị trí 2541 còn `<main>` ở 2050. Lát cắt tìm 0 nút, nên
    "không nút nào trỏ vào chính nó" đúng VÔ CĂN CỨ
  - >
    CỔNG ĐO HÌNH THỨC hai lần: đòi thân hàm chứa chuỗi `tv-mo` (bản cài đặt tốt
    hơn dùng helper chung nên không chứa), và đọc dòng liệt kê bằng mẫu `<span>`
    trơn (mốc SSR có thuộc tính nên khớp 0)
  - >
    Escaping #33-34: so-chuỗi trên dòng có dấu thoát lồng nhau lệch một dấu gạch
    chéo ⇒ phép thay bị BỎ QUA im lặng, hai lượt liền. Đường đi được: sửa theo
    CHỈ SỐ DÒNG, không so chuỗi dài

con_lai_cua_WO019:
