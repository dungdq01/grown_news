    gõ tay gì), nhưng master vẫn là `media-mime.json` + `loai-nguon.json`, không
    phải một bảng như `concepts`/`categories`. Đây là yêu cầu tường minh của
    người dùng và nó CÒN MỞ
  - >
    Kèm theo: đường THÊM/SỬA/XOÁ một loại nguồn (bộ `data-suanhan` đã tổng quát,
    chỉ route ghim cặp `concepts|categories`)
