dinh_chinh:  # 2026-08-29, sau khi agent khác chạm vào cùng vùng mã
  - >
    **Tôi ghi SAI nguyên nhân.** WO-027 khai lỗi là *"neo `(?:^|\}}` nuốt dấu
    `}}` của luật trước"*. Đo lại, tách từng biến:
      neo cũ  `(?:^|\}})`  KHÔNG cờ `m` : 417
      neo cũ  `(?:^|\}})`  CÓ cờ `m`    : 826
      neo mới `(?:^|[}};])` có cờ `m`   : 826   ← đóng góp ĐÚNG BẰNG KHÔNG
      không neo                        : 834
  - >
    Thứ thật sự chữa là **cờ `m`**. Thiếu `m` thì `^` chỉ có nghĩa ở đầu CHUỖI,
    nên gần như mọi luật mất một nửa cơ hội khớp. Việc tôi nới lớp ký tự từ
    `\}}` sang `[}};]` không thay đổi một luật nào
  - >
    Bản vá VẪN ĐÚNG (417 → 826) — nó đúng vì tôi thêm `m` cùng lúc, không vì
    lý do tôi viết ra. Người đọc hồ sơ cũ sẽ rút bài học sai: đi nới lớp ký tự
    thay vì soi cờ regex
  - >
    Còn sót: **1 selector thật** (`.st.dr`), không phải 8. Hai cái kia là bước
    keyframes (`0%,100%`, `from`) — không phải luật cho các cổng này
  - >
    Đường ĐÚNG hẳn là **quét ngoặc theo độ sâu**, không neo gì cả. Agent làm
    WO-035 đã viết một bản như vậy trong `mo-ta-va-nut-nap.test.js` §9; bảy chỗ
    còn lại nên chép sang. Ô backlog đã mở

