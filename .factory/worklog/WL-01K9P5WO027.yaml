ban_sua:
  - >
    Bỏ neo. `[^}]*` KHÔNG thể vượt qua một `}` nên nó không tràn sang luật khác
    được — neo là thừa ngay từ đầu. Thay bằng `(?:^|[};])` + cờ `m`: thiếu `m`
    thì `^` chỉ có nghĩa ở đầu CHUỖI, không ở đầu dòng
  - "Cùng bug đã sửa ở WO-015, nơi `[hidden]{display:none}` có thật mà cổng báo 'thấy 0 luật'"

