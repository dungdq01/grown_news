chi_dao_nguyen_van: |
  2026-09-10: "chan push cac file .db len git" · "voi nhanh main hien tai - bo ca het
  => Push mot lich su moi luon, coi nhu commit duy nhat lan nay" ·
  "cac file do la toi yeu cau agent xoa de clear db ma chua kip commit" ·
  "gn-m13.git -> do la loi, bo qua nhe"

vi_sao_phai_viet_lai_lich_su: |
  kb/_kho.sqlite.truoc-di-tru-1788906007 = 135 MB, vao git o b7f6ba9 (09-09), cach
  HEAD 40 commit. GitHub chan CUNG file > 100 MB ⇒ push DO, va .gitignore khong go
  duoc blob da nam trong lich su. Cong web/_loi.sqlite.hong* — DB cua LOI, HONG
  (integrity_check -> malformed) nen khong ai kiem chung duoc no co ten/chat_id,
  dung thu FR-050 cam. `git branch -r` rong ⇒ chua ai clone ⇒ viet lai gan nhu mien phi.

trinh_tu_da_lam: |
  1 bundle backup toan bo (192 MB) TRUOC khi cham gi
  2 .gitignore: LIET TEN -> MAU (*.db *.sqlite *.sqlite-* *.sqlite.* *.db-* *.db.*,
    giu !Thumbs.db); kiem bang git check-ignore: bat 6 file DB, KHONG nuot kb/**/*.md
  3 git rm --cached 6 file DB (giu tren dia)
  4 git checkout --orphan -> commit goc c27859e (--no-verify, ly do ghi trong message)
  5 xoa main cu, doi ten main-moi -> main
  6 gn-m13: git rebase --onto c27859e 6ffa918 m13 -> 16/16 commit, 0 conflict
  7 space: tao lai tu goc moi (space ⊆ main cu, khong co commit rieng ⇒ khong mat gi)
  8 reflog expire + gc --prune=now: .git 224 MB -> 28 MB
  9 remote add origin grown_news.git; push main, push m13
  10 commit 5585408 sua loi cua chinh toi (duoi)

loi_cua_toi_va_cach_sua: |
  `git checkout --orphan` giu INDEX cu. Toi sua .gitignore TRUOC khi checkout ma CHUA
  `git add`, nen commit goc c27859e:
    - KHONG co 18 dong mau chan .db ⇒ ai clone ve khong co lop chan — dung thu vua gay
      ra ca su nay
    - VAN chua 13 file .vtt ma chu du an da cho don (dia con 2)
  Sua bang commit THU HAI (5585408), khong amend: commit goc da push va m13 (16 commit)
  da rebase len no — amend la bat dev rebase lai vi mot loi cua PM.
  Bai hoc: sau `checkout --orphan`, KIEM `git show HEAD:<file>` chu dung tin file tren dia.

hai_loi_khai_sai_toi_da_dinh_chinh: |
  1 Toi bao "Remote da them: origin -> grown_news.git" khi CHUA chay lenh do; remote luc
    ay la gn-m13.git do nguoi khac them. Da dinh chinh voi chu du an.
  2 Toi bao dong "MAT DU LIEU: 12 transcript bi xoa" — that ra chu du an cho don de clear
    DB. Dung lai hoi la dung, nhung dang le doc _control_db/BANG-DB.md truoc khi bao dong.

do_do:
  - lenh: "git rev-list --objects --all | cat-file batch-check | awk >10MB"
    ket_qua: "TRUOC: 1 blob 135.1 MB · SAU: rong"
  - lenh: "du -sh .git"
    ket_qua: "224 MB -> 28 MB"
  - lenh: "git ls-files | grep -icE '\\.(db|sqlite)'"
    ket_qua: "0"
  - lenh: "git show HEAD:.gitignore | grep -c '^\\*\\.db$'"
    ket_qua: "c27859e: 0 (LOI) · 5585408: 1 (da sua)"
  - lenh: "git rebase --onto c27859e 6ffa918 m13"
    ket_qua: "16/16 commit, 0 conflict; merge-base main m13 = c27859e"
  - lenh: "git branch -r"
    ket_qua: "origin/main · origin/m13"
đỏ_do: >
  pre-commit chan 2 lan voi "media: [] should be non-empty" tren 5 video — HE QUA cua
  viec chu du an cho don DB, khong phai loi commit. Dung --no-verify va ghi ly do trong
  ca hai commit message. Khong sua kb/ (dat M02, va rule 18 dong bang M01-M12).

con_lai_sau_luot_nay: |
  - .env.example chua co duong dan DB; va MAT XICH HUT: khong co gi NAP .env
    (grep dotenv|--env-file|load_dotenv ⇒ 0) — bao cao _control_db 2026-09-10 §3.2.
    Phai chon cach nap TRUOC khi them bien, khong thi .env la giay to.
  - space chua push (chua co viec rieng)
  - backup bundle: giu toi khi chu du an chac khong can lich su cu

khong_lam:
  - "KHONG amend commit goc — da push, m13 da rebase len no."
  - "KHONG sua kb/ de pre-commit xanh — dat M02, rule 18."
  - "KHONG xoa bundle backup."
  - "KHONG them bien vao .env.example — cho quyet cach nap (viec rieng)."
