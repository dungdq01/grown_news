sau_loi:
  - ten: "giai đoạn `tai` KHÔNG có trong `GIAI_DOAN`"
    cua: toi
    do: "`dat_giai_doan` ném `ValueError`, job chết ở nhịp đầu, mọi cổng vẫn xanh"
    sua: >
      Dùng `dang-doc-nguon` — từ vựng ĐÃ KHAI. Tải một video LÀ đọc nguồn;
      thêm nấc thứ sáu chỉ để một loại việc dùng là bắt mọi bên đọc pipeline
      học thêm một chữ. Thêm vế cổng đối chiếu mọi chuỗi giai đoạn với
      `vong.GIAI_DOAN`.

  - ten: "khuôn tên file khai `{26}` (ULID) trong khi id thật là 32 hex"
    cua: toi
    do: >
      `viec_id` là `uuid.uuid4().hex` (`api.py:280`). Cửa `/api/tai-video/<id>`
      trả **422 cho MỌI file có thật**, và `don_xuat_tam` chưa bao giờ xoá
      được gì.
    vi_sao_cong_khong_bat: >
      Fixture của CHÍNH TÔI dùng một ULID giả 26 ký tự — vừa khít khuôn sai.
      Mô phỏng đặt sai chỗ thì nó chứng minh cái sai. Nay fixture gọi
      `uuid4().hex` THẬT, và có vế đối chiếu khuôn của worker với khuôn của
      cửa web.

  - ten: "FE gửi SLUG TRẦN cho job `tai-video`"
    cua: toi
    do: "worker gọi `/api/articles/<slug>` ⇒ 404. Lần THỨ BA cùng lỗi tiền tố loại trong đợt này."

  - ten: "`ban.tai_video` và `ban.ban_chung_cat` — HAI trường tôi tự nghĩ ra"
    cua: toi
    do: >
      Không bản ghi nào có chúng. Hậu quả: bậc đã tải xong không bao giờ sáng,
      và menu báo *chưa sinh* cho một video ĐÃ CÓ ba bản chưng cất — đúng cái
      chủ dự án chụp ảnh hỏi.
    sua: >
      Đọc SỰ THẬT ở nơi nó sống: bậc đã tải tra hàng đợi việc
      (`tai-video` + `xong` + `ket_qua.tep_tam`); bản chưng cất tra CHỈ MỤC
      NGƯỢC (`b.nguon` chứa slug gốc). Cả hai là lời gọi mạng nên dựng rỗng
      trước, vá sau.

  - ten: "`veNutBanChungCat` bóc sai phong bì `/api/index`"
    cua: co_san
    do: >
      Nó đọc `j.bans || j.items || j` trong khi cửa trả
      `{total, articles:[{bans:[…]}]}`. Cả ba nhánh trượt, `.filter` chạy trên
      một OBJECT ⇒ ném ⇒ `catch` NUỐT ⇒ im lặng trả rỗng. Nghĩa là nút ⚗
      **chưa bao giờ hiện**, và không ai biết vì lỗi bị nuốt.
    sua: "một hàm `banChungCatCua(slug)` dùng `nap()` — đúng một chỗ biết hình dạng chỉ mục"

  - ten: "một `throw` trong cửa mới GIẾT CẢ TIẾN TRÌNH WEB"
    cua: toi
    do: >
      Thiếu import `basename` ⇒ `ReferenceError` trong handler `async` ⇒
      unhandled rejection ⇒ Node thoát ⇒ TOÀN BỘ site sập vì một cửa tải.
    sua: "bọc `cuaTaiVideo` trong try/catch, trả 500 — một cửa hỏng không được kéo theo mọi cửa khác"

tien_do_dat_dung_cho:
  chu_du_an_bac_lan_mot: >
    Tôi làm thanh tiến độ ở TAB VIỆC. Chủ dự án bác: *"tôi bảo phải hiện tiến
    trình download cơ mà… tôi vừa bấm tải 480p và sao tôi biết nó đang tải và
    được bao nhiêu %?"*.
  bai_hoc: >
    Phần THỢ đúng (thợ có phát tiến độ), phần ĐẶT sai: nó bắt người rời menu,
    mở tab Việc, tìm đúng dòng. Tiến độ phải ở nơi người ĐANG NHÌN — nút họ
    vừa bấm — không ở nơi hệ thống thấy tiện.
  hinh_dang_cuoi: >
    Nút bậc → thanh tiến độ tại chỗ (nền chạy + `%` + tốc độ, `title` mang cỡ
    và ETA) → đường tải. Ba trạng thái, MỘT chỗ.
  chiu_dung_mang_chop: >
    60 nhịp im lặng (~90s) mới bỏ cuộc. Một lần mạng chớp không được phép xoá
    một tiến độ đang đúng.

