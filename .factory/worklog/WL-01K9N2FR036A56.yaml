# ══ A6 · CÁI ĐÁNG NÓI NHẤT: NĂM BẢN SAO KHUNG NGOÀI REPO ═══════════════════
a6_bundle:
  vi_sao_nguy: >
    `~/.claude/skills/source-distiller/` là thứ THẬT SỰ viết ra bài. Nó giữ năm
    bản sao khung, gồm `scripts/validate.py` — bản validator THỨ TƯ, đã lạc hậu
    từ trước FR-034. Không sửa ⇒ mọi bài skill viết ra bị cổng mới trả về, và
    lỗi hiện ở chỗ người dùng chứ không ở CI.
  da_lam:
    - "đồng bộ validate.py + khung.py + hai file assets + examples/mau-dat-chuan.md từ repo"
    - "xoá __pycache__ (bytecode của bản validator cũ)"
    - "references/format.md: bảng ngân sách từ 9 mục -> 5 mục · template thân bài · format cứng mục tinh túy `#### 3.4.x` · checklist đảo sàn 35% thành trần 25%"
    - "SKILL.md + README.md: dãy tên mục, số cổng, mô tả cổng"
  loi_da_do_va_sua: >
    `SCHEMA_PATH` của validate.py (và `KHUNG_PATH` của khung.py) tính đường bằng
    `HERE.parent.parent` — đúng ở repo (`core/src/source_distiller/` ->
    `core/assets/`), LỆCH MỘT CẤP ở bundle (`<skill>/scripts/` -> `skills/assets/`).
    Bản bundle nổ `FileNotFoundError` lúc import. Sửa: cả hai tìm theo DANH SÁCH
    ỨNG VIÊN, chạy được ở cả hai layout. Kiểm: bản bundle validate mẫu ra 0 lỗi,
    bản repo vẫn 0 lỗi trên kb/.
  dua_nguon_vao_repo: >
    `core/skill-src/format.md` + `core/skill-src/source-distiller.SKILL.md` — lần
    sau drift nằm trong tầm cổng, không ở `~/.claude/` ngoài mọi phép kiểm.

