    ket_qua: "403 — site chinh day TRUOC khi .env co khoa. Cung MA, khac TIEN TRINH: day la bang chung cho luat 'sua .env ⇒ restart', khong phai bug."
  - lenh: "python core/tests/check_worklog.py (tu web/)"
    ket_qua: |
      TRUOC: 13 van de — trong do BA ve CUA LUOT NAY: `plugin timkiem khong duoc nhac` · `test heading-id-anchor khong duoc nhac`
             · `test kho-delta khong duoc nhac`; cong hai so lieu lech (prototype.css 3322 vs tai lieu 3287 · test 140 vs 138).
      SAU:   8 van de, TAT CA la duong dan trong `web/site/**` (gn.js · gn.css · index.json · mau-nap-nguon.md) —
             worktree chua build Quartz (`web/_quartz` la thuong nguon ngoai git). Cay main CO web/site nen cong do pass o do.
  - lenh: "python core/tests/check_running.py"
    ket_qua: "5 muc khong chay — Y HET tren main (do doi chieu). Do nen."

hai_bien_de_quen:   # ghi vao truyhoi/README §"Hai bien, hai duong" — day la ban tom tat
  - "`.env` GOC REPO: ca `web/server.mjs` (loadEnvFile) lan `api.py` (nap_env trong chay()) doc MOT LAN luc day. Sua .env ⇒ restart CA HAI. Chua restart ⇒ /api/tim 403 (fail-closed dung)."
  - "CONG test + `indexer.py` CLI KHONG doc .env — tien trinh roi, khong ai goi nap_env(). Chay tay thi `export PYTHONIOENCODING=utf-8 TRUYHOI_LOI_URL=http://127.0.0.1:<cong web>`."

đỏ_do:
  - "8 van de con lai cua check_worklog: thieu `web/site/**` trong worktree (chua build Quartz) — moi truong, khong phai ma; main pass."
  - "check_running 5 muc: do nen, y het main."

keo_theo:
  - "M03/M04: cong `check_worklog` va `four-screens` doi `web/site/**` co san ⇒ moi worktree moi deu do cho toi khi clone `web/_quartz` + build. Dang mot dong trong RUNNING.md hoac mot buoc `npm run site` — de nghi PM."

tiep_theo: "Cho PM: don vi doi cong T03-125 vao web/test. Con lai: 14 commit tren m13 chua push."
