      200 · {"ket_qua":[{"doc_id":"cai-dat-va-thiet-lap-hermes-tren-vps","file":"kb/video/cai-dat-va-thiet-lap-hermes-tren-vps.md",
      "anchor":"","line_start":1,"line_end":17,"dia_chi":"video/cai-dat-va-thiet-lap-hermes-tren-vps.md:1-17",
      "heading_path":"Cài Đặt và Thiết Lập Hermes trên VPS","body":"Hướng dẫn Hermes Agent trên Hostinger…"}]
      ⇒ chuoi THAT web → truyhoi tra ket qua kem dia_chi phan giai duoc. Khong mock, khong 502.
  - lenh: "curl :8791/health"
    ket_qua: '{"ok": true, "so_tai_lieu": 16, "so_chunk": 111, "moc_index_gan_nhat": "2026-09-11T05:15:52Z", "sqlite_version": "3.50.4"}  — sqlite 3.50.4 ≥ 3.45 nen `remove_diacritics 2` chay dung (db.mo() probe lai moi lan mo).'
