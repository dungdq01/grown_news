loi_that_thu_hai_ca_panel_Kho_bi_an:
  nguoi_dung_gui_anh: "/kho/ bat dau thang bang muc Cho duyet — khong tieu de man, khong o KPI nao"
  luat_sai: ".pn:has(> [data-mount]:empty:only-of-type){display:none}"
  nguyen_nhan: >
    ':only-of-type' hoi "co phai phan tu <p> DUY NHAT trong panel khong" — KHONG
    phai "co phai MOC duy nhat khong", la dieu no dinh hoi. Panel dau man Kho co
    <p class=khocanh> (RONG khi moi file doc duoc) nam canh <div id=mbkho> va
    <div id=kpi2> day noi dung. <p> do la <p> duy nhat => khop => CA PANEL BIEN MAT.
  sua: ".pn:has(> [data-mount]:empty):not(:has(> [data-mount]:not(:empty))){display:none}"
  co_tu_TRUOC_luot_gop: >
    Khong phai do gop. Man Kho truoc day bat dau bang cac panel bieu do nen khong
    ai de y phan dau bi thieu. Gop Cho duyet vao lam no lo ra.
  vi_sao_khong_test_nao_bat_duoc: >
    Markup LUON co du — chi CSS an no. Bat bang markup thi phai chay trinh duyet
    that. Nen rang dat len chinh LUAT: khong duoc dung :only-of-type, va phai co
    ve :not(:has(> [data-mount]:not(:empty))).
  kiem_hai_chieu: "tai tao :only-of-type => 2 phep kiem do; bo ve :not(...) => 1 phep kiem do; chan ca hang lai => 1 phep kiem do"

