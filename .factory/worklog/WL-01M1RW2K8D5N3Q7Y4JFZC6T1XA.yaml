quyet_dinh:
  luong_khong_tien_trinh: >
    Việc `chung-cat` chờ MẠNG, và luồng Python nhả GIL khi chờ I/O. Tiến trình
    con thì mỗi cái nạp lại module + `.env` + bảng khai cho một việc chỉ ngồi
    đợi socket.
  khong_khoa_python_quanh_chon_viec: >
    `rename` và `O_EXCL` đã nguyên tử ở tầng hệ điều hành nên chúng đúng cho
    luồng cùng tiến trình y như cho tiến trình khác nhau. Một khoá Python chỉ
    đúng TRONG một tiến trình — nó tạo cảm giác an toàn ở đúng chỗ đã an toàn,
    và không giúp gì cho ca hai TIẾN TRÌNH.
  moi_tien_trinh_mot_so_egress: >
    `seq` do TA cấp bằng cách đọc dòng cuối. N bên cùng ghi một file là cuộc
    đua trên chính phép cấp số, và `AC-6.2` vỡ IM LẶNG. Khoá file chéo tiến
    trình trên Windows là ổ bug; khoá giữ qua `fsync` biến mọi lần gửi thành
    hàng một. Đánh đổi khai thẳng: `seq` chỉ liên tục TRONG một sổ, đọc gộp
    theo `(worker_id, seq)` — `egress.doc_moi_so()` làm sẵn.
  tran_asr_tach_rieng: >
    `chung-cat` chờ mạng (CPU rảnh); `sinh-transcript` local nghiến CPU và mỗi
    bản giữ một model trong RAM. Một con số chung thì hoặc bóp nghẹt loại thứ
    nhất, hoặc cho loại thứ hai làm nghẽn máy.
  pid_chet_manh_hon_dong_ho: >
    Với một worker, chờ hết `HAN_TREO_GIAY` chỉ tốn thời gian. Với 2×4 luồng,
    một tiến trình chết lúc tám việc đang chạy KHOÁ CẢ TÁM trong nửa tiếng, và
    người dùng nhìn màn thấy tám việc "đang chạy" mà không gì nhúc nhích.

khong_noi_tai_cho: >
  `chay.sh` ở GỐC repo, ngoài boundary `M12` (`chungcat/**`). Lệnh chạy hai
  tiến trình ghi vào `chungcat/README.md` (đất mình) + ô nợ trong backlog cho
  chủ đất. Không sửa `chay.sh`, nên `song_song.tien_trinh: 2` CHƯA có hiệu lực
  khi khởi động bằng script — nói ra thay vì để người tưởng đã có.

