bon_loi_dua_song_song_lam_lo:
  - id: 1 · cửa sổ giữa `rename` và đóng dấu lease
    goc: >
      `nhan_viec` chiếm bằng `os.rename` rồi MỚI ghi `nhan_luc`. Giữa hai bước
      đó, file đã nằm ở `cur/` mà chưa có dấu ⇒ `_nhan_lai_bo_roi` của luồng
      khác đọc là "bỏ rơi" và chiếm luôn. Hai luồng ôm một job.
    sua: >
      MỘT primitive (`O_CREAT|O_EXCL`) cho CẢ HAI đường chiếm, và lấy TRƯỚC mọi
      thay đổi trạng thái. Hai primitive khác nhau thì không loại trừ được nhau.
    ghi_chu: >
      Bản sửa ĐẦU của tôi vẫn sai: tôi tạo dấu SAU `rename`, tức vẫn để hở đúng
      cửa sổ ấy. Chỉ khi dời dấu lên TRƯỚC mới hết.
  - id: 2 · file tạm dùng chung
    goc: >
      `_ghi_nguyen_tu` ghi qua `tmp/<ulid>.json` — một tên CHUNG cho mọi lần
      ghi của cùng một việc. Hai bên ghi cùng lúc là đụng nhau, và trên Windows
      nó nổ `WinError 32` ngay giữa một phép được đặt tên là "ghi NGUYÊN TỬ".
      Cái làm nên tính nguyên tử là `os.replace` từ một bản nháp KHÔNG ai khác
      chạm — một file tạm dùng chung thì phép ghi không còn nguyên tử.
    sua: "tên tạm mang `pid` + `thread ident`"
  - id: 3 · việc CHẠY XONG bị báo HỎNG
    goc: >
      Chuyển `cur/ → done/` gặp `WinError 32` vì một luồng khác đang `read_text`
      file đó trong lúc quét. Trên Windows một handle mở CHẶN rename — khác
      POSIX. Kiểu sai tệ nhất: hệ thống nói dối về một việc nó làm ĐÚNG.
    sua: "`_doi_ten_ben_bi` — thử lại có TRẦN (20×20ms) rồi mới ném"
  - id: 4 · `os.kill(pid, 0)` không dùng được trên Windows
    goc: >
      Đo 2026-09-05: pid không tồn tại ném `OSError [WinError 87] tham số không
      đúng` — CÙNG mã lỗi với một tham số thật sự sai, nên không phân biệt được
      "chết" với "gọi hỏng".
    sua: >
      `OpenProcess` + `GetExitCodeProcess`, phân biệt được cả ba ca đã đo:
      pid mình → exit 259 (STILL_ACTIVE) · pid bịa → handle NULL, lỗi 87 ·
      pid VỪA chết → handle mở được nhưng exit code 0. Ca thứ ba là lý do phải
      đọc exit code chứ không chỉ xem handle có mở được.

gia_thuyet_cua_toi_sai_hai_lan:
  - >
    "Thiếu hụt tăng tốc là do phí cố định mỗi job." SAI — đo ở ba độ dài job
    (0.3s · 1.0s · 2.0s) thì tăng tốc kẹt ~2.5-2.6× ở CẢ BA, tức không phải phí
    cố định.
  - >
    "Trần là `fsync` serialize." CŨNG SAI — sau khi đóng cuộc đua ở lỗi 1,
    tăng tốc lên 3.77× ngay tại job 0.3s. Trần thật là chính cuộc đua: các
    luồng va nhau rồi thử lại. Nếu tôi nới bar cổng xuống cho vừa 2.5× thì đã
    giao một hệ thống có lỗi đua kèm một cổng nói nó bình thường.

