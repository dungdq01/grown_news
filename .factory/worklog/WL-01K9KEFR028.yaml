viec: >
  Nguoi dung: "toi muon concept hay topic deu co API crud chu ko phai doc tu
  .yaml ra nua. user se khai bao va update lien tuc cac key cho vao API"

cau_hoi_doc_sai_thi_lam_sai_het: >
  Cau do doc nhu "chua co CRUD". Khao sat noi nguoc lai: CRUD da du bon cho ca
  hai danh muc tu FR-019 + FR-021. Neu tin cau chu va di dung API moi thi da
  dung mot ban sao cua thu da co, va van KHONG chua duoc benh.
  Benh nam o hai cho khac han — va phai tach ra thi moi sua dung.

hai_benh_that:
  mot_man_doc_ban_chup: >
    Emitter doc concepts.yaml/categories.yaml LUC BUILD roi in vao 10 moc HTML
    (home-pages/index.ts:738-856). Ghi qua API xong man hinh khong doi, nen 5
    toast phai dinh kem "chay npm run build". Do dung la "doc tu .yaml ra":
    khong phai API doc sai, ma MAN HINH doc ban chup yaml cua lan build gan nhat.
    CUNG LOP BENH FR-024 da chua cho BAI VIET, chua chua cho NHAN.
  hai_cong_bang_chung: >
    POST /api/concepts tu choi neu nhan chua nam trong concepts_proposed cua >=N
    bai. "Khai bao lien tuc" bi chan ngay tu key dau tien.

phat_hien_quyet_dinh_huong_lam: >
  Ba nut tren hang nhan (data-suanhan · data-xoanhan · data-ketnap) DA dung
  event delegation — t.closest(...) trong MOT handler tren document. Nghia la
  hang nhan ve lai bao nhieu lan cung van bam duoc, KHONG phai gan lai listener
  nao, no-leak.test.js khong co gi de phan nan.
  Neu nut gan theo tung phan tu thi bai toan da khac han — huong "ve lai moc"
  se dat gap may lan va co the phai chon huong khac.

ba_nhanh_nguoi_dung_chot:
  nguon_su_that: "GIU yaml. validate.py, check_danh_muc.py, enum trong schema FROZEN, FROZEN.lock deu doc yaml — doi sang SQLite la viet lai ca chuoi cong Python, ma cai dau that (phai build moi thay) khong can toi do."
  cong_bang_chung: "BO — khai tu do"
  topic: "= chu de/category san co, khong phai chieu phan loai thu ba"

khong_them_endpoint_moi: >
  Noi hai GET da co (/api/concepts, /api/categories) them gom/aliases/dang_dung
  thay vi dung /api/danhmuc thu ba. Form viet bai da goi chung roi; mot danh muc
  thi mot cua doc. Va napMotDanhMuc TRA LAI danh sach thay vi goi them mot luot
  — hai luot goi la hai anh chup o hai thoi diem, nguoi dung them nhan giua hai
  luot thi form va man hinh noi hai chuyen khac nhau.

