bon_neo_cong_hong_da_siet: |
  Bon cong do vi MA DA DOI, khong vi he sai. Ca bon duoc DOI PHEP DO:

  1 `mot-phieu-chung-cat` ve 3b — cat 1400 ky tu sau mot moc roi tim markup
    NGAY trong cua so ay, tuc do "nut nam canh nhanh". WO-081 tach nut ra ham
    rieng => do. Neo lai vao HAI mat xich that.
  2 `the-viec-noi-ro-loai` ve 2 — (a) doc `.ts` nen chu thich moi day `tenLoai`
    ra ngoai cua so 1800; doi sang ban BUILD. (b) neo `"function ccThe"` khop
    NHAM `ccTheoNgay` — ten do CHINH TOI vua dat; siet thanh `"function ccThe("`.
  3 `chung-cat-nhap` — neo chuoi `kieu !== "nhap"`; doi sang CHAY that dieu kien.
  4 `tran-hien-thi-luoi` ve 9 — neo chuoi `.cd.qua{display:none}`; gop selector
    de lay byte lam no do du luat y nguyen. Doi mau nhan ca dang gop.

  Chung minh do duoc cho tung cai truoc khi dong.

ba_loi_cua_toi_trong_dot_nay: |
  1 `ccBanCuoi` lot mot byte NUL vao dau noi khoa => file thanh "binary" voi
    moi cong cu. Doi sang `"::"`.
  2 Cong neo CSS vao `prototype.css` sau khi CSS da doi cho; va `tach` dem
    ngoac nen vap chinh `{}` cua CSS => cat theo MOC DONG cho ham do.
  3 `border-radius:99px` va `font-size:.95rem` go tay => token.

