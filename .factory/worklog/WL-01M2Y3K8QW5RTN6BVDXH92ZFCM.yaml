vi_sao_mot_entry: |
  Ba WO nhung MOT y do thiet ke (`SCR-26`) va MOT luot ve. Tach ba entry thi ba
  ban ghi cung tro ve cung mot wireframe va cung mot ham `ccNap`.

trieu_chung_va_ba_lan_bi_bac: |
  1 `WO-085` (sang) gop viec theo bai bang mot `<h3>` chen vao luoi phang, VA
    them hang nut thu ba. Chu du an: *"design khong on: ve lai wireframe, toi
    ko chap nhan kieu list menu design co hu nhu the"*.
  2 Ban ve lai (3 huong) chu du an chon **A+C**.
  3 Ban dung A+C bi bac tiep HAI y: *"Sinh thumbnail la cai gi? … nhac rac vao
    cac trang thai cua tao a?"* va *"can them mau sac va hieu ung, lam co ban
    the cho nguoi co dai dung a?"*.

  Ca ba lan chu du an dung. Ghi ra vi day la thu de quen: cai sai khong phai
  mot bug, no la mot MENH DE thiet ke sai.

menh_de_cua_ban_ve_lai: |
  **Moi hang nut la mot chieu du lieu chua duoc dua vao bo cuc.** Khi hinh dang
  khong noi duoc gi thi moi thu phai leo len thanh loc, va man thanh mot thanh
  cong cu co danh sach dinh kem.

    trang thai -> mau cua chang
    thoi gian  -> tieu de moc ngay
    bai goc    -> chinh cai hang

  => thanh loc con KHONG hang nut nao. Kha nang loc trang thai khong mat: ba so
  tong ket (`xong 24 · can xu ly 1 · cho 0`) tro thanh cho bam — no la ban tom
  tat VON DA o do, khong phai hang nut thu tu.

hai_lop_viec: |
  Do duoc, va day la cai chu du an bat dung:

    sinh-transcript      14  NGUOI dat
    chung-cat-mot-nguon   3  NGUOI dat
    sinh-thumbnail        7  MAY tu xep (tho-cua.mjs:203, WO-071 loi (a))
    tai-video             1  MAY, buoc tien de

  Duong ong = viec cua NGUOI. Viec cua may xuong hang meta, va CHI noi thanh
  chip do khi HONG — loc tron la giau mot loi that.

  `ccViecNguoi` la DANH SACH CHO PHEP, khong loai tru — cung bai hoc `WO-087`:
  ke ten thu bi loai thi viec nen THU BA se tu chen len ong.

chi_ban_cuoi: |
  25 viec / 15 cap (bai,chang). `ecomerce-skill-claude` mot minh co BON lan
  chay transcript dung thanh bon the.

  `ccBanCuoi` giu mot viec moi nhat moi cap, chon theo `tao_luc` KHONG theo
  trang thai. Ve 16b canh dung bay do: mot `xong` CU canh mot `dang chay` MOI
  ma uu tien `xong` thi man bao "xong" trong luc may dang chay — sai theo cach
  nguoi tin ngay va khong nghi ngo.

icon_theo_nguon: |
  `data-i` truoc dat bang TIEN TO SLUG (`video`), ma bang icon khai theo LOAI
  NGUON (`youtube`/`pdf`/…) => o bia trong tron.

  `nhanTuBan(ban, MB)` thuan: video khop HOST -> `nhan`; tai lieu -> duoi hien
  vat dau; khong khop -> lui `source_type`.

  KHONG dung `idVideo`: no tra `null` khi `id_tu` khong khop, nen
  `youtube.com/playlist?list=…` mat icon du host dung ranh ranh. Icon noi
  NGUON, khong noi "da boc duoc id chua". Ve 19b canh dung ca do.

  Hai khoa tach bach: `data-n` (mau cot song) theo NHOM, `data-i` (icon) theo
  NGUON — hai cau khac nhau.

tran_byte_dung_HAI_lan_va_khong_noi_lan_nao: |
  1 Mau + nhip ton ~2 KB ma `gn.css` chi du 5 byte.
    => Chuyen TOAN BO CSS cua man sang tiem tu chunk (`ccCss`), dung loi
    `TX_CSS`. gn.css 106491 -> **104852, du 1644**. Moi trang khac nhe di 2 KB;
    chi `/chung-cat/` tai phan cua no.
  2 Dat `nhanTuBan` vao `gn.js` lam no vuot **279 byte**.
    => Phep SUY ve chunk, cau chi dua DU LIEU (`banTheoSlug` + `mediaBang`).
    gn.js **105229, du 243**.

  Ca hai lan deu KHONG nới trần, khong FR. `FR-061a §3` da goi dung ten no:
  duong dung la dua ma cua mot man ve chunk cua man ay.

