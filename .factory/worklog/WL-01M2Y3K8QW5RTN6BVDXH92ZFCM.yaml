chua_nghiem_thu_duoc: |
  Chua tu bam thu tren trinh duyet. Cong chay ham that tren du lieu dung hinh
  dang va do markup + CSS + noi day; nhung "mau co de nhin khong", "nhip co
  chuong mat khong" thi phai mat nguoi. Chu du an mo `/chung-cat/` la thay.

  Luu y: anh chup chu du an gui luc 2026-09-10 la ban TRUOC lan restart cuoi —
  no hien `sinh-thumbnail` tren ong va 3 chip TRANSCRIPT chua gop. Da kiem lai:
  server dang phuc vu `gn-chungcat.js?v=gksw9k` co du ma moi.

