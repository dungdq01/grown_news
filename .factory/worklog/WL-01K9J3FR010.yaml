     Bác thì revert server.mjs + rules.md + ký lại baseline."
  - "gate.py CỐ Ý không xoá file khỏi _inbox/ sau khi chép vào kb/ (thiết kế M05).
     Hệ quả: nộp lần hai chạy lại gate cho MỌI file cũ trong _inbox/, và output
     liệt kê cả chúng — dễ tưởng vừa nạp nhiều bài. Chưa sửa vì đó là hành vi của
     M05, không thuộc phạm vi FR-010."
  - "Hai file thử nghiệm còn trong kb/article/ và _inbox/ (thu-nghiem-gpt.md,
     nop-qua-web.md). Tôi tạo để kiểm luồng; người dùng từ chối lệnh xoá — hợp lý
     vì kb/ là nguồn chân lý. Cần xoá tay."
  - "web/site bị EBUSY khi build (tiến trình cũ giữ thư mục). Không liên quan
     FR-010; đã ghi trong RUNNING.md §5 từ trước."
