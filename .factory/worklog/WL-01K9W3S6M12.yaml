cong_bat_HAI_lo_that_trong_pack_toi_vua_viet: >
  check_ba bao 8 diem treo, ca 8 la CUA TOI, va ca hai lop deu that:

  1) Nam rule khai `be_mat: S3` ma khong tro lenh nao. CLAUDE.md cam thang:
     khai S3 thieu `lenh` + `do_khi` + `xanh_khi`. Toi viet "lenh chua ton tai"
     trong ghi chu roi tuong the la du — khong du: mot rule S3 khong tro lenh la
     KY LUAT, khong phai co che, va cong doc dung cho do.
     Da them du ba ve cho ca sau rule.

  2) Ba "truong" toi khai trong data_flow khong co trong schema:
     `article_versions`, `categories` la ten BANG (toi viet chung trong backtick o
     dau dong bang, dung dang ma cong doc thanh truong frontmatter);
     `model_da_dung` la truong toi TU DAT — schema khong co no.
     Sua: hai cai dau viet ro la "bang ...", cai thu ba ha xuong NO can FR toi
     M01 (owner cua schema), khong giu trong bang nhu mot hop dong da co.

  Bai hoc: toi viet mot pack roi tu cho la dat, va cong tim ra hai lop sai trong
  vong mot phut. Do la ly do G6A ton tai — khong phai de xac nhan cai minh vua
  viet, ma de bat cai minh khong thay.

khai_S3_khi_lenh_chua_co_—_quyet_dinh_va_ly_do: >
