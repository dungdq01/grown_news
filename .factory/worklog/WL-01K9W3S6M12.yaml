  Ap thang thi sau rule nay dang la S2. Nhung ha xuong S2 roi nang lai sau la HAI
  lan sua cung mot file, va lan nang lai la thu PHAI NHO moi lam — dung lop loi
  bang khai sinh ra de dep (S18, bai hoc C5: khong dung co `da_dung: false`).
  Chon: khai S3 kem du ba ve, va NOI THANG o dau file rang lenh chua chay duoc.
  check_ba thay lenh duoc tro; nguoi doc thay lenh chua co. Hai vai, hai thu.

