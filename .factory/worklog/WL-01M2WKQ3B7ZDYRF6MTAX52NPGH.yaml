  khong bia) va cap nhat ba so: test 115->132 · prototype.css 3084->3282 ·
  shell.html 58443->58633.

do_do: |
  Web  : 17 do -> 7 do. Dung bang baseline dau phien, KHONG mot do moi:
         api-guard · man-tai-lieu · man-video · moc-fe-con-that · mot-bien-mau ·
         opacity-khong-pha-contrast · page-weight
         `page-weight` con HAI ve: "trang chu" va "tai dau nang nhat".
         Ve `gn.js` da XANH (104971/105472).

         SUA MOT LOI BAO CAO CUA CHINH TOI: co luc toi doc duoc "page-weight
         chi con mot ve" — phep do ay lay LUC WO-083 con dang ap (chunk nho
         hon ~2 KB). Sau khi hoan tac, hai ve. Con so dung la hai.

         Va do them duoc mot dieu dang ke: trang chu 65669 byte voi **0 byte**
         CSS/JS nhung lai — no nang thuan tuy vi dang phat **34 the `.cd`**.
         Tuc `WO-082` chua duoc cai NGUOI THAY (tran man) nhung KHONG chua
         byte: SSR van phat moi the, va HTML lon tuyen tinh theo kho. Da mo o
         backlog M03 rieng cho viec do — no la thu dang khoa duong dua
         `home-motion` vao chunk.
  M12  : 56/56 xanh.
  core : 7 do — `check_g6b` (xung dot he thong, xem duoi) + 6 cai commit lan
         cuoi 2026-08-29/09-07, truoc phien nay: check_danh_muc ·
         check_db_dung_cho · check_loai_nguon_db · check_media_ddl ·
         check_skill · check_running (cai nay chi tong hop cac cai kia).
         => `chua quy duoc chu` cho 6 cai do; khong phai cua WO-082/083.

  Luu y moi truong: cong Python phai chay bang `./.venv/Scripts/python.exe` +
  `PYTHONIOENCODING=utf-8`. `python` tran thieu `rapidfuzz` va cp1252 lam moi
  cong "do" — mot lan hoang bao 58/58 do.

