quyet_dinh_thiet_ke:
  - >
    DÙNG LẠI `.fw`/`.fl`/`.sortb`/`.mb` của màn Tổng hợp thay vì đặt class mới —
    `gn.css` giữ nguyên **92/100 KB** sau khi ba màn loại đầy đủ. Đặt class mới
    cho việc đã có class là cách hết 8 KB còn lại trong một lượt
  - >
    Màn có `module` mà module đó CHƯA có đường nạp ⇒ KHÔNG hiện nút nào. `/video/`
    chưa có `/video/nap/` (C6b), và một nút "+ viết bài" ở đó là mời người dùng
    làm việc của module khác. Vắng một nút nói đúng sự thật
  - >
    Màn không có `module` (Trang chủ · Tổng hợp · Kho · Danh mục) vẫn nói số CẢ
    KHO — chúng là màn trộn, và đó là đúng

tu_bat_duoc:
  - >
    CỔNG CỦA TÔI ĐO HÌNH THỨC, hai lần. §4 hỏi "`.mid` có luật `min-height`
    không" và trả lời "có" — trong khi `.mid` cao 906/1026px mà `.pn` (khối kính
    NHÌN THẤY ĐƯỢC) vẫn 278px. `.mid` trong suốt. Sửa thành chuỗi BA khâu, và §7
    khai thẳng rằng đây là phép kiểm chuỗi luật kèm số đo thật
  - >
    §5 CẮT SAI VÙNG: tôi cắt tới `</header>`, và `<header class="top">` là RAIL
    TRÁI — chữ "viết bài" chưa bao giờ ở đó. CẢ HAI chiều vô căn cứ. Vùng đúng
    là `.ph`
  - >
    Dải "LỚP CỔNG 6" trên màn nạp tài liệu — chính tôi thêm ở C6a, và nó nói
    KIẾN TRÚC. `chu-giao-dien` tồn tại đúng để chặn điều đó, và tôi vi phạm cổng
    của chính mình
  - >
    Tôi thêm luật `.mid` THỨ HAI; cổng chặn: "một selector, một sự thật" — hai
    luật thì phép kiểm dễ khớp vào luật đã bị đè

