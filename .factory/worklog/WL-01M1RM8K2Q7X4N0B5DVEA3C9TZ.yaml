chan_doan_sai_da_sua: >
  `tran_than_cua_byte` (8 MiB) ra đời từ một phép suy sai. Lỗi xuất hiện trên
  audio 19 phút, không ai thử lại với clip ngắn, và câu lỗi của `egress` nói
  `chunk=0` — đọc như "cửa không nhận nổi lượng dữ liệu này".
  Đo lại trên clip 8 GIÂY (~43 KB base64, nhỏ hơn 400 lần): cửa từ chối Y HỆT.
  Kích thước chưa bao giờ là nguyên nhân.
  `so_chunk` khai `= 0` rồi KHÔNG BAO GIỜ TĂNG — một cổng chẩn đoán nói dối.
  Cổng vắng thì người đi tìm; cổng nói dối thì người tin và đi sai đường.

nam_loi_that:
  - id: 1 · data-URI
    do: "clip 8 giây, đổi đúng một biến"
    ket_qua: >
      `data:audio/mpeg;base64,…` → 502 + trang HTML Cloudflare (chết ở HẠ TẦNG,
      chưa tới model, nên API không nói được gì).
      `data:audio/mp3;base64,…` → 502 y hệt.
      base64 TRẦN → 200 + bản phiên âm THẬT.
    ghi_chu: "`beeknoee-api-guide.md` §4.3 khai data-URI. Guide sai cho cửa này."
  - id: 2 · max_tokens
    ket_qua: >
      Vắng `max_tokens` ⇒ cửa cắt giữa mảng JSON ⇒ `json.loads` ném ⇒ mất SẠCH
      bản phiên âm đã trả tiền. Đặt 65536: `finish_reason: stop`, 14.382
      completion token, phủ trọn 1176s.
  - id: 3 · stream cắt nội dung
    do: "cùng audio, cùng model, cùng max_tokens"
    ket_qua: >
      `stream: true` → nội dung cụt ở ~175 GIÂY transcript với MỌI độ dài nguồn
      (5 phút và 10 phút cùng ra ~175s) — cửa bỏ qua `max_tokens` khi stream.
      Không stream → phủ trọn. Nên `asr_cua` không stream, khác lối chưng cất.
  - id: 4 · nhánh không-stream của egress chưa ai đi
    ket_qua: >
      `_httpx_post` bỏ qua `headers` (tức rơi `Authorization` ⇒ 401) và trả
      thẳng `Response` thay vì dict. Hai lỗi ẩn được vì mọi lối đang dùng đều
      khai `stream: true`.
  - id: 5 · vớt cue mất đồng bộ
    ket_qua: >
      Model tự đẻ một object hỏng giữa 300 object lành —
      `{"v": "591.738, "den": …}` (sai khoá + chuỗi không đóng). Phép quét theo
      ĐỘ SÂU bị dấu nháy thừa lật trạng thái trong-chuỗi ⇒ 256/294 cue hỏng theo.
      Viết lại kiểu cắt theo ranh `}, {`: hỏng nằm gọn một mảnh ⇒ 317/319 cue.
    tu_sua: >
      Tôi đã dùng chính bản vớt hỏng này để kết luận "stream chỉ phủ 49%" — tức
      đo lỗi của mình rồi quy cho stream. Kết luận đó sai và đã đo lại.

