nen_audio: >
  mono 16 kHz mp3 32k. Đo: 12.0 MB → 4.53 MB (base64 16.0 → 6.0 MB). KHÔNG phải
  để lách trần — ASR hạng whisper hạ mẫu về đúng mono 16 kHz trước khi nghe, nên
  gửi stereo 44.1 kHz là trả tiền mạng cho phần bên nhận vứt đi ngay.
  mp3 chứ không opus (opus nhỏ hơn 1.4 MB) vì guide chỉ khai `format: "mp3"` —
  đổi một trần ĐO ĐƯỢC lấy một giả định là sai chiều, nhất là với một cửa từ
  chối ÂM THẦM.

