ket_luan: |
  Bon viec dau KHONG ton mot loi goi model: gop cue -> doan ~30 s · header
  metadata · bang khai khuon theo the loai · Typst lam may in. Viec thu nam
  (faster-whisper local) mua do tin cay — loi `uu_tien 3` da KHAI va `asr.py`
  da viet, nhung WORKER CHUA NOI: `_chon_loi` luon tra `cua-asr`, `worker.py`
  khong `import asr`. Ban dau toi viet "chi chua cai goi" — SAI, da sua ca bon
  file sau khi grep. MCP khong phai cau tra loi cho runtime: ba server khao duoc deu boc
  TeX Live/LibreOffice; `subprocess` trong THO la dung khuon du an (ffmpeg, yt-dlp).

