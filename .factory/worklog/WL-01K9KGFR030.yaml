    `edited`. Bai da duyet roi bi sua KHONG XUAT HIEN O DAU trong bieu do trang
    thai, du `edited` la mot trong BON gia tri enum. `maxTrang` con tinh tren
    `choDuyet` trong khi cot ve `draft` => thang cung lech.
  day_la_lan_thu_4: >
    `bon-trang-thai.test.js` mo dau bang ba lan truoc (chi muc cua so · man Cho
    duyet · luat CSS). BA LAN TRUOC DEU SUA TUNG CHO. Nen lan thu tu den.
  lan_nay_sua_GOC: >
    `TRANG_THAI` doc `enum` TU SCHEMA (core/skill-src/frontmatter.schema.json,
    properties.review_status.enum). Khong ai liet ke tay duoc nua, va mot trang
    thai thu nam se TU CO MAT o moi bieu do.
  rang_hoi_dung_cau: >
    §4b hoi "co liet ke tay khong", KHONG hoi "co du bon khong". Dem bon thi lan
    thu nam van lot — dung lop loi, dung mot buoc cham hon.
  fallback_co_chu_dich: >
    Thieu file schema thi tra ve enum hien tai, KHONG tra ve mang rong. Ve du bon
    cot con hon ve mot bieu do rong ma khong ai biet vi sao.

