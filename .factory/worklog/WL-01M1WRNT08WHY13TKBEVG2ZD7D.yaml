đỏ_do: >
  token-only + nut-song đỏ vì CHÍNH THAY ĐỔI NÀY (quy chủ bằng git status,
  không phải đỏ của người khác): 5 giá trị px gõ tay (gap 2px · border-radius
  1px · ba margin âm) và cổng mới chưa nằm trong npm test. Đã vá: gap dùng
  --s-3xs; bỏ bo góc, vì một token bo nhỏ nhất trên cột rộng 13px là một cái
  vòm, và gõ tay 1px để né điều đó là đúng thứ token-only cấm; ba vòng chồng
  bằng grid một ô thay cho absolute + margin âm nửa cỡ.
quyet_dinh:
  - >
    Dải KHÔNG phải phổ âm thanh. FE không bao giờ cầm byte audio (M12-R1) —
    không AudioContext, không FFT. Chiều cao cột = số cue + số ký tự SINH THÊM
    trong nhịp poll vừa rồi. SCR-22 chọn lối này và nói rõ vì sao: một dải nhảy
    múa trong lúc thợ đã chết tệ hơn không có dải.
  - >
    Chưng cất dùng VÒNG XOAY, không dải tần — chưng cất không có âm thanh, vẽ
    dải ở đó là mượn hình của một việc khác (cùng lỗi "mượn màu của chiều phân
    loại khác" mà SCR-20 đã cấm). Và KHÔNG thanh phần trăm: ta không đo được
    model còn bao lâu, bịa một con số là hứa một thứ mình không đo được.
  - >
    Guard chuyển động viết chiều OPT-IN (no-preference) theo idiom sẵn có của
    chunk, KHÔNG theo khối "reduce animation-none" mà SCR-22 vẽ. Quên một luật
    ở chiều tắt-sau là một animation LỌT QUA; quên ở chiều opt-in thì chỉ là
    một thứ đứng yên. Cổng đo cái bất biến, không đo cách viết.
