vi_sao_WO021_khong_bat:
  - >
    WO-021 chữa CỘT FORM (`.np-p{max-width:52rem;margin-inline:auto}`) và
    `format-chung` §5 đo đúng cái đó. Dải tab nằm NGOÀI `.np-p` nên nó không
    trong phạm vi phép đo. **Chữa một nửa màn rồi đo đúng nửa đã chữa** — cùng
    lớp với `#acount` đếm sai phạm vi (BUG-2 của WO-015)

ban_chua_da_co_san_trong_repo:
  - >
    `.dm-tabs` từng mắc y hệt và đã đổi sang `grid-auto-flow:column;
    grid-auto-columns:1fr`. `auto-flow` sinh đúng số cột bằng số phần tử CÓ MẶT
    nên không bao giờ lệch với markup; `repeat(N)` là con số gõ tay ở tầng thứ
    hai, và lệch của nó IM LẶNG vì CSS không báo gì

cai_bay_thu_hai:
  - >
    Với `auto-flow: column` thì `grid-template-columns` VÔ HIỆU. Truy vấn hẹp cũ
    đổi đúng thuộc tính đã bị vô hiệu ⇒ ba tab vẫn nằm ngang trên điện thoại,
    "đã sửa" trên giấy. Phải đổi chính `grid-auto-flow` sang `row`

tu_bat_duoc:
  - >
    Cổng CHẾT thay vì BÁO — lần thứ tư trong dự án. Tôi cắt một template literal
    giữa chừng qua HAI chuỗi backtick, nên `${...` đóng sớm và `.filter(...)`
    thành phép nối chuỗi ⇒ `TypeError` lúc chạy. Sửa bằng cách dựng câu lỗi
    trong MỘT biến trước. Và lần vá sau để lại một dòng `ok(` mồ côi — `node
    --check` bắt, không phải mắt tôi
  - >
    §6 tự kiểm phạm vi trước khi kết luận: đòi phép đếm PHÂN BIỆT được ba màn
    (`{bai-viet:3, tai-lieu:1, video:1}`). Ra cùng một số cho cả ba nghĩa là tôi
    đang đếm sai phạm vi, và §6 sẽ xanh vì MÙ

