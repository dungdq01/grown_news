khao_moi_loai_nguon: >
  Bảng đầy đủ ở `WO-072`. Tóm: youtube = ytimg đoán từ id (0 lời gọi) ·
  tiktok/facebook/douyin = yt-dlp (WO-071) · host NGOÀI allowlist = icon, cố ý
  vì `AC-V4` · mp4 byte trong kho = ffmpeg (WO này) · pdf = pypdfium2 (WO này) ·
  docx/pptx/doc/ppt = cần LibreOffice, KHÔNG có trong hệ, nói thẳng ·
  md/txt = không có gì render · bài viết = không hiện vật nào.
  Đo kho thật: 6/6 video ĐÃ có ảnh trước WO này ⇒ WO này thêm ảnh cho đúng
  MỘT bản ghi (PDF). Nói ra để không ai tưởng nó đổi cả kho.

luat_chi_khi_chua_co_nen: >
  MỘT phép quyết `chien_luoc_anh_bia(fm)` → None | "url" | "khung" | "pdf".
  LÕI dùng nó để quyết CÓ XẾP việc không; THỢ dùng CHÍNH nó để quyết chạy nhánh
  nào. Hai bên tự quyết là hai chỗ để lệch, và lệch ở đây nghĩa là gọi ra
  Internet cho một bản ghi ĐÃ CÓ ảnh — tốn lời gọi, và ghi đè một ảnh đang đúng.
  Trả None khi: đã có `image/*` · YouTube · không hiện vật render được · host
  ngoài allowlist. Không dùng chung được MÃ (Python/JS) nên dùng chung LUẬT, và
  cổng `7b`/`7c`/`7d` canh cho hai bản không trôi khỏi nhau.

