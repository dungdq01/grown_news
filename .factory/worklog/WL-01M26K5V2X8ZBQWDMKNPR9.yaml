cong_do_OAN_va_cach_va: >
  `check_khong_cham_kho` vế 3 gom mọi chuỗi `startswith("http")` rồi đòi chúng
  là loopback/bảng khai. `u.startswith("http")` của `chien_luoc_anh_bia` là một
  phép SO SÁNH SCHEME, không phải một URL — nhưng cổng bắt nó, và `M12-R1` báo
  "chưa có răng" cho một thay đổi không đụng gì tới kho.
  Vá: đòi thêm `"://" in n.value`. Mọi chỗ vế này ĐANG bắt đều có `://`, nên
  phép siết KHÔNG nới răng nào — và đã chứng minh: gieo
  `"https://ke-xau.example/…"` hằng trong mã ⇒ cổng vẫn ĐỎ.

