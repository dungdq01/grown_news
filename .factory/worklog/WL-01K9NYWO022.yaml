bug:
  - >
    `const s = String(un ?? "").toLowerCase()` rồi bóc id TỪ `s`. Chữ thường cần
    cho MỘT việc — so tên miền — nhưng nó được áp cho cả phần id, và id YouTube
    là base64url PHÂN BIỆT hoa–thường
  - >
    Đo trên byte đã build: `youtube.com/watch?v=dQw4w9WgXcQ` ⇒ id `dqw4w9wgxcq`,
    `src` iframe trỏ vào MỘT VIDEO KHÁC. Xác suất id 11 ký tự không có chữ hoa
    nào là `(38/64)^11 ≈ 0,0028` ⇒ **~99,7% video YouTube nhúng sai**
  - >
    `normalize_url()` phía Python làm ĐÚNG:
    `chu = duong.lower().split("/", 1)[0]` — hạ RIÊNG phần host. FE lệch với nó

vi_sao_70_cong_khong_keu:
  - >
    `dqw4w9wgxcq` VẪN khớp `^[A-Za-z0-9_-]{11}$`. `id_mau` hỏi *"id có đúng HÌNH
    DẠNG không"* và câu trả lời là CÓ — id sai vẫn đúng hình dạng. Đo HÌNH THỨC
    thay vì đo SỰ THẬT, đúng lớp lỗi đã gặp nhiều lần ở dự án này
  - >
    Ba file test nhắc `video_host` đều dùng id toàn chữ thường hoặc toàn chữ số.
    `tiktok` là số nên `.toLowerCase()` VÔ HẠI ở đó — bug ẩn sau đúng cái host
    duy nhất miễn nhiễm với nó. Cổng mới giữ một ca tiktok ở §5 để phép sửa
    không làm hỏng cái đang đúng

phep_do:
  - >
    Cổng chạy BYTE ĐÃ BUILD: cắt thân `idVideo` khỏi `gn.js` rồi `new Function`.
    Chép tay bản thứ hai là kiểm bản chép — nó luôn đúng vì tôi vừa viết nó
  - >
    So TỪNG KÝ TỰ với id kỳ vọng, không so `id_mau`: `id_mau` không phân biệt
    được đúng với sai, và đó chính là chỗ bug sống sót
  - >
    §3 kẹp phép sửa từ phía kia — `YouTube.COM/…` vẫn phải nhận ra host. Bỏ luôn
    `.toLowerCase()` thì §2 xanh mà §3 đỏ

hep_dung_pham_vi:
