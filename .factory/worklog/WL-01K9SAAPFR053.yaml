phat_hien_nang: |
  WO-042 · `api.chay(cong=0)` bind CỔNG THẬT 8790.
  `cong or cong_tu_bang_khai()` — **`0` là falsy**, mà `0` là cách POSIX nói
  "cho OS chọn cổng rảnh". Mọi cổng kiểm truyền `cong=0` đã dựng server trên
  cổng sản xuất. Và nó IM LẶNG: `HTTPServer.allow_reuse_address = 1`, trên
  Windows `SO_REUSEADDR` cho HAI socket bind cùng cổng thành công ⇒ không raise,
  kết nối có thể vào listener CŨ, listener đó đọc khoá từ env của NÓ ⇒ 403.
  ⇒ Kết quả cổng phụ thuộc "có ai đang giữ 8790 không" — nó KHÔNG đo thứ nó
  khai đo. `#cổng-đỏ-oan` + `#cổng-không-đỏ-được` trong một dòng mã.
  Sửa: `cong if cong is not None else …`.

hoc_duoc: |
  Bốn hướng chẩn đoán SAI trước khi đo đúng, và mỗi hướng bị loại bằng một phép
  đo (ghi đủ trong WO-042). Phép đo cắt được nút: thay `_tu_loi` thành
  `return True` vô điều kiện — ca "KHÔNG có khoá ⇒ 403" VẪN xanh, điều không
  thể xảy ra nếu server đang chạy mã đó ⇒ cổng đang nói với MỘT SERVER KHÁC.
  Bài học: khi một cổng đỏ mà mã không giải thích được, hỏi "nó đang nói với
  ai?" trước khi hỏi "mã sai ở đâu?".

  Ba lần tự gây đỏ vì escaping: chuỗi `\n` trong heredoc Python thành xuống-dòng
  THẬT, làm hỏng một regex JS và cắt một khối `>` của Markdown (khiến check_g6a
  báo AC-3.2 thiếu nhãn hard). Viết `\n` vào file thì dùng `chr(92) + "n"`.

