do_do_boi: chua-quy-duoc-chu

quyet_dinh:
  - |
      KHÔNG gõ tay 238 dòng. Danh mục gateway có 427 model và đổi mỗi tuần: gõ
      tay là 427 chỗ sai chính tả HÔM NAY, và một bảng nói dối THÁNG SAU. Nên
      bảng khai VẪN là nguồn chân lý (`M12-R4` + `AC-4.6` nguyên vẹn), chỉ khác:
      **máy ghi phần DANH MỤC, người giữ phần CHÍNH SÁCH.** Kết quả commit vào
      repo ⇒ runtime KHÔNG BAO GIỜ đọc mạng, và allowlist vẫn cố định.
  - |
      BẰNG CHỨNG ngay lượt chạy đầu: ba trong tám dòng gõ tay ở lượt một KHÔNG
      TỒN TẠI ở gateway — `claude-opus-4-1` (gateway dùng dấu CHẤM:
      `claude-opus-4.1`) · `claude-haiku-4-5` · `deepseek-reasoner` (gateway gọi
      `deepseek-r1`). Cả ba sẽ 404 GIỮA JOB. Không cổng nào cũ bắt được: cổng đo
      bảng TỰ NHẤT QUÁN, không đo bảng KHỚP THỰC TẾ.
  - |
      `kieu_structured` DẪN XUẤT từ `supported_parameters`, không đoán:
      `structured_outputs`→json_schema · `tools`→tool_use ·
      `response_format`→json_mode · không cơ chế nào ⇒ **BỎ DÒNG** (hợp đồng M12
      LÀ structured output — bày một model không làm được chỉ để job chết giữa
      đường). `nguong_lech_schema` tra từ `$bang_lech_schema` — không gõ số lần
      thứ hai.
  - |
      Đồng bộ KHÔNG ghi lên cột chính sách (`khu_vuc` · `du_phong` ·
      `la_mac_dinh` · `ngon_ngu` · `can_key` · `dich`). Một lệnh đồng bộ xoá
      được quyết định của người là một lệnh không ai dám chạy lần hai.
  - |
      `--kiem` KHÔNG tự sửa, chỉ trả 1 khi lệch. Một lệnh tự sửa rồi báo xanh
      là một lệnh không đo gì.
  - |
      HỘP THOẠI thay vì chèn vào cửa sổ đọc. Bản trước chèn `.bk-phieu` vào giữa
      thân và chân cửa sổ ⇒ ĐẨY nội dung đang đọc đi; với PDF nhúng thì khung
      xem co lại. `<dialog>` native cho focus-trap · ESC · backdrop · inert —
      trình duyệt làm sẵn và đúng hơn mọi bản tự viết. Dùng lại `.dlg` của
      `FR-022` + `.bt`/`.bt.pri` ⇒ 0 byte CSS mới cho khung.
  - |
      `la_mac_dinh` PHẢI đi qua hai cửa. Nó đang bị lọc ở cả `:8790 /model` lẫn
      `CHO_RA` của `web /api/model`, nên FE mở dòng ĐẦU của 238 dòng —
      `gemini-3.8-flash`, một model không ai chọn cho người dùng. Không phải bí
      mật: một quyết định đã khai, và `FR-053 §1.1` cho người THẮNG gợi ý —
      muốn thắng thì phải thấy gợi ý là gì.
  - |
      HOÀN LẠI một phép gộp CSS: gộp `.dlg .f-act …` vào sáu rule của
      `.bk-phieu` tốn 225 byte để dựng lại đúng thứ hệ đã có. Thay bằng `.bt` /
      `.bt.pri` — 0 byte, và đã audit tương phản.
  - |
      `chung-cat-ui.test.js` sửa CÙNG LƯỢT: mẫu `[^;]{0,120}` ĐỎ OAN khi nhánh
      có `e.preventDefault();` ở giữa. Hành vi không đổi. Mẫu mới đo mệnh đề
      thật: giữa `cc-gui` và `guiChungCat` KHÔNG có `fetch(` nào — tức nhánh đó
      gửi QUA `guiChungCat`, không tự dựng request.
  - |
      DỪNG ở ngân sách byte thay vì cắt thêm nội dung. Tải đầu
      `/chung-cat/nhap/` còn **5 byte**; ngay cả 24 byte trả lại khoảng cách cho
      `.cc-o` cũng không vừa. Đếm được **107 selector khai trùng** trong
      `gn.css` — đó là một đợt giảm béo riêng, không phải việc làm chen giữa.

