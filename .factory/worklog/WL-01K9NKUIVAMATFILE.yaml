    Gốc: `manTuUrl()` lấy `p.split("/")[0]` nên `/tai-lieu/nap/` cho `tai-lieu`
    và khớp màn danh sách; SSR đặt đúng, rồi `khoiDong()` GHI ĐÈ.
    Sửa: khớp CẢ đường, sắp theo độ dài giảm dần, lấy khớp dài nhất.
  - >
    CỔNG CỦA TÔI BỎ LỌT: `man-nap-rieng.test.js` §2 hỏi "khối có trong DOM
    không" — có mặt trong tài liệu ≠ được HIỆN. Thêm §5 canh HAI tầng: SSR
