su_co:
  gi_da_xay_ra: >
    Trong lượt kiểm hai chiều cho `manTuUrl`, tôi dùng `git checkout -- <file>`
    làm lệnh HOÀN TÁC. Người dùng đã dặn "bỏ qua git, tôi chưa cần push commit
    gì cả", nên cây làm việc chưa commit và `checkout` không lùi về "trước lúc
    phá" — nó lùi về commit 184514f, tức TRƯỚC cả FR-036.
  mat_gi: >
    `web/plugins/multiwindow/src/scripts/multiwindow.inline.ts` mất 21 hàm —
    toàn bộ FE của FR-036 (khung 5 mục · kho hiện vật) · FR-037 · FR-038/C5+C6a ·
    FR-039. Git không có đường lùi: `stash` rỗng, `fsck` chỉ trả hai dangling
    tree, không blob.
  khoi_phuc_tu: >
    `multiwindow.inline.js` — bản build ngay trước đó, 86 hàm đầy đủ. esbuild
    dùng `bundle:false` nên mã giữ nguyên hình dạng; ba bảng khai nằm ở ba dòng
    `var define_X_default` đầu file, thay lại thành `__KHUNG__`/`__MEDIA__`/`__MAN__`
    nên KHÔNG có bảng nào bị nhúng cứng.
  con_mat_that: >
    CHÚ THÍCH và KIỂU. esbuild lột cả hai. Ở dự án này chú thích chở LÝ DO nên
    đó là phần đắt nhất; 670 escape `\uXXXX` cũng phải de-escape lại (chỉ ký tự
    >= U+00A0 — đổi cả control range là đúng lớp lỗi 0x08 của B7b).
  bai_hoc: >
    `git` KHÔNG phải lệnh hoàn tác khi cây làm việc chưa commit. Phá/hoàn tác
    phải dùng bản lưu BYTE (`read_bytes`/`write_bytes`) rồi so sha256 — khuôn đã
    dùng ĐÚNG ở bốn lượt trước trong cùng phiên, và tôi bỏ nó ở lượt này.

