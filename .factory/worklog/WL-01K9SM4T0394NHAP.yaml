viec: |
  Màn triage cho bản nháp chưng cất, dùng LẠI chunk `chungcat` — nó là màn DƯỚI
  url module chưng cất, nên chunk của module đó là chỗ đúng cả về byte lẫn nghĩa.

  BA quyết định, tất cả từ một câu: ĐÂY LÀ MÀN NGƯỜI KÝ DUYỆT một bản do MÁY
  viết.
  1 · `⚠ đã tỉa N` dựng **TRƯỚC** cụm nút. Bản bị cắt bớt khẳng định mà không
      nói ra thì người duyệt ký vào bản đã bị tỉa và tin đó là bản đầy đủ.
      BA ca phân biệt: `>0` cảnh báo · `0` "không có" · `null` **"CHƯA ĐO"** —
      `null` và `{so:0}` đọc ra hai câu khác nhau.
  2 · Bản chưa ai sửa NÓI RA "Trùng bản AI gốc". Im lặng đọc ra như "chưa tải
      xong", và người sẽ đợi một thứ không bao giờ tới.
  3 · BA nút, không bốn. `FR-046 §1` chưa có trạng thái "đã bỏ" nên `T08-22`
      chưa mở cửa Xoá, và `S18` cấm render nút gọi đường chưa có.

