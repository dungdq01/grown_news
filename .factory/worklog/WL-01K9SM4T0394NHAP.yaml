  1 · `cat_khi_khac` MANG HAI NGHĨA và chúng va nhau LẦN THỨ HAI. (1) "cắt khỏi
      trang khác" — việc render; (2) "là màn NẠP" — thứ cụm `+ nạp` lọc theo.
      `T03-98` va lần một (`/dot-hai/` mọc trong `+ nạp`); lần này màn nháp CẦN
      nghĩa (1) nhưng không được nhận nghĩa (2).
      Tách bằng `cat_khi_khac && module` — chỉ màn NẠP mới có `module`, nên
      không phải thêm một cờ thứ ba.

  2 · `catMotMan` khớp CHUỖI MỞ chính xác `<div class="view" id="v-…">`. Mốc của
      tôi có `data-mount` ⇒ `indexOf` không thấy ⇒ view KHÔNG bị cắt ⇒ trang chủ
      vượt trần. **Không một thông báo nào** — chỉ một con số byte ở cổng khác.
      Ô nợ M03 ghi hai lối sửa.

  3 · Cổng tôi viết neo vào MỘT TÊN HÀM (`ccNhapDung`) mà mã đặt tên khác — lớp
      lỗi đã trúng SÁU cổng ở T03-104, và tôi tự tái phạm trong cùng phiên. Đổi
      sang neo vào MỐC `v-chungcatnhap`: shell khai nó, nên nó là hợp đồng thật.

  4 · Và một phép đo quét quá rộng: `review_status` trong CẢ mã FE trúng
      `ban.review_status = "approved"` của luồng duyệt bài KHO — một dòng hợp lệ
