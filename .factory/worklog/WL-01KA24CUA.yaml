quyet_dinh:
  - |
      ADAPTER THEO PHƯƠNG NGỮ, KHÔNG THEO CỬA và cũng không theo NHÀ. `cua.json`
      khai mỗi cửa kèm `phuong_ngu`; file adapter đặt tên theo phương ngữ.
      ⇒ thêm một cửa nói tiếng OpenAI (gateway khác, hay API gốc OpenAI) =
        1 dòng bảng khai + 0 FILE;
      ⇒ thêm một phương ngữ mới (Gemini native `:generateContent`, khoá ở query,
        thân `contents[]`) = 1 dòng + 1 file.
      Đúng yêu cầu "sau này dùng bên khác hay API chính đều dùng được".
  - |
      `cua.json` TÁCH khỏi `model.json`. `model.json` trả lời "gọi model NÀO",
      `cua.json` trả lời "gọi QUA ĐÂU". Gộp thì mỗi lần đổi cửa phải sửa 112
      dòng model, và thêm một model phải chép lại cấu hình cửa.
  - |
      Bảng khai chứa TÊN BIẾN MÔI TRƯỜNG, không chứa khoá. Một khoá trong file
      bảng khai là một khoá trong git, và `.gitignore` không cứu được thứ đã
      commit một lần.
  - |
      Dòng `google` (native) CÓ TRONG BẢNG dù chưa có file adapter. Nó ở đó để
      `phuong_ngu` là một cột THẬT chứ không phải trang trí: cửa đó chưa dùng
      được, và phép chặn (b) từ chối kèm tên đọc được — đúng thiết kế.
  - |
      Cửa lạ ⇒ NÉM, không rơi về mặc định. Rơi im lặng nghĩa là gửi tài liệu tới
      một nơi không ai khai. `kieu_auth` lạ cũng ném, không rơi về `bearer`:
      gửi khoá theo cách cửa không nhận cho ra một 401 không ai đoán được vì sao.
  - |
      `cua=None` KHÔNG đi tiếp xuống adapter — `goi_qua_adapter` đọc bảng khai
      khi không được truyền. Cùng lớp lỗi `tran=None` mà `AC-6.4` đã trả giá:
      `None["bien_khoa"]` là `TypeError` GIỮA JOB.
  - |
      STREAM gom về CÙNG hình dạng `choices[0].message.content`. Nó đổi ĐƯỜNG
      ỐNG, không đổi hợp đồng — `_boc` của adapter không phải biết mình đang đọc
      stream hay không. Một hàm bóc rẽ hai nhánh là hai đường về cùng một hợp
      đồng, và một trong hai sẽ mục.
      `AC-6.1`/`AC-6.2` KHÔNG bị ảnh hưởng: log ghi TRƯỚC khi gửi, `sha256` băm
      PAYLOAD GỬI ĐI. Cổng đo cả hai vế + "một lời gọi stream = ĐÚNG một dòng
      log, không phải một dòng mỗi chunk".
  - |
      `headers` KHÔNG vào dòng log. `gui()` đổ mọi `kw` lạ vào log, và headers
      chứa khoá API — một dòng `egress.jsonl` mang khoá là một khoá trong file
      mà `ADR-06` không cho phép xuất, và log này CÓ đường ra (bản lùi). Cổng
      đo bằng cách gieo một khoá thử rồi grep cả file.
  - |
      ASR: LÀM CẢ HAI LỐI, `dich_vu` ưu tiên 1. Nhưng chúng là HAI `loai` NGUỒN,
      không phải hai nhánh trong `asr.py` — `T12-16` khai "asr.py KHÔNG import
      egress, cổng canh bằng AST", còn lối `dich_vu` gửi audio RA NGOÀI. Gộp là
      phá đúng cổng đang canh, và mất câu "lối này có tiêu egress không".
  - |
      KHOÁ CHƯA THẤY. Chủ dự án nói đã note API key, nhưng `BEEKNOEE_API_KEY`
      không có trong env của shell này và không có file `.env` nào. ⇒ lời gọi
      THẬT chưa chạy; mọi phép đo ở trên là transport giả + `/v1/models` (đường
      mở, không cần khoá). Không hỏi khoá qua chat — dán khoá vào transcript là
      một đường rò.

