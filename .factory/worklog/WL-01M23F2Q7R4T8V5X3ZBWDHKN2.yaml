bay_tu_dat:
  - >
    Nối `hong` vào CUỐI tuple ⇒ `dong_viec` dùng `GIAI_DOAN[-1]` làm "xong" ⇒
    mọi việc THÀNH CÔNG bị đánh hong, loi rỗng. Hai cổng cũ đỏ ĐÚNG. Sửa bằng
    tên. Một vị trí không phải một ý nghĩa.
  - >
    `nhat_ky.ghi(loai, **truong)` một positional; tôi truyền hai ⇒ TypeError ở
    RÀNG BUỘC THAM SỐ, trước `try` trong thân — lời hứa "không ném" của ghi()
    không che được lớp này. Cổng chỉ đo phép CHỌN lối nên không bắt được; thêm
    vế CHẠY nhánh với LÕI giả.
  - >
    Tôi nói "28 phút audio rời máy không để lại dòng egress" — SAI. Egress có
    đủ dòng `loi_dung: cua-asr`; grep của tôi tìm ulid mà dòng egress không
    mang ulid. M12-R3 nguyên vẹn. Đính chính trong WO-066.

