wo_067_chay_lai_khong_co_duong: >
  Chủ dự án dán câu lỗi 502 kèm chính câu tôi viết trên màn: "chạy lại tiếp từ
  chỗ hỏng". Đo: THỢ chỉ có POST /job, LÕI không proxy POST /viec, FE 0 nút,
  `vong.chay_lai` có sẵn mà không ai gọi. Và có đường thì `phien_am` cũng chạy
  từ 0 (da_co=[]), tức lần gửi THỨ HAI — cũng là lần cuối — tiêu vào việc làm
  lại 13 phút đã đúng. Cộng: `chay_lai` không xoá lease, PID worker cũ còn
  sống ⇒ không ai nhặt trong 30 phút.
  Đã làm: THỢ `POST /viec/<ulid>/lai` (chỉ nhận `hong`, 409 khác) · `chay_lai`
  xoá lease · `phien_am(bat_dau)` + worker đọc file tiến độ ghép cue cũ · LÕI
  `cuaChayLaiViec` + router · FE nút "↻ Chạy lại từ chỗ hỏng (gửi n/2)" ·
  `no-write-path` khai `viec` như một QUYẾT ĐỊNH kèm lý do.
  KHÔNG tự thử lại 502 trong job: lần gửi thứ hai là của NGƯỜI quyết.
