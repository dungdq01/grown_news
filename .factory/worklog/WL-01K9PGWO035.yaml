nguyen_nhan_that:
  - >
    **§2 không phải `flex-wrap`.** Mốc `.f-chon` là một **`<span>` con trực tiếp
    của `.f-row`**, nên luật dành cho NHÃN của hàng —
    `.f-row > span{…justify-content:space-between}`, độ cụ thể `0-1-1` — **đè**
    luật của chính mốc (`.f-chon`, `0-1-0`). `flex-wrap` sống sót; `gap` bị thay;
    `justify-content` được THÊM vào. `flex-wrap` một mình không dàn hai mép
  - >
    Ba luật giẫm, không một: `prototype.css:1096` (`justify-content`·`display`·
    `gap`) · `:1465` (`display`·`gap`) · `:1524` `.f-nhom .f-row > span`
    (`display:block` ở ≥1200px). Dòng 1524 là lý do màn **bài viết** ở màn rộng
    không lộ lỗi — mốc bị ép `block` nên `justify-content` vô nghĩa, đổi lại mất
    luôn `gap` của chính nó. Dưới 1200px màn bài viết dàn hai mép y hệt

quyet_dinh_trung_tam:
  - >
    **Không sửa `.f-chon`, không bỏ `justify-content` khỏi luật nhãn.** Luật nhãn
    CẦN `space-between` để đẩy `<i class="f-opt">` sang mép phải hàng — bỏ nó là
    chữa triệu chứng bằng cách phá một thứ đang đúng. Sai ở chỗ luật nhãn **rơi
    trúng một phần tử không phải nhãn**, nên chữa bằng `:not(.f-chon)`: luật nhãn
    nói rõ nó nói về nhãn. 3 bộ chọn × 13 byte = 39 byte
  - >
    **Nút ra khỏi khối `hidden` là ĐƯỢC.** `#tv-meta`/`#vd-meta` chỉ hiện sau khi
    chọn file / dán link, nhưng hai hàm gửi đã có chốt riêng (`"Chưa nạp tài liệu
    nào."` · `LOI_HOST`) — nút bấm sớm trả lời được. Cùng lối WO-018 đã đưa mô tả
    và hai ô nhãn ra ngoài khối ẩn vì cùng một lý do
  - >
    **Cổng đo THỨ TỰ TRONG DOM, không đo có-mặt.** Phép kiểm "có nút `#tv-gui`"
    xanh y nguyên khi nút nằm giữa form — nó không thể đỏ vì lỗi này. Và bộ thuộc
    tính cấm ở §9 **suy từ luật `.f-chon`** chứ không gõ tay: thêm một khai báo
    vào `.f-chon` mà cổng không biết là một lỗ mở lại
  - >
    **§9 đo CẢ HAI VẾ.** Vế CSS một mình không nói được gì: luật nhãn chỉ giẫm khi
    mốc ĐÚNG LÀ `<span>` con trực tiếp của `.f-row`. Đổi mốc sang `<div>` cũng là
    một cách chữa hợp lệ, và lúc đó luật kia không còn là điều phải cấm

tu_bat_duoc:
  - >
    **Phép dò `document.styleSheets` đầu tiên trả 0 luật khớp** trong khi mốc rõ
    ràng đang bị đè. Lý do: Chrome cho CSSStyleRule một `cssRules` RỖNG (nested
    CSS), mà nó **truthy**, nên nhánh "đây là at-rule, đệ quy vào" nuốt mọi luật
    thường. Một phép đo trả rỗng mà không ai báo — đúng lớp "xanh vì mù"
  - >
    Cắt luật CSS trong cổng dùng **quét ngoặc theo độ sâu**, KHÔNG dùng neo
    `(?:^|[};])` như sáu chỗ khác trong `web/test/`: neo đó nuốt dấu `}` của luật
    liền trước nên chỉ thấy CÁCH MỘT luật (WO-027 đã trúng). Ở đây nó sẽ bỏ sót
    đúng một trong ba luật giẫm

