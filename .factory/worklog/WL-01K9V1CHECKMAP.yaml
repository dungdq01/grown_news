  48 thieu khoa `object`. Suot ca du an khong ai bao.

vi_sao_no_nguy_hiem_hon_THIEU_cong: >
  Day la mot khang dinh CHUA KIEM nam trong phan GIAI THICH cua mot cong.
  Thieu cong thi cung lam khong ai bao. Nhung mot cau noi "da co" thi ai doc
  check_map.py de biet cong nao da co se TIN NHAM — no khong chi im lang, no
  noi sai. Va no nam dung trong file duoc viet ra de chong lech.

do_CA_BON_khang_dinh_truoc_khi_sua_MOT: >
  Cau cu liet bon lenh la "da co". Toi kiem tung cai thay vi sua chi cai minh
  nghi la sai:
    <freeze-check>       -> check_frozen.py         CO
    <rule-surface-check> -> check_rule_surfaces.py  CO
    <pin-check>          -> check_version_pin.py    CO
    <worklog-check>      -> khong co                KHONG
  Dung ba, sai mot. Neu chi sua cai thu tu ma khong kiem ba cai dau thi co the
  phai sua cau nay lan hai — va lan hai thi khong ai con tin ca cau.

thay_cau_LIET_KE_bang_BANG: >
  Ban cu la mot cau van xuoi tron ba trang thai (da co / khong ap dung / chua
  cai) — de doc nhanh, de sai am tham. Thay bang bang 8 dong, moi dong mot lenh
  + file thi hanh + trang thai. Bang thi thieu mot dong la nhin thay duoc.

o_backlog_KHONG_doi_cong_khac: >
  O nay truoc ghi "sua cung luc voi viec cai <worklog-check>". Bo cach do:
  sua mot khang dinh sai la NGUONG RUT GON (khong WO), con cai cong la doi hanh
  vi (can WO). Gop hai viec la de cai RE cho cai DAT.

