# ══ PHAN DANG GIA NHAT ═════════════════════════════════════════════════
loi_la_gi: >
  check_map.py:7 xep <worklog-check> vao nhom "da co". SAI.
  core/tests/check_worklog.py canh web/**/WORKLOG.md (tai lieu — so dong CSS, so
