    ngu. Va `--fix` chi sua word_count, khong dien url_normalized.
  sua_hom_nay: "dien truong cho bai do bang chinh normalize_url() cua M01"
  chua_sua: >
    Cong 9 van ngu khi truong vang. Sua validate.py la doi hop dong CI => can FR
    rieng. Ghi vao no.
  chiMucMo_gop_theo_gi: >
    CO Y giu `fm.url_normalized` (loi khai), KHONG dung cot tinh lai cua index du
    cot do "dung hon" — hai duong doc phai tra CUNG ket qua.

