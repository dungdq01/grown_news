# ── Phan (1): DO, khong phong doan ────────────────────────────────────────
do_truoc_khi_liet_ke:
  cach_do: "grep moi loi goi doc dia trong web/api + khao sat 1 agent doc lai doc lap"
  so_lieu:
    - "9 loi goi docBai() — 7 nam tren duong GHI, chi 2 la doc thuan"
    - "5 cho goi quetKho() — 4 goi ngay docBai() cho tung bai => mo + parse N file/request"
    - "quetKho+docBai 7.546 ms/luot · khoDoc (index) 1.079 ms/luot · sinh_index ~430ms/luot"
    - "giu handle 0.206ms vs mo-doc-dong 0.594ms (duong dia 7.546ms)"

ket_luan_kien_truc: >
  DB cho DOC; file cho GHI va cho etag. Khong phai thu tuc — do la cho DUY NHAT
  bat duoc xung dot giua web va editor ngoai. `etag = sha256(FILE)`; lay tu index
  thi mot lan sua bang editor KHONG lam etag lech => If-Match mat rang =>
  lost-update im lang.

