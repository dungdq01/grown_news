# ── Bon bug do chinh toi gay ra o GD 3, va cach bat ──────────────────────
bug_toi_gay_500_ENOENT:
  hien_tuong: "DELETE roi GET /api/articles => 500 ENOENT"
  nguyen_nhan: "index con ban ghi cua file da sang _recycle/; theBai goi vanTay tren file khong con"
  sua: "khoDoc() loc existsSync — DIA THANG khi index va dia khong dong y"
bug_toi_gay_danh_sach_3_tren_4:
  hien_tuong: "restore roi GET => 3/4 bai"
  nguyen_nhan: >
    Hai lan capNhatIndex chong nhau va lan CHAM HON thang, nen index chot o
    trang thai truoc restore. `void capNhatIndex()` khong ai cho.
  sua: >
    Hang doi rieng cho index (khong dung tuanTu — do la mutex duong GHI, dung
    chung se giu mutex them ~430ms moi request) + co `_ban`: index KHONG dang tin
    tu luc kho doi toi luc dung lai xong; trong cua so do moi duong doc roi ve dia.
bug_toi_gay_EBUSY:
  hien_tuong: "EBUSY: unlink _index.sqlite — CA file test chet, khong chi do mot phep kiem"
  nguyen_nhan: "giu handle SQLite; sinh_index.py xoa roi tao lai file do"
  sua: "mo-doc-dong moi lan (0.594ms, van nhanh 12.7x so dia) + don kho tam co maxRetries"
  ghi_chu: "Tai hien duoc bang cach chay 3 test API SONG SONG — chay rieng thi xanh"
bug_toi_gay_cong_do_vi_ly_do_sai:
  hien_tuong: "check_index_dan_xuat do: WinError 32 khi unlink kb/_index.sqlite"
  nguyen_nhan: "3 `node server.mjs` dev dang chay giu file — khong phai index sai"
  sua: "cong chay tren kho TAM, khong tren kb/ that (KB_DIR)"

# ── Rang moi ─────────────────────────────────────────────────────────────
rang_moi:
  - >
    web/test/hai-duong-doc-khop.test.js (9 phep kiem) — HAI DUONG DOC PHAI TRA
    DU LIEU Y HET. Khong co no thi "index la dan xuat" chi la loi khai: tat index
    ma man hinh doi noi dung nghia la index da mang thong tin rieng.
    Kiem hai chieu: bo `WHERE luu_tru = 0` => do 3 phep kiem, goi ten dung nguyen nhan.
  - >
    check_index_dan_xuat.py khoi 6 (7 phep kiem) — tu gieo bai trung slug, ban
    luu tru, nhan trung. Kiem hai chieu: lui khoa ve `slug` => do 4 phep kiem.
  - >
    check_index_dan_xuat.py — "moi renameSync deu co banIndex() di kem".
    Ban DAU toi viet `count("banIndex()") >= 3` va no KHONG bat duoc khi toi bo
    mot loi goi: con 1 dinh nghia + 2 loi goi = 3, vua du nguong. Dem mot ten
    xuat hien bao nhieu lan la phep kiem yeu; hoi "moi renameSync co ban di kem
    khong" moi la phep kiem that.
  - >
    check_index_dan_xuat.py — BO COMMENT truoc khi so thu tu renameSync/capNhatIndex.
    Ban truoc do vi comment CUA TOI o dau file khop truoc lan goi that. Cung lop
    loi voi phep kiem quet hex bat gia tri trong comment.

# ── Loi trong kho phat hien khi doi chieu hai duong ──────────────────────
