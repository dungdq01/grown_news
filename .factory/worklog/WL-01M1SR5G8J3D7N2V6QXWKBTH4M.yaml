ba_loi_mot_goc: >
  Hệ coi MỌI việc là việc chưng cất, và coi MỌI hiện vật là thứ đáng chiếm chỗ
  xem trước.
  1. Video biến mất sau khi sinh transcript — `xemTruocHienVat` lấy cứng
     `media[0]`, mà `[0]` giờ là `.vtt`, nên hàm thoát sớm và nhánh vẽ trình
     phát không bao giờ chạy. KHÔNG mất dữ liệu (`url` YouTube nguyên vẹn);
     mất CHỖ.
  2. Cửa sổ việc gắn cứng nhãn "Chưng cất" cho mọi loại việc.
  3. Hàng nháp `0 nháp` — hệ quả của (2): việc transcript KHÔNG BAO GIỜ sinh
     nháp, mà câu kết chỉ mọi người sang hàng nháp bất kể loại. Nhãn nói dối,
     người đi theo nhãn tới một nơi chắc chắn trống, rồi báo là lỗi. Đúng là
     lỗi — chỉ không nằm ở hàng nháp.

xac_minh_bang_du_lieu: >
  Chủ dự án hỏi "mở nháp cũng chưa có bản nào là sao". Đo: hàng đợi có ĐÚNG MỘT
  việc từng chạy, loại `sinh-transcript`; sổ egress hôm nay 5/5 dòng đều
  `cua-asr`. Tức chưa lần chưng cất nào chạy — `0 nháp` là con số THẬT, và câu
  hỏi của chủ dự án hoàn toàn hợp lý vì nhãn đã chỉ sai đường.

quyet_dinh:
  - loc_theo_co_khong_go_cung: >
      Lọc hiện vật dẫn xuất bằng cờ `chi_dan_xuat` của `media-mime.json` — cờ ĐÃ
      CÓ SẴN cho `.vtt`, chỉ chưa ai đọc nó ở FE. Gõ cứng `text/vtt` thì loại
      dẫn xuất thứ hai (giọng đọc, tóm tắt máy) chiếm chỗ y hệt.
  - cong_bat_them_mot_tang: >
      `bang-khai-khong-mo` báo `chi_dan_xuat` bị LƯỢC khỏi bundle — nghĩa là
      phép lọc tôi vừa viết sẽ lặng lẽ VÔ HIỆU (`undefined` không đỏ ở đâu).
      Đã giữ trường lại trong bundle. Đó đúng là lý do cổng ấy tồn tại.
  - ba_tab_tach_bach: >
      Chủ dự án chốt: *"xem · chưng cất · transcript, tách biệt hoàn toàn"*.
      Tab "Xem" nay LUÔN có. Trước đó tab bản ghi chỉ dựng khi >1 bản, nên với
      bản ghi thường, bấm sang Chưng cất là MẤT ĐƯỜNG VỀ bài đang đọc.
  - hai_loi_vao_nhap_deu_mo_CUA_SO: >
      *xem bản nháp* ở cửa sổ việc, và bấm thẻ ở `/chung-cat/`. Rời trang là mất
      CẢ HAI cửa sổ — nguồn đang đọc và cửa sổ việc — mà cả điểm của flow là
      *vừa xem bản gốc vừa duyệt bản chưng cất bên cạnh*.
      Việc CHƯA xong vẫn mở panel chi tiết: chưa có nháp thì không có gì để đọc.
  - bam_the_thay_panel: >
      Panel "CHI TIẾT VIỆC" nói giai đoạn · model · lần gửi — mà RÊ CHUỘT đã nói
      đủ (`WO-048`). Cú bấm đang tiêu vào việc lặp lại một thông tin sẵn có,
      trong khi thứ người mở màn này muốn là ĐỌC và DUYỆT.

