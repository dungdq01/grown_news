tu_bao_loi_do_cua_toi: >
  Con số tôi báo ở lượt trước ("3032 vế, 0 FAIL" cho T03-116) là ĐO TRÊN BẢN
  DỰNG CŨ. Chú thích CSS tôi thêm chứa DẤU HUYỀN NGƯỢC, mà nó nằm trong một
  template literal — dấu ấy KẾT THÚC chuỗi, và `build-fe` chết từ đó. Tôi lại
  chạy build với `>/dev/null` nên NUỐT LUÔN thông báo lỗi.
  Hai bài học, cả hai của tôi: (1) không dấu huyền ngược trong chú thích nằm
  trong template literal — đã trúng một lần trước; (2) KHÔNG nuốt stderr của
  lệnh dựng: một lệnh dựng im lặng làm mọi phép đo phía sau nói về một vật
  không tồn tại.
  Đã đo lại trên bản dựng thật: 3041 vế, 0 FAIL.

