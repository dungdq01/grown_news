phu_thuoc_moi_can_ghi_o_README_trien_khai: |
  `typst` la MOT BINARY NGOAI, cai bang `winget install Typst.Typst` (hoac dat
  `TYPST_BIN`). Vang no thi `?dang=pdf` tra 503 va `?dang=in` van chay — nen no
  la phu thuoc MEM, khong chan khoi dong.
