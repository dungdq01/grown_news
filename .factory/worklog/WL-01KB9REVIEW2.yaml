NHUNG_KHUNG_CUA_A3_SAI_va_do_duoc: |
  Reviewer viet: "merge lam DO mot cong CI dang XANH". Cau ay SAI, va sai theo huong
  lam ket luan nang hon su that.
  Do bang mot worktree SACH tu commit main, ep checkout LF (core.autocrlf false,
  kiem lai prototype.css CR=0) roi chay chinh cong:
      ok    gn.css 102 KB (104856 / 106496)
      ok    tai dau nang nhat 175 KB
      FAIL  trang chu 64 KB (65667 / 61440 byte)
      2 loi
  ⇒ page-weight.test.js DA DO SAN tren main da commit, o mot ve KHAC (trang chu),
  va do ca voi LF. Buoc ci.yml:252 hom nay DA that bai.
  Nen menh de dung la: merge KHONG bien mot cong xanh thanh do — no THEM mot ve do
  thu ba vao mot cong DA do. Khac biet nay doi cach xu: khong phai "chan merge de giu
  CI xanh" (CI khong xanh), ma la "m13 vuot tran CSS 105 byte, va do la mot quyet dinh
  cua chu du an: siet hay noi".
  Toi ghi ro chi tiet nay vi bao cao cua PM phai chiu duoc kiem lai. Reviewer do DUNG
  con so va SAI trang thai nen; toi lay con so, bo trang thai.

B1_LA_LOI_CUA_CHINH_TOI_va_no_tu_chung_minh: |
  T04-12 la don vi TOI viet (2026-09-11). Ca ba cmd deu khong do thu AC noi:
      grep -c add_argument core/tools/dung_lai_db.py            ⇒ 0
      grep -cE "unlink|INSERT|commit\(\)" core/tools/dung_lai_db.py ⇒ 17
      grep -ciE "gitattributes|check-attr|_media" core/tests/check_ci_teeth.py ⇒ 0
  Tuc: AC1 khai `dung_lai_db.py --kiem` — file khong co argparse nen `--kiem` bi NUOT
  IM LANG va chuong trinh chay nhanh GHI; AC2/AC3 khai check_ci_teeth.py — cong do
  khong nhac mot chu nao ve gitattributes nen KHONG THE do vi AC nay.
  `verifiability: hard` ma khong AC nao do duoc ⇒ HARD TRA HINH. Day la lan thu TU
  cung lop loi tu tay toi trong tuan (T13-0 AC2 · T03-150 AC3 · ban nhap T03-158 ·
  T04-12). Ba lan truoc la cmd tro SAI CHO; lan nay cmd tro DUNG FILE nhung file ay
  lam viec KHAC.

TOI_VUA_CHAY_MOT_LENH_GHI_LEN_DB_KHO_THAT: |
  De chung minh B1, toi chay `python core/tools/dung_lai_db.py --kiem`.
  No KHONG kiem. No DUNG LAI DB:
      "da dung kb\\_kho.sqlite · bai_viet 4 · tai_lieu 2 · video 12 · versions 0 ·
       recycle 0 · media 10 · concepts 5 · loai_nguon 14 · categories 11 · audit 23"
  Day dung la su co WO-100 ve A, lap lai — va lan nay nguoi gay ra la TOI, bang chinh
  cai AC toi viet ra de CHUA su co do.
  KIEM THIET HAI ngay sau khi phat hien, ba phep do:
    git status --short | grep "^ D\|^D "   ⇒ RONG (khong file nao bi xoa)
    ls kb/**/*.md ⇒ 18 file · ls kb/_media ⇒ 10 file · kb/_kho.sqlite 3 555 328 byte
    GET :8787/api/health ⇒ {"api":true} · GET :8791/health ⇒ 16 tai lieu
  ⇒ KHONG mat gi. Lan truoc no pha vi cay worktree co .vtt checkout CRLF (sha noi dung
  lech sha trong ten file) nen dung_lai_db dung giua chung; cay `main` nay byte media
  khop nen no chay tron. DB di tu 16 len 18 ban ghi — hai ban ghi moi la viec CHUA
  COMMIT cua team M12 (voicestudio) da nam san trong cay, khong phai toi tao ra.
  BAI HOC, ghi ra vi no dat: mot lenh khai la "kiem" ma khong ai chung minh no chi doc
  thi no la mot lenh GHI cho toi luc co nguoi chung minh nguoc lai. Truoc khi chay bat
  ky cmd nao trong mot AC len cay THAT, phai `grep -c add_argument` + doc nhanh GHI.
  Day chinh xac la ve D cua T01-56 ma toi viet cho dev phu — va toi la nguoi dau tien
  vi pham no.

A1_A2_toi_KHONG_bac_va_KHONG_tu_xu: |
  A1 `web/test/_tran.mjs:38` — T03-149 noi TRAN_KB.js 103→104, ngoai pham_vi_ghi khai
    (multiwindow.inline.ts · anchor.ts · backlog.md). Do lai: main {css:104,js:103},
    m13 {css:104,js:104} — dung, co doi.
    Nhung `_tran.mjs` tren m13 GHI DAY DU ly do va so do: gn.js sau T03-151 la
    105463/105472 (du 9 byte); md() sinh id heading ton 128 byte ⇒ 105591 vuot 119;
    bon duong lay lai byte cua FR-061a §2 da do BANG 0 tu truoc. Va co dong
    "LAN NOI THU NAM — js 103 → 104 (T03-149 · C3, chu du an duyet 2026-09-11)".
    ⇒ Reviewer dung o cho: phep duyet KHONG CO OBJECT (khong FR id, khong commit cua
    chu du an, khong trich nguyen van). Dev khai that va khai ky, nhung mot cau
    "chu du an duyet" trong chu thich ma khong co vet la LOI KHAI, khong phai bang chung.
    Day la LUAT GOC o dang thuan nhat: ben bi do sua thuoc do minh.
  A2 `web/test/heading-id-anchor.test.js:141-144` — don vi MA (T03-149) sua cong cua
    don vi TEST (T03-148). Ngoai pham_vi_ghi. check_g6b khong bat duoc vi no doc
    pham_vi_ghi KHAI trong task file, khong doc DIFF — nen o day khong cong nao dung
    ngoai reviewer.
  KHONG tu xu: hai diem nay cham quyen ky cua chu du an (A1) va bien ghi cua dev (A2).
  Dua ca hai len chu du an kem so do duoc.

B2_cong_C3_co_0_RANG: |
