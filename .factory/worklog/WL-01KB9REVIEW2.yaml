  BLOB GIT (khong doc dia, nen khong dinh CRLF cua Windows):
      main  gn.css = 104856 byte  (CR trong nguon: 0)  tran 106496 ⇒ duoi 1640
      m13   gn.css = 106601 byte  (CR trong nguon: 0)  tran 106496 ⇒ VUOT 105
  Duong thu hai: chay chinh cong tren cay gn-m13 ⇒ FAIL gn.css 106837/106496.
  Hai duong cung mot chieu ⇒ m13 THAT SU vuot tran CSS.
  Nguon tang, do theo file: 05_uiux/tokens.css +0 · web/styles/prototype.css +1745 byte
  (19 dong .tim-*/#q — khoi CSS cua panel tim toan van, SCR-27). Day la chi phi THAT
