phat_hien_chan_duong: >
  Schema khoá `origin external ⇒ review_status const draft` VĨNH VIỄN — mọi bài
  external (toàn bộ hàng màn Chờ duyệt) không approve được ở ĐÂU CẢ, kể cả tay
  trong editor. Chỏi vòng đời M02 §2.2 và over-enforce M05-R1 ("khi ghi vào",
  không phải cả đời). Chưa từng lộ vì kho chỉ có 2 bài external draft.
  ⇒ FR-012 bỏ đúng khoá const, GIỮ citations>=2. Bất biến "external VÀO KHO ở
  draft" còn 3 răng: gate.py hardcode · test -k draft_external · M05-R1.

quyet_dinh_1_tach_B_C3_lam_hai: >
  "Web không ghi kb/" đang gộp bundle tĩnh (deploy được — giữ read-only tuyệt
  đối) với API biên tập local (M08, 127.0.0.1, người bấm). Đảo có điều kiện:
  chỉ vế sau được ghi, và mọi ghi qua validate.py --strict (M08-R2). B-B1 giữ
  nguyên bằng CẤU TRÚC: 3 trường M1 không có default trong code (M08-R3,
  api-guard quét literal) — máy không có gì để điền vào chỗ chỉ người trả lời.

quyet_dinh_2_POST_khong_qua_gate: >
  gate.py hardcode external + đòi citations_sampled>=2 — đúng cho hàng NHẬP,
  ép bài người tự viết khai man (M05-R2 "bịa có hệ thống"). Bài tự viết đi
  validate thẳng, origin manual, server áp draft. Hai cửa, hai loại hàng,
  một đích draft.

quyet_dinh_3_nut_duyet_o_cua_so_doc: >
  Không đặt nút duyệt ở hàng danh sách màn Chờ duyệt — đặt ở CHÂN CỬA SỔ ĐỌC:
  B-B1 tồn tại vì "chỗ duy nhất một người đọc thật", nút phải đứng cạnh nội
  dung vừa đọc. Duyệt từ queue = bấm bài (mở đọc) rồi duyệt trong cửa sổ.

quyet_dinh_4_dinh_danh_type_slug: >
  Route /:type/:slug ánh xạ 1:1 vào kb/<type>/<slug>.md — type enum đóng 6,
  slug whitelist [a-z0-9-]: traversal chặn bằng CẤU TRÚC. id vẫn trả trong
  payload nhưng không làm địa chỉ (tra id = quét cả kho mỗi request).

