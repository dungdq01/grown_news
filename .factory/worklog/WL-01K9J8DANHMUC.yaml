    - "web/plugins/home-pages/shell.html:319-324      6 <label> gõ tay ⇐ nguy nhất"
    - "05_intake/gate.py:51-52 · kb/README.md:57 · project_map.yaml:217  tài liệu"
  chi_mot_noi_doc_dong: "validate.py:53 đọc err.validator_value từ schema"
