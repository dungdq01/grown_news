    Sửa enum mà quên shell.html thì form hiện 6 giá trị cũ và KHÔNG test nào
    bắt. Cùng họ bug word_count (FR-015): hai nơi khai một sự thật thì sẽ lệch.

toi_noi_sai_va_da_sua:
  what: >
    Lượt trước tôi nói với người dùng "concepts vào công thức
    corroboration_factor — hai bài khác nguồn cùng nói idempotency thì đáng
    tin hơn", và dùng đó làm lý lẽ chính để bảo vệ rào chắn quanh concepts.yaml.
  do_lai: "grep corroboration core/src/ 05_intake/ 06_skillgen/ 07_curate/ → 0 hit"
  that_ra: >
    Không mã nào TÍNH nó. Nó là số LLM tự khai (enum 0.6|1.0|1.3|1.6), suy từ
    `independent_sources` đếm theo url_normalized (M02_kb/data_flow.md:46).
    Công thức chỉ sống trong M06_skillgen/spec.md:114-120, không trong code.
  hau_qua: >
    Lý lẽ mạnh nhất bảo vệ "concepts phải chặt" không có thật. Đã nói lại với
    người dùng trước khi đề xuất. Nếu sau này mở GĐ 2 thì FR phải nêu lý do
    THẬT: danh mục mịn trôi thì lọc mất nghĩa — đúng cái tags đã làm trước
    FR-009 (`quan-ly` tiếng Việt lọt giữa 11 tag tiếng Anh).

chan_ly_la_schema_khong_phai_yaml:
  quyet: "người dùng chọn — schema giữ vai chân lý"
  nghia: >
    kb/categories.yaml là bản DẪN XUẤT, phải khớp enum. Đối lập với
    kb/concepts.yaml — file đó là chân lý của chính nó. validate.py KHÔNG đổi
    hành vi: vẫn chặn bằng enum như hôm nay. Script chỉ đổi "lệch im lặng"
    thành "cổng đỏ".
  vi_sao_bo_aliases_khi_tao_file: >
    concepts.yaml có `aliases` (22 mục × ~3 ≈ 60 giá trị) mà KHÔNG mã nào đọc
    — validate.py:279 chỉ lấy {c["id"]}. Đó là code chết; nhân bản sang file
    mới là nhân bản nợ.

cong_may_moi_TU_BAT_LOI_THAT_ngay_luot_dau:
  ba_phep_kiem:
    - "categories.yaml ⇔ enum schema (thiếu/thừa/lệch thứ tự)"
    - "core/assets ⇔ core/skill-src — so RÀNG BUỘC, bỏ qua $comment/description"
    - "shell.html không còn <input value=...> nào của 6 giá trị"
  loi_that_bat_duoc: >
    Phép kiểm 2 ĐỎ ngay lượt đầu: core/skill-src còn `review_status: const
    draft` ở allOf[4] mà core/assets đã bỏ theo FR-012. Hai file TỪNG được sửa
    cho khớp một lần rồi (phiên trước, lệch 4 field) và đã lệch LẠI ở chỗ khác
    — vì không cái nào sinh ra từ cái kia, và bản thứ hai không nằm trong
    FROZEN.lock nên không ai canh.
  sua_thong_bao_sau_khi_thay_no_kem: >
    Bản đầu in "khối allOf khác nhau (assets 6 mục, skill-src 6)" — biết số
    lượng bằng nhau mà vẫn phải mở file mới biết lệch đâu. Sửa thành in đúng
    allOf[i] kèm điều kiện `if`. Đồng thời lọc $comment đệ quy: bản đầu báo cả
    allOf[0] chỉ vì khác ghi chú — báo giả.
  kiem_hai_chieu_ca_3_phep:
    - "thêm nhãn vào yaml không sửa schema → exit 1, báo `thừa [...]`"
    - "đổi minimum của word_count ở skill-src → exit 1, báo đúng tên property"
    - "gõ 1 checkbox vào shell.html → exit 1, báo đúng giá trị"
    - "phục hồi cả ba → exit 0"
  bai_hoc_ap_dung_tu_FR015: >
    Không `|| true`, exit code là của chính phép kiểm (check_rule_surfaces canh).
    Đo exit code KHÔNG qua pipe — lần đầu tôi chạy `| tail` và thấy exit=0,
    tưởng cổng nuốt lỗi; là pipe che, không phải cổng.

hai_no_don_kem:
  docDanhMuc_hardcode_kb:
    truoc: 'join(GOC, "..", "kb", "concepts.yaml") — không tham số'
    sau: "docDanhMuc(kho) dùng duongKho() đã có"
    chung_minh: >
      Thêm 1 mục vào kb-mock/concepts.yaml rồi build: bản mock đổi 10/22 →
      10/23, bản real GIỮ NGUYÊN 0/22. Trước đó cả hai đọc kb/. Hai file trùng
      nội dung (chỉ khác CRLF) nên chưa ra bug — đúng kiểu trùng khớp tạm thời
      của bug word_count.
  nguong_2_hardcode:
    truoc: "index.ts:493 `n >= 2` gõ tay"
    sau: 'docNguong("concept_merge_min", 2) đọc 07_curate/thresholds.yaml'
    vi_sao: >
      M07-R2 ghi rõ "sửa MỘT chỗ, không rải trong mã". File thresholds tự khai
      cả ba số là PHỎNG ĐOÁN và sẽ sửa sau khi nạp 10 bài thật — sửa file mà
      web vẫn báo theo số cũ là lệch im lặng.

bay_tu_phat_hien_khi_lam:
  what: >
    Đổi `#f-cat` sang nạp động thì dienForm() (tick checkbox theo fm.category)
    có thể chạy TRƯỚC khi danh mục tải xong ⇒ tick vào tập rỗng, mất category
    của bài mà không báo gì.
  vi_sao_truoc_day_khong_co: "6 checkbox là HTML tĩnh — tick lúc nào cũng đúng"
  sua: >
    Giữ promise DANH_MUC, dienForm() thành async và `await DANH_MUC` trước khi
    tick. Không dựa vào "doTimApi chạy sớm nên chắc kịp" — đó là đoán về timing.
  them: >
    napMotDanhMuc bỏ qua khi items rỗng — giữ "đang tải…" thay vì để trống trơn,
    vì trống trơn không phân biệt được với "API trả 0 mục".

