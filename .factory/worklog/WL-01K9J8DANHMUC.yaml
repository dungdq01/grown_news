  - core/tests/check_danh_muc.py            # MỚI — cổng máy 3 phép kiểm
  - core/skill-src/frontmatter.schema.json  # bỏ khoá const draft (drift FR-012)
  - web/api/articles.mjs · router.mjs       # GET /api/categories
  - web/plugins/home-pages/shell.html       # 6 <label> gõ tay → mốc động
  - web/plugins/home-pages/index.ts         # docDanhMuc(kho) + docNguong()
  - web/plugins/multiwindow/.../multiwindow.inline.ts  # nạp 2 danh mục
  - Makefile · .github/workflows/ci.yml · RUNNING.md   # nối cổng mới
  # KHÔNG đụng: FROZEN.lock · .claude/settings.json · frontmatter.schema.json
  # (bản core/assets) — đều thuộc GĐ 2, cần FR.

