viec: >
  Người dùng hỏi "nhãn gán từ danh mục có sẵn — muốn THÊM nhãn thì làm sao?
  CRUD trên web được không?", và yêu cầu thấy cơ chế lưu/get trước khi nghe
  giải pháp. Truy vết xong thì câu hỏi làm lộ ra vấn đề khác và nặng hơn:
  `category` KHÔNG CÓ nguồn chân lý dùng được cho web, nên 6 giá trị bị khai
  lại ở 5 nơi. Lượt này bịt lệch, CHƯA mở đường ghi (người dùng chọn GĐ 1).

pham_vi_ghi:
