r5_do_truoc: >
  check_nhat_ky_mot_ben_ghi.py viết TRƯỚC mã: lượt một ĐỎ 3/6 vế (tên file log),
  lượt hai ĐỎ 2 vế nữa (file pid) sau khi thêm §5. Xanh 10/10 sau khi cắm mã.
  check_rule_surfaces: ca G ĐỎ trước khi có nhánh tra thư mục task.
đỏ_do: >
  Không có đỏ của người khác trong lượt này. Hai vế đỏ đều do CHÍNH thay đổi
  này và đều là bug CÓ SẴN mà thay đổi làm lộ ra — quy chủ bằng đọc mã hai
  phía, không bằng suy đoán.
phat_hien_nang_nhat:
  - >
    KHOÁ CHỐNG WORKER MỒ CÔI LÀ MÃ CHẾT. `nhat_ky.bat("worker")` GHI
    `log/worker.pid`; `worker.chiem_khoa()` ĐỌC `log/worker-<id>.pid`. Hai nửa
    của MỘT cơ chế gọi nhau bằng hai tên ⇒ file khoá không bao giờ được ghi,
    phép đọc luôn thấy rỗng, luôn `return True`. Khoá này được viết ra SAU KHI
    một worker mồ côi gây đúng lỗi *"việc xong mà thiếu ket_qua"* (ghi chú ở
    worker.py:1174) — và nó chưa từng chặn một tiến trình nào.
    Vá: `nhat_ky.duong_pid()` là MỘT chỗ dựng tên, cả hai nửa gọi nó.
  - >
    NHÂN ĐÔI WORKER LÀM LỘ MỘT ĐUA TRONG NHẬT KÝ. `_tep()` đo độ đầy bằng
    `f.tell()` trên handle của chính tiến trình mình. Hai bên ghi chung một
    file ⇒ mỗi bên chỉ đếm phần mình (trần 8 MiB thành ~16), và bên nào xoay
    trước thì bên kia giữ handle cũ, ghi tiếp vào `.1` — đúng file mà lần xoay
    sau `unlink()`. Dòng mất, không ai báo, trong khi `nhat_ky` mở đầu bằng
    chính câu *"không nói là mình chỉ thấy một nửa"*.
    Vá: `worker-<id>.jsonl`, cùng lối đã chọn cho sổ egress.
  - >
    BẢN ĐỒ NÓI SAI HAI CHỖ MÀ KHÔNG CỔNG NÀO BẮT. `depends_on` của M12 và M03
    đều thiếu `M08_api`. `check_map` chỉ đối chiếu module ↔ thư mục, KHÔNG đối
    chiếu quan hệ. Đo bằng lời gọi thật: chungcat/src gọi /api/articles ·
    /api/loi · /api/nhap-chung-cat; FE gọi 14 cửa /api/*. `luat_rieng` của M12
    đã NÓI phụ thuộc ấy bằng văn xuôi ba dòng liền — một sự thật khai bằng văn
    xuôi thì không máy nào đọc được.
  - >
    CỔNG TỐ OAN: check_rule_surfaces báo M18-R5/R6 "rule mất răng" cho một cổng
    đang ĐỖ đúng lệ `.claude/rule.md` mục 8 (`T08-26b-cai-dat.test.js`, chờ mã
    T08-26). Checker không đọc được lệ của chính dự án. Vá bằng nhánh tra thư
    mục task; ca H giữ vế "không ở đâu cả thì VẪN phải đỏ".
