    trieu_chung: bon nut bien tap click vo dung
    goc: FE dung `/api/articles/<slug>`, route doi `<type>/<slug>` -> 404
    sua: them helper `duongBai(b)` = `source_type + "/" + slug`
    tai_sao_chua_xong: >
      Toi kiem HINH DANG loi goi fetch, khong kiem GIA TRI chay ra.
  lan_2:
    trieu_chung: y nguyen, nguoi dung bao lai
    goc: >
      `/api/index` (`chiMucMo`) da tra `slug` KEM tien to loai. `duongBai` cong
      them lan nua -> `repo/repo/hermes-agent` -> 404. Hinh dung, gia tri sai.
    sua: >
      guard bat bien — `slug.includes("/")` roi moi cong `source_type`,
      nen ap bao nhieu lan cung ra mot duong
    rang_moi: duong-api-khop-route §2c-bis — lay slug THAT tu /api/index, ap
              cong thuc cua FE, GET ket qua, va doi `duongBai` ap hai lan ra mot duong
  lan_3_lan_nay:
    trieu_chung: van "nut loai ko hoat dong" — anh chup o trang 03/09 va 06/09
    goc_1: >
      `w.cur` MANG HAI NGHIA. `tai()` dat no la chi so BAN (`bans[cur]`);
      `dongBo()` — chay MOI LAN CUON than bai — ghi de bang chi so MUC H2, dung
      con so "03 / 09" o chan cua so. Cuon toi muc 3 => `bans[2] === undefined`
      => ca bon nut bien tap `return` KHONG NOI GI.
    goc_2: >
      `.bk-f button` lay THEO VI TRI. Sau khi chan cua so tach hai hang, `.bk-f`
      chua ca hang nut bien tap (`[data-bt]` dung TRUOC hang meta), nen `f[0]` la
      nut **Loai**: `f[0].disabled = (muc === 0)` khoa dung nut Loai o muc 1,
      `f[1]` khoa nut Sua o muc cuoi, con ‹truoc/tiep› khong bao gio bi khoa.
    ca_hai_deu_do_toi: >
      goc_2 sinh ra tu chinh viec toi tach `.bk-f` thanh hai hang (FR-011 A4).
      Toi doi CAU TRUC DOM ma khong tim ai dang danh so vao cau truc do.

