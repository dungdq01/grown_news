quyet_dinh_2_lam_lo_mot_khac_biet_that: >
  Chủ dự án chọn "bài viết NÊN có File gốc". Lúc hỏi tôi cho đây là *hai tên
  cho một thứ* — SAI, và câu trả lời làm lộ khác biệt thật:
    `dang=md`  → THÂN BÀI, không frontmatter
    `dang=goc` → NGUYÊN FILE `.md` như trên đĩa, CÓ frontmatter
  Ai cần ĐỌC thì lấy `md`; ai cần NẠP LẠI ở kho khác thì cần frontmatter —
  thiếu nó thì bản ghi mất `id`, `nguon`, `category`, `concepts`. Đã cài `goc`
  cho cả bài viết lẫn nháp, dựng từ `fm` + `than` chứ KHÔNG đọc file trên đĩa
  (`FR-034`: DB là nguồn, file là export).

noi_pham_vi_khai_thang: >
  Bản khai định đặt nhánh `?in=1` ở `trang.mjs`. Đo ra KHÔNG đặt được: site chỉ
  có route theo MÀN (`VIEW_SSR[duong]`), không có route theo từng bài — đặt ở
  đó phải thêm một đường định tuyến mới ở `server.mjs`, hai file cho một trang.
  Đặt vào `xuat-cua.mjs`: cửa đã phân giải được bản ghi, và `xuat-dang.json` đã
  liệt `in` là MỘT DẠNG cạnh md/txt/docx — nhà sẵn có, 0 route mới.
  Đánh đổi nói ra, không giấu: một cửa `/api/` trả HTML, hơi lệch vai API/SSR.

hai_cong_neo_sai_cho:
  - markup_matches_css: >
      Chỉ soi `prototype.css`, nên tố oan mọi class có luật trong khối CSS TIÊM
      TỪ MÃ — chính cách `cctab`/`multiwindow` tránh trần `gn.css` (`FR-062`).
      Tính chất nó giữ là *không class nào thiếu luật*, không phải *mọi luật
      phải nằm trong prototype.css*.
      Sửa xong nó BẮT NGAY hai luật typography trong chunk chưa từng ai kiểm:
      `#cc-hv .hv-h b` và `#cc-hv dt` thiếu `--f-ui` (nhãn HOA phải dùng font
      giao diện — `TYPOGRAPHY.md` luật 3 / `FR-018`). Đã sửa.
  - ve_trang_in: >
      Vế "trang in nằm ở `trang.mjs`" hỏi NÓ Ở FILE NÀO, không hỏi nó có tồn tại
      và có sạch không. Chỗ đặt là quyết định thi công; tính chất mới là thứ
      cần giữ. Đổi sang đo: có nhánh `in` · tự gọi `window.print()` · 0 rail/menu
      · có `@media print`.

tran_byte: >
  Đặt CSS menu vào `prototype.css` đẩy `gn.css` lên 103140/102400 — VỠ 740 byte.
  KHÔNG nới trần (`FR-061`). Chuyển sang khối `TX_CSS` tiêm lúc dựng menu lần
  đầu: luật này chỉ dùng ở thanh chân CỬA SỔ ĐỌC, người chỉ lướt danh sách
  không bao giờ thấy nó. Sau khi chuyển: `gn.css` về đúng 102378.

vet_nho: >
  Bảng khai `xuat-dang.json` nhúng vào bundle ban đầu mang cả `$comment` —
  cổng `cat-binh-luan-js` bắt đúng. Đã áp `lotComment` như mọi bảng khác.
  Và tên dạng ban đầu là "Word (.docx)" trong khi menu đã hiện đuôi riêng ⇒
  "Word (.docx).docx". Bỏ đuôi khỏi TÊN.

