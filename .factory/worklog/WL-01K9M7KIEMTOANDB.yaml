      unlink se THANH CONG va de reader dang mo phuc vu mot DB BONG da bi xoa —
      te hon la that bai. Cung lam napLaiDb trong test la nguon flaky tiem an.
    duong_sua_ngan_nhat: "ghi ra .tmp roi os.replace, thay vi unlink tai cho"
