    duong_sua_ngan_nhat: "CHECK (review_status IN (...)) trong DDL, HOAC dung_lai_db goi validate"
  F2_dung_lai_db_unlink_DB_dang_song:
    do: >
      dung_lai_db.py:98 `duong.unlink(missing_ok=True)` — xoa chinh file DB roi
      dung lai. Voi mot writer khac dang giu khoa: chet 0.40s bang
      PermissionError WinError 32. xuat_kho.py cung tinh huong: exit 0 sau 0.17s.
    vi_pham_hop_dong_nao: >
      DDL dong 10 doi MOI connection dat busy_timeout=5000 va moi txn ghi dung
