quyet_dinh:
  - |
      BỎ ≠ XOÁ. Không cửa nào chạy `DELETE`. `ban_goc_ai` tốn token model để tạo
      và là thứ duy nhất trả lời "người đã sửa những gì" (`FR-046 §1` gọi nó bất
      biến); `rule.md` mục 4 cấm agent tự xoá; và một dòng `audit_loi` trỏ vào
      hàng đã biến mất là một vết vô nghĩa.
  - |
      HAI ca 409, hai lý do KHÁC NHAU — `da_duyet` (file đã trong `kb/`, bỏ hàng
      nháp không gỡ file ra ⇒ hai nguồn chân lý) và `da_bo` (một chiều). Trả cùng
      một mã nhưng hai câu, vì người đọc cần biết vướng cái nào.
  - |
      `da_bo` MỘT CHIỀU cưỡng chế ở CỬA, không ở `CHECK`: `CHECK` nói về GIÁ TRỊ,
      không nói về CHUYỂN TIẾP. Nên `cuaSuaNhap` cũng chặn — không thì "sửa" là
      một nút hồi sinh.
  - |
      Danh sách mặc định lọc bỏ `da_bo`; `tong` đếm CÙNG tập với `dong`. Hai câu
      lệnh đếm hai tập khác nhau là cách một badge nói dối ("5 việc", hiện 3).
  - |
      Di trú enum-4 → enum-5 đi qua `diTruLoi` đã có (`WO-044`), đo bằng SỰ VẮNG
      MẶT của `da_bo` trong DDL thật — không bằng một cột cờ "đã di trú": cờ đó
      là một lời khai. Cổng đo cả tính BẤT ĐỘNG lẫn việc trigger `ban_goc_ai`
      được dựng lại (trigger gắn bảng CŨ và chết theo nó).

