# ══ BA LAN MA CUA TOI SAI, CONG/TAI LIEU BAT DUOC ═══════════════════
sai_1_cache_handle: >
  Ban dau loidb.mjs giu mot bien `_db` cache. dungchung.mjs:208-210 DA GHI bai
  hoc nguoc lai: "MO-DUNG-DONG moi luot, khong giu handle" — giu handle thi
  EBUSY khi test don kho tam (Windows, loi cung) va handle tro inode cu
  (FR-023 GD 3). Da go TRUOC khi chay lan nao.

sai_2_SQL_ngoai_dungchung: >
  Ban dau loidb.mjs cam DatabaseSync => api-guard.test.js rang 2 DO
  ("moi mutation o dungchung.mjs").
  Cong dung, ma toi sai. Cau tra loi KHONG phai noi danh sach mien tru: bat bien
  "SQL o mot cho" la thu lam cau hoi *ai ghi duoc vao dau* tra loi duoc bang mot
  lan doc file. MOT DB THU HAI KHONG TU NO LA LY DO CHO MOT CUA SQL THU HAI —
  neu ngay nao la, do la mot FR.
  => dungLoiDb + 15 thao tac CO TEN vao dungchung.mjs; loidb.mjs con hang khai;
     loi-cua.mjs goi TEN, khong cam db tho.
  LOI ICH KEO THEO: rang buoc do ep dung thu M18 AC-3.1 doi — "dung MOT cho
  INSERT vao bang dinh danh" — thanh CAU TRUC thay vi ky luat. Dem duoc bang grep.

sai_3_binh_luan_pha_phep_dem: >
  AC-3.1 dem ra 2 thay vi 1. Cho thu hai KHONG phai ma — la BINH LUAN cua chinh
  toi co chua literal "INSERT INTO dinh_danh_kenh" de giai thich chokepoint.
  Dung loi cac-man-con-lai.test.js:117 da vap ("thu pha phep cat la mot binh
  luan cua toi co chua literal do").
  Da viet lai binh luan de KHONG chua cau lenh ra chu, va ghi ngay tai cho vi sao.

