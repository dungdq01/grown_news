# ══ Cổng cho một khoảng trắng do một cổng BỊ GỠ để lại ══════════════════════
#
# `hai-duong-doc-khop.test.js` retired ở FR-034, lý do ghi trong chính file:
# *"chỉ còn MỘT đường đọc (SELECT), không còn hai đường để so"*.
#
# Điều đó CHỈ ĐÚNG CHO KHO THẬT. `duLieuMock()` vẫn quét đĩa, nên `data.mjs`
# vẫn có HAI hàm dựng `Ban` — `banTuDb` (JSON từ DB) và `docTuDia` (parser YAML
# tự chế) — mỗi hàm một danh sách trường GÕ TAY. Từ FR-034 tới hôm nay KHÔNG
# cổng nào so chúng.
#
# Nói cách khác: một cổng bị gỡ đúng phần nó không còn canh được, và phần nó
# CÒN canh được đã rơi xuống đất mà không ai khai. Đây là lớp lỗi riêng của
# việc RETIRE một cổng — khác với lớp lỗi cổng mất răng.
#
# Hai việc, không một:
#   · thêm răng — `hai-ban-shape.test.js` so TẬP KHOÁ, HAI CHIỀU;
#   · bỏ chỗ để lệch — hai hàm giờ gọi CÙNG helper `hoSoVaMedia(fm)`.
# Cách chắc nhất để hai bản song sinh không lệch là để chúng dùng chung một
# cài đặt; cổng chỉ là lưới đỡ khi ai đó tách chúng ra lần nữa.

# ══ Ba quyết định về hình dạng ══════════════════════════════════════════════
#
# `ho_so` VẮNG ⇒ `"phan-tich"` — khớp `validate.py` và schema. Không bản ghi cũ
# nào phải sửa, và ba nơi cùng một mặc định.
#
# `media` VẮNG ⇒ `null`, KHÔNG `undefined` và KHÔNG `""`. Một hình dạng ổn định
# là thứ FE kiểm được bằng MỘT phép thử; ba kiểu rỗng khác nhau là ba nhánh ở
# phía FE, và nhánh thứ ba luôn là nhánh không ai viết.
#
# CHỈ nhận object. Parser tự chế của `docTuDia` đọc được block LIST (`- x`) và
# flow JSON, nhưng KHÔNG đọc được block MAPPING — `media:` + hai dòng thụt vào
# ra chuỗi rỗng. Trả `null` ở đó là NÓI THẬT, không phải che lỗi.
# HỆ QUẢ CHO B8: bản ghi `tai-lieu` trong `kb-mock/` phải viết FLOW JSON
# (`media: {"sha256": …}`). Viết block style là bản mock im lặng mất `media`.

# ══ Hai chi tiết của cổng, mỗi cái chống một cách xanh-vô-căn-cứ ═══════════
#
# 1 · Lấy HỢP KHOÁ CỦA CẢ TẬP, không lấy bản ghi đầu tiên: một bản ghi lẻ có
#     thể thiếu khoá vì giá trị `undefined` bị bỏ, và mẫu đó không đại diện.
# 2 · So HAI CHIỀU: thiếu ở mock = FE nhận `undefined` khi người dùng bấm MOCK;
#     thiếu ở real = điều đó xảy ra trên kho THẬT. Hai bệnh, hai dòng báo.
# Cộng một phép kiểm "tập khoá có ≥15 trường" — nếu hàm dựng `Ban` đổi hình
# dạng thì phép so tập khoá có thể so hai tập RỖNG và vẫn xanh.

