    TÌNH CỜ đóng đúng chỗ nên hai màn đó "xanh" trong khi cùng lỗi
  - >
    Escaping tiếp tục cắn qua `bash -c`: backtick trong chuỗi kép bị thay-thế-lệnh
    (mất thân hai khai báo), `</div>` bị đọc thành chuyển hướng

