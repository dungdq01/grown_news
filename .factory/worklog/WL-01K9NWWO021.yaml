hai_quyet_dinh_cua_nguoi_dung:
  - >
    BỎ CHẶN. Cổng module không còn đòi chủ đề + khái niệm cho tài liệu/video.
    Đây là ĐẢO chính quyết định của họ ở T08-17, nên tôi hỏi lại trước khi gỡ.
    Hệ quả đã nói ra: facet Chủ đề sẽ rỗng dần nếu bỏ qua thường xuyên
  - >
    GỠ ĐÚNG BA NHÓM họ kể — `Mã bài` · `Tên đường dẫn` · `Tín cậy tối đa` ·
    `Mức đầy đủ`. GIỮ `Ngày phân tích` và `Loại nguồn` vì họ không kể, và loại
    nguồn là nội dung thật (nó quyết bản ghi vào bảng nào)

format_chung:
  - "① thứ đang nạp · ② Tiêu đề · ③ Tóm tắt · ④ Mô tả · ⑤ Chủ đề + Khái niệm"
  - >
    Hai màn kia CHƯA CÓ `Tiêu đề` — thêm mới. Cổng đo TẬP GIAO và TẬP HIỆU chứ
    không đo "có ô X": thêm ô cho một màn mà quên hai màn kia thì phép kiểm
    có-mặt vẫn xanh
  - >
    Bốn trường gỡ khỏi form nhưng VẪN vào payload — schema đòi cả bốn. Gỡ ô mà
    quên tự điền thì mỗi lần bấm Ghi là 422, và 422 đó tới SAU khi người dùng gõ
    xong cả form. `FM_GOC?.x ??` giữ địa chỉ bất biến khi SỬA (M08-R5)

sai_lam_nang_nhat_cua_luot_nay:
  - >
    BỌC MARKUP HAI CỘT LÀM HỎNG SHELL, và mất SÁU LƯỢT vá mới về lại được.
    Gốc: lát cắt lấy mốc chia là chuỗi ĐẦU TIÊN trong cả VIEW, nên khối mở ở
    panel `link` và đóng ở panel `file`
  - >
    VÌ SAO KHÔNG PHÁT HIỆN SỚM: phép đếm thăng bằng thẻ vẫn +0. **Cân bằng đạt
    được ở SAI CHỖ vẫn là cân bằng** — đếm thăng bằng KHÔNG chứng minh được cấu
    trúc. Và phép đi độ sâu của tôi báo "ba view đóng sạch" vì độ sâu về 0 ở một
    thẻ đóng khác
  - >
    Thứ CUỐI CÙNG bắt được nó là `chu-giao-dien`: tổng chữ 577 > 480, vì ba dòng
    `dừng ở bản nháp` của CẢ BA màn rò ra ngoài view ⇒ hiện trên mọi trang. Một
    cổng đếm CHỮ tìm ra một lỗi CẤU TRÚC
  - >
    ĐỔI HƯỚNG: bỏ hẳn wrapper, làm bố cục bằng CSS thuần (`margin-inline:auto` +
    `max-width`). Ở CSS thì sai chỉ sai hiển thị, không hỏng DOM

bo_cuc:
  - "Đo được: `.f-row` max-width 600px trong panel 1344px ⇒ trống 715px = 53%"
  - >
    KHÔNG kéo ô nhập rộng 1344px — một dòng chữ dài thế thì mắt mất hàng khi
    xuống dòng, và `max-width` tồn tại vì lý do đó. Vấn đề là chỗ TRỐNG
  - >
    Khối giải thích cuối màn nằm NGOÀI `.np-p` (anh em của nó trong `section`),
    nên nếu không căn thì màn có HAI mép trái — đo được: form x=488, khối giải
    thích x=315

tu_bat_duoc:
