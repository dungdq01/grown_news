  Tôi gõ `check_frozen.py --ky` (56 file). Chữ ký là CỦA CHỦ DỰ ÁN; agent chỉ
  gõ lệnh. `R2` không đổi nghĩa: agent vẫn không tự nhận xong, không tự duyệt.
  Đã nêu ranh giới này một lần ở lượt trước và chủ dự án tái khẳng định.

deny_mot_cua: >
  Lần sửa `rules.md` đầu bằng Bash bị hook chặn — ĐÚNG. `rules.md` FROZEN,
  `#deny-một-cửa` cấm vòng qua deny bằng Bash. Đi lại bằng `Edit`, cửa chính.

bon_cong_do_oan_da_sua:
  - id: chú thích chứa chữ "test"
    goc: >
      `check_g6b §5` so `"test" in <cả dòng phạm_vi_ghi>`, mà dòng đó là
      `<đường> # <chú thích tiếng Việt>`. Một chú thích TỐT ("đăng ký cổng nếu
      sinh test mới") làm task đỏ ⇒ cổng phạt người viết rõ ràng.
    sua: so trên phần ĐƯỜNG DẪN, cắt sau dấu `#`
  - id: nhận diện đơn vị test bằng TÊN FILE
    goc: >
      `T04-6` (răng thật cho rule-surface) và `T08-23` (cổng db-dùng-chỗ) có
      phạm vi ghi CHỈ gồm một file cổng — chúng LÀ đơn vị test, chỉ không có
      chữ "test" trong tên. Ngược lại, một task ghi cả mã lẫn cổng chỉ cần
      thêm chữ "test" vào tên là lách được.
    sua: >
      nhận diện bằng PHẠM VI (`mọi đường trong phạm_vi_ghi đều là file cổng`)
      — thứ không đổi được bằng cách đặt tên. Đã thử ĐỎ: task ghi cả mã lẫn
      cổng vẫn bị bắt.
  - id: ký tự BACKSPACE vô hình trong regex
    goc: >
      Tôi ghi `_MA = re.compile(r"\bMÃ\b")` qua một chuỗi KHÔNG-raw, nên `\b`
      thành ký tự 0x08 THẬT nằm hai đầu regex. Dòng đó nhìn bằng mắt đọc y hệt
      dòng đúng; `_MA.pattern` in ra cũng y hệt; chỉ `cat -A` mới lộ `^H`.
      Hệ quả: `_MA` không khớp gì, phép kiểm "phụ thuộc treo" IM LẶNG thành mù.
    phat_hien: >
      Không phải nhờ đọc mã — nhờ thử ĐỎ. Tôi cắm một mã bịa `T99-404` và cổng
      vẫn xanh. Nếu tin vào "23 → 14 lỗi, xong" thì đã bàn giao một cổng mù.
    sua: viết lại dòng không dùng `\b`; quét cả repo, không file nào khác dính
  - id: enum `xem_truoc` thiếu `van-ban`
    goc: >
      `.md`/`.txt` (T03-111) khai `xem_truoc: van-ban` và KHÔNG có `magic` —
      văn bản thuần không có magic byte, và bảng ghi rõ lý do. Cổng đòi mọi
      dòng có `magic` + enum ba giá trị ⇒ đỏ oan một quyết định đã khai.
      Chính cổng ấy đã học đúng bài này một lần với `.vtt`; đây là lần thứ HAI.
    sua: >
      miễn theo TÍNH CHẤT SUY ĐƯỢC (`xem_truoc == "van-ban"`), không theo danh
      sách mime chép tay; thêm chiều NGƯỢC: khai `van-ban` mà có `magic` là
      khai mâu thuẫn, cũng đỏ.

loi_that_da_sua:
  - id: validate.py đi lạc vào kb/_media/
    goc: >
      `is_analysis` chỉ xét TÊN FILE bắt đầu bằng `_`, không xét THƯ MỤC. Từ
      khi `.md` được nhận làm nguyên liệu, một file upload tên
      `cd31…c55c.md` trong `kb/_media/` lọt qua ⇒ `validate.py kb/ --strict`
      đỏ vì "không có frontmatter", mà bản upload thô KHÔNG có frontmatter là
      đúng — nó chưa được chưng cất. Kéo `check_running` đỏ theo.
    sua: xét cả thư mục cha; kb/ từ 1 lỗi → 0 lỗi
  - id: /chung-cat/ sai nhóm menu
    goc: >
      Tôi thêm nó vào nhóm NỘI DUNG. Nhóm đó là hợp đồng ba-module: Tổng hợp +
      ĐÚNG ba loại (bài viết · tài liệu · video). Thêm mục thứ năm làm người
      đọc menu tưởng có loại nội dung thứ tư.
    sua: về nhóm `hethong`, cạnh Kho và Danh mục — nơi người LÀM VIỆC với kho
  - id: đếm `lan_gui` trùng
    goc: >
      Tôi thêm `q.ghi_nhan_gui(ulid)` vào lối ASR, nhưng `worker.py:414` ĐÃ gọi
      sẵn. Grep trước đó của tôi tìm chuỗi `lan_gui` — tên hàm là `ghi_nhan_gui`,
      không chứa chuỗi ấy. Đã gỡ lần đếm thừa.
    tu_sua_loi_khai: >
      Ô backlog tôi ghi lượt trước ("R6 chưa có răng, không ai gọi") là SAI.
      Đã sửa ô đó thành lời khai đúng thay vì để một câu sai nằm trong sổ.

