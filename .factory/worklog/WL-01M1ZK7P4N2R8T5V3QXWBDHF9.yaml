dao_cau_1_va_gia_cua_no: >
  Chủ dự án nhìn màn thật rồi ĐẢO câu 1: *"tài liệu và bài viết chưa có"* ⇒ MỌI
  loại có nền, không chỉ video + tài liệu. Lưới đều một nhịp thắng lý lẽ
  *"khung trống là hứa hão"* của wireframe.
  Cài bằng thứ RẺ NHẤT có thể: thẻ ĐÃ mang `--c: var(--c-<source_type>)`, nên
  `.cd-n` đọc `var(--nm, var(--c))` và bài viết + video có màu riêng với **0
  byte HTML thêm**. Chỉ TÀI LIỆU trả byte cho `--nm`, và đó là ngoại lệ THẬT:
  `source_type` của cả 5 định dạng đều là `tai-lieu` nên `--c` nói *"tài liệu"*
  chứ không nói *"pdf hay docx"*.
  Bỏ luôn luật `[data-pl=video] .cd-n{--nm:var(--c-video)}` — nó là bản THỨ HAI
  của một sự thật `--c` đã mang.
  Thêm `--c-docs` + `--c-announcement` (hai `source_type` chưa có màu; ba loại
  bài viết còn lại đã có sẵn).

