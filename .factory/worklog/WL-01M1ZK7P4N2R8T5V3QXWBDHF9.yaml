hai_smell_cua_chinh_toi_cong_bat_duoc:
  - >
    HAI luật `.cd-n{}` chồng nhau — đúng lớp lỗi mà khối `.cd` ở trên đã phải
    viết một đoạn chú thích để bào chữa. Đổi sang selector CÓ PHẠM VI
    (`.cd:has(.cd-n) .cd-n`), giữ `.cd-n{aspect-ratio:4/3}` làm đường lùi khi
    `:has()` không được hỗ trợ.
  - >
    Vế `7a2` đếm luật bằng `/[\s}]\.cd-n\{/` — nó khớp CẢ
    `.cd:has(.cd-n) .cd-n{` (dấu cách trước) nên đếm 2 và TỐ OAN. Sửa: so
    SELECTOR nguyên vẹn. Một cổng đỏ oan dạy người ta bỏ qua cổng.

