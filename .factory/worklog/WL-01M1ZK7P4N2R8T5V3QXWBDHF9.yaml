gon_the_vong_hai: >
  Chủ dự án sau khi nhìn màn: *"hạ height, tỉ lệ ảnh nền và vùng text 6/4, cho
  nhỏ text hơn, design lại cho gọn"*, rồi chỉ tiếp *"phần footer của tab chiếm
  nhiều diện tích quá"*. Ba việc, mỗi việc một lý do đo được:

  · CHIỀU CAO CỐ ĐỊNH `17.375rem` = **278px**, KHÔNG `aspect-ratio` trên `.cd` — aspect-ratio
    nhân theo BỀ RỘNG cột (`minmax(15rem,1fr)`), nên ở màn 1600px cột rộng
    ~290px và thẻ cao lại ~313px, tức đúng cái đang phải hạ.
  · BADGE loại ĐÈ LÊN ảnh. Vòng đầu 40% (102px) không đủ cho badge + tít 2 dòng
    + meta + chip: **tít bị cắt NGANG DÒNG** — lỗi tệ nhất trong ba, vì người
    đọc mất CHỮ chứ không chỉ mất chỗ. Badge là thứ duy nhất trong bốn không
    cần một dòng riêng.
  · FOOTER MỘT DÒNG. `.mt` và `.cts` là hai hàng liên tiếp, ăn ~34px trong vùng
    chữ ~90px — footer ngốn gần một nửa vùng chữ để nói hai mảnh siêu dữ liệu.
    Neo cả hai vào đáy thẻ: chip trái, tin cậy phải, cùng một dòng ~16px.
    Neo tuyệt đối chứ KHÔNG đổi thứ tự DOM: đổi thứ tự là sửa `the()`, mà
    `the()` còn phục vụ lưới trang chủ (không nền).
  · `:has(.cd-n)` chứ không áp cho mọi `.cd`: lưới TRANG CHỦ chạy `coNen=false`
    nên thẻ ở đó không có nền — ép chúng cao 14rem là một ô trống 90px không
    nói gì. Không có nền thì cao theo nội dung, như trước.

