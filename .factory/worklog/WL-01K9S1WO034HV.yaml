  THOAT RA, khong phai keo cot chu rong ra.
  => cong hoi HAI CHIEU: `.hv` co doc `cqw` khong, VA `.doc` co CON chan khong.
  Hai phep kiem chieu nguoc XANH SAN luc cong con do — do la bang chung chung
  khong do oan.

