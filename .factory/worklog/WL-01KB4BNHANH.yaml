mot_chu_khac_chi_dao_va_vi_sao: |
  Chu du an noi "tao branch M13-gn". Toi de nghi GIU `m13` dang co, khong tao them:
   - `m13` da co 2 commit dung cach (T01-52 do truoc, T01-51 xanh sau, R5 cung entry
     WL-01M24GPRW2 cua dev), worktree da dung, dev dang lam o do.
   - Hai nhanh cho mot module la hai cho se lech — dung lop loi "hai ban mot luat".
   - Chuan ten `m<NN>` de nhanh cua module nao doc ra ngay; `space` la ngoai le vi
     khong danh so.
  Ghi thanh luat (rule 17) + decisions + memory. Neu chu du an van muon ten `M13-gn`
  thi la mot lenh `git branch -m m13 M13-gn` — doi TEN, khong tao nhanh thu hai.

remote: |
  Repo chua co remote ⇒ ve "push" trong chi dao chua thuc hien duoc. Toi KHONG tu
  `git remote add`: khong co URL, va do la ha tang cua chu du an. Ghi ro o rule 17 va
  BAN-GIAO-DEV de dev khong tuong "da push". Cho toi khi co remote, nhanh chi song
  local — mat may la mat nhanh.

anh_huong_nhanh_khac: |
