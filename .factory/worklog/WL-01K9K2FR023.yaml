viec: >
  Phase 3 của upgrade.md: "thêm database" + "không để sau mỗi lần phải run build
  và api nữa". Người dùng chọn "DB làm nơi LƯU chính" và "làm hạ tầng song song,
  nạp bài sau", rồi "ok làm luôn". GĐ 2 của plan: SQLite làm index DẪN XUẤT.

pham_vi_ghi:
  - core/tools/sinh_index.py               # sinh kb/_index.sqlite tu kb/**/*.md
  - core/tests/check_index_dan_xuat.py     # 4 rang: dung lai duoc · mot chieu · khong phai nguon · dung parser M01
  - web/api/dungchung.mjs                  # capNhatIndex() goi SAU renameSync
  - .gitignore · Makefile · .github/workflows/ci.yml · RUNNING.md
  - 06_modules/M02_kb/spec.md §2.1 · 06_modules/M02_kb/rules.md M02-R2
  - 06_modules/M08_api/spec.md §2.1 (hang GET /api/index)
  - 04_system/adr.md (muc "ĐÃ ĐỔI — FR-023" duoi ADR-04)
  - FROZEN.lock (ky lai, 27 file)

khong_vien_dieu_kien_cu: >
  ADR-04 mở cửa cho index khi "vượt vài trăm file mà build chậm". Kho có 3 bài,
  build 669ms — điều kiện đó CHƯA thoả và FR khai thẳng như vậy. Lý do thật:
  bỏ readdirSync + parse YAML mỗi request (GET /api/index của FR-024 chạy
  thường xuyên hơn build), và mở chỗ cho truy vấn gộp/đếm. Viện một điều kiện
  chưa thoả là làm hỏng ô "Đổi thì" cho lần sau.

khong_dependency_moi: >
  sqlite3 là stdlib Python (3.13.7), node:sqlite built-in ở Node 22.20.
  security_baseline §7 không bị vướng — đã kiểm cả hai trước khi viết dòng nào.

ba_tinh_chat_co_rang:
  dung_lai_duoc: >
    Chạy sinh_index.py hai lượt phải ra dữ liệu Y HỆT. Đo được:
    "lan 1: 3 ban · d747439db4e58ce0" / "lan 2: 3 ban · d747439db4e58ce0".
    Đây là AC hard của B-C1; đỏ nghĩa kiến trúc hỏng, không phải bug cần sửa.
  mot_chieu: >
    Quét tĩnh: không write_text / open( nào trong sinh_index trỏ vào .md, và
    capNhatIndex() phải nằm SAU renameSync. Kiểm chiều ngược bằng cách đảo thứ
    tự gọi → cổng exit 1.
  khong_phai_nguon: "xoá index rồi dựng lại, số bản ghi không đổi"

hash_noi_dung_khong_hash_file: >
  bam_noi_dung() băm NỘI DUNG BẢNG, không băm file .sqlite. File sqlite nhúng
  timestamp và page layout nên hai lượt sinh cùng dữ liệu vẫn ra hai hash khác
  nhau — băm file thì phép kiểm quan trọng nhất sẽ đỏ vì lý do sai.

khong_viet_ban_dem_thu_hai: >
  sinh_index.py import count_words, normalize_url, normalize_yaml,
  split_frontmatter TỪ validate.py. M05-R3: hai bản đếm sẽ lệch nhau im lặng,
  và bản lệch không ai biết là bản nào đúng.

# ── Bug thật tìm thấy khi chạy bộ test sau khi wiring ────────────────────
bug_chi_muc_thieu_trang_thai:
  hien_tuong: "FAIL real · Tất cả: 3 thẻ, 2 bấm được"
  chan_doan: >
    KHÔNG phải do FR-023. Emitter gom chỉ mục từ [...appr, ...draft, ...rej] —
    thiếu `edited`, trạng thái thứ tư của M02 §2.2. Bản edited rơi khỏi chỉ mục
    ⇒ iCua() trả -1 ⇒ thẻ không có data-open ⇒ bấm không mở được gì. Đúng lỗi
    số 1 mà comment ở dòng 420 đã ghi, nhưng với một trạng thái khác.
  vi_sao_ngu_lau: >
    Bug có từ trước. Nó chỉ lộ khi kho CÓ bản edited — và bản edited đầu tiên
    xuất hiện đúng lượt này (PUT bài docs/ qua API làm approved → edited).
    kb-mock không có bản nào edited nên 13/13 thẻ mock vẫn xanh. Lại đúng lớp
    lỗi quen: "dữ liệu mẫu không phủ hình dạng dữ liệu thật".
  sua: "gom từ `tatCa` (cả kho) thay vì liệt kê tay ba trạng thái"
  rang_moi: >
    open-card.test.js thêm phép kiểm GỌI TÊN trạng thái nào rơi ngoài chỉ mục,
    thay vì chỉ báo một con số lệch. Kiểm hai chiều: lùi code → đỏ với
    "trạng thái không vào chỉ mục: edited"; sửa lại → xanh.

evidence:
  - "cd web && npm test → exit 0, 29/29 file xanh, 0 FAIL"
  - "node test/open-card.test.js → 'real · Tất cả: 3 thẻ, 3 bấm được' (trước: 2)"
  - "python -m pytest core/tests -q → 30 passed"
  - "12/12 cổng check_* exit 0, gồm check_index_dan_xuat và check_frozen (đã ký, 27 file)"
  - "sinh_index.py --kiem → hai lượt cùng hash d747439db4e58ce0"

moi_truong_phai_ghi_lai: >
  `make` KHÔNG có trên máy này — phải gọi từng cổng. Và `python` mặc định trỏ
  vào venv hermes: có jsonschema, THIẾU pytest. Bản đúng theo ADR-02 là
  C:/Users/Admin/AppData/Local/Programs/Python/Python313/python.exe (3.13.7,
  pytest 9.1.1). Thêm nữa: stdout cp1252 làm 9/12 cổng ném UnicodeEncodeError
  khi chuyển hướng ra file — phải đặt PYTHONIOENCODING=utf-8. Ba thứ này làm
  cổng đỏ vì LÝ DO SAI; ghi lại để lần sau không chẩn đoán lại từ đầu.

no_con_lai:
  - >
    check_running ĐỎ, đúng một mục: `validate.py kb/ --strict` exit 1 vì bài
    docs/ai-agent-prototype-len-production.md có 1 CẢNH BÁO (2 khái niệm chờ
    duyệt danh mục) — 0 lỗi. validate.py:339 cho warning kéo exit code lên 1.
    Tôi KHÔNG sửa validate.py: đó là hợp đồng CI, đổi thì cần FR. Ba đường ra,
    chờ người chọn: (a) nới --strict để cảnh báo không kéo exit, (b) đổi lệnh
    trong RUNNING.md, (c) nhận màu đỏ này là đúng và duyệt danh mục cho 2 khái
    niệm kia.
  - GĐ 3 chưa làm: quetKho()/docBai() vẫn readdirSync/readFileSync, chưa đổi
    sang SELECT. etag phải giữ cách tính TỪ FILE (không từ row) để If-Match còn
    bắt được sửa bằng editor ngoài web.
  - Màn Chờ duyệt chưa được dongBoThe() (nó chỉ đồng bộ #grid2).
  - Chưa có cache-busting cho gn.js/gn.css.
