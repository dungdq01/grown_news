thiet_ke_lai:
  - >
    Bốn điều sai đo được ở bản cũ: 14 dòng xếp dọc × 36px = 500px một cột trong
    khi nửa phải màn hình trống · số đếm sát lề trái cách tên 40px · ba nhóm không
    gì phân biệt ngoài chữ đậm · `0 bài` × 11 dòng
  - >
    Hướng: bảng công cụ DÀY ĐẶC, không trang trí — đây là màn quản lý. Mỗi phân
    loại một THẺ (quan hệ tập-con là quan hệ NHÓM, và nhóm đọc bằng khối cạnh
    nhau) · ba cột `auto-fit` chứ không `repeat(3,…)` vì ba là số phân loại HÔM
    NAY · số áp lề phải để mắt quét một đường thẳng đứng · thanh tỷ lệ TRONG nhóm
    (thang chung làm nhóm nhỏ trông như lỗi) · nhóm chưa dùng gì thì NÓI RA

sieet_va_don:
  - >
    `document.getElementById(` xuất hiện **128 lần** — 23 ký tự × 128 ≈ 2.9 KB
    trong bundle trần 100 KB. Gom về `G()` ⇒ `gn.js` từ 102450 (VƯỢT trần 50) về
    99703, dư 2697. Đây là phép BỎ: mọi lời gọi giữ nguyên id và ngữ cảnh
  - >
    Chiếu `magic` ra khỏi bảng media nhúng: soi byte mở đầu là việc SERVER
    (M09-R2), nên 58 byte hex đó nằm không trong bundle trình duyệt

rang_moi_va_bay_loi_no_tim_ra:
  - >
    RĂNG: mọi `var(--x)` phải có khai báo `--x:`. `var()` trỏ vào token chưa khai
    là lỗi IM LẶNG — không cảnh báo, không đỏ, chỉ một thuộc tính rơi về giá trị
    thừa hưởng
  - >
    Nó tìm ra **tám** token chưa khai, và chỉ hai là của tôi:
    `--f-mono` GÕ SAI TÊN (`tokens.css` khai `--f-mn`) ⇒ hai chỗ đang KHÔNG phải
    mono · `--mono` cùng lỗi · `--hov` dùng 3 chỗ cho hover tab rail ⇒ hover không
    đổi màu gì · `--e-out` tên sai cho một easing (namespace `--e-*` là ĐỔ BÓNG)
    ⇒ hai transition dùng easing mặc định · `--lh-meta` · `--bg` · `--fs-xs` ×4
  - >
    Của tôi: `--c-docs` (bịa tên — viền thẻ Tài liệu ra `rgb(23,23,26)` gần như
    đen) và `--r-md` · `--glass-1` · `--f-body`
  - >
    Ánh xạ chỉ dùng token ĐÃ KHAI, không bịa giá trị. `--hov` khai lại theo giá
    trị thu hồi từ `trang-chu.html` — nguồn gốc của token đó

tu_bat_duoc:
  - >
    CỔNG KHỚP VĂN XUÔI: §7 tìm chữ "thiếu"/"chỉ khi" quanh `x-bo-sung` trong
    `server.mjs`, và chú thích của tôi viết "THIEU" không dấu nên không khớp. Một
    phép kiểm khớp văn xuôi KỂ VỀ luật thì đổi một chữ là nó nói sai, còn luật đổi
    thì nó vẫn xanh — cả hai chiều đều vô dụng. Đổi sang gọi HTTP thật
  - >
    `.ln-mo{opacity:.62}` trên `--ink-2` ra **3.63:1**, dưới AA 4.5:1. Cổng
    `opacity-khong-pha-contrast` bắt. `opacity` chồng lên một token đã audit là
    làm hỏng đúng thứ audit bảo đảm; bỏ hẳn vì `.ln-0` đã làm mờ bằng `--ink-3`
  - >
    Ba luật CSS rác do chính tôi để lại ở WO-016 (`r-nguon` · `rc-h-pl`) — 0 lần
    trong markup sau khi thiết kế mới thay. Dọn mớ của chính mình
  - >
    Import `server.mjs` để kiểm cú pháp làm nó LISTEN và treo 600s. `node --check`
    là công cụ đúng
  - >
    Hai cổng ghim chuỗi `document.getElementById(` — đo HÌNH THỨC nên phép gom làm
    chúng đỏ vì lý do không liên quan. Nới mẫu để nhận cả hai hình dạng

