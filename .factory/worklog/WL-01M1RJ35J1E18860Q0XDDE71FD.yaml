t03_113:
  goc: >
    Bản nháp KHÔNG tồn tại trong kho — nó sống ở DB nháp, khoá `job_ulid`.
    `T03-112` của tôi mở nó bằng cửa sổ bài-kho generic, và cửa sổ đó chạy
    `tai()` ⇒ fetch `/api/articles/<loai>/<slug>` ⇒ 404 + bộ nút của bài đã
    lên site. SAI CỬA, không sai API.
  sua:
    - "`mo(bai, {kieu:'nhap'})` BỎ QUA `tai()` — 0 request tới `/api/articles/*`"
    - "cửa sổ nháp đọc `GET /api/nhap-chung-cat/<id>` (một lời gọi, cả hai bản)"
    - >
      bốn nút ĐÚNG VAI: Duyệt vào kho · Trả lại (bắt lý do) · Sửa ở hàng nháp ·
      Bỏ nháp. Bỏ *Đưa lên site* / *Bỏ khỏi kho* — đời sống của bài ĐÃ duyệt.
    - "nháp `da_duyet` ⇒ dẫn sang bài kho thật (lúc đó `/api/articles` mới đúng)"
    - "lý do trả lại hỏi bằng `<dialog>`, không `prompt()` (`FR-022`); rỗng thì không gửi"
  vet_luon: >
    Cửa sổ VIỆC của `T03-112` có cùng lỗi tiềm ẩn (cũng chạy `tai()`) — nay
    dùng chung `kieu: "nhap"`.

t12_19:
  hinh_dang: >
    `HangDoi.ghi_tien_do` / `doc_tien_do` / `duong_tien_do` + `api.py` gắn
    `tien_do: {cue_xong, giay_xong, vtt_tung_phan}` vào `GET /viec/<id>`, CHỈ
    cho `loai: sinh-transcript`.
  ba_quyet_dinh:
    - >
      GHI NGUYÊN TỬ (`os.replace`). Lý do rất cụ thể: người đang NHÌN màn hình
      trong lúc file được ghi lại mỗi block. Ghi thẳng vào đích thì có một
      khoảnh khắc file chỉ có nửa nội dung, và FE đọc đúng lúc đó render nửa
      câu rồi ném.
    - >
      GHI ĐÈ, không nối đuôi: `phien_am` trả TOÀN BỘ cue từ đầu tới block vừa
      xong (nó bỏ block cũ bằng `moc_bat_dau`), nên nối đuôi là nhân đôi cue
      sau mỗi lần resume.
    - >
      `vtt_tung_phan` cắt trần 64 KB CUỐI — đủ để hiện, không phình phản hồi
      lên vài MB cho một video dài.
  loi_khong_giet_viec: >
    `ghi_tien_do` nuốt lỗi. Làm chết một job đã tiêu tiền vì không ghi được một
    file HIỂN THỊ là đánh đổi sai chiều.

t03_108:
  lam: >
    Cửa sổ việc hiện khối "Đang phiên âm": số câu + mốc giây + 12 cue CUỐI, đổ
    bằng `textContent`, câu mới trượt vào (chỉ transform/opacity, trong khối
    `prefers-reduced-motion`).
  khong_tu_suy: >
    FE ĐỌC `tien_do` do THỢ tính, không suy tiến độ từ `giai_doan`. Giai đoạn
    là enum bốn nấc; suy ra một con số câu từ nó là bịa một tiến độ.
  chua_chay_that: >
    Đường ASR vẫn chưa chạy được đầu-cuối: lối cửa bị chặn vì thân request
    (~17 MB base64 > trần cửa), lối local cần `pip install "./chungcat[asr]"`.
    Nên phần "hiện tới đâu" mới xanh ở mức NGUỒN + cổng, chưa có ảnh chụp một
    lần phiên âm thật.

