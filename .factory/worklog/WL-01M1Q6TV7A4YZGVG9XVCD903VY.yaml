    XANH — đo trên trình duyệt: 2 cửa sổ, nguồn nguyên vẹn, cửa sổ mới ở cạnh.
  AC2: XANH — ban_hien_tai + citations, `<pre>` + textContent.
  AC4: XANH — khối BẢN CHƯNG CẤT 4 số tách + lối vào /chung-cat/nhap/; thẻ xong mang data-ccnhap.
  AC5: XANH — npm test exit 0, trần trang chủ về xanh (FR-064).
  AC6: XANH — mọi animation trong khối prefers-reduced-motion, chỉ transform/opacity.
  AC7: chưa — vế NGƯỜI chấm.

ac_chua_dat:
  AC3:
    trang_thai: MỘT NỬA
    dat: >
      Nút gọi ĐÚNG cửa duyệt sẵn có (`POST /api/nhap-chung-cat/<id>/duyet`),
      KHÔNG thêm đường ghi — `api-guard` whitelist không đổi.
    chua_dat: >
      Bấm xong nhận 422: cửa chạy `validate.py --fix` và từ chối vì bản nháp
      THIẾU TRƯỜNG (`id`, `url` là bắt buộc). Cửa làm đúng; thiếu sót ở phía
      TẠO (`worker._dung_nhap`).
    xu_ly: >
      Mở T12-20 (M12 dev lấy 20-29 theo quy ước chủ dự án 2026-09-05). KHÔNG
      nới thước để lọt: nới `validate` là bỏ phép kiểm cho MỌI đường nạp, không
      riêng chưng cất.

