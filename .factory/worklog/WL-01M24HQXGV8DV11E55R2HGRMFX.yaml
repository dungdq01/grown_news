  - "Khoa chieu theo quy uoc PM chot 2026-09-10 (Q3): env `KHOA_WEB_TRUYHOI`, header `x-khoa-dich-vu` + `x-aud: truyhoi`. chungcat GIU hop dong cu `X-Khoa-Loi`/`CHUNGCAT_KHOA_LOI` trong bang HEADER_KHOA_CU (ngoai le CO TEN, xoa khi FR-078 ap) — khong doi hanh vi M12 o luot nay."
