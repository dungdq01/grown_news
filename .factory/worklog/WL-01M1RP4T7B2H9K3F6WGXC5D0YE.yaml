    ranh đoạn, kết thúc đúng câu cuối của nguồn ("Xin chào và chúc các bạn một
    ngày cuối tuần vui vẻ."). Bỏ 1 cue thiếu mốc do model.

con_no:
  - >
    `M12-R6` vẫn viết *"GỬI lần thứ 3"* — chữ chưa khớp cách đọc đã chốt. Hôm
    nay không ai đỏ vì `vong.ghi_nhan_gui` CHƯA ĐƯỢC GỌI từ `worker`/`asr_cua`,
    tức trần thử-lại đang không có răng trên đường transcript. Đã ghi ô backlog
    M12; đấu bộ đếm vào phải làm CÙNG LƯỢT với chữ mới, không thì đấu xong là
    đỏ oan mọi nguồn dài. Chữ đề nghị nằm trong `FR-065`; agent KHÔNG sửa
    `rules.md` (FROZEN, và `R2` cấm agent ký thứ chấm mình).

