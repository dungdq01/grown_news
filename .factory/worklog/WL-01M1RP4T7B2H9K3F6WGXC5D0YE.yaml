don_vi: T12-22 · nguồn dài — cắt đoạn, gửi từng đoạn, gộp lại

viec: >
  `FR-065` lối A. Chủ dự án chốt: chunk + concat KHÔNG phải gửi đi gửi lại một
  request, nên `M12-R6` không đụng tới. Thi công theo đúng ranh giới đó.

r5_do_truoc:
  - don_vi: T12-22
    lenh: python chungcat/tests/check_cat_doan_audio.py
    ket_qua: "ĐỎ — `asr_cua` chưa có `cat_doan`"
    đỏ_do: claude-opus-5

ranh_gioi_r6: >
  `lan_gui` đếm số lần THỬ phiên âm một job — chia bao nhiêu đoạn cũng tính
  MỘT. Mỗi đoạn vẫn một dòng `egress.jsonl` riêng có `sha256` riêng, nên số
  byte rời máy vẫn đếm đúng từng byte (`AC-6.1` không đổi một chữ).
  Đếm theo đoạn thì nguồn 60 phút tự chạm trần ngay lần thử ĐẦU, chưa hỏng lần
  nào — tức `M12-R6` biến thành trần ĐỘ DÀI NGUỒN, thứ nó không được dựng lên
  để chặn. Cổng `AC5` canh đúng chỗ này: `ghi_nhan_gui` không được xuất hiện
  bên trong vòng lặp đoạn.

hai_quyet_dinh:
  - khong_chong_lan: >
      Chồng lấn thì phần chồng được phiên âm hai lần và phải khử trùng. Khử
      trùng trên văn bản model sinh là ĐOÁN, và đoán sai thì XOÁ chữ thật.
      Không chồng lấn thì mất cùng lắm một từ vắt ngang ranh — mất ở chỗ đoán
      trước được, và không bao giờ xoá nhầm chữ đã có.
  - doi_moc: >
      Mỗi đoạn về từ cửa với mốc đếm từ 0 của CHÍNH NÓ. Quên cộng offset thì
      bản 25 phút có ba lần chạy lại từ 0 giây — file `.vtt` vẫn HỢP LỆ, vẫn
      mở được, và sai hoàn toàn. Đây là vế cổng phải canh chặt nhất vì nó
      không tự lộ ra.

