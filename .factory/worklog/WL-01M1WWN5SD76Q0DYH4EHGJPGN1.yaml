cau_4_giai_phap: >
  M18 có spec FROZEN với 5 AC hard mà không lệnh nào chạy được, và nó chặn G6B.
  Ba lối, chọn lối thứ ba:

  (a) xếp lượt build M18 ngay ⇒ dựng phần tài khoản/phiên/thu-hồi cho vừa một
      cổng xanh. M18 là phần BẢO MẬT; làm nó vì gate là đúng cách làm sai nó.
  (b) gỡ T18-1 ⇒ làm cổng xanh bằng cách XOÁ THỨ BÁO. Bên bị đánh giá cầm bút
      ghi vào thứ đánh giá mình — luật gốc cấm đúng chuyện này. Và mất luôn chủ
      quyền giấy tờ mà T18-1 vừa lập.
  (c) VÁ ĐIỂM MÙ CỦA CỔNG. `co_plan` cũ hỏi *"module có task nào chưa"*, và câu
      đó TRỘN hai trạng thái: module đang DỰNG (AC phải có cổng) với module vừa
      có một task GIẤY (áp một FR, sửa một câu spec). T18-1 khai `phạm_vi_ghi`
      đúng hai file — spec.md + rules.md. Không core/, không web/. Vì nó là
      "một task", W5 lật M18 từ MIỄN TOÀN BỘ sang 5 lỗi hard trong một nhịp,
      và cả 5 đòi cổng cho mã KHÔNG AI ĐANG VIẾT.

  Vì sao (c) an toàn LÂU DÀI, không phải một lối lách:
  · Nó KHÔNG thêm cờ miễn cho ai bấm. Nó đọc BẰNG CHỨNG đã khai (`phạm_vi_ghi`).
  · Muốn "được hoãn" phải khai phạm vi TOÀN GIẤY — khai vậy rồi viết mã là vi
    phạm `R1`, đã có cổng riêng bắt (`check_g6b §5`).
  · Nợ KHÔNG BIẾN MẤT: khối `HOÃN` in ra từng cmd, có tổng, và trỏ về ô backlog.
  · Task ĐẦU TIÊN của module chạm MÃ ⇒ cả 5 AC thành ĐỎ ngay.
  · Nhãn dòng in cũng vá luôn: trước đó nó in `FAIL` cho MỌI module còn thiếu —
    kể cả module chưa có plan, thứ mà `if` bên dưới KHÔNG tính là lỗi. Một dòng
    `FAIL` không vào danh sách lỗi dạy người đọc rằng `FAIL` ở đây vô nghĩa, và
    đó là cách mất một cổng.
