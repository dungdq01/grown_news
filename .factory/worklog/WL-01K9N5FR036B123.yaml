# ══ B1 · Bảng media — vì sao KHÔNG cột metadata nào ══════════════════════════
#
# `mime`, `ten_goc`, `so_byte` sống trong `articles.frontmatter.media`. Đặt chúng
# thành cột nữa là hai bản khai cùng một sự thật, và bản thứ hai luôn là bản sẽ
# lệch. `so_byte` là cột GENERATED từ `length(byte)` — máy tính, không ai gõ.
#
# Không FK từ `articles` sang `media`: một blob HỢP LỆ khi chưa có bản ghi tham
# chiếu — đúng khoảng thời gian người dùng đang điền form. Toàn vẹn do LUẬT MỒ
# CÔI giữ (M09-R1), và luật đó là việc của B4.
#
# `la_dan_xuat` khai NGAY v1 dù chưa ai set: nó là chỗ ngồi cho bản PDF chuyển
# đổi từ ppt/word. Thêm cột sau = một lần dựng lại DB huỷ diệt nữa (SQLite không
# ALTER được CHECK), và lần này kho không còn rỗng.
#
# `check_media_ddl.py` chạy trên BẢN SAO của DB, không trên DB thật: một cổng
# muốn chứng minh "constraint có bắn" phải THỬ vi phạm, và thử vi phạm trên kho
# thật là đúng thứ CẤM "sửa file thật để thử một cổng".

# ══ B2 · Ca âm bắt được một lỗ trong THIẾT KẾ của tôi ════════════════════════
#
# Tôi viết nhánh `thu-vien` cho MỌI `source_type`. Ca âm của `check_ci_teeth`
# dán một dòng `ho_so: thu-vien` vào bản đạt chuẩn 202 từ (`source_type: paper`)
# — và nó thoát CẢ BỐN cổng hình dạng: 202 < trần 400, và `paper` không phải
# `tai-lieu`/`video` nên không cổng thư viện nào bắn.
#
# Tức MỘT DÒNG frontmatter miễn hết cổng cho một bản phân tích.
#
# Sửa bằng mệnh đề về NGHĨA, không bằng ngưỡng đoán: `loai_thu_vien:
# ["tai-lieu","video"]` khai ở `media-mime.json`. Một `paper`/`repo`/`article`/
# `docs`/`announcement` LÀ bản phân tích theo định nghĩa của chính loại nó.
# Nếu tôi hạ trần 400 xuống thay vì thế, tôi đã vá bằng một con số đoán và lỗ
# vẫn còn cho bài 50 từ.
#
# Hai chỗ KHÔNG cần sửa, và biết vì sao mới đáng tin: cổng 6 và 7 đã `if tt:` /
# `if khoi and …` nên với `secs, subs = {}, {}` chúng tự bỏ qua — đúng theo CẤU
# TẠO, không nhờ tôi nhớ.
#
# TikTok: `@handle` KHÔNG phải danh tính, id mới là — hai handle cùng một video
# chuẩn hoá về một, không thì hệ số kiểm chứng chéo bị thổi bằng một lần đổi tên
# tài khoản. `vm.tiktok.com` là redirect phía server, KHÔNG giải được offline ⇒
# trả host+path và NÓI RA, không bịa id.

# ══ B3 · Kho hiện vật — bốn hàm, và lý do từng cái đứng ở đâu ════════════════
#
# `TRAN_MEDIA` đọc `tran_byte` từ `media-mime.json`. `TRAN` (1 MB) KHÔNG đổi:
# nó là chặn bù của MỌI lần ghi bài (FR-010), nới nó để chứa một PDF là nới cả
# cửa kia (M09-R5). Hai trần riêng là cách giữ một cửa ghi mà không hạ một lớp.
#
# `docBodyMedia` chặn HAI lớp: `content-length` để từ chối SỚM (không tốn RAM,
# không tốn thời gian), rồi đếm byte đã nhận để không TIN nó. Header là dữ liệu
# của người gửi — khai 10 byte rồi bơm 30 MB phải chết ở lớp thứ hai.
#
# `luuHienVat` là LỚP THỨ SÁU của intake. Năm lớp hiện có (bind 127.0.0.1 · trần
# kích cỡ · tên file whitelist · đích cố định · spawn cổng thật) KHÔNG lớp nào
# soi byte. Không có magic-byte thì một file HTML-có-script dán nhãn
# `application/pdf` được phục vụ lại SAME-ORIGIN dưới content-type đó.
# `sha256`/`so_byte` gửi kèm bị BỎ QUA — khoá lưu trữ đến từ client là để client
# chọn nó nằm ở đâu.
#
# Kiểm con trỏ treo đặt TRƯỚC `validate`: `validate.py` kiểm được DẠNG của
# `media.sha256` (schema: 64 hex) nhưng chạy trên file tmp ngoài repo nên không
# biết bảng `media`. Một bản ghi trỏ vào byte không tồn tại là bản ghi mà
# `phucHoi()` sau này vẫn báo THÀNH CÔNG — nó chạy lại validate, mà validate
# không bao giờ thấy blob. Mất dữ liệu im lặng với bộ test xanh.

# ══ Ba lần bộ máy chặn tôi, và mỗi lần chặn đúng ═════════════════════════════
#
# 1 · `check_g6b` §3 — `phụ_thuộc: T01-8, T01-10`. Parser đọc CẢ DÒNG làm một
#     tên, nên nó báo "phụ thuộc T01-8, T01-10 không tồn tại". Không task nào
#     trong repo dùng dấu phẩy ⇒ ngữ pháp là MỘT phụ thuộc. Sửa task, KHÔNG sửa
#     parser: `core/tests/check_g6b.py` là file test và đơn vị này không phải
#     đơn vị test (R1). Ghi lại ở đây vì nó là giới hạn thật, không phải bug của
#     tôi: một task cần hai phụ thuộc hôm nay chưa khai được.
#
# 2 · `check_worklog` — "test thu-vien khong duoc nhac trong test/WORKLOG.md".
#     Đúng: một file test không ai giải thích là một file mà người sau sẽ sửa
#     sai. Ba thứ dễ sập của nó (thứ tự env/import · `nap()` · hẹn giờ 300ms) đã
#     ghi vào đó.
#
# 3 · `nut-song §5` — test ngoài chuỗi `npm test` là test không tồn tại. Nên
#     `web/package.json` phải vào phạm_vi_ghi của đơn vị TEST, và nó ở đó.

# ══ Kiểm hai chiều: xanh không chứng minh gì ═════════════════════════════════
#
# Sáu răng mới, mỗi răng phá một chỗ rồi đòi ĐỎ + đòi lời đỏ NÓI RA chỗ sai:
#   magic-byte bị gỡ · INSERT OR IGNORE thành INSERT · kiểm con trỏ treo bị gỡ ·
#   content-length đo SAU khi đăng ký listener · TRAN_MEDIA gõ tay ·
#   TRAN bị nới lên 25 MB
# Sau mỗi ca, khôi phục và so sha256 — không để lại vết.
#
# HAI ca đầu tiên "đỏ=True nói-ra=False", và đó là phát hiện thật về TEST của
# tôi, không về code:
#   · mất `OR IGNORE` ⇒ SQLite NÉM ⇒ ngoại lệ không bắt giết cả file test ở lời
#     gọi thứ hai, trước khi in được dòng nào. Sửa: MỌI lời gọi qua `nap()`.
#   · gỡ chặn-ở-header ⇒ hàm ngồi chờ byte mãi ⇒ test TREO thay vì báo. Sửa:
#     `Promise.race` với hẹn giờ 300ms.
# Cả hai là cùng một bệnh: một phép kiểm phải SỐNG SÓT qua đúng thứ nó đang
# chấm. Một màu đỏ không nói ra chỗ sai là màu đỏ người ta sẽ bỏ qua.

