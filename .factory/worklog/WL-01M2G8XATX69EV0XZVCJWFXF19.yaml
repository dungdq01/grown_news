ba_lop: |
  1 502 tu cua Beeknoee — KHONG phai bug cua ta, khong sua duoc tu phia ta.
  2 Viec MOI khong thay tien do cu => moi lan 502 mat ca ban phien am. WO-078.
  3 Mot cue dao moc / mot 502 giua chung giet ca job. WO-079.

y_tuong_chu_du_an_va_dinh_chinh: |
  Chu du an de xuat: *"noi so lan gui/job tu 2 len 5-10, moi lan gui co che do
  tu dong retry khi dut (request user va request ngam)"*.

  Kien truc ay DA CO phan lon: checkpoint theo cue (.tien-do.vtt), `bat_dau`
  tiep tu cho dut, vong chunk trong `phien_am` chinh la "request ngam", va
  `ghi_nhan_gui` goi MOT lan cho ca job nen `lan_gui` da la "request user".

  DINH CHINH mot diem: noi `lan_gui` len 5-10 KHONG cuu duoc ca nay. No dem
  LUOT JOB, nen noi chi cho khoi dong lai nhieu luot hon — moi luot van chet o
  dung chunk ay. Don dung la thu lai CHINH CHUNK vua dut. Sua dung cho thi
  khong phai noi `M12-R6`, va ve 4 cua cong canh cho no khong bi noi nhan dip.

sua: |
  1 Cue `den <= tu` => bo qua + dem + in ra, cung cho dang bo cue THIEU moc.
    Ly le da nam san o dong chu thich ngay tren: *"bo mot cue thi mat mot cau —
    thay duoc; doan mot cue thi sai lech ca dong thoi gian"*. Chi la chua ai ap
    cho ca "moc dao".
  2 `loi_tam_thoi(e)` — 5xx/429/mang/timeout thi thu lai; 401/403/422 nem NGAY.
    Doc `status_code` qua getattr, khong `isinstance(httpx.*)`: `egress` nap
    httpx LUOI de cong chay duoc khi vang goi.
  3 Vong thu lai quanh loi goi cua, tran + gian cach tu `nguong.json`
    (`tran_thu_lai_cua: 3`, `[2,5,12]` giay). Moi lan van di qua `egress.gui()`
    => van mot dong so, van tinh byte. Thu lai ngam khong duoc la egress vo hinh.

