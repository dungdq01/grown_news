chot_trong_FR: |
  §1.1 hinh dang file — 4 dai CJK dang SO (khong phai chuoi regex: hai ben doc la
    Python va JS, mot regex viet cho engine nay khong chac dung o engine kia, nhat la
    dai ngoai BMP can surrogate pair) + `$vi_sao` tung dai + hai `$comment` am
    (KHONG gom Hiragana/Katakana/Hangul · KHONG chua nguong ti le).
  §1.2 CHU LA M01, khong phai M13 — dao cau cu cua `M13/data_flow` ("M13 so huu").
    Ba loi da can, ghi ra de khong ban lai: dat M13 / giu o chungcat / moi ben mot ban.
    Ly le: mot HANG SO khong co "muc dich rieng", no chi co gia tri dung hoac sai —
    khac han mot HAM (chuan_hoa_tim vs chuan_hoa duoc phep hai ban vi hai muc dich).
  §2 nam cong H1-H5, chia dung chu: H1·H2·H4 do BANG KHAI ⇒ vao
    check_khai_mot_noi.py §4 (cong do da la nha cua "hai tap khai mot noi", day la
    tap thu ba); H3·H5 do MA CUA BEN DOC ⇒ thuoc FR-078 (M12) va T13-3 (M13).
  §3 bon rang buoc: khong doi gia tri 4 dai · khong them nguong · khong cho ben doc
    co dai mac dinh (thieu bang khai thi DO, khong doan) · giu dang so.

