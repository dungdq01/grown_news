tu_bat_duoc:
  - >
    CỔNG XANH KHI TÔI XOÁ TAB. §7 bản đầu chỉ hỏi `vKn.includes("loại nguồn")` và
    chuỗi đó CÒN trong đoạn văn giải thích ngay dưới ⇒ xoá `data-dmtab="nguon"`
    mà cổng vẫn xanh. Nay đo COMPONENT: tab · panel · mốc đổ danh sách
  - >
    BA "ok" XANH VÌ LÝ DO SAI trong `nhan-bat-buoc`: `"chủ đề".length` và
    `"cả hai".length` đều là 6 ⇒ hai ca trùng slug, ca sau được **409 xung đột**
    và tôi đọc con số ≥400 đó thành "luật đã nổ". Và PUT ba đoạn ⇒ **404 sai
    chỗ**, không phải luật nổ. Đặt mã slug tường minh + đường PUT bốn đoạn
  - >
    `sv.dong?.()` — TÊN SAI, và `?.` làm nó im lặng không làm gì: mọi phép kiểm
    xanh mà tiến trình TREO (exit 124). Tên đúng là `dung()`. `?.` trên một thứ
    BẮT BUỘC biến lỗi thành im lặng
  - >
    `demNguon` trùng tên với một nghĩa KHÁC của chữ "nguồn" (`origin`: máy dựng /
    bạn viết / nguồn ngoài) ⇒ `SyntaxError`. Hai khái niệm cùng tên trong một file
    là đúng sự nhầm lẫn người dùng vừa chỉ ra, ở tầng biến số
  - >
    `nhanDu` chèn VÀO TRONG object literal `CONG` ⇒ `SyntaxError`, và nó chỉ lộ
    khi server không dậy nổi (test báo "server không dậy sau 10s")
  - >
    ĐOẠN CHÚ THÍCH CỦA TÔI PHÁ CỔNG CŨ: 189 ký tự vượt trần 80 của
    `chu-giao-dien`, lại dùng chữ nội bộ (`enum` · `schema` · `module`) — đúng thứ
    FR-029 cấm. Bỏ hẳn đoạn đó: tooltip và nhãn đếm đã nói cùng một điều
  - >
    `man-danh-muc` ghim `=== 3` tab và `=== 2` panel đóng. Không bump số — đổi
    sang BẤT BIẾN: mỗi tab đúng một panel, đúng một panel mở. Và thêm `t-nguon`
    vào vòng audit màu, vì một tab không được liệt kê thì không được canh
  - >
    Escaping #29: `\\r\\n` qua heredoc thành xuống dòng THẬT hai lần, và một
    `\\\\n` nữa làm `sv-tam2.mjs` lỗi cú pháp. Cách đi được: viết script bằng
    Write, hoặc dựng ký tự bằng `chr()`/`String.fromCharCode`
  - >
    Mốc gõ LF trong script kiểm hai chiều khớp **0 lần** (`trang.mjs` là CRLF) nên
    một ca kiểm bị BỎ QUA — và nó không kêu. Script nay lấy dấu dòng TỪ FILE

sieet_khong_noi_tran:
  - >
    Thêm ô nhãn làm `gn.js` **102651 / 102400 — vượt 251 byte**. `page-weight` vẫn
    nói "100 KB · ok" vì nó so KB làm tròn; cổng mới của tôi đo BYTE nên nó bắt
  - >
    SIẾT, không nới (tiền lệ `page-weight.test.js:85-89`): ba câu lỗi xuất hiện
    5/3/3 lần được hợp về một khai báo, và câu nhắc nhãn thành một hàm khác nhau
    đúng một chữ. Về 102253 — dư **147 byte**
  - >
    CÒN 147 BYTE là quá chật cho WO-017. Đường đã đo: mã nạp/form là **20941 byte
    (23%)** của `gn.js` và `catNap()` đã cắt các view nạp khỏi 7/10 trang, nên nó
    là tải chết ở phần lớn trang ⇒ TÁCH BUNDLE là đơn vị việc kế tiếp

