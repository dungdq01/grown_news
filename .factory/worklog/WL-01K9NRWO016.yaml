dinh_chinh_phep_do_dau_tien:
  - >
    `cat` KHÔNG thiếu mã. `bangLoc` đã phát `nhom("chủ đề", "cat", …)` từ trước;
    nó vắng vì `nhom()` trả rỗng khi không có mục — tức KHÔNG BẢN GHI NÀO có
    `category`. Kho thật `category: []`, kho mock không khai trường này
  - >
    Gốc sâu hơn: `categories` **0 hàng** · `concepts` **0 hàng** · `nhan` chỉ 5
    dòng `proposed`. Bảng rỗng ⇒ ô nạp từ DB cũng rỗng ⇒ không ai gán được ⇒
    facet rỗng vĩnh viễn. Tôi KHÔNG tự gieo nhãn (M02-R3) — chỉ làm đường
  - >
    `/khai-niem/` đã có hai trong ba (khái niệm + chủ đề, kèm thêm/sửa). Thiếu
    đúng loại nguồn, và nó phải CHỈ ĐỌC
  - >
    `/tat-ca/` thiếu `nguon` là lỗi mã thật: `bangLoc` dùng `if/else` nên màn trộn
    nhận `pl`, màn loại nhận `nguon`, không màn nào cả hai

loai_nguon_giu_o_bang_khai:
  - >
    Người dùng viết *"cần làm bảng DB lưu trữ nếu chưa có"*. `concepts` và
    `categories` ĐÃ có bảng. Loại nguồn thì tôi GIỮ ở `loai-nguon.json` và nói rõ
    vì sao: file đó sinh ra chính các ràng buộc `CHECK` của DDL, nên một bảng DB
    là HAI nguồn sự thật cho một enum; và `coFileBai()` cùng phép kiểm `type` của
    route phải chạy KHI DB CHƯA TỒN TẠI. Muốn bảng thật ⇒ FR trên
    `kho.schema.sql` (FROZEN), tôi không tự làm

