canh_bao_ghi_lai: |
  `--ky` ky lai TOAN BO 56 file frozen, khong chi file trong FR. Lan nay an toan
  vi cong xac nhan truoc do CHI MOT file lech. Ai ky khi co hai file lech thi
  dang dong dau cho ca file khong co FR nao — kiem cong TRUOC khi ky la buoc
  BAT BUOC, khong phai buoc lich su. Da ghi canh bao nay vao cuoi FR-075.

nut_tai_xuong: |
  Chu du an bao 5 file tai ve mang ten UUID, roi xac nhan "gio ko bi nua".
  KHONG tai hien duoc: moi route xuat tra 200 + Content-Disposition dung ten,
  bam that ra `cai-dat-va-thiet-lap-hermes-tren-vps.txt`; FE khong co cho nao
  `createObjectURL` de tai. DE MO o backlog M03, khong dong — mot loi tu het la
  mot loi chua hieu.

  Nhung tim duoc MOT loi that o cung be mat: `?dang=goc` 302 sang route media,
  va route do dat `inline; filename="<12 hex>.pdf"` — Content-Disposition thang
  thuoc tinh `download`, nen `ten_goc` FE truyen vao bi vut. Da mo o backlog.

