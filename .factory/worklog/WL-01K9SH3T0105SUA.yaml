don_vi: T03-105 — ngữ cảnh SỬA sống qua điều hướng (WO-045)

viec: |
  Bấm **Sửa** một tài liệu từ `/tai-lieu/` trả về một form **Nạp mới trống**.
  Nguyên nhân: `suaTaiLieu()` gọi `doiView("naptailieu")` RỒI MỚI điền form,
  mà `doiView` ĐIỀU HƯỚNG khi view vắng khỏi DOM (`v-naptailieu` bị cắt khỏi
  mọi trang không phải nap) — mọi dòng sau chạy trên trang đang unload.

  Sửa: CẤT ngữ cảnh vào `sessionStorage` TRƯỚC khi gọi `doiView`; `noiLaiSua()`
  đọc + XOÁ NGAY ở `khoiDong()`, cạnh khuôn `data-moBai` đã có sẵn cho cửa sổ
  đọc. Phần điền form tách thành `dienFormSua()` để dùng lại — chép đôi mã thì
  chỗ thứ hai sẽ lệch, và lệch ở đây là form nối lại thiếu một ô không ai thấy.

  Ba quyết định, mỗi cái một lý do:
  1 · `sessionStorage`, KHÔNG `localStorage` — ngữ cảnh sửa là việc của MỘT tab
      đang làm dở; `localStorage` sống qua cả lần đóng trình duyệt và dùng
      chung mọi tab ⇒ tab thứ hai thấy "đang sửa" một bài mình chưa bấm.
  2 · XOÁ NGAY sau khi nối lại — để lại thì lần vào `/…/nap/` kế tiếp (bấm
      "+ nạp tài liệu") mở ra form điền sẵn của bài cũ, và người ghi đè một bài
      họ không định đụng.
  3 · Sửa CẢ ca thứ hai (`suaTuCua`) — `doiView` có thể điều hướng, nên MỌI
      người gọi điền DOM sau nó đều mang cùng lỗi. Sửa một chỗ là để lại lớp.

