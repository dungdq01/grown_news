# ══ FR-050 CACH 2 LAT MOT VE CUA ADR-06 — ghi ro, khong de am ═══════
he_qua_that: >
  ADR-06 (c) viet "ba bang dang cuu nay di dung duong B-C1" — tuc export ra file
  ROI COMMIT VAO GIT. Sau cach 2, ve COMMIT VAO GIT khong con.
  Va env_plan khai "clone repo la co du CONG MOT LENH". Cau do HET DUNG cho DB
  cua LOI: clone cho ban kho, ma, va moi thu dung lai duoc tu file — KHONG cho
  ban 5 tai khoan va moi chat_id da buoc.
  DIEM YEU THAT cua cach 2, da ghi vao .gitignore va vao dungchung.mjs ngay cho
  nguoi ta doc khi di tim ban lui:
    MAT O BACKUP = MAT TAI KHOAN. Khong co ban thu hai o dau ca.
    Cach 1 co git remote lam ban thu hai; cach 2 khong.
  Kho (kb/) VAN dung B-C1 nhu cu vi no DUNG LAI DUOC TU FILE. Hai loai du lieu,
  hai co che — va do la ly do ADR-06 ton tai.

X7_ve_de_bo_nhat: >
  Sau cach 2, mot `clone` moi se CHAY DUOC va KHONG CO TAI KHOAN NAO — va do
  trong GIONG HET mot he thong moi tinh chua moi ai.
  trangThaiBanLui() phan biet hai ca:
    "chua moi ai"          -> DB rong, _backup rong  => binh thuong
    "backup khong o day"   -> DB CO nguoi, _backup thieu => CANH BAO co so lieu
  Cung lop loi ui_flow §3 da ghi, va du an DA VAP dung no mot lan o man Danh muc
  (commit 0035fa3: "Danh muc ket 'dang tai...': o do phai NOI RA khi tai that bai").
  Ham nay KHONG tu khoi phuc gi — chi TRA LOI. Mot ham khoi phuc tu dong o day
  se chay dung vao luc nguoi ta chua kip nghi.

# ══ CHI DAO MOI O FR-051 §7 — DOI HANG, khong chi them mot man ═════
phan_quyen_thanh_setting_on_off: >
  Nguyen van: "note lai la phan quyen lam tinh nang on/off - setting de admin
  co the edit ngay tren web => co the them module setting nua; neu can co the
  gop voi quan ly nguoi dung luon => Quan ly va cai dat he thong (nen research
  them)".
  DIEU NAY DOI HANG: ma tran quyen o §6 la MA. Mot ma tran sua duoc tren web la
  DU LIEU. Va no cham dung LUAT GOC cua du an:
    "Khong ai duoc so huu thu dung de danh gia minh."
  Neu phep kiem quyen DOC TU DB va DB SUA DUOC tu mot form web, thi thu quyet
  dinh "ai lam duoc gi" tro thanh thu GHI DUOC BOI ben bi no kiem soat. Mot
  phien admin bi chiem khong chi lam duoc viec cua admin — no VIET LAI DUOC
  bang quyen, va sau do moi phep kiem deu "dung".
  Hom nay rui ro NHO (mot admin duy nhat, web/ chi nghe 127.0.0.1). Nhung
  M17_cong ton tai DE dua he nay ra Internet. Ngay do toi thi bang quyen
  sua-duoc-qua-web la be mat tan cong DAT NHAT trong ca he.
  BA RANG BUOC toi de nghi (da ghi vao FR-051 §7):
    a) B-B1 KHONG BAO GIO la mot o on/off — phai o MA, khong o DB
    b) doi quyen ghi audit_log, va audit KHONG sua duoc qua setting
    c) SCR-16 da khai "KHONG form"; chi dao nay MO mot duong ghi o do nen phai
       noi ro O NAO mo, va moi o khac van dong
  CHUA THI CONG: s1 chua (chu du an da noi "nen research them"), s2 chua
  ("cai dat he thong" khong co trong scope-in dot hai), s3 chua.
  Cung hinh dang M19_baihoc => can FR MO RONG PHAM VI.
  KHONG dat so M20: dat so cho mot module chua qua s2 la tao mot con tro tro
  vao cho trong.

gop_M18_hay_module_rieng_CHUA_quyet: >
  Du kien dang can: M18 la module NGANG (khong so huu file ma nao). Mot module
  cai-dat cung NGANG. Hai module NGANG cung dich M03 + M08 thi ranh gioi giua
  chung la GIAY, khong phai ma — nen "gop" va "tach" o day RE hon binh thuong,
