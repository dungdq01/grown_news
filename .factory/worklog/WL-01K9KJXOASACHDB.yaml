# ══ PHAN DANG GHI NHAT: mot phep kiem KHONG CO RANG ma van xanh ════════════
b_thanh_backspace_lan_hai:
  chuyen_gi: >
    Toi viet ham `trongMoc()` (dem the de lay dung phan TRONG mot moc) qua mot
    script Python. Regex `\b` trong chuoi non-raw cua Python la BACKSPACE (0x08),
    nen file nhan `/<(\/?)div\x08/g`.
  he_qua: >
    Regex khong khop gi => vong lap khong chay MOT NHIP NAO => ham tra ve CA PHAN
    CON LAI cua trang => luon co chu => phep kiem "moc khong duoc trang" LUON
    XANH, ke ca khi moc rong that.
  ai_bat: >
    KIEM HAI CHIEU. Toi lam moc rong that va phep kiem van xanh — exit 0 khi phai
    khac 0. Khong co buoc do thi mot phep kiem vo rang da nam trong bo test, va
    no con te hon khong co phep kiem: no bao dam mot dieu no khong kiem.
  vi_sao_kho_thay:
    - "0x08 KHONG HIEN: grep, Read, va terminal deu in ra `div/g` — mat thuong khong phan biet duoc"
    - "chi `repr()` moi phoi ra `div\\x08`"
    - "cung file con MOT ham khac co `\\b` DUNG (dong 485, viet tay) nen doc nhanh thay 'binh thuong'"
  sua: >
    Doi sang `(?![a-z])` — lam dung viec `\b` dinh lam (chan `<divider>`) va
    khong co ky tu nao de tang escaping dich lai. Ghi ly do NGAY TAI CHO.
  lan_truoc: "cung lop loi da lam hong `trang-chu-layout.test.js` (FR-027e)"
  luat_rut_ra: "KHONG viet regex chua `\\b` qua script Python. Dung Edit, hoac dung chuoi RAW, hoac tranh `\\b`."

