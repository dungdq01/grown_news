§8_viet_cho_thoi_SO_TU_KHAI_nen_phai_doi: >
  "verified < sampled => loai ca ban" dung khi so la LOI KHAI: khai verified <
  sampled la tu nhan that bai. Voi so MAY DEM, verified < sampled la ca BINH
  THUONG cua moi bai trich nguon ngoai kho. Giu nguyen la bien lua chon "gan co,
  khong loai bai" cua chu du an thanh "do cung" — nguoc chi dao.
  Bien mot so tu-khai thanh so may-dem doi Y NGHIA cua moi luat doc so do. Phai
  ra soat tung luat, khong chi doi cho tinh.

