toi_khai_18_ma_that_ra_15: >
  Trong task file va docstring cong toi viet "18 dia chi". Dem lai bang
  `grep -o | sort | uniq -c`: 3+2+2+2+2+1+1+1+1 = 15. Toi cong nham.
  Da sua trong ca ba cho. Bai hoc lap lai: so nao viet ra cung phai dem lai ngay
  truoc khi viet, ke ca so minh vua do 5 phut truoc.
  LOI THU HAI CUNG LOP trong cung task: toi viet '8/11 muc'. Dem lai bang may:
  CAN_LOCATOR chi co BON muc (3.2, 3.3, 3.4, 4) va CA BON deu co dia chi —
  4/4, khong phai 8/11. So 11 la tong moi tieu de ##/### cua bai, mot phep dem
  KHAC cau dang noi. Hai lan trong mot task: toi dem mot thu roi dan no cho mot
  cau hoi khac.

BA lo cua chinh toi, deu lo ra bang CHAY chu khong bang doc:
  1_file_dong_khoa_cung_md: >
    Khai `file-dong` la `...\.md:dong`. Chay tren kb-mock: 42/55 cho "khong nhan
    dang" la `nguon.py:10-40`. Toi thu hep dinh dang ma khong do truoc.
  2_json_dumps_tu_escape: >
    Sua regex bang json.dumps voi HAI backslash => file ra `\.` => regex thanh
    "backslash roi ky tu bat ky". Nhan dang tut 31 -> 17. Lan viet tay can HAI,
    lan qua json.dumps can MOT — hai duong ghi cung mot file, hai luat escape.
  3_link_gay_suy_tu_manh_la_DO_OAN: >
    Ban dau: dia chi nao `manh != khong` ma khong phan giai duoc => bao "link
    gay". Nhung `[backend]` trong mot vi du `category: [backend]` khop dang
    `slug` y het mot dia chi that. Bao link gay cho no la phat nguoi viet vi mot
    dau ngoac trong khoi ma. => them cot `bat_link_gay`, CHI `:p.N` va `:t=`
    (cu phap khong the go nham) moi duoc do.

