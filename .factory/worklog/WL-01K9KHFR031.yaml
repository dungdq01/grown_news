# ══ BUG LON NHAT: FE dung URL thieu MOT DOAN ═══════════════════════════════
nut_chet:
  nguyen_nhan: >
    Route la `/api/articles/<type>/<slug>` (router.mjs:78 doi `phan.length >= 4`),
    FE dung URL chi bang `ban.slug` o NAM cho.
  do_duoc_bang_curl:
    GET_slug_tran: 404
    GET_type_slug: 200
    PATCH_slug_tran: "400 — type phai thuoc: ..."
    PATCH_type_slug: "409 — route KHOP, handler xet tiep"
  vi_sao_ca_BON_nut_chet_cung_luc: >
    `docChiTiet` la buoc DAU cua ca bon nut (no lay `etag` cho If-Match). No tra
    `null` va moi nut dung ngay do.
  sua_GOC_khong_sua_tay: >
    Mot helper `duongBai(b) = b.source_type + "/" + b.slug`. Sua tay nam cho thi
    cho thu sau viet sau nay lai thieu — chi mot noi biet cach dung duong.

vi_sao_41_test_khong_bat:
  su_that: >
    `vong-doi-bai.test.js` goi API TRUC TIEP bang duong tu go dung. No chung minh
    API tot — va API tot that. Khong phep kiem nao hoi "FE dung duong NAO".
  lop_loi: >
    Ban MOT-MAT cua loi "ban song sinh": khi hai ben phai khop nhau, kiem tung
    ben xanh KHONG suy ra cho noi xanh.
  rang_moi: >
    `duong-api-khop-route.test.js` — §1 soi BUNDLE DA BUILD va cam dung hinh dang
    da gay loi; §2 dung server that chung minh router THAT SU doi `type`, de §1
    co LY DO. Ai noi router cho nhan 3 doan thi §1c tu khai het hieu luc.
  kiem_hai_chieu: "tra mot call site ve `ban.slug` => do, neu dung chuoi vi pham"

# ══ HANG DANH MUC CAO GAP DOI: nguyen nhan la SPECIFICITY ═══════════════════
hang_90px:
  do_duoc: >
    `.rc-act` cung la mot `<span>`, nen `.rc-r span` (0,1,1) khop no VA THANG
    `.rc-act{grid-column:4}` (0,1,0). O hanh dong bi dat vao COT 2 cung nhan;
    grid khong xep hai thu vao mot o nen day no xuong DONG 2.
  khong_phai: "loi padding — do la thu toi se sua neu khong doc specificity"
  sua: >
    `:not(.rc-act)` o selector, KHONG doi thu tu dong: thu tu chi quyet khi
    specificity bang nhau, nen mot luat thang-do-dung ben hon thang-do-dung-sau.

mo_khoa_sua_xoa:
  sua_nhan: >
    API DA CHO tu dau (`suaNhan` chi chan doi `id`). Chi GIAO DIEN khoa: hang
    `#cb` la mot `<button>` loc, va `<button>` khong long duoc `<button>` nen
    khong co cho dat nut. Tuc giao dien tu cam mot viec he thong van cho lam.
  xoa_nhan: >
    `?force=1` — nguoi dung chon "ep xoa kem canh bao". Ba dieu bat buoc: mac
    dinh KHONG doi (khong co thi van 409) · 409 tra DANH SACH bai chu khong chi
    con so · 200 tra `gay_hong`.
  phep_kiem_dang_gia_nhat: >
    Chung minh he qua la THAT: bai tro hut PUT => 422. Khong co no thi canh bao
    chi la mot loi noi suong.
  nhat_ky: >
    Ban truoc hardcode "0 bai dung". Voi `force` thi cau do thanh LOI KHAI SAI
    trong dung file dung de tra lai sau nay.

