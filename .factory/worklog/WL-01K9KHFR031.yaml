# ══ LO O CONG DONG BANG — "no khong keu, no CHUC PHUC" ═════════════════════
lo_frozen:
  co_che: >
    `kyLaiBaseline()` goi `check_frozen.py --ky` VO DIEU KIEN voi cwd=GOC. Moi
    lan mot test POST/DELETE mot nhan — tren kho TAM, schema TAM, khong cham mot
    byte nao cua repo — no van ky lai FROZEN.lock cua repo.
  do_duoc: >
    Toi sua 3 file frozen, check_frozen DO dung thiet ke; chay `npm test` mot
    luot va no XANH tro lai. Cong co nhiem vu doi "doi file frozen phai qua FR"
    bi vo hieu boi chinh bo test.
  vi_sao_te_nhat: "mot cong khong keu ma chuc phuc thi te hon khong co cong"
  sua: >
    Co KB_DIR hoac SCHEMA_DIR => dang lam viec tren thu muc tam => KHONG ky.
    Fail closed: bo mot lan ky dang ra phai lam thi check_frozen keu va nguoi sua
    biet; ky thua thi im lang.
  kiem_hai_chieu: >
    Dua FROZEN.lock ve HEAD, chay tron npm test (43/43 xanh), `git hash-object`
    KHONG doi.

ba_cong_bat_dung_va_toi_sua_MINH:
  no-write-path: "unlinkSync trong web/api (M08-R4); va dich cua loi goi ghi phai DOC DUOC ngay tai cho goi"
  api-guard: "renameSync moc ngoai ba ham duoc thiet ke"
  page-weight: "cat-theo-so-cung trong emitter"
  hai_lan_bao_dong_GIA_vi_COMMENT_cua_toi: >
    Chung quet nguyen van nguon, nen mot dong giai thich nhac ten ham goi mang /
    cach cat cu la du de do. Da sua `page-weight` boc comment truoc khi quet —
    boc comment khong lam cong yeu di (mot .slice trong comment thi khong chay),
    nhung khong boc thi cong DAY NGUOI TA DUNG VIET chu thich ve doan ma vua sua.
  api-guard_con_khai_SAI_TEN: >
    Danh sach cu ghi `ghiSauValidate`. Do lai thi ham do KHONG goi renameSync, no
    goi `doiTenBenBi`. Con so 3 khop nen khong ai phat hien ten sai — mot phep
    kiem xanh vi CON SO, trong khi cau no khai ve he thong thi sai.
    Gio dem HAM thay vi dem SO LAN GOI.
  man-danh-muc_§6a_cung_xanh_SAI: >
    No so chuoi tren nguyen van nguon, va comment toi vua viet co chua may chu
    "dang dung" de giai thich cai vua bo. Mot phep kiem doi chieu hai ban CAI DAT
    lai di doc hai ban VAN XUOI. Gio boc comment truoc khi so.

