bug1_doi_huong:
  - >
    Bản sửa ĐẦU thêm `:not([hidden])` vào ba luật `.api-only`. Cổng xanh, trình
    duyệt vẫn `display: grid` — luật thắng là `.np-form{display:grid}`, một luật
    THỨ TƯ tôi không nghĩ tới. Đó là bằng chứng `:not([hidden])` từng luật là
    cuộc đua không có đích
  - >
    Đổi sang BẤT BIẾN `[hidden]{display:none !important}`. WO-015 ban đầu xếp
    `!important` là anti-pattern — phép đo cho thấy phương án thay thế TỆ HƠN,
    nên đảo hướng và ghi lý do vào chính chỗ mã, không để trong đầu
  - >
    Ca âm giữ `!important` không rải sang luật khác: hai `!important` là đua
    trọng số lần nữa, và lần đó không còn bất biến nào phân xử

