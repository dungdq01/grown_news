tu_bat_duoc:
  - >
    PHÉP ĐO CỦA TÔI NUỐT DẤU PHÂN CÁCH. Mẫu mở đầu `(?:^|\})` khớp và do đó
    TIÊU THỤ dấu `}` của luật trước, nên nó chỉ bắt được luật CÁCH MỘT —
    `[hidden]{…}` rơi đúng nhịp bị bỏ. Cổng báo "thấy 0 luật" trong khi luật có
    thật trong file. Bỏ dấu phân cách khỏi mẫu: từ 3 luật lên 5 luật nhìn thấy
  - >
    CHÚ THÍCH PHÁ MÃ, ba lần trong một lượt: (a) khối `/* … */` trước luật đi
    lọt vào phần bắt selector ⇒ `sel` thôi bằng `[hidden]` · (b) chuỗi đóng khối
    viết trong chú thích làm khối tự đóng ⇒ SyntaxError · (c) hai chú thích CSS
    còn khai bản sửa là `:not([hidden])` sau khi thứ đó đã bị bỏ — đúng bệnh
    WO-015 mở ra để chữa, lần này là chú thích của tôi
  - >
    Dòng `chot()` của cổng khai "hidden thắng bằng trọng số" trong khi bản sửa
    thắng bằng BẤT BIẾN. Lời tổng kết của một phép đo cũng là một lời khai
  - >
    Phép đo facet đầu tiên tôi chạy lấy phạm vi CẢ TRANG nên năm màn in ra cùng
    một danh sách; và nó đọc `data-tang` (0 chỗ) rồi rơi sang nhánh dự phòng
    `data-loc` mà không nói. Phải cắt theo từng `v-*` mới thấy khác biệt

