# ══ TOI VIET SAI VE 2 VA NO DO OAN — da sua truoc khi giao ═══════════
do_oan_da_bat_duoc: >
  Luot dau ve 2 lay tap thu muc hop le tu dich-vu.json (bay dich vu co tien
  trinh). Chay tren repo that => DO, bao kb/_kho.sqlite va kb/_index.sqlite
  "sai cho".
  Do la DO OAN, va sai o mo hinh chu khong o ma: `kb/` KHONG phai mot dich vu —
  no la nha cua M02_kb, mot module DU LIEU khong co tien trinh nao. ADR-06 noi
  THANG rang kb/_kho.sqlite la vi du cua chuyen DUNG CHO.
  => Chu cua mot DB la mot MODULE, khong phai mot DICH VU. Nguon dung la
     project_map.modules.*.be (kb/** la be cua M02_kb). Hop them dich-vu.json
     de phu dich vu duoc khai truoc khi co mac trong map.
  Va toi da KHONG sua repo cho khop cong — T08-10 khai truoc rang neu cong do
  thi do la PHAT HIEN, di ra backlog/FR, khong sua file san pham trong cung
  don vi. Lan nay hoa ra cong sai, nen sua cong.

siet_lan_hai: >
  Sau khi sua, tap "hop le" van chua FROZEN.lock va Makefile — vi chung la
  `be` cua vai module nhung la FILE, khong phai thu muc. Mot cong nhan
  "FROZEN.lock" la mot thu muc chua DB hop le thi no gan nhu khong tu choi gi.
  Da loc: chi giu mau `be` tro toi mot THU MUC co that.

ve_3_BO_QUA_co_thong_bao_—_khong_xanh_im_lang: >
  Ca nam bang chua ton tai nen ve 3 chua kiem duoc gi. Cong IN RA tung ve bi bo
  qua va in mot dong canh bao o cuoi, thay vi xanh im lang.
  Ly do: mot cong xanh vi "chua co gi de kiem" ma khong noi ra la dung thu
  M17 AC-3.4 goi la CONG XANH RONG — no te hon khong co cong, vi no lam nguoi
  ta tin. Khi FR-047 dung DDL, nam dong BO QUA se tu bien mat.

