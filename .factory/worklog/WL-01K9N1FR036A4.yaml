# ══ SÁU LẦN TẦNG ESCAPING CẮN TÔI TRONG MỘT LƯỢT ═══════════════════════════
# Ghi lại vì đây là lớp lỗi tôi đã viết thành luật ở FR-033 §6 rồi vẫn vi phạm.
escaping:
  ca_1: "regex xuống dòng qua heredoc thành CR thật + newline thật, phá regex qua HAI dòng ⇒ esbuild 'Unterminated regular expression'"
  ca_2: "vá tay lần một: mất một dấu ngoặc và xoá mất một dòng else — tự làm hỏng thêm"
  ca_3: "search string dùng LF không khớp file CRLF ⇒ AssertionError; phải đọc/ghi text mode"
  ca_4: "escape unicode trong regex JS viết qua heredoc thành MỘT backslash ⇒ regex khớp chữ u, giải escape không chạy, và nó ĐỎ OAN cho code đúng"
  ca_5: "escape unicode trong chuỗi Python -> SyntaxError truncated escape"
  ca_6: "esbuild escape chữ có dấu thành CẢ hai dạng (u và x); giải một dạng vẫn đỏ oan dạng kia"
  ca_7: "heredoc vỡ khi nội dung mang dấu nháy — phải dùng Write, không dùng shell"
  luat_da_biet_ma_van_vi_pham: >
    Không viết regex chứa escape ký tự qua bash heredoc. Dùng Edit/Write (không
    tầng escaping), hoặc dựng backslash bằng chr(92).
  lop_loi_thu_hai: >
    Ba dấu thăng là CHUỖI CON của bốn dấu thăng, nên phép kiểm "bundle không
    chứa ba dấu thăng" luôn đỏ oan khi code đúng. Neo bằng ký tự mở chuỗi.

