bug_that_1_mat_du_lieu_khi_sua:
  trieu_chung: "sửa bài trên web → 422, người dùng thấy 'đang lỗi'"
  nguyen_nhan: >
    guiForm() dựng lại frontmatter TỪ SỐ 0 từ 12 ô của form. Frontmatter thật có
    tới 40 trường — citations_sampled/verified, ingested_at, url_normalized,
    skill_candidates, 3 trường M1... Mọi trường ngoài form bị XOÁ khi PUT.
    Bài origin=external mất citations_* ⇒ schema chặn ⇒ 422. Không chỉ là lỗi
    hiển thị: nếu schema không chặn thì đó là mất dữ liệu im lặng.
  sua: "FM_GOC giữ frontmatter gốc; form chỉ ĐÈ ô nó có (Object.assign)"
  tai_hien_va_kiem_chung: >
    Dựng kho tạm + server cổng 8801, PUT theo cách CŨ (12 trường) ⇒
    422 "'citations_sampled' is a required property" — đúng giả thuyết.
    PUT theo cách MỚI (giữ gốc + đè) ⇒ 200, one_liner mới nằm trong .md.

