ba_skill_design_doc_gi_va_dung_gi:
  frontend_design: >
    ÁP DỤNG. Điểm chính lấy được: "nếu repo đã có design tokens/DESIGN.md thì
    dùng làm nguồn chân lý" và "tránh AI default: gradient tím-xanh, glass card
    mơ hồ, bo góc quá tay". Nên: 0 màu mới, 0 gradient, dùng lại .np-tabs/.rc-r/
    .bt.dstr/.pgn đã có.
  article_magazine: >
    KHÔNG áp. Nó là mẫu bài viết magazine (hero text-5xl, một cột 700px, serif,
    blockquote accent). Màn Danh mục là màn QUẢN LÝ DỮ LIỆU — áp mẫu đọc-dài vào
    đó là chọn sai công cụ.
  color_expert: >
    KHÔNG có nội dung thi hành — file chỉ là mục catalogue trỏ upstream chưa cài.
    Thay bằng nguồn thật của dự án: contrast-audit.json (50/50 pass WCAG AA).

tra_no_1_test_duong_ghi_CHU_DE:
  no_cu: >
    "DELETE/POST chủ đề chỉ chạy khi KB_DIR = kb/ thật ⇒ KHÔNG có test
    đường-thành-công, chỉ kiểm tay." (FR-021 tự khai là nợ)
  vi_sao_truoc_day_khong_lam_duoc: >
    Đường đó sửa `enum` trong hai bản schema ở repo. Test mà sửa schema thật là
    tự tạo ra đúng thứ check_frozen sinh ra để bắt.
  sua: >
    Thêm `SCHEMA_DIR` (cùng khuôn KB_DIR/RECYCLE_DIR của FR-010) cho CẢ
    dungchung.mjs VÀ check_danh_muc.py. Test copy hai schema sang thư mục tạm rồi
    trỏ vào đó — kiểm đủ đường mà không đụng một byte của repo.
    Mặc định KHÔNG đổi: make check và CI vẫn kiểm repo.
  them_khoVaSchemaLech: >
    Điều kiện thật là "kho và schema CÙNG PHÍA" (cùng repo, hoặc cùng tạm), không
    phải "KB_DIR phải là kb/". Lệch phía ⇒ 409 với câu giải thích, thay vì ghi rồi
    rollback rồi trả 500 mờ mịt.
  ket_qua: "22 → 53 phép kiểm. POST/DELETE chủ đề giờ có test đường-thành-công đủ"

tra_no_2_hai_bug_cua_luot_truoc:
  bug_dinh_dang_YAML:
    what: "YAML.stringify đổi `aliases: [a, b]` (flow) thành block list"
    do_duoc: "một lần PATCH sửa MỘT nhãn làm diff 78 thêm / 32 xoá"
    sua: >
      Hàm inDanhMuc() in flow style; vẫn dùng YAML.stringify cho từng GIÁ TRỊ vô
      hướng (không tự escape chuỗi — đó đúng là chỗ parser tự chế sai).
  bug_kho_rong:
    what: >
      DELETE trên kho thật trả 200 và XOÁ THẬT `idempotency`. kb/ có 0 bài nên
      MỌI nhãn đều "0 bài dùng".
    khac_phuc: "git checkout kb/concepts.yaml"
    sua: "quetKho().length === 0 → 409. 0 bài dùng là HỆ QUẢ kho rỗng, không phải bằng chứng"
    cung_lop_loi: "validate.py xanh trên kho 0 bài suốt FR-001 → FR-015"
  ca_hai_gio_co_cong: "khối 12 của danh-muc-them.test.js"

tra_no_3_4_5:
  prompt_thay_bang_popup: >
    Ba prompt() đã xoá. suaNhanTuWeb (bản prompt) và themChuDeMoi (form cũ) là
    code chết sau khi có popup — xoá cả hai, giữ lại comment về literal fetch
