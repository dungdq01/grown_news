  ket_qua:
    npm_run_check: sạch
    web_test: 25/25 file, exit 0 (thêm man-danh-muc.test.js — 35 phép kiểm)
    danh_muc_them: 53 phép kiểm (từ 22)
    cong_may: 5/5 đã chạy (frozen · danh_muc · ci_teeth · running · kb_mock)
    pytest: 30/30
    build: exit 0
  kiem_tay_tren_trang_da_xay:
    - "3 tab với số: 22 mục · 6 mảng · 5 chờ; hai panel hidden, một mở"
    - "2 <dialog>: dlg-nhan (tạo) + dlg-sua (sửa)"
    - "3 mốc phân trang pg-cpt/cat/cho; 12 hàng khái niệm = đúng ngưỡng"
    - "hàng mang màu: 12 r-cpt · 5 r-cat r-dung · 1 r-cat"
    - "bundle có moTabDm/veTrangDm/moPopupNhan/moPopupSua/DM_MOI_TRANG"
  cong_moi_kiem_hai_chieu:
    - "SCHEMA_DIR trỏ thư mục không tồn tại → check_danh_muc exit 1"
    - "không đặt SCHEMA_DIR → exit 0 (mặc định không đổi)"
  frozen: "check_frozen exit 0 — KHÔNG file frozen nào đổi trong lượt này"

