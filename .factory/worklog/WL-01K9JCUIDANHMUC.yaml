    bản build — chạy npm run build"). Một câu, một chỗ sửa.
  more_concepts_mo_coi: "xoá khỏi từ điển EN — grep shell.html = 0 chỗ dùng"

UI_ba_yeu_cau:
  1_phan_trang:
    quyet: CLIENT-SIDE, 12 mục/trang
    vi_sao_khong_dung_co_che_cu: >
      Phân trang màn Tất cả là BUILD-TIME (sinh /tat-ca/2/ thành trang riêng).
      Ở đây đổi tab không tải lại trang ⇒ trang riêng vô nghĩa. 22 mục thì DOM đã
      có sẵn, ẩn/hiện hàng là đủ.
    dung_lai: ".pgn CSS của màn Tất cả; chỉ thêm .dm-pgn button (là <button> chứ không <a>)"
    12_vi_sao: "~14px/hàng + tiêu đề + tab ≈ một màn 900px không cuộn"
  2_ba_tab_va_popup:
    tab: "dùng lại khuôn .np-tabs của màn Nạp nguồn — không phát minh cơ chế thứ hai"
    popup: >
      <dialog> NATIVE + showModal(). Focus-trap, ESC, backdrop, inert cho phần
      còn lại của trang — trình duyệt làm sẵn và đúng hơn mọi bản tự viết.
      MỘT dialog cho CẢ HAI loại nhãn (hai form giống nhau 3/4; hai dialog thì
      phải đồng bộ hai lần mỗi khi đổi). Ô `gom` ẩn khi tạo khái niệm.
    loi_hien_TRONG_popup: >
      Không phải toast rồi mất — người dùng còn đang gõ. Và dải cảnh báo nói
      TRƯỚC điều kiện (ngưỡng M07 / schema FROZEN), không đợi 422 mới nói.
  3_mau_sac:
    nguyen_tac: "0 màu mới. Mọi màu từ contrast-audit.json (50/50 pass WCAG AA)"
    ba_vai_ba_mau: "khái niệm --brand · chủ đề --ok · chờ --warn"
    dung_lam_gi: >
      VIỀN (border-top 3px trên tab, border-left 2-3px trên hàng) và nền nhạt.
      KHÔNG làm màu chữ trên nền nhạt — chữ giữ --ink/--ink-2 đã đo.
    nhan_dang_dung: ".r-dung viền dày hơn (3px) để tách khỏi nhãn rỗng"

test_moi_35_phep_kiem:
  vi_sao_can: >
    Tab/phân trang/popup là JS trên trình duyệt. type-check xanh, build xanh, và
    trang vẫn hỏng nếu mốc đổi tên hoặc handler không nối. Cùng lớp lỗi với bug
    nhãn dài phình cột.
  quet_TINH_khong_chay_trinh_duyet: >
    Repo không có playwright/jsdom; thêm một phụ thuộc để kiểm ba mốc là không
    tương xứng (security_baseline §7). Kiểm được tĩnh: mốc có mặt · handler đọc
    đúng data-* · popup là <dialog> · form đều api-only · 0 hex gõ tay trong khối
    màn Danh mục · ba tab dùng đúng ba token đã audit.
  kiem_hai_chieu: "đổi `data-dmtab` thành `data-XXtab` → exit 1; phục hồi → exit 0"
  loi_cua_TEST_tu_bat: >
    Phép kiểm "tab đầu mang aria-selected=true" đỏ trên markup ĐÚNG — regex tôi
    viết quét cả trang nên bắt lẫn aria-selected của tab màn Nạp. Sửa: đếm trên
    chính các nút dm-tab.

verify:
