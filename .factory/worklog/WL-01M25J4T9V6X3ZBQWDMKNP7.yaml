loi_a_va_hai_thu_chi_lo_khi_chay_that: >
  Chủ dự án chọn lối (a): LÕI TỰ xếp việc sau khi ghi bản ghi video, fire-and-
  forget, bỏ qua YouTube (đã có ảnh từ id) và `kho://`. Chạy thật lộ HAI lỗi mà
  mọi cổng đều bỏ qua:
  (1) `egress.gui(_chay=)` sai tên tham số (đúng: `chuyen=`) ⇒ tên lạ rơi vào
      `**kw` rồi vào dòng log JSON ⇒ TypeError. Năm vế đầu đọc NGUỒN nên không
      thấy; thêm vế `6` CHẠY THẬT với LÕI giả + yt-dlp giả.
  (2) DDL sửa mà DB ĐANG CHẠY vẫn CHECK cũ — job đi trọn đường rồi chết ở
      `dang-verify`. Cổng dùng DB TẠM dựng từ DDL MỚI nên mù hoàn toàn ca này.
      Viết `core/tools/di_tru_kieu_moc.py` (12 bước SQLite, có bản lùi, đếm
      hàng trước/sau). KHÔNG dùng `dung_lai_db.py`: nó dựng lại từ export, mà
      exporter chỉ ghi `la_dan_xuat = 0`.

