doi_thiet_ke_so_voi_T12-29_ban_soan: >
  Bỏ oEmbed, dùng `yt-dlp --write-thumbnail --skip-download`. Lý do đo được:
  oEmbed của Facebook ĐÒI app token từ 10/2020 (fb là host chủ dự án hỏi), và
  `douyin.com` còn chưa có trong allowlist. `yt-dlp` có extractor cho CẢ BỐN
  host — 0 token, 0 nhánh per-platform — và nó đã cài, đã qua cửa egress, đã
  có allowlist. Ghi ở `WO-071` + `PLAN-2026-09-09`.

