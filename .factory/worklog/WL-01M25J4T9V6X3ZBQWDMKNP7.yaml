ba_thu_KHONG_AI_THAY_neu_chi_lam_phan_de:
  - >
    `image/*` CHƯA CÓ trong bảng mime. Hai thứ hỏng cùng lúc mà không ai báo:
    `luuHienVat` chỉ soi magic `if (loai)` ⇒ mime lạ LỌT QUA lớp thứ sáu của
    intake — đúng lúc byte đến từ một CDN ngoài; và `hienVatPhucVu` trả
    `octet-stream` + `attachment` ⇒ thẻ 2 tầng KHÔNG hiện nổi ảnh. Thêm
    `image/jpeg`(ffd8ff) + `image/png`(89504e47) + `xem_truoc: "anh"` (inline).
  - >
    Cửa gắn hiện vật THÊM chứ không THAY (`media: [...media, entry]`) — đúng ô
    backlog append của transcript (2026-09-08) còn treo ở TẦNG CỬA. Thêm
    `thay_kieu_moc`; mặc định `false` nên 0 ca gọi hiện tại đổi.
  - >
    `kieu_moc` được cửa KIỂM mà **CHƯA BAO GIỜ ĐƯỢC GHI** — không một
    `UPDATE media SET kieu_moc` nào trong repo. Cột có trong schema từ T01-45,
    trường có trong payload từ T08-30, và nó đi vào hư không. Nên phép THAY
    không có gì để khoá vào, VÀ `AC-V1` (*hiện vật .vtt mang `kieu_moc:
    la_asr`*) chưa bao giờ đúng trong DB — trong khi cổng của AC ấy vẫn xanh.
    Đã thêm `ghiKieuMoc`. Mở rộng phạm vi T08-38 trong CÙNG module, khai ra ở
    task file chứ không nới lặng lẽ.

