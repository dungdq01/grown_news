bug:
  - >
    WO-021 gỡ ô *"Địa chỉ trong kho"* đúng theo yêu cầu, nhưng HAI hàm gửi vẫn
    đọc nó. `G("vd-slug")` trả `null`, `slug` thành `""`, và phép kiểm ngay dưới
    từ chối chuỗi rỗng ⇒ **luôn đỏ**. Người dùng không có cách nào qua vì KHÔNG
    CÒN Ô NÀO để sửa cái địa chỉ đó
  - >
    `?.value ?? ""` TRÔNG như đã phòng thủ, nhưng cái nó phòng thủ lại rơi thẳng
    vào một phép kiểm từ chối chuỗi rỗng. Guard không cứu được gì — đây là hình
    dạng đáng nhớ: một `?.` làm lỗi IM LẶNG ở chỗ nó xảy ra, rồi nổ ở chỗ khác
  - "Bài viết sống sót vì nó TỰ SUY. Hai đường kia chết hẳn kể từ WO-021"

