  chungcat_file: 100
  task_s7: "18 file T12-0 … T12-18 (THIEU T12-3 — chua ro doi so hay bo)"
  bang_khai: "chungcat/assets/{model,cua,nguon-transcript,nguong}.json — DU, gom
    ca nguon-transcript.json cua FR-054"
