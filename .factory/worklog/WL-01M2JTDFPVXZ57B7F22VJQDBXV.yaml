tiktok_anh_trong: |
  Lo ra khi nhin poster: mot o den. `yt-dlp --list-thumbnails` cho thay TikTok
  cong bo BA ban — dynamicCover · cover · originCover — va `--write-thumbnail`
  lay ban CUOI (`originCover`), von la gradient TRONG 4 761 byte. Ban `cover`
  la anh that 28 980 byte.

  Sua: `--write-all-thumbnails` roi chon tep LON NHAT. Khong go ten ban nao —
  moi nen tang dat ten khac nhau, con "anh trong nen xuong gan bang khong" thi
  dung o moi nen tang.

  LO THU HAI ngay do: chay lai bi chinh luat "da co anh ⇒ thoi" chan, kem cau
  loi nghe nhu dang lam dung. Ban ghi KET VINH VIEN voi anh hong. Them co `ep`
  — dung cai "sinh lai la viec NGUOI bam" ma chu thich cu da hua nhung chua ai
  cai. Ve 11f kep: `ep` CHI mo dung luat ay, khong pha loai tru douyin hay
  allowlist.

  Nghiem thu that: bam nut ↻ tren cua so -> job `ep=True` -> xong -> 28 980 B.

nam_lan_cong_xanh_ma_man_hong: |
  Ca nam chi lo khi MO TRINH DUYET THAT. Day la lan thu hai lien tiep nhu vay.

  1 Regex gop header an luon CHINH dong khai: `const HJ = HJ;` =>
    `ReferenceError: Cannot access 'HJ' before initialization` => toan bo FE
    chet. Khong cong nao bat.
  2 Icon DE len anh — the ngoai danh sach chi dat `data-i` khi KHONG co anh;
    toi dat ca hai.
  3 Anh doc 540x960 tran cao 1207px trong khung 382px. `height:100%` vo dung:
    `.cd-n` cao theo NOI DUNG, ma noi dung la chinh tam anh — phan tram gap
    vong tron nay thi roi ve `auto`. Phai neo TUYET DOI.
  4 Nhan bi day len dinh: `translate(-50%,-50%)` tinh theo kich thuoc CHINH NO,
    ma `.hv-play` von da to bang ca khung.
  5 Nut ↻ mang `duong` RONG khi mo tu danh sach: HAI duong mo cua so mang hai
    hinh dang — tu danh sach thi `ban.slug` da la `<loai>/<slug>`; tu URL thi
    phong bi dat `slug` = `url_normalized` va duong that o `duong`. Doc mot
    trong hai thi mot nua so cua so co mot cai nut chet cam.

