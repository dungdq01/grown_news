quy_chu_cac_do_KHAC: |
  Chay ROI tung file (129 file) thay 7 file do. Khong cai nao thuoc don vi nay.

  Lan quy chu DAU TIEN cua toi SAI va toi ghi lai day de khong ai lap:
  toi `git stash push` ba file cua don vi nay roi chay lai, thay
  `opacity-khong-pha-contrast` chuyen XANH, va suyt ket luan "do la loi cua
  T03-130". Nhung `git stash` go ve HEAD, ma CSS the cua `T03-126` cung DANG
  CHUA COMMIT trong chinh `prototype.css` — nen phep "go" ay xoa luon luat
  `.cd-n[data-i]::before`. Cong xanh vi luat BIEN MAT, khong vi loi duoc sua.

  Do lai dung cach: dung mot ban `prototype.css` chi DAO NGUOC 3 hunk cua
  T03-130 va giu nguyen moi thu khac. Cong THAY luat `.cd-n` o CA HAI ban
  => chu la `T03-126`, khong phai don vi nay.

  Bai hoc: `git stash` khong phai phep "go mot don vi viec" khi cay lam viec
  dang mang sua chua commit cua NHIEU don vi. Phai dao nguoc dung hunk.

phat_hien_lon: |
  `npm test` CHE 116 cong. `package.json:scripts.test` noi 129 file bang `&&`,
  va `page-weight.test.js` dung thu 13 — no DANG DO tu 2026-09-05 (`WO-055`,
  chu la mot phien khac). Moi lan chay `npm test` deu chet o do, nen 116 file
  sau no CHUA TUNG CHAY trong ca phien nay.

  Sau khi chay roi, 6 cong do khac lo ra, va 4 trong so do la no cua chinh
  cac don vi truoc trong phien nay:
    - api-guard          : `ghiKieuMoc` thieu `banXuat()`      <- WO-071
    - opacity-...        : `.cd-n[data-i]::before` 3.63:1 < 4.5 <- T03-126
    - man-video          : 2 thuoc tinh `src="https://` (hotlink ytimg) <- T03-126
    - man-video/tai-lieu : man hien 4 the thay vi 2, 6 thay vi 3  <- chua quy chu
    - moc-fe-con-that    : `hienVatVideo is not defined`         <- chua quy chu
    - mot-bien-mau       : cung so page-weight                   <- WO-055

  Toi da bao "suite web co dung MOT FAIL" o cac ban giao truoc. Cau do SAI, va
  no sai vi toi tin vao `npm test`. So dung la 7. Da mo o backlog M03.

