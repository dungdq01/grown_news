    đỏ_do: claude-opus-5

ba_mac_dinh_tu_chon: >
  Chủ dự án duyệt bằng một chữ "duyệt", không trả lời ba câu tôi hỏi kèm bản
  vẽ. Không hỏi lại để chặn tiến độ — chọn mặc định AN TOÀN HƠN và ghi ra để
  đảo lại bằng một câu. Chi tiết ở worklog mốc duyệt.

quyet_dinh_thi_cong:
  - gap_bang_details: >
      `<details>` của trình duyệt lo gấp/mở — 0 dòng JS, 0 byte CSS cho hành vi
      ấy. Ô mở sẵn biến hộp thoại XÁC NHẬN thành một cái FORM: người bấm
      "Chưng cất" đã quyết rồi.
  - maxlength_gap_doi_tran: >
      Đặt `maxlength` BẰNG trần thì trình duyệt CẮT ÂM THẦM đúng thứ server từ
      chối bằng 422 kèm lời giải thích — người gõ quá tay không bao giờ biết
      câu mình viết đã cụt. Gấp đôi cho người gõ xong, THẤY "vượt N ký tự", rồi
      tự rút. Vẫn có trần vì một ô không giới hạn là ô dán được cả quyển sách.
  - chip_dien_khong_gui: >
      Chip đổ chữ vào textarea rồi để con trỏ ở cuối. Chip gửi thẳng là một nút
      làm hai việc, và người bấm nhầm không có đường lùi.
  - spread_co_dieu_kien: >
      `chi_dan` chỉ vào body KHI CÓ. Gửi chuỗi rỗng thì MỌI job mang thêm một
      trường — vào `sha256`, vào `egress` — và `T12-25 AC2` (*job không chi_dan
      chạy y như cũ*) thành lời nói suông.
  - fe_khong_viet_lai_cau_loi: >
      Hiện NGUYÊN VĂN 422 của server. Hai bản của một lời là hai chỗ để lệch,
      và bản FE sẽ nói câu cũ sau lần server đổi trần.
  - khong_disable_nut_gui: >
      Nút xám không nói vì sao nó xám; người bấm vào chỗ trống rồi tự đoán. Để
      nút sống, bấm thì hiện đúng câu 422.
  - khong_them_cot_cho_dong_meta: >
      `veMetaChiDan` đọc `chi_dan` từ FRONTMATTER bản nháp bằng một phép quét
      dòng, không parse YAML: cần đúng một trường, và kéo một trình phân tích
      YAML vào chunk là trả vài KB cho một dòng.
  - css_trong_chunk: >
      `gn.css` dư 22 byte. Một luật chỉ dùng trong MỘT hộp thoại mà nằm ở bundle
      chung thì mọi độc giả tải nó. Đo sau khi làm: `gn.css` KHÔNG đổi byte.

vet_sua_giua_chung: >
  Cổng `token-only` chặn `border-radius:999px` gõ cứng. Tokens đã có sẵn
  `--r-pill` cho đúng hình viên thuốc — dùng nó. Cổng bắt đúng: một con số ma
  trong CSS là chỗ giao diện bắt đầu trôi khỏi hệ token.

