  chủ dự án duyệt (mốc `WL-01M1SH3B8W5R2Y7K4NPQVDXC6T`), rồi mới viết cổng ĐỎ,
  rồi mới code. Không dòng mã bước 2 nào tồn tại trước mốc duyệt.

