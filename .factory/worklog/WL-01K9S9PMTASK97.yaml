  CẤU TRÚC, nhưng sáu lỗi NGHĨA mà cổng đó không đo được:

  1 · **Hai màn sống bằng cửa KHÔNG TỒN TẠI.** T03-93 khai `GET /api/job` +
      `GET /api/viec/<id>`; T03-94 khai "cửa LÕI T08-19" cho hàng đợi nháp. Đo
      `web/api/router.mjs`: chỉ có `GET /api/model`, `POST /api/job`,
      `POST /api/nhap-chung-cat` — KHÔNG cửa ĐỌC nào. `check_g6b` đo
      `phạm_vi_ghi` và AC/cmd, không đo *"cửa mà AC dựa vào có thật không"*.
  2 · **Ba `cmd` của T03-97 không đo được AC của chúng** (`#cổng-không-đỏ-được`):
      hai vế dùng `check_g6b.py` (nó không đọc chữ trong task file, không đọc
      `rule.md`), một vế dùng `sinh_dot_hai.py` — lệnh SINH, xanh khi chạy xong
      kể cả khi sidebar sinh ra vẫn theo nhóm gom.
  3 · **T03-97 khai sửa hai task, thực tế phải sửa NĂM.**
      `grep -lE "Xưởng|xuong" 07_plan/M03_web/tasks/T03-9*.md` → 92·93·95·96·97.
      T03-95 khai *"badge trên đúng MỘT mục nav (Xưởng)"* — mục đó nay tên
      **Chưng cất**; badge trỏ sai mục là badge nói dối.
  4 · **`~150B dư` sai** — đo thật `gn.css` **39 byte** (102361/102400). Ba màn
      của đợt đều thêm CSS ⇒ đơn vị giảm-béo phải đi TRƯỚC, không đi sau.
  5 · **`/dot-hai/` vẫn sống và nay chỏi rule 5** — không đơn vị nào tháo, và
      T03-97 không khai file nào để tháo được. Quyết định của NGƯỜI.
  6 · **T08-20 (của chính lượt trước) có HAI lỗi R1** máy bắt đúng:
      `web/package.json` ngoài boundary M08 (`web/api/**`) — nó là đất M03.
      Tự ghi nhận lượt trước còn nhẹ hơn sự thật: không chỉ thiếu khai, mà là
      file của module khác.

