    Heredoc lại nuốt escape: `\n` thành xuống dòng thật và làm vỡ file cổng đang
    sửa. `node --check` bắt ngay. Cách chạy được vẫn là ghi script ra file bằng
    Write — tôi đã biết điều này và vẫn tái phạm

