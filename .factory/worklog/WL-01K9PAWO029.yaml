bug:
  - >
    `<dialog id="dlg-nhan">` (shell:522) và `<input id="dlg-nhan">` (shell:537)
    cùng tồn tại. `getElementById` trả PHẦN TỬ ĐẦU TIÊN ⇒ cái dialog; dialog
    không có `.value` ⇒ `label_vi` luôn rỗng ⇒ server trả 422 *"cần NGƯỜI khai:
    label_vi"* dù người dùng ĐÃ điền
  - >
    Cùng id đó phục vụ HAI việc khác CHẠY ĐÚNG (`showModal`/`close` vốn thuộc về
    dialog), nên lỗi chỉ lộ ở MỘT nhánh — nhìn bằng mắt thì mọi thứ hợp lý
  - >
    Hệ quả thứ hai, âm thầm hơn: vòng dọn form cũng trúng cái dialog, nên ô nhập
    KHÔNG BAO GIỜ được xoá giữa hai lần mở
  - >
    Hệ quả rộng: **không thêm được khái niệm hay chủ đề nào qua giao diện** —
    và đó chính là lý do các màn nạp hiện *"Danh mục đang trống"*

vi_sao_cong_hom_qua_khong_bat:
  - >
    `moc-fe-con-that` (WO-028) hỏi *"mốc có TỒN TẠI không"*. Nó KHÔNG hỏi *"có
    ĐÚNG MỘT không"*. Id này tồn tại — hai lần. Một cổng đúng câu hỏi nhưng hẹp
    một bậc so với thứ cần canh
  - >
    Đây là lần thứ hai trong hai lượt liên tiếp một cổng tôi vừa viết bỏ lọt
    đúng cái lớp nó tưởng đã phủ

ban_sua:
  - >
    Đổi tên cái INPUT (`dlg-nhan-o`), giữ id của `<dialog>` — `man-danh-muc.test.js:100`
    đang đòi `<dialog id="dlg-nhan">`. Sửa hai chỗ FE muốn input; hai chỗ muốn
    dialog giữ nguyên
  - >
    Vế HÀNH VI trong cổng đo TÊN THẺ, không chỉ đo id: `<input>` chứ không phải
    thẻ bao. Đo id thôi thì lần sau ai đó lại gắn id ấy lên một `<label>`

tu_bat_duoc:
