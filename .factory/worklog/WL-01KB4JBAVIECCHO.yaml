MOT_SU_CO_HAI_NGUYEN_NHAN: |
  Hai o backlog dev M13 mo trong thoat nhu mot loi. Do ky: HAI nguyen nhan DOC LAP,
  sua mot cai khong chua cai kia:
    .vtt checkout CRLF (khong co .gitattributes)          <- nguyen nhan B (M04)
      ⇒ sha256 noi dung ≠ sha256 trong TEN FILE
      ⇒ dung_lai_db tu choi giua chung ⇒ DB RONG
      ⇒ xuat_kho coi 16 export la mo coi va XOA
    check_running.py CHAY THAT hai lenh do tren kb/ cay    <- nguyen nhan A (M01)
  Khong co A thi B chi lam mot lenh chay tay that bai. Khong co B thi A van la mot cong
  duoc phep ghi de du lieu. ⇒ WO-100 co HAI ve, hai module, hai don vi.

ve_A_la_LUAT_GOC_o_dang_cong_cu: |
  check_running.py:50 subprocess.run THUC THI moi lenh liet trong RUNNING.md. Hai lenh
  o :173-174 khong co co --fix|--ghi|--ky nen nhanh "chi cu phap" (:96) khong bat, va
  GHI_KHONG_CO (:45) chi co MOT phan tu (07_curate/curate.py).
  Day la "khong ai duoc so huu thu dung de danh gia minh" o bien the: CONG KHONG DUOC
  DOI THU NO DO. He qua ngoai mat du lieu: ai chay bo cong cung nhan working tree ban,
  va `git status` sau do KHONG con phan biet duoc "toi vua sua gi" voi "cong vua sinh
  gi" — dung cong cu dung de QUY CHU khi may do.
  VI SAO SONG LAU: tren main no VO HAI (DB va export khop, dung lai ra y het). Chi
  worktree — noi .vtt checkout CRLF — moi lo.

chon_b_khong_chon_a: |
  T01-58 chon (b) chay lenh voi KB_DIR tam, KHONG chon (a) them hai lenh vao
  GHI_KHONG_CO. Ly do: (a) ha dung HAI LENH QUAN TRONG NHAT xuong muc "chi kiem cu
  phap" — cong con xanh ma khong ai biet dung_lai_db co chay duoc khong. (b) giu nguyen
  "chay that", chi chay o cho khac. Co che da co san: dung_lai_db.py:37 · xuat_kho.py:33
  deu doc KB_DIR; do_tai.py:216 da dung dung khuon.
  AC3 cua T01-58 canh chinh dieu nay: grep dung_lai_db|xuat_kho trong khoi GHI_KHONG_CO
  phai ra 0 — de khong ai lang le roi ve (a).
  Va T01-56 ca D chong SUA QUA TAY: lenh DOC van phai chay that; ha moi lenh xuong
  --help thi cong mat rang va RUNNING.md thanh danh sach khong ai kiem.

ve_B_mot_dong_dong_ca_mot_HO: |
  `.gitattributes` hom nay RONG noi dung (2 dong comment giu dat, map v29).
  `kb/_media/** -text` (khong phai `binary`: -text chi tat doi EOL; binary tat ca diff,
  ma .vtt la van ban that nen mat diff la mat thu huu ich).
  Mot dong nay dong ca mot HO ca da gap: su co worktree hom nay · check_worklog do 8 ve
  tren worktree ma xanh tren main · "19 file lech chi vi EOL" luc review nhanh m13.
  ⚠️ Thi cong xong phai kiem tren CA HAI cay — loi nay VO HINH tren main.

ve_C_cau_sai_RUNNING_md_54: |
  "Clone moi chua co DB: chay dung_lai_db.py mot lan de dung" — KHONG chay duoc: kb/_media/*
  bi .gitignore tru vai ngoai le (3/8 file trong git) nen clone sach luon dung o "kho
  thieu byte". Do HAI LAN doc lap (WL-01M24MFFK9T8... T04-9 · WL-01M27G9E22... hom nay).
  CHUA mo don vi: RUNNING.md chua co chu trong project_map (cung nhom "con thieu chu" voi
  03_docs/**, ghi chu v15). Can mot dong cua chu du an ve ai sua. Ghi o WO-100 §3.

