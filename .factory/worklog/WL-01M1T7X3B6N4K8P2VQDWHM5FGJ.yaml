moc_duyet: >
  Chủ dự án duyệt `05_uiux/wireframes/SCR-19-tai-xuong-va-print.md` và trả lời
  đủ ba câu hỏi. Bước 2 được phép bắt đầu từ đây, KHÔNG sớm hơn.

ba_quyet_dinh:
  - cau: "Ca tài-liệu chỉ một mục — giữ menu xổ hay đổi thành nút thẳng?"
    chon: GIỮ MENU XỔ
    hieu_qua: >
      Nút "Tải xuống ▾" đứng CÙNG MỘT CHỖ, CÙNG MỘT HÌNH ở mọi loại bản ghi.
      Người học một lần rồi dùng ở khắp nơi; đổi hình theo loại thì họ phải
      nhận diện lại mỗi lần mở một bản ghi khác kiểu.
  - cau: "Bài viết có thêm `File gốc` không?"
    chon: CÓ
    lam_ro_nghia: >
      Lúc hỏi tôi cho rằng đây là "hai tên cho một thứ" — SAI, và câu trả lời
      của chủ dự án làm lộ ra sự khác biệt thật:
        `dang=md`  → THÂN BÀI, không frontmatter
        `dang=goc` → NGUYÊN FILE `.md` như trên đĩa, CÓ frontmatter
      Ai cần đọc thì lấy `md`; ai cần NẠP LẠI ở nơi khác thì cần frontmatter —
      thiếu nó thì bản ghi mất `id`, `nguon`, `category`, `concepts`.
      Hai thứ khác nhau, và tên gọi nay nói ra điều đó.
  - cau: "Nút đặt ở đâu?"
    chon: TẠM THỜI chỉ trong cửa sổ đọc/xem
    hieu_qua: >
      Thẻ ngoài lưới tiện hơn nhưng thêm byte cho MỌI trang, kể cả trang người
      chỉ lướt. `gn.css` còn 22 byte — thêm ở đó là mua tiện lợi bằng tốc độ
      tải của mọi độc giả. Để dành, không bỏ.

