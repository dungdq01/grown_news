quyet_dinh:
  - |
      Bảng thứ tư xuất file RỖNG khi `audit_loi` chưa tồn tại, KHÔNG bỏ qua bảng.
      Bảng này được tạo lúc ghi audit đầu tiên (`loiGhiAudit`), không ở
      `loi.schema.sql` — nên trên DB vừa init nó chưa có. "Chưa có dòng audit nào"
      là một câu trả lời; thiếu hẳn file thì im lặng, và im lặng đọc giống hệt
      "bản lùi này không có audit" — đúng thứ WO-046 đi dẹp.
  - |
      KHÔNG dời DDL `audit_loi` sang `loi.schema.sql`. Ba trigger append-only sống
      cùng chỗ với CREATE trong `loiGhiAudit`; tách CREATE ra mà để trigger lại là
      dựng hai nguồn chân lý cho một bảng. Ngoài phạm vi T08-28.
  - |
      `04_system/adr.md` KHÔNG nằm trong `FROZEN.lock` (`grep -c` = 0) ⇒ sửa
      "ba bảng" → "bốn bảng" không cần FR. Vế chịu lực của ADR-06 (c) là
      "hai bảng bí mật (`ma_moi`, `phien`) không xuất" — vế đó giữ nguyên; con số
      "ba" là ngẫu nhiên.
  - |
      Cổng cũ đo `=== 3`, tức đo *"ba bảng ĐÃ KHAI"* — số lấy từ chính thứ bị đo
      (`#tự-khai`), nên nó xanh mãi dù bảng thứ tư không ai cứu. Thêm một vế đo
      HÀNH ĐỘNG THẬT: ghi một dòng audit rồi đòi thấy nó trong bản lùi. Một file
      rỗng cũng "có mặt".

