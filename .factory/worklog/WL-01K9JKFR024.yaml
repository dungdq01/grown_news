lam_gi:
  1_endpoint_moi: >
    `GET /api/index` (articles.mjs `chiMucMo`) trả ĐÚNG hình dạng
    `open-index.json` nhưng đọc lúc request. Gộp theo `url_normalized` cùng luật
    M03-R5 mà emitter dùng, sắp theo priority. Gồm mọi review_status + thân bài.
  2_nap_uu_tien_API: >
    `nap()` thử `/api/index` trước, rơi xuống file tĩnh khi không có API. CHỈ thử
    ở bản THẬT (`goc() === "/"`) — API đọc kb/ thật, ở `/mock/` nó trả kho khác
    nên chỉ số trỏ sai bài (cùng lý do `doTimApi` tắt API_CO khi không ở gốc).
  3_dongBoThe: >
    Bù thẻ THIẾU ở màn Tất cả và sửa lại `data-open` của thẻ cũ. Không vẽ lại
    toàn bộ: markup thẻ do emitter sinh, vẽ lại ở FE là bản thứ hai và hai bản
    sẽ lệch — đúng lớp lỗi đã gặp ba lần (parser YAML, word_count, tiêu đề đôi).
  4_data_slug: >
    Thêm vào 4 chỗ emitter sinh (`the`, `dong`, `dongDuyet`). `data-open` là CHỈ
    SỐ vào chỉ mục, và chỉ mục runtime có thể khác chỉ mục lúc build. FE cần một
    khoá BỀN để sửa lại chỉ số — slug duy nhất trong kho, url_normalized thì không.

rang_M03_R1_van_nguyen:
  van_de: >
    `approved-only` là filter Quartz chạy lúc BUILD, và nó là bề_mặt S3 của
    M03-R1 — thứ chống bài draft (kể cả bài sinh do prompt injection) lọt lên web.
    `GET /api/articles` trả MỌI trạng thái nên đọc động không tự có răng đó.
  ke_hop_phap: >
    Hệ thống ĐÃ tách hai loại màn (index.ts:359 — "Màn Tất cả là màn QUẢN LÝ: nó
    hiện mọi trạng thái"). Nên: màn quản lý đọc động thấy mọi trạng thái (đúng
    vai), còn TRANG BÀI vẫn qua build + ApprovedOnly.
  kiem_chung: "web/site/docs/ và web/site/article/ RỖNG — 3 bài draft không lọt trang nào"

test_bat_duoc_loi_THAT_ngay_luot_dau:
  what: "`theFE()` thiếu `data-slug` — emitter có, FE không"
  hau_qua_neu_lot: >
    Thẻ FE vẽ ra không sửa được `data-open` ở lần đồng bộ sau ⇒ đứng yên với chỉ
    số cũ ⇒ bấm mở SAI BÀI. Lỗi im lặng, không ai thấy tới khi bấm.
  vi_sao_test_bat_duoc: >
    Khối 4 so TỪNG data-* giữa hai khối code. Bản song sinh nào cũng phải có
    cổng — đó là bài học từ ba lần trước.

