hinh_dang:
  - >
    `loai_nguon (id, module, nhan, thu_tu)`. `module` là thứ trả lời câu người
    dùng hỏi: *loại nguồn nào ứng với phân loại nào*
  - >
    `loai-nguon.json` KHÔNG bị thay. File đó giữ enum `source_type` và sinh các
    ràng buộc `CHECK`; nó phải đọc được KHI DB CHƯA TỒN TẠI (`coFileBai()` và
    phép kiểm `type` của route chạy trước khi có DB). Bảng giữ thứ NGƯỜI DÙNG
    thấy — định dạng · nơi phát · loại bài. Hai vai, không phải hai bản
  - >
    KHÔNG có POST/DELETE: danh sách đến từ schema và whitelist. Thêm một loại mà
    DDL không biết là hứa thứ `CHECK` sẽ từ chối; xoá một loại còn bản ghi dùng
    là làm facet mất một nhóm. Đổi CHỮ HIỆN THỊ thì được — đó là thứ của người
    dùng
  - >
    PATCH từ chối `module`: loại nguồn thuộc phân loại nào là do PHÉP SUY
    (`nguonCua`) quyết. Gán `pdf` sang `video` thì màn Video liệt kê một định
    dạng không video nào có

luat_gieo_sai_lan_dau:
  - >
    Tôi viết "gieo khi BẢNG RỖNG". `check_media_dan_xuat` đỏ ngay: nó dựng DB1
    bằng SQL trực tiếp (không qua `dung_lai_db`), nên `loai-nguon.yaml` xuất ra
    RỖNG — rồi vòng sau thấy bảng rỗng và gieo 14 dòng ⇒ hai cây export khác nhau
  - >
    "Bảng rỗng" và "chưa có file" là HAI trạng thái. Một kho đã có
    `loai-nguon.yaml` rỗng là một kho đã NÓI: không loại nguồn nào. Gieo ở đó là
    ghi đè một câu trả lời đã có. Luật đúng: gieo khi CHƯA CÓ FILE

tu_bat_duoc:
  - >
    Điểm bất động hỏng lần đầu vì export ghi khoá `label_vi` (quy ước của
    `yaml_danh_muc`) còn import đọc khoá `nhan` ⇒ tên rơi về id sau một vòng.
    Cổng bắt bằng cách so từng hàng, không so số hàng — so số thì 14 == 14 và nó
    xanh
  - >
    Cổng CHẾT thay vì BÁO hai lần: `dem()` ném khi bảng chưa có, và `items[0]`
    là `undefined` ở lần chạy đầu. R5 đòi ĐỎ TRƯỚC, nên "chưa có" là trạng thái
    HỢP LỆ của lần chạy đầu — phép kiểm phải báo, không chết
  - >
    Đặt task vào M02_kb trong khi `core/**` thuộc boundary M01_core; `check_g6b`
    bắt. M02_kb là `kb/**` — DỮ LIỆU, không phải công cụ sinh ra nó
  - >
    Truy vấn "tìm mục lạ" của tôi dùng `id LIKE '%__%'` và khớp TẤT CẢ — trong
    SQL `LIKE`, `_` là ký tự đại diện một ký tự. Lỗi phép đo, không phải dữ liệu

kho_that:
  - >
    Kho THẬT nay có bảng `loai_nguon` 14 hàng (5 bài viết · 6 tài liệu · 3 video)
    và `kb/loai-nguon.yaml`. Quy chủ: server của NGƯỜI DÙNG đang chạy trên 8787
    với kho thật (có `-wal`/`-shm` ⇒ kết nối mở); họ khởi động lại nó sau khi tôi
    đổi mã, nên bản mới áp DDL và `banXuat()` xuất file
  - >
    Không có gì lạ lọt vào: đúng 14 mục đã gieo, và số bản ghi không đổi
    (`bai_viet 1 · tai_lieu 0 · video 0`)

phan_FE_da_noi:
