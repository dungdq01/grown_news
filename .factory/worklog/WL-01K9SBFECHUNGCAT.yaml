hoc_duoc: |
  BA lỗi chỉ hệ ĐANG CHẠY mới lộ, không cổng nào bắt:

  1 · `.rise` giữ `opacity:0` cho thẻ tạo bằng JS — IntersectionObserver chỉ
      quét panel có sẵn trong shell. Màn nằm đúng chỗ, cao 813px, và VÔ HÌNH.
      `innerHTML` 3450 ký tự, `getBoundingClientRect()` trả số thật,
      `display:block` — mọi thứ nói "có", chỉ `opacity` nói "không".
      **Chỉ ẢNH CHỤP mới thấy.** Ô nợ M03.
  2 · cửa vào THỨ HAI tới `/dot-hai/`: `cat_khi_khac: true` làm nó mọc trong
      cụm `+ nạp`. `cmp` hai shell và `markup-matches-css` đều xanh trong khi
      cửa đó còn đó, vì nó do `trang.mjs` SINH lúc render.
  3 · web phải khởi động VỚI `CHUNGCAT_KHOA_LOI`; thiếu nó thì nút báo 403 qua
      toast — đúng hành vi, nhưng khoá nên vào chỗ sống qua restart.

  Và một lỗi ĐO của chính tôi, ba lần trong phiên: heredoc làm sập `\n` thành
  xuống-dòng THẬT ⇒ hỏng một regex JS, cắt một khối `>` Markdown, hỏng một gate
  Python. Viết `\n` vào file thì dùng công cụ Write/Edit, đừng qua heredoc.

