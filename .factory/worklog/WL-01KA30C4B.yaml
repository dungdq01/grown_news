quyet_dinh:
  - |
      vong.py THÊM VÀO phạm vi T12-13 lúc thi công. `_duong()` bản đầu trỏ cứng
      `new/`, nên sau nhịp claim đầu tiên mọi hàm ở dưới (đếm egress, đổi giai
      đoạn) ném FileNotFoundError. Worker không thể claim mà không có một phép
      claim ở tầng hàng đợi — PM đã khai "dùng ghi_nhan_gui/chay_lai sẵn có",
      tức vong.py là phụ thuộc chứ không phải đất cấm.
  - |
      HAI LỖI CỦA TÔI, cổng bắt được, ghi ra vì cả hai là lớp lỗi lặp lại:
      (1) `_duong_phan_hoi` đặt phản hồi CẠNH file job ⇒ với job chưa bị chiếm
          nó rơi vào `new/`, phá bất biến §5.0 ("new/ chỉ chứa file HOÀN CHỈNH")
          và check_idempotency đếm HAI việc sau một lần nạp. Sửa: phản hồi ở
          `cur/`|`done/`, không bao giờ `new/`.
      (2) `liet_ke` khớp cả `*.phan-hoi.json` ⇒ mỗi việc đã gọi model đếm thành
          HAI. Lọc tường minh.
  - |
      JOB HỎNG KHÔNG ĐI VÀO `done/`. Nó về giai đoạn hỏng và ở lại `cur/` cho
      `chay_lai`. Đẩy job hỏng sang `done/` là nói dối hai chiều: người đọc thấy
      "xong", và `chay_lai` không tìm ra nó.
  - |
      check_khong_tu_duyet NỚI ĐÚNG CHỖ. Nó chặn mọi chuỗi chứa `/api/articles`,
      mà quyết 1a của chủ dự án chốt đường ĐỌC nguyên liệu là
      `GET /api/articles/media/<sha>` — cũng chứa chuỗi đó. Cấm ở đây là cấm cửa
      GHI (POST đặt approved vô điều kiện), nên phép đo đổi sang PHƯƠNG THỨC:
      0 lời gọi POST tới /api/articles. Vế cấm KHÔNG bị bỏ, nó được đo đúng chỗ.
  - |
      check_tran_hai_nhip bỏ 3600 khỏi phép quét số-gõ-cứng: 3600 là số GIÂY
      TRONG MỘT GIỜ và nó xuất hiện hợp lệ trong mọi phép đổi mốc thời gian
      (vtt._giay, vtt._moc). Quét nó thì cổng tố một phép chia là một trần gõ
      cứng, và người sửa sẽ viết `60 * 60` để lách. Bù lại: thêm ba vế đo HÀNH VI
      (nhịp hai ném khi không đọc được metadata · nhịp một chặn byte ở cửa ·
      byte trong trần thì qua).
  - |
      asr.py KHÔNG import egress, và ThieuAsr thay ImportError trần: cổng phải
      phân biệt THIẾU GÓI với THIẾU MÃ. Model tải vào CHUNGCAT_MODEL_DIR NGOÀI
      repo — trong repo thì git status thấy 500MB và quy chủ mù đi (WO-039).
  - |
      tai_nguon.lenh_tai() TRẢ LỆNH, không chạy. yt_dlp.download() tự mở socket,
      mà M12-R3 đòi đúng một hàm ra Internet — nên hàm này chuẩn bị và xin phép,
      egress.gui() là chỗ đếm và log. `-x` (chỉ audio) vì FR-054 §1.1 chốt không
      lưu byte video.
  - |
      text/vtt chọn thay application/json: JSON KHÔNG có magic (`{` là một byte)
      nên nó sẽ là mục đầu tiên trong bảng mime làm YẾU lớp thứ sáu của intake —
      lớp duy nhất soi byte. WEBVTT là magic thật, 6 byte, chuẩn W3C.
  - |
      chi_dan_xuat cho .vtt — và ba chỗ theo sau. Thêm một dòng mime làm HOME
      PAGE VƯỢT TRẦN (61715/61440): trang.mjs render một chip lọc cho mỗi loại
      nguồn, trên MỌI trang. Nhưng phép sửa không phải cắt byte — nó là sửa
      NGHĨA: .vtt là hiện vật do MÁY sinh, một chip `vtt` ở bộ lọc tài liệu là
      chip không bao giờ khớp bản ghi nào. Lọc ở SSR · chiếu ra khỏi bundle FE
      (cổng define_MEDIA bắt được khoá chết) · cổng facet khớp theo.
  - |
      moi_truong.nap() chỉ điền biến CHƯA CÓ — env thật THẮNG file. Không thì
      một .env cũ lặng lẽ đè giá trị người vận hành vừa export, và họ không có
      cách nào biết mình đang chạy với khoá nào.

