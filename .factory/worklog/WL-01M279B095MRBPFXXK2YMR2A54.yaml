ma_da_viet: |
  const D: Record<string, number> = {};
  const neo = (t: string) => { const g = slugGoiY(t); let a = g; while (a in D) a = g + "-" + (D[g] = (D[g] || 0) + 1); D[a] = 0; return a; };
  ...
  ra.push(`<h${c} id="${neo(h[2])}">` + inline(h[2]) + `</h${c}>`);
  · `D` khai TRONG md() ⇒ reset moi lan render mot bai (FR-073 §1 $dedup: state theo FILE).
  · vong WHILE (khong phai if): heading that ten `foo-1` da chiem cho cung khong va.
  · dung lai slugGoiY :1326 — KHONG viet ham slug thu hai (M13-R2: hai luat slug = link chet hang loat).

