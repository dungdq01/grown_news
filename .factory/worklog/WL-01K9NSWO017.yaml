tu_bat_duoc:
  - >
    CHÈN SAI TẦNG. Tôi đặt dải lối VÀO TRONG panel đã có, và thêm một panel thứ
    hai + một `</div>` lạc. Trình duyệt nói: tab `w=0 h=0`, HAI panel mở cùng
    lúc. Không cổng đọc-chuỗi nào thấy — mọi chuỗi đều CÓ MẶT, chỉ sai vị trí
  - >
    Và một kết luận SAI của tôi từ cùng phép đo đó: tôi đọc "nút Ghi h=0" thành
    "nút biến mất", trong khi nó nằm trong `#tv-meta` vốn ẩn tới khi chọn file.
    Đo đúng nhưng suy sai
  - >
    LÁT CẮT CHẠY QUÁ CUỐI VIEW làm tôi tưởng view video lệch thẻ (-1). Cắt bằng
    "id=v- kế tiếp" thì đoạn cuối gồm cả thẻ đóng của khối bao. Chỉ tài liệu có
    thẻ lạc thật
  - >
    CỔNG XANH KHI TÔI BỎ PHÉP ĐẶT PANEL: phép kiểm nối hai điều kiện trên CẢ
    BUNDLE, và `.hidden =` còn ở hàm khác. Siết vào đúng thân `moTab`
  - >
    CỔNG ĐO HÌNH THỨC: tìm chuỗi `napview` trong bundle, mà bản cài đặt ĐÚNG
    dựng selector từ biến nên chuỗi đó không tồn tại ⇒ đỏ oan trong khi trình
    duyệt đã xác nhận chạy
  - >
    PHẠM VI CẢ SHELL, hai lần trong `thu-vien-nap`: đếm `data-naptab` trên toàn
    shell rồi đòi bằng 3 (nay 5 vì hai dải mới), và "KHÔNG còn tab `tep`" cũng
    quét cả shell. Cả hai đổi sang cắt VÙNG
  - >
    Escaping #30-32: backtick trong chuỗi kép bash bị thay-thế-lệnh ⇒ hai khai
    báo mất thân · `</div>` trong `bash -c` đọc thành chuyển hướng · và `\\b`
    thành ký tự BACKSPACE 0x08 làm `/function moTab\\x08/` không khớp gì — đúng
    lớp lỗi tôi đã tự đặt tên. Đường đi được: script viết bằng Write, ký tự dựng
    bằng `chr()`
  - >
    Comparator bỏ dấu của tôi chỉ thay `đ` thường, không thay `Đ` hoa ⇒ hai ca
    kiểm hai chiều báo DO trong khi răng đúng

