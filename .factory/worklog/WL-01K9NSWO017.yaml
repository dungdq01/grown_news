bug_nang_nhat_khong_cong_nao_thay:
  - >
    HAI MÀN NẠP VÔ HÌNH TỪ TRƯỚC. Luật
    `.pn:has(> [data-mount]:empty):not(:has(> [data-mount]:not(:empty)))` tắt CẢ
    section vì mốc `mbnaptl`/`mbnapvd` rỗng ⇒ mở `/tai-lieu/nap/` là TRANG
    TRẮNG. Đúng câu người dùng: *"chưa có form và design UI cho tài liệu/video"*
  - >
    Chú thích của chính luật khai chủ ý *"ẩn panel khi MỌI mốc rỗng — tức panel
    chỉ còn cái đầu bảng"*. Tiền đề đó SAI với hai màn nạp: chúng đầy nội dung
    TĨNH. Thêm vế còn thiếu: `:not(:has(input, select, textarea, button))` —
    panel có ĐIỀU KHIỂN thì nó không rỗng, điều khiển CHÍNH LÀ nội dung
  - >
    KHÔNG chữa bằng cách cho SSR luôn điền `mbnaptl`: một màn hiện được chỉ khi
    một mốc tình cờ có dữ liệu là một màn có thể vô hình lại bất cứ lúc nào
  - >
    HANDLER `data-naptab` KHÔNG TỒN TẠI. Bấm "Tự viết bài" không làm gì; hai
    trong ba lối nạp bài viết không vào được, tức không viết được bài qua web.
    Mất khi `git checkout --` phá file; bản khôi phục từ build là bản TRƯỚC khi
    handler được thêm. 66 file test bỏ lọt vì chúng kiểm MARKUP ("nút có trong
    DOM") — cả hai đúng, thứ sai là KHÔNG AI NỐI chúng lại

