no:
  - "Chỉ đổi CSS. Bố cục (3 tab, phân trang, popup) giữ nguyên như FR-021 —
     người dùng nói 'tạm thời ổn' về phần đó."
  - "Cổng opacity chỉ đo tone LIGHT (token :root đầu). Dark có bảng riêng
     (--muted-foreground #9A9AA4 vs #6B6B74) và chưa được kiểm bằng máy —
     contrast-audit có đo dark, nhưng cổng này chưa đọc khối đó."
  - "Sọc chẵn-lẻ dùng color-mix 34% glass: nhạt tới mức có thể không thấy trên
     một số ảnh nền. Chưa đo trên cả 4 ảnh nền như contrast-audit làm."
  - "8 chỗ opacity CÓ SẴN trong file (bgn .7, more::after .7, cd.st-draft .72,
     cd.st-rejected .5) — cổng miễn trừ chúng vì không mang màu đỏ hoặc là
     trạng thái thẻ. Nếu sau này ai đặt chữ đỏ vào đó thì cổng không bắt."
