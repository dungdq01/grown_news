ba_lo_trong_chinh_CONG_cua_toi_phep_thu_bat_duoc:
  - >
    Gate gieo vào hàng đợi TẠM rồi hỏi THỢ THẬT ở `:8790` — nó không bao giờ
    thấy. Cổng đỏ vì SAI LÝ DO, đúng thứ `workflow §1a` cấm. Vá: dựng THỢ TẠM
    bằng `api.chay(cong=…)` qua `-c`, KHÔNG chạy thẳng `api.py` — `__main__`
    của nó gọi `chay()` không tham số ⇒ bind cổng THẬT 8790 và giành với THỢ
    đang chạy (chính `api.py:417` cảnh báo: `SO_REUSEADDR` trên Windows cho hai
    socket cùng cổng bind THÀNH CÔNG, nên hỏng mà không ai kêu).
  - >
    Vế 3b đọc thẳng `readFileSync` ⇒ sổ bị xoá thì cổng CHẾT thay vì báo. "Đỏ vì
    crash" không nói cho ai biết vế nào hỏng. Vá: đếm phòng hộ, trả -1.
  - >
    Vế 4e quét CẢ FILE bằng `/chi phí|egress/` ⇒ khớp luôn toast "Sổ chi phí giữ
    nguyên", nên nó XANH cả khi câu `confirm()` đã mất chữ. Vá: neo vào đúng
    chuỗi trong `confirm()` — chỗ người dùng thật sự đọc.

quyet_dinh_dang_ke: >
  Câu xác nhận xoá phải NÓI RA THỨ KHÔNG MẤT: "VẾT CHI PHÍ VẪN GIỮ — sổ egress
  là một file riêng". Không nói thì người dùng tưởng xoá là mất luôn con số đã
  tiêu, và họ sẽ giữ rác lại vì sợ mất sổ tiền. `xoa_han` không đụng
  `egress.*.jsonl`, và vế 3b canh đúng điều đó.

lo_nho_kem_theo: >
  `nhomLoc()` không có nhánh `hong` ⇒ rơi về `"cho"`. Hôm nay vô hại vì việc
  hỏng nằm trong `rac/` và `/api/job` không kể rác — nhưng vô hại DO HOÀN CẢNH,
  không do thiết kế. Đã thêm nhánh tường minh.

