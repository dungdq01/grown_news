cong_moi_phai_do_duoc_ca_chieu_NGUOC: >
  `bang-khai-khong-mo` co hai chieu vi phep chieu co hai cach sai. Chieu A
  (thua) chi ton bang thong; chieu B (thieu — FE doc mot khoa vua bi bo) tra
  `undefined` luc chay, form thieu mot o, va KHONG cong nao do. Chi lam chieu A
  la lam nua viec nguy hiem hon khong lam.
  Ba do OAN cua ban dau, ca ba la loi DO:
    - cat khai bao kieu bang /interface|type/ — file dung `declare const X: {}`
      => cat 0 byte, phep tu kiem §0 to dung cho.
    - tim khoa bang regex tren van ban CHUA tach chuoi => "Chuyen giao:" thanh
      mot "khoa" ten `giao`.
    - doi FE nhac ten tung khoa cua `__DUONG__` — do la bang TRA, khoa la DU
      LIEU. Do nham LOAI BANG.

