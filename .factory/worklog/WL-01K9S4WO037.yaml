  phep TU KIEM VAT LIEU:
    1. hop cat thieu `define_KHUNG_default` (ten esbuild noi `__KHUNG__` thanh)
       => dungKhung() nem, form 0 byte, BA phep "khong co markdown" dung VO
       DIEU KIEN va hien mau xanh.
    2. hop cat thieu addEventListener/createElement => themTinhTuy() khong
       chay, O CON KHONG TON TAI de ma do.
    3. §3 doc than `gomKhung` tim `####` — nhung `####` do `gomTinhTuy()` sinh
       => DO OAN trong khi ma dung.
  Chot vat lieu gio `process.exit(1)`, khong chi canh bao. Mot bang toan `ok`
  dung tren 0 byte form con te hon mot cong do.

