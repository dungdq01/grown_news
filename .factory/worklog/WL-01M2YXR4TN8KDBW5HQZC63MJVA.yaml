chua_nghiem_thu_duoc: |
  Chua chay MOT luot chung cat THAT (ton egress + tien, va la quyet dinh cua
  chu du an). Nen duong `worker -> /duyet -> kho` moi duoc do o TANG NGUON va
  qua E2E --mock; chua co mot ban ghi nao di het duong bang model that.

  Chu du an bam chung cat mot ban ghi la biet ngay: ket qua phai co trong
  `/video/` ma khong can bam duyet, va bam lai lan hai thi ban cu vao thung rac.
