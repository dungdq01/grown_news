WO_092_loi_cua_toi: |
  Chu du an: *"trong multi window van con sinh thumbnail gi day? bao bo het chi
  co sinh transcript va chung cat ma? Cang sua cang thay ngu vay?"* — dung.

  `WO-088` bo viec may khoi duong ong o MAN `/chung-cat/`, nhung danh sach viec
  trong CUA SO la mot bo ve khac (`veViecCuaBan`, chunk `cctab`) chi loc theo
  `slug`. Mot luat, hai cho ve, toi sua mot — chinh lop loi `go_khung` da ghi,
  va lan nay TOI tu tao ra.

  Sua: phep loc DOI LEN CAU (`viecNguoi`/`vatHong`), hai chunk cung doc, khong
  chep. Ve 20 khong do "cctab da loc chua" ma do **phep loc chi co MOT ban** —
  do hanh vi thi lan lech thu ba lai lot.

WO_094_khong_ep_khung: |
  `FR-036a` duyet va THU HEP: *"chi can ko ap phan-tich (ep 5 muc) cho chung
  cat, moi thu de tu nhien — nguoi va model LLM quyet"*. Nen KHONG lam nhanh
  `theo_nguon` nhu FR de xuat — do mot nhanh cau hinh khong ai xin.

  Nhan dien bang `origin: pipeline` (worker ghi cho moi ban may sinh), KHONG
  dung `ho_so`: enum ay FROZEN va chi co hai nac, nac con lai (`thu-vien`) bo
  luon tran 400 tu.

  MIEN dung BA phep ve HINH DANG: thieu muc · tran dan nhap · locator theo muc.
  GIU: tran tu · nhan trong danh muc · schema. `pipeline` la mien khung, khong
  phai duong vong qua moi cong — ve 3/3a khoa dieu do.

  Ve 2 nang nhat: `origin: manual` thieu muc VAN TRUOT. Khong co ve do thi mot
  `return []` o dau ham cung lam cong xanh, va do la BO cong chu khong phai NOI.

WO_093_bo_vong_duyet: |
  Chu du an: *"chung cat khong co nhap gi nua ca, giong transcript … Logic
  duyet nay qua ngu va ruom ra?"*

  Do TRUOC khi sua: `cuaDuyetNhap` DA lam du bon thu —
  validate → ghi kho → `da_duyet` → `donBanCu()` day ban chung cat CU cung
  `nguon` sang thung rac, tuc *"ban moi thi ban cu an di"* co san.

  => KHONG dap bang nhap, KHONG viet duong ghi thu hai. Chi thieu hai thu:
    1 chot `409` chan lan chay thu hai (ban chung cat luon mang slug
      `phan-tich-<ten>` nen chay lai la dung chinh no);
    2 khong ai bam nut.

  Sua: `409` re theo `origin` — `pipeline` thi THAY, khac thi CHAN. Va worker
  tu goi `POST …/duyet`, truot thi `ViecHong`, khong nuot.

  Ve 2 nang nhat: go `409` cho de thi mot luot chay TU DONG ghi de len ban
  NGUOI da sua tay — im lang, khong cong nao khac canh.

  KEO THEO: cai nay chua luon o *"vao /video/ khong thay ban chung cat"* —
  hom nay khong thay vi ban nhap chua duyet nen CHUA TUNG co ban ghi nao trong
  kho de ma thay.

WO_095_ban_in: |
  Chu du an: *"Dac biet la format in ra PDF (download)"*.

  `xuat-cua.mjs:273` nhet ca than bai vao MOT `<pre>`: `## 2. Boi canh` in ra
  dung chu ay, bang Markdown thanh mot rung dau `|`, `**dam**` giu nguyen hai
  dau sao, va chu don cach xuong hang theo KY TU chu khong theo tu.

  Sua: `mdSangHtml` — tieu de · doan · danh sach · BANG · trich dan · khoi ma ·
  dam/nghieng/ma · lien ket. Kem CSS in that: `@page`, chu co chan 12pt,
  `orphans/widows`, `break-after:avoid` cho tieu de, `break-inside:avoid` cho
  bang va khoi ma.

  Ve 2 nang NGANG ve 1: `<pre>` cu AN TOAN nho `esc2`, va than bai do MODEL
  sinh. Doi sang dung HTML la mo dung cai cua `<pre>` dang dong. Nen THOAT
  TRUOC, DUNG SAU — va ve 2 gieo `<script>`, `<img onerror>`, `javascript:` de
  chung minh. Bo ve do thi WO nay doi mot ban in xau lay mot lo XSS.

bon_neo_cong_hong_da_siet: |
  1 `check_ci_teeth` — fixture `dat-chuan.md` khai `origin: pipeline`, nen sau
    WO-094 hai rang ve khung khong con can. KHONG sua fixture (sau cong khac
    dung chung); thay vao do hai CA them `origin: manual`, vi luat gio chi ap
    cho ban nguoi viet. Chieu nguoc lai do `check_khong_ep_khung` ve 1 canh.
  2 `check_frozen` — 21 file spec/rules lech baseline. Do ra la DI CHUNG CRLF
    cua toi: cong bam `read_bytes()`, va `git diff` cho thay 0 khac biet noi
    dung. Da doi 21 file ve CRLF; cong xanh lai — chinh dieu do CHUNG MINH lech
    thuan tuy vi line-ending.
  3 Ve 1a cua `check_khong_can_duyet` neo `origin[^\\n]{0,60}pipeline` — hai ve
    cua phep re nam tren HAI dong. Doi sang `[\\s\\S]{0,240}`.
  4 `than_ham` cat theo SO KY TU (3200) nen `/duyet` nam ngoai cua so chi vi
    khoi chu thich o giua. Doi sang cat toi MOC (`\\ndef `) — phep do khong con
    phu thuoc do dai van xuoi. Day la lop loi da gap ba lan hom nay.

