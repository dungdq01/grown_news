quyet_dinh:
  - |
      HAI CỔNG MỚI KHÔNG PHẢI PHÉP ĐỔI TÊN. Đọc kỹ spec thì phép đo cũ THIẾU VẾ:
        · AC-4.5 đòi gieo BỐN ca §4.0b — cũ gieo HAI;
        · AC-4.5 đòi 0 DÒNG `egress.jsonl` — cũ không đụng log. Vế này quan trọng
          nhất: `da_goi == 0` chỉ nói transport chưa chạy; `egress.gui` ghi log
          TRƯỚC khi gửi (AC-6.1), nên "chặn muộn" để lại một dòng có `sha256` của
          dữ liệu kho dù không byte nào ra Internet.
        · AC-4.6 đòi gọi THẲNG `:8790` — cũ gọi `dinh_tuyen.quyet_dinh()` TRONG
          TIẾN TRÌNH, tức đo THƯ VIỆN chứ không đo CỬA. `do_POST` có thể quên gọi
          nó hoặc nuốt exception mà phép đo cũ vẫn xanh.
  - |
      Cổng AC-4.6 đo cả hàng đợi, không chỉ mã HTTP: 4xx mà việc VẪN vào hàng đợi
      nghĩa là chặn SAU chỗ cần chặn, và worker sẽ nhặt nó lên.
  - |
      Cổng AC-4.5 có vế ĐỐI CHỨNG (một lời gọi hợp lệ ghi ĐÚNG 1 dòng). Không có
      nó thì "0 dòng" cũng đúng khi đường log chết hẳn — cổng không đỏ được.
  - |
      CA (d) DỰNG TỪ DÒNG BẢNG TẠM, không từ `model.json`. Đo được: cả BA dòng
      mang `khu_vuc: khong-xac-dinh` ⇒ phép so `!=` không bao giờ đúng. Đó KHÔNG
      phải lỗi của bảng — `T12-11` chốt "giữ `khong-xac-dinh` khi chưa xác minh
      route gateway, KHÔNG điền đại một khu vực cho đẹp". Biến một lời khai trung
      thực thành cổng đỏ là `#cổng-đỏ-oan`. Cổng đo NHÁNH MÃ; "bảng đã điền khu
      vực thật chưa" là câu hỏi của T12-11, có ô backlog riêng.
  - |
      TRẦN 32MB vào `nguong.json`, KHÔNG vào `model.json`: trần thuộc CỬA EGRESS,
      không thuộc một model — mọi lời gọi ra Internet đi qua nó, kể cả lối
      `tai_ve` không gọi model. Để nó thành cột của model.json là bốn trần cho
      một cửa, và mỗi nhà mới là một lần quên điền.
  - |
      `doc_tran_payload` KHÔNG có default. Một default là cách trần 32MB im lặng
      thành số khác khi bảng khai mất khoá — vẫn chặn, vẫn xanh, chỉ chặn ở một
      ngưỡng không ai khai. `KeyError` là câu trả lời đúng.
  - |
      `google.goi` bỏ `tran=None`: một default `None` đi thẳng vào `len(...) >
      None` ⇒ `TypeError` GIỮA JOB, sau khi tài liệu đã đọc xong.
  - |
      `da_xanh` của `check_g6b` chạy `sys.executable` thay vì chữ `python`. Đo
      được: `check_reject_reason.py` XANH dưới `.venv`, exit 1 với "Thiếu phụ
      thuộc" qua `python` trần ⇒ W5 báo "chưa xanh" cho một cổng đang xanh. Cổng
      đỏ vì SAI INTERPRETER dạy người đọc bỏ qua dòng W5 — mất đúng thứ W5 canh.
  - |
      FR-058 KHÔNG gộp cả 13 FAIL boundary vào một rổ: chúng là BA bài toán.
      Lớp C (`T08-16`, `T09-8`) là BUILD khai sai thành PATCH — nới boundary cho
      nó là gỡ đúng cái răng đang cắn. FR cố ý để chúng đỏ.

