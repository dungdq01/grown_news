tu_bat_duoc:
  - >
    CỔNG CỦA TÔI VÔ CĂN CỨ ở lượt đầu. §2 chỉ đòi `ma === 422`, và nó XANH cả khi
    cổng module tắt hoàn toàn — `validate.py` cũng từ chối đúng ba ca đó, nên phép
    kiểm đang đo cái hàm DÙNG CHUNG, tức chính thứ FR-040 nói là vấn đề. Sửa bằng
    cách phân biệt AI từ chối: cổng module trả `{loi}`, validate trả `{loi_validate}`
  - >
    Ca "host ngoài whitelist" ĐỎ VÌ SAI LÝ DO: tôi bỏ trống `url_normalized` nên
    nó rơi vào luật khác. Đo trực tiếp mới biết một bản video host lạ KÈM
    `url_normalized` đi qua `validate.py --strict` SẠCH — nên khẳng định ban đầu
    ("server không kiểm host") đúng, nhưng phép kiểm của tôi chưa chứng minh được
  - >
    Ba lỗi mầm gieo, mỗi lỗi làm một mục đo nhầm: `id` thiếu độ dài nên cả ba mầm
    422 và §1 đo BA BẢN CỦA FIXTURE · thân ngắn làm bản `paper` trượt cổng khung ·
    video thiếu `url_normalized`

