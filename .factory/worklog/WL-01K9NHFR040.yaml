quyet_dinh_thiet_ke:
  - >
    `/api/articles**` GIỮ làm bí danh, KHÔNG xoá. FE dựng URL thẳng ở bốn chỗ sửa
    đổi (`multiwindow.inline.ts:1196·1289·1323·2249`) và FR-024 đã một lần làm vỡ
    đúng đó. Tách đường + xoá đường cũ trong một lượt là hai rủi ro chồng nhau
  - >
    Cổng đặt trong `taoBai` chứ không trong `router.mjs`: router chưa đọc body, và
    đọc body hai lần là hai cơ hội để hai bên nhìn thấy hai thứ khác nhau
  - >
    `cong-module.mjs` NÉM lúc nạp nếu một module khai trong `loai-nguon.json` mà
    không có cổng — biến "quên viết cổng cho module thứ tư" thành lỗi lúc khởi
    động thay vì một module lặng lẽ không ai chấm
  - >
    Host so bằng HẬU TỐ có dấu chấm, không `includes`: `includes("youtube.com")`
    khớp cả `youtube.com.ke-xau.example`. Đây là cách whitelist thành vô nghĩa mà
    khó thấy nhất, và có phép kiểm riêng cho nó
  - >
    `api-guard` răng 1+2 KHÔNG nới: `cong-module.mjs` không có fs ghi và không có
    SQL. Tách route ≠ mỗi file tự viết SQL — mỗi route mang CỔNG, rồi cùng gọi
    một đường ghi

