TRUNG_SO_WO_lan_thu_bay_va_lan_dau_tren_day_WO: |
  Lo ra khi `git add -A` cua toi vo ca viec chua commit cua nguoi khac trong cay `main`.
  Toi DA HOAN TAC (`git reset`) va chi them file cua minh — commit ho viec nguoi khac la
  pha chinh thu R6 bao ve.
  Do duoc tren dia luc 2026-09-15:
    WO-099-indexer-chet-o-ban-ghi-khong-co-file-goc.md      <- cua toi (PM M13), DA COMMIT
    WO-099-noi-cue-khong-cat-trung-bien-resume.md           <- cua team M12, chua commit
