  HAI so bi hai WO khac nhau cung mang. Day la lan trung dinh danh thu BAY trong tuan, va
  lan DAU khong phai tren day task ma tren day WO — tuc quy dai chan/le cho task KHONG
  phu day WO.
  HE QUA do duoc, khong phai gia dinh: worklog cua toi tro "WO-099" va "WO-100"; worklog
  cua M12 cung tro hai so ay. Sau khi ca hai ben commit, `grep -l WO-099 .factory/worklog/`
  tra ve hai chuoi su kien khong lien quan — vet kiem toan tro thanh vet doan mo. Do la
  mat thu R4 bao ve, khong phai mot phien toai dat ten.
  KHONG tu doi so cua ai: doi so WO cua M12 la sua bien ghi cua nguoi khac; doi so cua
  toi thi moi worklog + task file da commit tro sai. Can chu du an phan mot lan cho ca
  hai day. Da ghi vao muc cho_NGUOI.
  Nguyen nhan goc van la mot: `check_scope` (T04-90, PM-Space) CHUA cai. No la co che duy
  nhat trong du an chan duoc lop loi nay bang may. Bay lan trung, bay lan nguoi bat.
